<style>
/* All Basic presentation overrides stay under the server-selected mode. */
#basic-section-row,#basic-navigation,#basic-case-actions,#basic-conveyor-layout { display:none; }
html[data-ui-mode=basic] .app-shell.case-open { padding-left:0; padding-right:0; }
html[data-ui-mode=basic] #case-sidebar { display:none !important; }
html[data-ui-mode=basic] .app-shell.case-open.assistant-open { padding-right:var(--assistant-width); }
html[data-ui-mode=basic] .topbar { height:auto; min-height:var(--header-height); flex-wrap:wrap; padding-top:var(--space-3); padding-bottom:var(--space-3); }
html[data-ui-mode=basic] #basic-section-row { display:flex; align-items:center; gap:var(--space-3); order:3; flex-basis:100%; min-width:0; }
html[data-ui-mode=basic] #basic-navigation { display:flex; gap:var(--space-1); flex-wrap:wrap; flex:1; min-width:0; }
html[data-ui-mode=basic] #basic-section-row > #toggle-gemini { flex-shrink:0; margin-left:auto; }
html[data-ui-mode=basic] #basic-navigation [aria-current=page] { background:var(--selected); color:var(--selected-text); }
html[data-ui-mode=basic] #basic-case-actions { display:flex; align-items:center; }
html[data-ui-mode=basic] .chart-note,
html[data-ui-mode=basic] .notice,
html[data-ui-mode=basic] .eyebrow,
html[data-ui-mode=basic] .auth-note,
html[data-ui-mode=basic] .section-heading p,
html[data-ui-mode=basic] .editor-subheading p,
html[data-ui-mode=basic] .format-zone-heading p,
html[data-ui-mode=basic] .format-zone-preview,
html[data-ui-mode=basic] .zone-caption,
html[data-ui-mode=basic] .zone-assumptions,
html[data-ui-mode=basic] .zone-audit-goals,
html[data-ui-mode=basic] #batch-dialog .dialog-body > p:first-child,
html[data-ui-mode=basic] #sheet-import-dialog .dialog-body > p:first-child,
html[data-ui-mode=basic] .settings-section > p,
html[data-ui-mode=basic] .parameter-help,
html[data-ui-mode=basic] .json-example,
html[data-ui-mode=basic] #editor-meta,
html[data-ui-mode=basic] #run-case-meta,
html[data-ui-mode=basic] #status:not(.error),
html[data-ui-mode=basic] .equipment-filters { display:none !important; }
html[data-ui-mode=basic] #basic-conveyor-layout { display:block; }
html[data-ui-mode=basic] #basic-conveyor-panel { display:none; }
html[data-ui-mode=basic][data-basic-view=equipment] #equipment-list { grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--size-240)),1fr)); align-items:start; }
html[data-ui-mode=basic] .basic-machine { cursor:default; padding:var(--space-4); }
html[data-ui-mode=basic] .basic-machine .equipment-fields { display:block; }
html[data-ui-mode=basic][data-show-json=true] .basic-machine .equipment-json-details { display:block; }
html[data-ui-mode=basic] .basic-machine .equipment-grid { display:grid; }
html[data-ui-mode=basic] .equipment-drag { display:none; }
html[data-ui-mode=basic] .basic-machine .equipment-json-details { margin-top:var(--space-3); }
html[data-ui-mode=basic][data-basic-view=conveyors] #basic-conveyor-layout { display:grid; grid-template-columns:minmax(var(--size-220),1fr) minmax(0,3fr); gap:var(--space-5); align-items:start; }
html[data-ui-mode=basic][data-basic-view=conveyors] #basic-conveyor-panel { display:flex; flex-direction:column; min-width:0; border:var(--border-width) solid var(--line); border-radius:var(--radius-md); padding:var(--space-4); background:var(--surface); position:sticky; top:var(--space-4); }
html[data-ui-mode=basic] #basic-conveyor-panel #equipment-inspector { max-height:calc(100vh - var(--header-height) - var(--space-8)); }
html[data-ui-mode=basic] #basic-conveyor-panel h3 { margin:0 0 var(--space-3); }
html[data-ui-mode=basic][data-basic-view=vgraph] #results-panel > .section-heading,
html[data-ui-mode=basic][data-basic-view=vgraph] #results-body > :not(#line-performance),
html[data-ui-mode=basic][data-basic-view=vgraph] #line-performance > :not(.section-heading):not(.vgraph-legend):not(.vgraph-plot) { display:none !important; }
html[data-ui-mode=basic][data-basic-view=vgraph] #line-performance { margin-top:0; border-top:0; }
html[data-ui-mode=basic] .equipment-speed-chart-heading p,
html[data-ui-mode=basic] .simulation-analysis-heading p { display:none; }
html[data-ui-mode=basic] label:has(> .equipment-unit),
html[data-ui-mode=basic] label:has(> .equipment-mode) { display:none !important; }
/* Keep the setup controls on one compact row and use identical field tracks. */
html[data-ui-mode=basic] .topbar { padding-top:var(--space-2); padding-bottom:var(--space-2); }
html[data-ui-mode=basic] .case-open .user-chip { display:none; }
html[data-ui-mode=basic] .case-open .breadcrumb { flex:1 1 var(--size-220); }
html[data-ui-mode=basic] #editor-panel > .section-heading > div:first-of-type { display:none; }
html[data-ui-mode=basic] #editor-panel > .editor-subheading { margin-top:var(--space-3); margin-bottom:0; }
html[data-ui-mode=basic] #equipment-list { gap:var(--space-3); margin-top:0; }
html[data-ui-mode=basic] #basic-conveyor-layout { margin-top:var(--space-3); }
html[data-ui-mode=basic] .basic-machine { padding:var(--space-3); }
html[data-ui-mode=basic] .basic-machine .equipment-header { gap:var(--space-2); margin-bottom:var(--space-2); }
html[data-ui-mode=basic] .basic-machine .equipment-header strong { font-size:var(--font-secondary); overflow-wrap:anywhere; min-width:0; }
html[data-ui-mode=basic] .basic-machine .equipment-grid { gap:var(--space-2); align-items:start; }
html[data-ui-mode=basic] .equipment-grid label { min-width:0; font-size:var(--font-caption); }
html[data-ui-mode=basic] .basic-machine .equipment-grid label { grid-template-rows:minmax(var(--size-28),auto) var(--control-height); gap:var(--space-1); align-items:end; }
html[data-ui-mode=basic] .equipment-grid input:not([type=checkbox]),
html[data-ui-mode=basic] .equipment-grid select { height:var(--control-height); box-sizing:border-box; }
html[data-ui-mode=basic] #equipment-inspector label { padding-right:0; }
html[data-ui-mode=basic] label:has(> .equipment-id) { display:none !important; }
@media(max-width:760px){
  html[data-ui-mode=basic] #editor-panel > .section-heading { flex-wrap:wrap; }
  html[data-ui-mode=basic][data-basic-view=conveyors] #basic-conveyor-layout { grid-template-columns:1fr; }
  html[data-ui-mode=basic][data-basic-view=conveyors] #basic-conveyor-panel { position:static; }
  html[data-ui-mode=basic] #basic-conveyor-panel #equipment-inspector { max-height:none; }

}
@media(max-width:1100px){
 html[data-ui-mode=basic] .app-shell.case-open.assistant-open { padding-right:0; }
 html[data-ui-mode=basic] .gemini-panel { width:min(var(--assistant-width),calc(100% - var(--space-6))); }
}

/* Basic typography and worksheet layout are independent of Advance. */
html[data-ui-mode=basic] { --vgraph-height:440px; }
#basic-run-controls,#basic-efficiencies,#basic-start-simulation,.basic-card-data,.basic-conveyor-tabs,#basic-conveyor-summary { display:none; }
html[data-ui-mode=basic] body { font-size:16px; }
html[data-ui-mode=basic] #basic-navigation button { font-size:16px; font-weight:700; }
html[data-ui-mode=basic] .equipment-grid label,
html[data-ui-mode=basic] .reliability-controls label,
html[data-ui-mode=basic] .basic-card-data label { font-size:15px; font-weight:600; }
html[data-ui-mode=basic] .equipment-grid input,
html[data-ui-mode=basic] .reliability-controls input { font-size:19px; font-weight:700; width:100%; min-width:0; }
html[data-ui-mode=basic][data-basic-view=equipment] #equipment-list { display:grid; grid-template-columns:repeat(7,minmax(145px,1fr)); overflow-x:auto; }
html[data-ui-mode=basic] .basic-machine .equipment-header strong { font-size:17px; font-weight:700; }
html[data-ui-mode=basic] .basic-machine .equipment-header .button-row,
html[data-ui-mode=basic] .basic-machine .equipment-grid:not(.reliability-controls) > label:not(:has(> .equipment-rate)),
html[data-ui-mode=basic] .reliability-controls label:has(> .reliability-enabled) { display:none !important; }
html[data-ui-mode=basic] .basic-machine .equipment-grid,
html[data-ui-mode=basic] .basic-machine .reliability-controls { grid-template-columns:1fr; gap:var(--space-3); }
html[data-ui-mode=basic] .basic-machine .reliability-controls { margin-top:var(--space-2); }
html[data-ui-mode=basic] .basic-card-data { display:grid; gap:var(--space-3); margin-top:var(--space-3); }
html[data-ui-mode=basic] .basic-buffer { display:block; text-align:right; font-size:20px; font-weight:700; padding:var(--space-2); min-height:var(--control-height); box-sizing:border-box; border:var(--border-width) solid var(--line-strong); border-radius:var(--radius-sm); color:var(--accent); }
html[data-ui-mode=basic] .basic-availability { font-size:14px; color:var(--warning); }
html[data-ui-mode=basic] #basic-efficiencies { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); }
html[data-ui-mode=basic] #basic-efficiencies > div { border:var(--border-width) solid var(--line); border-radius:var(--radius-md); padding:var(--space-3); flex-direction:column; align-items:start; }
html[data-ui-mode=basic] #basic-efficiencies strong { font-size:26px; }
html[data-ui-mode=basic] #basic-run-controls { display:grid; grid-template-columns:1.2fr 1.2fr .6fr; gap:var(--space-3); margin:var(--space-3) 0; }
html[data-ui-mode=basic] #basic-run-controls > section { display:grid; gap:var(--space-2); padding:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); }
html[data-ui-mode=basic] #basic-run-controls .button-row { flex-wrap:wrap; }
html[data-ui-mode=basic] #basic-run-controls button[aria-pressed=true],
html[data-ui-mode=basic] .basic-conveyor-tabs button[aria-pressed=true] { background:var(--selected); color:var(--selected-text); }
html[data-ui-mode=basic] #basic-run-controls label:has(> #run-playback-rate),
html[data-ui-mode=basic] #basic-run-controls label:has(> #run-shift-count) { display:none; }
html[data-ui-mode=basic][data-basic-view=conveyors] #basic-run-controls,
html[data-ui-mode=basic][data-basic-view=conveyors] #basic-efficiencies { display:none; }
html[data-ui-mode=basic][data-basic-view=conveyors] #equipment-list { display:grid; grid-template-columns:1fr; max-height:70vh; overflow-y:auto; }
html[data-ui-mode=basic][data-basic-view=conveyors] .equipment-header .button-row { display:none; }
html[data-ui-mode=basic] .basic-metric { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
html[data-ui-mode=basic] .basic-conveyor-tabs { display:flex; justify-content:flex-end; margin-bottom:var(--space-3); }
html[data-ui-mode=basic] #basic-conveyor-summary { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); font-size:16px; margin-bottom:var(--space-4); }
html[data-ui-mode=basic] #basic-conveyor-summary > h4 { grid-column:1/-1; }
html[data-ui-mode=basic] #basic-conveyor-summary > .basic-metric { grid-column:1; }
html[data-ui-mode=basic] #basic-conveyor-summary > .basic-metric strong { border:var(--border-width) solid var(--line); border-radius:var(--radius-sm); padding:var(--space-2); min-width:100px; text-align:right; }
html[data-ui-mode=basic] #basic-conveyor-panel .equipment-grid,
html[data-ui-mode=basic] #basic-conveyor-panel .reliability-controls { display:none; }
html[data-ui-mode=basic] .basic-conveyor-validation { grid-column:2; grid-row:2/5; }
html[data-ui-mode=basic][data-basic-view=results] #line-performance { display:none; }
html[data-ui-mode=basic] #run-config > summary,
html[data-ui-mode=basic] #run-config > .compact-heading,
html[data-ui-mode=basic] #control-events,
html[data-ui-mode=basic] #run-config label:has(> #duration-mode),
html[data-ui-mode=basic] #run-config label:has(> #run-duration),
html[data-ui-mode=basic] #run-config label:has(> #run-shift-hours),
html[data-ui-mode=basic] #run-config label:has(> #run-shift-count),
html[data-ui-mode=basic] #run-config label:has(> #run-sample-interval),
html[data-ui-mode=basic] #run-config label:has(> #run-seed) { display:none !important; }
@media(max-width:760px){
 html[data-ui-mode=basic] #basic-run-controls { grid-template-columns:1fr; }
 html[data-ui-mode=basic] #basic-conveyor-summary { grid-template-columns:1fr; }
 html[data-ui-mode=basic] .basic-conveyor-validation { grid-column:1; grid-row:auto; }
}

html[data-ui-mode=basic] .basic-conveyor-worksheet { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
html[data-ui-mode=basic] .basic-worksheet-group { display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); }
html[data-ui-mode=basic] .basic-worksheet-group h4 { margin:0 0 var(--space-2); font-size:16px; }
html[data-ui-mode=basic] .basic-worksheet-group label { display:grid; grid-template-columns:minmax(0,1fr) minmax(85px,120px); align-items:center; gap:var(--space-2); font-size:14px; }
html[data-ui-mode=basic] .basic-worksheet-group input { width:100%; min-width:0; font-size:16px; font-weight:600; height:var(--control-height); }
html[data-ui-mode=basic] .basic-worksheet-group output { display:block; padding:var(--space-2); text-align:right; font-weight:700; background:var(--surface-soft); border-radius:var(--radius-sm); }
html[data-ui-mode=basic] #basic-conveyor-panel .format-zone-heading,
html[data-ui-mode=basic] #basic-conveyor-panel .format-zone-setup > .format-zone-grid,
html[data-ui-mode=basic] #basic-conveyor-panel .equipment-json-details { display:none !important; }
html[data-ui-mode=basic] #basic-conveyor-summary > section { display:flex; flex-direction:column; gap:var(--space-3); }
html[data-ui-mode=basic] #basic-conveyor-summary .basic-metric strong { font-size:16px; }
html[data-ui-mode=basic] .basic-metric[data-status=PASS] strong { color:var(--success); }
html[data-ui-mode=basic] .basic-metric[data-status=FAIL] strong { color:var(--danger); }
html[data-ui-mode=basic] .basic-population { display:grid; gap:var(--space-2); font-size:14px; }
html[data-ui-mode=basic] .basic-population progress { width:100%; accent-color:var(--accent); }
@media(max-width:1000px){html[data-ui-mode=basic] .basic-conveyor-worksheet { grid-template-columns:1fr; }}
/* Basic machine fields stay visible independently of card collapse state. */
html[data-ui-mode=basic] .basic-machine .reliability-controls { display:grid; }
html[data-ui-mode=basic] .basic-machine .reliability-controls input { height:var(--control-height); box-sizing:border-box; }
html[data-ui-mode=basic] .basic-machine .equipment-header { border-bottom:var(--border-width) solid var(--line); padding-bottom:var(--space-3); margin-bottom:var(--space-3); }
html[data-ui-mode=basic] .basic-machine .equipment-header strong { color:var(--accent); }
html[data-ui-mode=basic] #run-config,
html[data-ui-mode=basic] .live-equipment-controls,
html[data-ui-mode=basic] .live-equipment-columns > :last-child,
html[data-ui-mode=basic] .live-controls-help { display:none !important; }
html[data-ui-mode=basic] .live-equipment-columns,
html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:minmax(150px,1.15fr) minmax(140px,.92fr) minmax(100px,.65fr) minmax(220px,1.42fr) minmax(180px,1fr); }
html[data-ui-mode=basic] .vgraph-legend { font-size:18px; font-weight:600; }
html[data-ui-mode=basic] .vgraph-label,
html[data-ui-mode=basic] .vgraph-reference { font-size:16px; }
html[data-ui-mode=basic] .vgraph-value { font-size:18px; }
@media(max-width:1260px){html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:repeat(2,minmax(0,1fr)); }}
@media(max-width:760px){html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:1fr; }}
html[data-ui-mode=basic][data-basic-view=results] #batch-results,
html[data-ui-mode=basic][data-basic-view=results] #results-table,
html[data-ui-mode=basic][data-basic-view=results] #results-body > h3,
html[data-ui-mode=basic][data-basic-view=results] #results-reference,
html[data-ui-mode=basic][data-basic-view=results] #results-body > .chart-layout,
html[data-ui-mode=basic][data-basic-view=results] #results-body > .raw-viewer { display:none !important; }
html[data-ui-mode=basic] .scenario-change > details,
html[data-ui-mode=basic] .scenario-change > .chart-note,
html[data-ui-mode=basic] .analysis-recommendation > .analysis-checks,
html[data-ui-mode=basic] .analysis-recommendation > .chart-note { display:none; }
</style>
