<script>
window.STLocalDrive=(function(){
  var user,workspace,popup,token,connected=false,name='',markerInfo,pending=new Map(),sequence=0,connectResolve,connectReject,connectTimeout;
  const origin='http://127.0.0.1:8765',channel='simuline-local-drive';
  function key(){return 'localDriveMode.'+JSON.stringify([user?.email||'',workspace||'']);}
  function mode(){return STPreferences.read(key())==='LOCAL'?'LOCAL':'CLOUD';}
  function refresh(){var picker=document.getElementById('storage-mode'),status=document.getElementById('local-drive-status');if(picker)picker.value=mode();if(status)status.textContent=mode()==='LOCAL'?(connected?'Local folder: '+name+'. Drive for desktop manages cloud upload.':'Local storage selected. Start npm run local-drive, then connect the local folder.'):'Cases are saved directly to Drive in the cloud.';}
  function configure(value,folder){if(user?.email!==value?.email||workspace!==folder){disconnect();popup=null;token=null;markerInfo=null;connectReject?.(Error('Workspace changed. Reconnect the local folder.'));connectResolve=connectReject=null;user=value;workspace=folder;}STPreferences.write('localDriveLastMode',mode());refresh();}
  function disconnect(){clearTimeout(connectTimeout);connected=false;for(const item of pending.values()){clearTimeout(item.timer);item.reject(Error('Local folder disconnected. Reconnect it in Settings.'));}pending.clear();}
  function request(action,args){if(!connected||!popup||popup.closed){disconnect();return Promise.reject(Error('Local folder unavailable. Start the helper and reconnect it in Settings.'));}
    return new Promise((resolve,reject)=>{var id=++sequence,timer=setTimeout(()=>{pending.delete(id);reject(Error('Local file operation timed out. Check folder permission and Drive for desktop.'));},60000);pending.set(id,{resolve,reject,timer});popup.postMessage({channel,token,type:'request',id,action,args},origin);});
  }
  window.addEventListener('message',event=>{
    var data=event.data;if(event.source!==popup||event.origin!==origin||data?.channel!==channel||data.token!==token)return;
    if(data.type==='hello'){if(markerInfo)popup.postMessage({channel,token,type:'init',identity:{email:user.email,workspaceId:workspace,markerId:markerInfo.markerId}},origin);return;}
    if(data.type==='ready'){clearTimeout(connectTimeout);return;}
    if(data.type==='connected'){clearTimeout(connectTimeout);connected=true;name=data.name;STPreferences.write(key(),'LOCAL');STPreferences.write('localDriveLastMode','LOCAL');refresh();connectResolve?.();connectResolve=connectReject=null;window.dispatchEvent(new Event('st-local-storage-change'));return;}
    if(data.type==='connect-error'){clearTimeout(connectTimeout);connectReject?.(Error(data.message));connectResolve=connectReject=null;return;}
    if(data.type==='response'){var item=pending.get(data.id);if(!item)return;pending.delete(data.id);clearTimeout(item.timer);data.ok?item.resolve(data.data):item.reject(Object.assign(Error(data.error?.message||'Local save failed'),{code:data.error?.code}));}
  });
  function connect(){if(!workspace||!user?.email)return Promise.reject(Error('Save the Drive workspace folder ID before connecting its local folder.'));disconnect();markerInfo=null;token=crypto.randomUUID();popup=window.open(origin+'/#token='+encodeURIComponent(token),'simuline-local-drive');if(!popup)return Promise.reject(Error('Allow the local storage window to open.'));refresh();return new Promise((resolve,reject)=>{connectResolve=resolve;connectReject=reject;connectTimeout=setTimeout(()=>{connectReject?.(Error('Start npm run local-drive, keep its window open, and reconnect.'));connectResolve=connectReject=null;},30000);rpc('prepareLocalWorkspace',[]).then(info=>{if(info.workspaceId!==workspace)throw Error('Workspace changed. Reconnect the selected Drive folder.');markerInfo=info;popup.postMessage({channel,token,type:'init',identity:{email:user.email,workspaceId:workspace,markerId:info.markerId}},origin);},reject).catch(reject);});}
  function snapshot(record){if(!record)return null;var selected=record.activeSimulationId;
    var data=JSON.parse(JSON.stringify(record,(key,value)=>['replay','replays','samples','events','sourceImport','geminiHistory'].includes(key)?undefined:value));
    // Context is supplied by the browser; it is not a cloud-saved-state claim.
    data.simulations=data.simulations.filter(s=>s.id===selected).concat(data.simulations.filter(s=>s.id!==selected).slice(0,30).map(s=>({id:s.id,name:s.name,equipmentCount:s.equipment?.length||s.equipmentCount||0,results:s.results?.summary?{seed:s.results.seed,summary:s.results.summary}:null})));
    data.totalSimulationCount=record.simulations.length;
    var simulation=record.simulations.find(s=>s.id===selected);if(simulation?.results?.summary&&window.STReports?.lossBreakdown)data.contextLossBreakdown=STReports.lossBreakdown(simulation.results,simulation);
    if(JSON.stringify(data).length>3*1024*1024)throw Error('The selected context is too large. Reduce retained scenario evidence before sending.');return data;
  }
  function rpc(method,args){return new Promise((resolve,reject)=>{var runner=google.script.run.withFailureHandler(reject).withSuccessHandler(r=>r?.ok?resolve(r.data):reject(Object.assign(Error(r?.error?.message||'Validation failed'),{code:r?.error?.code})));runner[method].apply(runner,args);});}
  const operations=new Set(['refreshCaseCatalog','getCase','saveCase','createCase','createDemoCase','cloneCase','deleteCase','getScenarioSourceSignature','createScenario']);
  async function dispatch(method,args){
    if(!connected||!popup||popup.closed)throw Error('Local folder unavailable. Start npm run local-drive and reconnect the folder in Settings.');
    if(method==='refreshCaseCatalog')return request('catalog',[]);
    if(method==='getCase')return request('get',args);
    if(method==='saveCase'){var r=await request('save',[Object.assign({},args[0],{ownerEmail:user.email})]);return {id:r.id,name:r.name,revision:r.revision,updatedAt:r.updatedAt,equipmentCount:r.equipment.length};}
    if(method==='deleteCase')return request('delete',args);
    if(method==='createCase'||method==='createDemoCase'||method==='cloneCase'){
      var draft=args[0];if(method==='cloneCase'){draft=await request('get',args);delete draft.id;delete draft.createdAt;delete draft.updatedAt;delete draft.revision;draft.name='Copy of '+draft.name;}
      var record=await rpc('prepareLocalCase',[{demo:method==='createDemoCase',case:draft||{}}]);var saved=await request('save',[record,{create:true}]);return {id:saved.id,name:saved.name,revision:saved.revision,updatedAt:saved.updatedAt,equipmentCount:saved.equipment.length,isSimulationReady:saved.equipment.length>=2,fileId:'local:'+saved.id};
    }
    var requestData=args[0],record=await request('get',[requestData.caseId]);
    if(Number(requestData.expectedRevision)!==Number(record.revision))throw Object.assign(Error('The local case changed. Reload it before creating a scenario.'),{code:'CASE_CONFLICT'});
    if(method==='getScenarioSourceSignature'){var source=record.simulations.find(s=>s.id===requestData.simulationId);if(!source)throw Error('SIMULATION_NOT_FOUND');return {revision:record.revision,simulationId:source.id,signature:STScenarios.signature(source)};}
    var prepared=await rpc('prepareLocalScenario',[{...requestData,caseSnapshot:snapshot({...record,activeSimulationId:requestData.simulationId})}]);
    var sourceCopy=prepared.case.simulations.find(s=>s.id===prepared.simulationId);record.simulations.push(sourceCopy);record.expectedRevision=record.revision;record.activeSimulationId=prepared.simulationId;var saved=await request('save',[record]);return {case:saved,simulationId:prepared.simulationId};
  }
  function handles(method){return mode()==='LOCAL'&&operations.has(method);}
  function init(){document.getElementById('connect-local-drive').onclick=function(){connect().catch(e=>{document.getElementById('local-drive-status').textContent=e.message;});};document.getElementById('storage-mode').onchange=function(){if(this.value==='LOCAL'){STPreferences.write(key(),'LOCAL');STPreferences.write('localDriveLastMode','LOCAL');}else{STPreferences.write(key(),'CLOUD');STPreferences.write('localDriveLastMode','CLOUD');}refresh();window.dispatchEvent(new Event('st-local-storage-change'));};refresh();}
  document.addEventListener('DOMContentLoaded',init);
  return {configure,mode,connect,snapshot,handles,dispatch,lastLocal:()=>STPreferences.read('localDriveLastMode')==='LOCAL',connected:()=>connected&&!!popup&&!popup.closed};
})();
</script>
