<script>
window.STCaseContext=(function(){
  function snapshot(record){if(!record)return null;var selected=record.activeSimulationId;
    var data=JSON.parse(JSON.stringify(record,(key,value)=>['replay','replays','samples','events','sourceImport','geminiHistory'].includes(key)?undefined:value));
    // Context is supplied by the browser; it is not a cloud-saved-state claim.
    data.simulations=data.simulations.filter(s=>s.id===selected).concat(data.simulations.filter(s=>s.id!==selected).slice(0,30).map(s=>({id:s.id,name:s.name,equipmentCount:s.equipment?.length||s.equipmentCount||0,results:s.results?.summary?{seed:s.results.seed,summary:s.results.summary}:null})));
    data.totalSimulationCount=record.simulations.length;
    var simulation=record.simulations.find(s=>s.id===selected);if(simulation?.results?.summary&&window.STReports?.lossBreakdown)data.contextLossBreakdown=STReports.lossBreakdown(simulation.results,simulation);
    if(JSON.stringify(data).length>3*1024*1024)throw Error('The selected context is too large. Reduce retained scenario evidence before sending.');return data;
  }
  return {snapshot:snapshot};
})();
</script>
