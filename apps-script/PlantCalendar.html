<script>
window.STPlantCalendar=(function(){
  var applyEvents;
  var fields=[['totalMinutes','Total time'],['externalMinutes','Business external time'],['changeoverMinutes','Changeover'],['coReportingErrorMinutes','CO reporting error'],['cleaningMinutes','Cleaning and sanitization'],['autonomousMaintenanceMinutes','Autonomous maintenance'],['plannedMaintenanceMinutes','Planned maintenance'],['breakMinutes','Lunch and break'],['trainingMinutes','Meeting and training'],['experimentationMinutes','Plant experimentation']];
  function calculate(data){
    data=data||{};var errors=[];
    fields.forEach(function(f){var v=data[f[0]];if(v!==undefined&&v!==null&&v!==''&&(!Number.isFinite(v)||v<0))errors.push(f[1]+' must be a nonnegative number.');});
    var total=data.totalMinutes,external=data.externalMinutes||0,decision=fields.slice(2).reduce(function(sum,f){return sum+(data[f[0]]||0);},0),available=total-external,production=available-decision;
    if(!(total>0))errors.push('Enter a positive total time.');
    if(!(production>0))errors.push('Calendar exclusions must leave positive production time.');
    return {errors:errors,total:total,available:available,decision:decision,production:production};
  }
  function format(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function mount(target,provider,changed,locked){
    function render(){var sim=provider(),data=sim?.dynamicConfig?.plantCalendar||{};target.classList.toggle('hidden',!sim);target.replaceChildren();if(!sim)return;
      if(!target.closest('#plant-calendar-dialog')){var heading=document.createElement('h3');heading.textContent='Plant calendar';target.append(heading);}
      var enable=document.createElement('label');enable.className='checkbox-label';var checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=data.enabled===true;enable.append(checkbox,document.createTextNode('Consider plant calendar in simulation'));target.append(enable);
      var content=document.createElement('div');content.className='plant-calendar-content';target.append(content);
      var note=document.createElement('p');note.className='chart-note';note.textContent='Minutes. Aggregate mode adjusts projections; scheduled mode (ST engine) stops the whole line and retains conveyor inventory. Shift changes do not create stops. Business external time and CO reporting error are accounting exclusions, not physical events.';content.append(note);
      function tables(parent,list,headers,className,renderRow){
        var columns=document.createElement('div');columns.className='settings-color-columns '+className;parent.append(columns);var split=Math.ceil(list.length/2);
        [list.slice(0,split),list.slice(split)].forEach(function(items){var table=document.createElement('table');table.className='settings-color-table plant-calendar-table';var head=document.createElement('thead'),header=document.createElement('tr');headers.forEach(function(text,index){var th=document.createElement('th');th.scope='col';th.textContent=text;if(index)th.className='numeric';if(index>1)th.classList.add('plant-calendar-timed');header.append(th);});head.append(header);table.append(head);var body=document.createElement('tbody');items.forEach(function(f){var row=document.createElement('tr'),name=document.createElement('th');name.scope='row';name.textContent=f[1];row.append(name);renderRow(row,f);body.append(row);});table.append(body);columns.append(table);});return columns;
      }
      function numericCell(row,options){var cell=document.createElement('td');cell.className='numeric';var input=document.createElement('input');input.type='number';input.min=options.min||'0';input.step=options.step||'any';input.value=options.value??'';input.setAttribute('aria-label',options.label);input.disabled=!!locked()||!checkbox.checked;cell.append(input);row.append(cell);return input;}
      var modes=document.createElement('div');modes.className='settings-simulation-grid plant-calendar-grid';content.append(modes);
      function select(key,labelText,choices,fallback){var label=document.createElement('label');label.textContent=labelText;var input=document.createElement('select');choices.forEach(function(choice){var option=document.createElement('option');option.value=choice[0];option.textContent=choice[1];input.append(option);});input.value=data[key]||fallback;label.append(input);modes.append(label);input.onchange=function(){save(key,input.value);refreshPlan();};return input;}
      var mode=select('mode','Calendar mode',[['AGGREGATE','Aggregate calendar'],['SCHEDULED','Scheduled line stops']],'AGGREGATE');
      var distribution=select('distribution','Event timing',[['EVEN','Evenly spaced'],['TIMED','Defined start and interval']],'EVEN');
      var restart=select('restartPolicy','After each stop',[['RESTART','Restart with startup and ramps'],['RESUME','Resume without a new startup']],'RESTART');
      tables(content,fields,['Category','min'],'plant-calendar-inputs',function(row,f){var input=numericCell(row,{label:f[1]+' (min)',value:data[f[0]]});input.onchange=function(){if(!input.reportValidity())return;save(f[0],input.value===''?null:Number(input.value));};});
      var planning=document.createElement('div');planning.className='plant-calendar-planning';content.append(planning);
      var guidance=document.createElement('p');guidance.className='chart-note';guidance.textContent='Total category minutes are divided by the number of events. Defined times start at minute 0 of plant available time minus CO reporting error. Events must not overlap. Repairs may continue during a planned stop; no new failures are generated while stopped.';planning.append(guidance);
      var stopFields=fields.filter(function(f){return !['totalMinutes','externalMinutes','coReportingErrorMinutes'].includes(f[0]);});
      var planGrid=tables(planning,stopFields,['Category','Events','Start (min)','Interval (min)'],'plant-calendar-events',function(row,f){
        [['count','Number of events',1],['firstStartMinutes','First start (min)',0],['intervalMinutes','Start interval (min)',null]].forEach(function(def){var input=numericCell(row,{label:f[1]+' · '+def[1],value:data.plans?.[f[0]]?.[def[0]]??def[2],min:def[0]==='count'?'1':'0',step:def[0]==='count'?'1':'any'});if(def[0]==='count')input.max='1000';else input.closest('td').classList.add('plant-calendar-timed');input.dataset.planField=def[0];input.onchange=function(){if(!input.reportValidity())return;var plans=Object.assign({},data.plans);plans[f[0]]=Object.assign({},plans[f[0]],{[def[0]]:input.value===''?null:Number(input.value)});save('plans',plans);};});
      });
      var planTables=Array.from(planGrid.querySelectorAll('table')),planRows=planTables.flatMap(function(table){return Array.from(table.tBodies[0].rows);}),planSplit=Math.ceil(planRows.length/2);
      var useDuration=document.createElement('button');useDuration.type='button';useDuration.className='ghost';useDuration.textContent='Apply plant calendar';planning.append(useDuration);
      useDuration.onclick=async function(){try{var schedule=window.SimulatorEngine.plantCalendarSchedule(data,.25);if(!applyEvents)throw Error('Event editor is unavailable.');useDuration.disabled=true;await applyEvents(schedule);data=sim.dynamicConfig.plantCalendar;update();}catch(error){summary.textContent=error.message;summary.setAttribute('role','alert');}finally{useDuration.disabled=!checkbox.checked||!!locked();}};
      function refreshPlan(){var scheduled=mode.value==='SCHEDULED';planning.classList.toggle('hidden',!scheduled);distribution.disabled=restart.disabled=!checkbox.checked||!!locked()||!scheduled;content.querySelectorAll('input,button').forEach(function(input){input.disabled=!checkbox.checked||!!locked();});mode.disabled=!checkbox.checked||!!locked();var timed=distribution.value==='TIMED';planGrid.classList.toggle('plant-calendar-events-timed',timed);planTables[1].classList.toggle('hidden',timed);planRows.forEach(function(row,index){var body=planTables[timed||index<planSplit?0:1].tBodies[0];if(row.parentNode!==body)body.append(row);});planGrid.querySelectorAll('.plant-calendar-timed').forEach(function(cell){cell.classList.toggle('hidden',!timed);});}

      var summary=document.createElement('p');summary.className='chart-note';content.append(summary);
      function update(){var c=calculate(data);summary.textContent='Plant available: '+format(c.available)+' min · Plant decision: '+format(c.decision)+' min · Production available: '+format(c.production)+' min'+(c.errors.length?' · '+c.errors.join(' '):'');summary.setAttribute('role',c.errors.length?'alert':'status');if(data.enabled&&data.mode==='SCHEDULED'){try{var schedule=window.SimulatorEngine.plantCalendarSchedule(data,.25);summary.textContent+=' · '+schedule.events.length+' scheduled stops · '+format(schedule.horizonSeconds/60)+' min full duration';}catch(error){summary.textContent+=' · '+error.message;summary.setAttribute('role','alert');}}}
      function save(key,value){if(locked())return;var wasScheduled=data.enabled&&data.mode==='SCHEDULED';data=Object.assign({},data,{[key]:value});sim.dynamicConfig=Object.assign({},sim.dynamicConfig,{plantCalendar:data});changed({physical:wasScheduled||data.enabled&&data.mode==='SCHEDULED'});update();}
      checkbox.disabled=!!locked();checkbox.onchange=function(){save('enabled',checkbox.checked);refreshPlan();};refreshPlan();update();
    }return render;
  }
  function renderResults(target,result,simulation){target.replaceChildren();var data=simulation?.dynamicConfig?.plantCalendar;if(!data?.enabled)return;
    var c=calculate(data.application==='EVENTS'&&data.appliedCalendar?data.appliedCalendar:data),heading=document.createElement('h3');heading.textContent='Plant calendar';target.append(heading);
    var note=document.createElement('p');note.className='chart-note';target.append(note);if(c.errors.length){note.textContent=c.errors.join(' ');return;}
    var efficiency=result?.batch?.statistics?.lineOeePercent?.mean??result?.summary?.lineOeePercent;
    var supported=result?.summary?.qualityAssumption==='NO_REJECT_MODEL_ASSUMES_100_PERCENT'&&Number.isFinite(efficiency);
    var audit=result?.plantCalendar,scheduled=data.mode==='SCHEDULED';
    if(scheduled&&!audit){note.textContent=simulation?.dynamicConfig?.eventsEnabled===false?'Events are disabled; plant stops were not executed.':'Apply the plant calendar and run the simulation to calculate scheduled line stops.';return;}
    var complete=scheduled&&audit.completePeriod;
    if(scheduled&&audit){c.decision=(audit.plannedStopSeconds||0)/60+((data.appliedCalendar||data).coReportingErrorMinutes||0);c.production=c.available-c.decision;}
    var effective=supported?(scheduled?result.durationSeconds/60:c.production)*efficiency/100:null;
    if(scheduled&&!complete)effective=null;
    var au=supported?(scheduled?(complete?efficiency*(audit.horizonSeconds/60)/c.available:null):efficiency*c.production/c.available):null;
    var rows=[['Total time (min)',c.total],['Plant available time (min)',c.available],['Plant decision time (min)',c.decision],['Production available time (min)',c.production],['Projected effective runtime (min)',effective],['Projected asset utilization / plant available (%)',au]];
    var table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr');['Metric','Value'].forEach(function(t){var th=document.createElement('th');th.textContent=t;hr.append(th);});head.append(hr);table.append(head);var body=document.createElement('tbody');rows.forEach(function(r){var tr=document.createElement('tr');[r[0],format(r[1])].forEach(function(v,i){var td=document.createElement('td');td.textContent=v;if(i)td.className='numeric';tr.append(td);});body.append(tr);});table.append(body);target.append(table);
    if(scheduled){rows.push(['Observed planned line stops (min)',audit.observedStopSeconds/60]);var row=document.createElement('tr');rows[rows.length-1].forEach(function(value,i){var cell=document.createElement('td');cell.textContent=i?format(value):value;row.append(cell);});body.append(row);note.textContent=(complete?'Scheduled stops are already included in simulated production; no additional downtime discount is applied.':'Run duration differs from the full calendar: only scheduled stops within the configured run occurred. Apply the plant calendar to use its full duration for period metrics.')+' Conveyor inventory is retained. Restart policy: '+audit.restartPolicy+'.';return;}
    note.textContent='Projection from '+format(result?.durationSeconds/60)+' simulated minutes using the nominal line reference. Calendar exclusions are applied once, outside the engine. Quality assumes 100%; startup effects and product mix may make a short run unrepresentative.';
  }
  return {connectApply:function(fn){applyEvents=fn;},calculate:calculate,mount:mount,renderResults:renderResults};
})();
</script>
