<script>
window.STSimulation2DEngine=(function(){
  const epsilon=1e-6;
  const durationKey={
    Starting:'starting',Running:'running',Discharging:'running',Starved:'starving','Waiting for Prime':'starving',
    'Ramp up':'acceleration','Ramp down':'deceleration',Blocked:'blocked','Back-up stop':'blocked',Failed:'failure'
  };
  function create(definitions,seed=1,checkpoint){
    const line=definitions.map((definition,index)=>definition.kind==='belt'
      ? {...definition,items:[],backupBlocked:false,backupElapsed:0,primeSeen:false,backupBeam:false,primeBeam:false,produced:0,state:'Empty',
        durations:{empty:0,flowing:0,accumulating:0},recentOutput:[],ratePerMinute:0}
      : {...definition,input:0,remaining:null,ready:false,started:0,produced:0,backupSince:null,residual:0,state:'Waiting',
        resident:[],residenceClock:0,intakeCredit:1,outletCredit:0,rampElapsed:0,activeRampSeconds:definition.primeRampSeconds??definition.rampSeconds??0,failureRemaining:0,failureCount:0,exposure:null,
        randomState:(Math.trunc(seed)+Math.imul(index+1,2654435761))>>>0,
        durations:{starting:0,running:0,starving:0,acceleration:0,deceleration:0,blocked:0,failure:0},
        recentOutput:[],ratePerMinute:0});
    let time=0;
    if(checkpoint&&Number.isFinite(checkpoint.time)&&checkpoint.time>=0&&checkpoint.line?.length===line.length){
      time=checkpoint.time;
      line.forEach((item,index)=>{
        const saved=JSON.parse(JSON.stringify(checkpoint.line[index]));
        saved.durations={...item.durations,...saved.durations};
        Object.assign(item,saved);
      });
    }
    function snapshot(){
      return JSON.parse(JSON.stringify({time,line:line.map((item,index)=>Object.fromEntries(
        Object.entries(item).filter(([key])=>!Object.hasOwn(definitions[index],key))
      ))}));
    }
    function moveBelt(belt,seconds){
      const travel=belt.speed*seconds;
      let limit=belt.length-belt.packageLength/2;
      let primeCrossed=false;
      for(const item of belt.items){
        const previous=item.x;
        item.x=Math.min(limit,item.x+travel);
        if(belt.prime!==null&&previous-belt.packageLength/2<=belt.prime&&item.x+belt.packageLength/2>=belt.prime)primeCrossed=true;
        limit=item.x-belt.packageLength-belt.packedGap;
      }
      const beam=position=>position!==null&&belt.items.some(item=>Math.abs(item.x-position)<=belt.packageLength/2);
      belt.primeBeam=beam(belt.prime);
      if(belt.primeBeam||primeCrossed)belt.primeSeen=true;
      belt.backupBeam=beam(belt.backup);
      if(belt.backupBeam===belt.backupBlocked){belt.backupElapsed=0;return;}
      belt.backupElapsed+=seconds;
      if(belt.backupElapsed+epsilon>=(belt.backupBeam?belt.blockDelay:belt.clearDelay)){
        belt.backupBlocked=belt.backupBeam;
        belt.backupElapsed=0;
      }
    }
    function discharge(machine,downstream){
      if(downstream?.kind==='belt'){
        const entry=downstream.packageLength/2;
        const last=downstream.items.at(-1);
        if(last&&last.x-entry+epsilon<downstream.pitch)return false;
        downstream.items.push({x:entry});
      }else if(downstream?.capacityBottles!=null){
        if(downstream.resident.length>=Math.floor(downstream.capacityBottles/downstream.inputBottleFactor)||
          downstream.failureRemaining>0||downstream.started<downstream.startDelay||downstream.backupSince!==null)return false;
        downstream.resident.push(downstream.residenceClock+downstream.residenceSeconds);
      }else if(downstream){
        if(downstream.input>=downstream.batch||downstream.ready||downstream.remaining!==null||downstream.backupSince!==null)return false;
        downstream.input++;
      }
      if(machine.capacityBottles!=null)machine.resident.splice(0,machine.batch);
      machine.ready=false;
      machine.input=0;
      machine.produced++;
      machine.recentOutput.push(time);
      return true;
    }
    function random(machine){
      machine.randomState=(Math.imul(machine.randomState,1664525)+1013904223)>>>0;
      return (machine.randomState+.5)/4294967296;
    }
    function updateFailure(machine,seconds){
      if(machine.failureRemaining>0){
        machine.failureRemaining=Math.max(0,machine.failureRemaining-seconds);
        if(machine.failureRemaining===0&&machine.rampAfterRepair){
          machine.rampElapsed=0;
          machine.activeRampSeconds=machine.rampSeconds||0;
        }
        return true;
      }
      const profiles=machine.failures||[];
      if(!profiles.length||(machine.capacityBottles==null?machine.remaining===null:!machine.resident.length))return false;
      const total=profiles.reduce((sum,profile)=>sum+profile.rate,0);
      if(machine.exposure===null)machine.exposure=-Math.log(random(machine))/total;
      machine.exposure-=seconds;
      if(machine.exposure>0)return false;
      let pick=random(machine)*total;
      const profile=profiles.find(item=>(pick-=item.rate)<=0)||profiles.at(-1);
      machine.failureRemaining=profile.repairSeconds;
      machine.failureCount++;
      machine.exposure=null;
      return true;
    }
    function stepMachine(machine,upstream,downstream,seconds){
      if(updateFailure(machine,seconds)){machine.state='Failed';return;}
      if(downstream?.backupBlocked){
        if(machine.backupSince===null){
          machine.backupSince=time;
          machine.residual=machine.capacityBottles==null?downstream.residual:
            Math.min(Math.floor(downstream.residual/(machine.bottlesPerUnit||1)),Math.floor(machine.resident.length/machine.batch));
        }
      }else if(machine.backupSince!==null){
        machine.backupSince=null;
        machine.rampElapsed=0;
        machine.activeRampSeconds=machine.rampSeconds||0;
      }
      const braking=machine.backupSince!==null&&time-machine.backupSince+epsilon>=downstream.responseDelay;
      if(machine.residual<=0&&(braking||machine.capacityBottles!=null&&machine.backupSince!==null)){machine.state='Back-up stop';return;}
      if(machine.started<machine.startDelay){machine.started+=seconds;machine.state='Starting';return;}
      const decelerating=machine.backupSince!==null&&!braking;
      const accelerating=!decelerating&&!braking&&machine.rampElapsed<machine.activeRampSeconds;
      const factor=decelerating?Math.max(0,1-(time-machine.backupSince)/downstream.responseDelay)
        :accelerating?Math.min(1,(machine.rampElapsed+seconds/2)/machine.activeRampSeconds):1;
      const motionState=decelerating?'Ramp down':accelerating?'Ramp up':braking?'Discharging':'Running';
      if(machine.capacityBottles!=null){
        stepResident(machine,upstream,downstream,seconds,factor,motionState,accelerating,machine.backupSince!==null);
        return;
      }
      if(machine.remaining!==null){
        if(accelerating)machine.rampElapsed+=seconds;
        machine.remaining-=seconds*factor;
        if(machine.remaining<=epsilon){machine.remaining=null;machine.ready=true;}
      }
      if(machine.ready){
        if(!discharge(machine,downstream)){machine.state='Blocked';return;}
        if(braking)machine.residual--;
      }
      if(braking&&machine.input===0){machine.state='Back-up stop';return;}
      if(machine.remaining!==null){machine.state=motionState;return;}
      if(machine.input<machine.batch&&!braking){
        if(!upstream)machine.input=machine.batch;
        if(upstream?.kind==='belt'){
          if(upstream.prime!==null&&!upstream.primeSeen){machine.state='Waiting for Prime';return;}
          const first=upstream.items[0];
          if(first&&first.x+upstream.packageLength/2>=upstream.length-epsilon){
            upstream.items.shift();
            upstream.produced++;
            upstream.recentOutput.push(time);
            machine.input++;
          }else if(!upstream.items.length)upstream.primeSeen=false;
        }
      }
      if(machine.input<machine.batch){machine.state=braking?'Back-up stop':'Starved';return;}
      machine.remaining=1/machine.rate;
      machine.state=motionState;
    }
    function stepResident(machine,upstream,downstream,seconds,factor,motionState,accelerating,stopping){
      machine.residenceClock+=seconds;
      if(accelerating)machine.rampElapsed+=seconds;
      const capacity=Math.floor(machine.capacityBottles/machine.inputBottleFactor);
      const residenceRate=machine.residenceSeconds>0?(capacity-machine.batch+1)/machine.batch/machine.residenceSeconds:Infinity;
      const work=seconds*factor*Math.min(machine.rate,residenceRate);
      machine.outletCredit+=work;
      let blocked=false;
      if(machine.outletCredit+epsilon>=1&&machine.resident[machine.batch-1]<=machine.residenceClock+epsilon){
        if(discharge(machine,downstream)){
          machine.outletCredit=Math.max(0,machine.outletCredit-1);
          if(stopping)machine.residual--;
        }else blocked=true;
      }
      machine.outletCredit=Math.min(1,machine.outletCredit);
      if(!stopping&&(!upstream||upstream.kind==='belt')){
        machine.intakeCredit+=work*machine.batch;
        while(machine.intakeCredit+epsilon>=1&&machine.resident.length<capacity){
          if(upstream){
            const first=upstream.items[0];
            if(!first){
              upstream.primeSeen=false;
              break;
            }
            if(upstream.prime!==null&&!upstream.primeSeen||first.x+upstream.packageLength/2<upstream.length-epsilon)break;
            upstream.items.shift();upstream.produced++;upstream.recentOutput.push(time);
          }
          machine.resident.push(machine.residenceClock+machine.residenceSeconds);
          machine.intakeCredit=Math.max(0,machine.intakeCredit-1);
        }
        machine.intakeCredit=Math.min(1,machine.intakeCredit);
      }
      machine.state=blocked?'Blocked':stopping&&!machine.resident.length?'Back-up stop':
        machine.resident.length||!upstream||accelerating?motionState:
        upstream.prime!=null&&!upstream.primeSeen?'Waiting for Prime':'Starved';
    }
    return {line,snapshot,get time(){return time;},step(seconds){
      time+=seconds;
      line.forEach(item=>{if(item.kind==='belt')moveBelt(item,seconds);});
      for(let index=line.length-1;index>=0;index--){
        const item=line[index];
        if(item.kind!=='machine')continue;
        stepMachine(item,line[index-1],line[index+1],seconds);
        const category=durationKey[item.state];
        if(category)item.durations[category]+=seconds;
      }
      for(const item of line){
        if(item.kind==='belt'){
          const head=item.items[0];
          const accumulating=head&&head.x+item.packageLength/2>=item.length-epsilon;
          const category=!head?'empty':accumulating?'accumulating':'flowing';
          item.state=!head?'Empty':accumulating?'Accumulating':'Flowing';
          item.durations[category]+=seconds;
        }
        while(item.recentOutput.length&&item.recentOutput[0]<=time-5)item.recentOutput.shift();
        item.ratePerMinute=item.recentOutput.length*60/Math.min(time,5);
      }
    }};
  }
  return {create};
})();
</script>
