<style>
#sheet-import-dialog { --dialog-width:var(--size-980); }
#sheet-import-form { display:grid; gap:var(--space-3); }
#sheet-import-preview { margin-top:var(--space-5); overflow-wrap:anywhere; }
#sheet-import-preview .table-scroll { overflow-x:auto; }
#sheet-import-preview table { width:100%; border-collapse:collapse; font-size:var(--font-secondary); }
#sheet-import-preview th,#sheet-import-preview td { padding:var(--space-2); border-bottom:var(--border-width) solid var(--line); text-align:left; }
#sheet-import-preview th { color:var(--muted); font-weight:var(--weight-medium); }
#sheet-import-preview pre { white-space:pre-wrap; font-size:var(--font-caption); }
#sheet-import-preview details { padding:var(--space-3); margin-top:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); }
#sheet-import-preview li { margin:var(--space-2) 0; }
.sheet-metadata { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2); }
.sheet-metadata dt { color:var(--muted); } .sheet-metadata dd { margin:0; }
#sheet-import-error { color:var(--danger); }
#sheet-import-dialog .dialog-actions { flex-wrap:wrap; }
#sheet-import-dialog .dialog-actions label { margin-right:auto; max-width:var(--size-420); }

#sheet-import-summary { flex-basis:100%; font-size:var(--font-secondary); color:var(--muted); }
#sheet-import-error { white-space:pre-line; }
#sheet-import-preview .sheet-field-changed { background:var(--accent-soft); }
#sheet-import-preview .sheet-equipment-choice > summary { font-weight:var(--weight-semibold); }
#sheet-import-preview .sheet-target { margin:var(--space-3) 0; }
#sheet-import-preview details table { min-width:var(--size-500); }
#sheet-import-preview details { overflow-x:auto; }
.sheet-correction { margin-top:var(--space-3); padding:var(--space-3); border:var(--border-width) solid var(--line); border-left:var(--state-border-width) solid var(--warning); border-radius:var(--radius-md); }
.sheet-correction h4 { margin:0; font-size:var(--font-body); }
.sheet-correction p { margin:var(--space-2) 0; }
</style>
