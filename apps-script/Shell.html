<script>
window.STShell = function(state,actions) {
  var collapsed=STPreferences.read('sidebar')==='collapsed', toastTimer,lastMotionView;
  var simulationToolbar=document.getElementById('simulation-toolbar');
  function sync() {
    STSettings.applyCaseCharts();
    var active=Boolean(state.activeCase),view=active?(state.uiView||'simulation'):'cases';
    if(active)actions.rememberView?.(view);
    var connected=Boolean(state.bootstrap?.settings?.workspaceRootFolderId);
    ['cases','editor','run','results','whatif','comparison'].forEach(function(name){var visible=(name==='cases'&&view==='cases')||(name==='editor'&&view==='editor')||(name==='run'&&view==='simulation')||(name==='results'&&view==='results')||(name==='whatif'&&view==='whatif')||(name==='comparison'&&view==='comparison');document.getElementById(name+'-panel').classList.toggle('hidden',!visible);});
    document.getElementById('application').classList.toggle('case-open',active);
    document.getElementById('case-sidebar').classList.toggle('hidden',!active);
    document.getElementById('cases-top-actions').classList.toggle('hidden',active);
    var pin=document.getElementById('pin-header'),pinHost=document.getElementById(active?'request-progress':'cases-settings');
    if(pin.nextElementSibling!==pinHost)pinHost.before(pin);
    var geminiToggle=document.getElementById('toggle-gemini'),geminiHost=document.getElementById(active?'header-case-actions':'cases-top-actions');
    if(geminiToggle.parentElement!==geminiHost){if(active)geminiHost.appendChild(geminiToggle);else geminiHost.prepend(geminiToggle);}
    geminiToggle.classList.toggle('hidden',!state.bootstrap);
    actions.assistant();
    document.getElementById('workspace-tabs').classList.toggle('hidden',!active);
    document.getElementById('home-cases').setAttribute('aria-current',view==='cases'?'page':'false');
    document.querySelectorAll('.sidebar [data-view]').forEach(function(button){button.disabled=!active;button.setAttribute('aria-current',button.dataset.view===view?'page':'false');button.title=active?button.getAttribute('aria-label'):__ST_TEXT__('shell.open_a_case_first');});
    document.getElementById('breadcrumb-case').textContent=active?state.activeCase.name:__ST_TEXT__('shell.workspace');
    document.getElementById('breadcrumb-view').textContent={cases:__ST_TEXT__('shell.cases'),editor:__ST_TEXT__('shell.line_setup'),simulation:__ST_TEXT__('shell.simulation'),results:__ST_TEXT__('shell.results'),whatif:__ST_TEXT__('shell.what_if'),comparison:__ST_TEXT__('client.compare_simulations')}[view];
    document.getElementById('save-case').classList.toggle('hidden',!active||(['ADVANCE','ADVANCED'].includes(String(state.bootstrap?.uiMode).toUpperCase())&&STPreferences.read('autosaveEnabled')!=='no'));
    document.getElementById('autosave-indicator').classList.toggle('hidden',!active);
    document.getElementById('settings-case-section').classList.toggle('hidden',!active);
    document.getElementById('case-name').disabled=!active;
    simulationToolbar.classList.toggle('hidden',!active||view==='comparison');
    document.getElementById('header-case-actions').classList.toggle('hidden',!active);
    document.getElementById('workspace-folder-id').disabled=false;
    document.getElementById('workspace-folder-note').classList.toggle('hidden',!active);
    document.getElementById('show-new-case').disabled=!connected; document.getElementById('create-public-demo-case').disabled=!connected;
    document.getElementById('whatif-empty').classList.add('hidden');
    if(view==='results') STResults.render(state.run.result,state.activeCase,(state.activeCase.simulations||[]).find(function(s){return s.id===state.activeSimulationId;}));
    STIcons.decorate(document);
    window.STBasicMode?.sync(state);
    var motionView=view+':'+(document.documentElement.dataset.headerView||'');
    if(motionView!==lastMotionView){lastMotionView=motionView;STMotion.reveal(document.getElementById(({simulation:'run',editor:'editor',results:'results',whatif:'whatif',comparison:'comparison',cases:'cases'}[view]||'run')+'-panel'));}
    var engineNotice=document.getElementById('simulation-engine-notice'),simulation=(state.activeCase?.simulations||[]).find(function(s){return s.id===state.activeSimulationId;});
    engineNotice.classList.toggle('hidden',simulation?.dynamicConfig?.engineId!=='DES_SIMPY_EXPERIMENTAL');
  }
  function toast(message) {var el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.add('hidden');},4000);}
  function init(){
    window.STBasicMode?.init(state,{navigate:actions.navigate,refresh:sync,preview:actions.preview});
    var pin=document.getElementById('pin-header'),header=pin.closest('header');
    function pinHeader(pinned){header.dataset.pinned=String(pinned);pin.setAttribute('aria-pressed',String(pinned));pin.title=pinned?'Unpin header':'Pin header';pin.setAttribute('aria-label',pin.title);}
    pinHeader(STPreferences.read('headerPinned')!=='no');pin.onclick=function(){var pinned=pin.getAttribute('aria-pressed')!=='true';STPreferences.write('headerPinned',pinned?'yes':'no');pinHeader(pinned);};
    var info=document.getElementById('app-info-dialog'),infoButton=document.getElementById('show-app-info');
    function openInfo(){infoButton=this;info.showModal();}
    document.getElementById('show-app-info').onclick=openInfo;
    document.getElementById('sidebar-app-info').onclick=openInfo;
    var basicInfo=document.getElementById('basic-app-info');if(basicInfo)basicInfo.onclick=openInfo;
    info.querySelectorAll('.app-info-developers a').forEach(function(link){link.href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(link.textContent.trim());});
    document.getElementById('app-info-close').onclick=function(){info.close();};
    info.addEventListener('close',function(){infoButton.focus();});
    STSettings.init();STIcons.decorate();
    document.getElementById('cases-settings').onclick=STSettings.open;
    document.getElementById('cases-sign-out').onclick=actions.signout;
    function collapse(){document.getElementById('application').classList.toggle('sidebar-collapsed',collapsed);var el=document.getElementById('collapse-sidebar');el.setAttribute('aria-expanded',String(!collapsed));el.setAttribute('aria-label',collapsed?__ST_TEXT__('shell.expand_sidebar'):__ST_TEXT__('shell.collapse_sidebar'));el.title=el.getAttribute('aria-label');el.dataset.icon=collapsed?'expand':'collapse';el.innerHTML=STIcons.svg(el.dataset.icon);}
    collapse();document.getElementById('collapse-sidebar').onclick=function(){collapsed=!collapsed;STPreferences.write('sidebar',collapsed?'collapsed':'expanded');collapse();setTimeout(actions.redraw,180);};
    document.querySelectorAll('[data-view]').forEach(function(button){button.addEventListener('click',function(){actions.navigate(button.dataset.view);});});
    document.getElementById('cancel-new-case').onclick=function(){document.getElementById('new-case-form').classList.add('hidden');document.getElementById('show-new-case').focus();};
    ['case-filter','case-sort'].forEach(function(id){document.getElementById(id).onchange=actions.cases;});
    var dialog=document.getElementById('command-dialog'),input=document.getElementById('command-search'),list=document.getElementById('command-list');
    function commands(){list.textContent='';var entries=[[__ST_TEXT__('shell.cases'),'folder',actions.home],[__ST_TEXT__('shell.settings'),'settings',STSettings.open]];
      if(state.activeCase)entries.push([__ST_TEXT__('shell.line_setup'),'edit',function(){actions.navigate('editor');}],[__ST_TEXT__('shell.simulation'),'play',function(){actions.navigate('simulation');}],[__ST_TEXT__('shell.results'),'chart',function(){actions.navigate('results');}],[__ST_TEXT__('shell.what_if'),'flask',function(){actions.navigate('whatif');}]);
      entries.filter(function(e){return e[0].toLowerCase().includes(input.value.toLowerCase());}).forEach(function(e){var b=document.createElement('button');b.className='ghost';b.innerHTML=STIcons.svg(e[1])+e[0];b.onclick=function(){dialog.close();e[2]();};list.appendChild(b);});
      if(!list.children.length)list.textContent=__ST_TEXT__('shell.no_matching_commands');
    }
    function openCommands(){if(document.getElementById('application').classList.contains('hidden')||document.querySelector('dialog[open]'))return;input.value='';commands();dialog.showModal();input.focus();}
    input.oninput=commands;
    input.onkeydown=function(e){if(e.key==='ArrowDown'){e.preventDefault();list.querySelector('button')?.focus();}if(e.key==='Enter'){e.preventDefault();list.querySelector('button')?.click();}};
    list.onkeydown=function(e){if(!['ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();var buttons=Array.from(list.querySelectorAll('button')),index=buttons.indexOf(document.activeElement);buttons[(index+(e.key==='ArrowDown'?1:buttons.length-1))%buttons.length]?.focus();};
    document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommands();}});
    window.addEventListener('st:theme',actions.redraw);
    sync();
  }
  return {init:init,sync:sync,toast:toast};
};
</script>
