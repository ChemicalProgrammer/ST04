                var proposal=bestChanges.filter(x=>!(x.equipmentId===c.equipmentId&&x.path===c.path));
                if(value!==c.before)proposal=proposal.concat([Object.assign({},c,{after:value})]);
                await trial(proposal);if(cancelled())return;if(finishRequested)break searchPhase;
              }
            }
            if(previous===keyOf(bestChanges))break;
          }
        }
        if(design&&finishRequested)evidence.doeSkippedReason='DOE skipped because the search was finished early.';
        if(design&&!finishRequested){
          var factorKeys=new Set(design.factors.map(f=>f.equipmentId+':'+f.path)),fixed=bestChanges.filter(c=>!factorKeys.has(c.equipmentId+':'+c.path)),observations=[];
          evidence.doe={type:design.type,factors:design.factors,fixedChanges:fixed,combinations:design.designPoints.length,roundsPerCombination:previewRun.rounds,observations:observations};
          for(var point of design.designPoints){
            stage='DOE · combination '+(observations.length+1)+' / '+design.designPoints.length;
            var response=await trial(fixed.concat(point.changes));if(cancelled())return;
            observations.push({index:point.index,levels:point.levels,changes:point.changes,oee:response?.oee??null,throughput:response?.throughput??null,warnings:response?.warnings||[],feasible:!!response});
            if(finishRequested)break;
            status.textContent='DOE '+observations.length+' / '+design.designPoints.length+' combinations · '+show(baseline,best);
          }
          evidence.doe.analysis=STScenarioDOE.analyze(design,observations);
          host.querySelector('.scenario-doe-results')?.remove();var doeResults=el('details','','scenario-doe-results');doeResults.append(el('summary','DOE results · best targets and effects'));var targets=el('ul');bestChanges.forEach(c=>{var info=STWhatIf.changeInfo(c,source.equipment);targets.append(el('li',info.equipment+' · '+info.parameter+': '+info.before+' → '+info.after));});doeResults.append(el('h4','Best evaluated targets'),targets);
          if(!evidence.doe.analysis.complete)doeResults.append(el('p','DOE is incomplete or contains infeasible combinations. Effects are not estimated from an incomplete design.'));
          else{doeResults.append(el('p','Descriptive contrasts of mean responses; not statistical significance.'));
            evidence.doe.analysis.effects.forEach(function(effect){var names=effect.factors.map(i=>{var f=design.factors[i],info=STWhatIf.changeInfo(f,source.equipment);return info.equipment+' · '+info.parameter;}).join(' × ');doeResults.append(el('p',names+': ΔOEE '+effect.oee.toFixed(3)+' pp · Δthroughput '+effect.throughput.toFixed(3)+' '+(source.unitOfFlow||'units')+'/min'));});}
          status.after(doeResults);
        }
        if(cancelled())return;
        searchCanFinish=false;setIcon(run,'Cancel validation','stop');evidence.searchStoppedEarly=all&&finishRequested;evidence.stopReason=finishRequested?(stopReason||'Finished by user'):'Search completed';
        if(all&&!bestChanges.length&&reviewBest){best=reviewBest;bestChanges=reviewChanges;}
        evidence.trials=done;evidence.infeasibleTrials=invalid;evidence.evaluatedChanges=bestChanges;evidence.candidate=best;
        if(best)evidence.delta={oeePercentagePoints:best.oee-baseline.oee,throughputPerMinute:best.throughput-baseline.throughput};
        if(!best){record('INFEASIBLE',evidence);status.textContent='No physically valid candidate. Review the selected values and limits.';status.dataset.state='rejected';return;}
        var text=(evidence.doeSkippedReason?evidence.doeSkippedReason+' ':'')+(all?'Complete: '+(finishRequested?'search finished early ('+evidence.stopReason+') · ':'')+done+' candidates checked, '+invalid+' infeasible. ':'')+show(baseline,best);
        if(!bestChanges.length||!improves(baseline,best)){record('NO_DEMONSTRATED_IMPROVEMENT',evidence);status.textContent=text+' · No demonstrated improvement; scenario creation is disabled.';status.dataset.state='rejected';return;}
        // Independent seed block is not used to select the winner.
        stage='Independent confirmation';record('VALIDATING',evidence);status.textContent=text+' · Checking independent seeds…';
        var offset=Math.max(1000003,Number(previewRun.rounds)+1),validationBase=await measured([],offset);
        if(cancelled())return;
        var validation=await measured(bestChanges,offset);if(cancelled())return;
        var warnings=best.warnings||[],validated=improves(validationBase,validation);
        evidence.independentCheck={seed:(Number(previewRun.seed)+offset)%2147483647,rounds:previewRun.rounds,baseline:validationBase,candidate:validation,passed:validated,delta:{oeePercentagePoints:validation.oee-validationBase.oee,throughputPerMinute:validation.throughput-validationBase.throughput}};
        evidence.warnings=warnings;record(warnings.length?'ENGINEERING_REVIEW_REQUIRED':validated?'IMPROVEMENT_REPRODUCED':'NOT_REPRODUCED',evidence);
        status.textContent=text+' · Independent check: '+show(validationBase,validation)+(validated?' · Improvement reproduced.':' · Improvement did not reproduce; creation disabled.')+(warnings.length?' · '+warnings.length+' engineering check(s) worsened; review required.':'');
        status.dataset.state=validated&&!warnings.length?'improved':'rejected';
        renderWarnings(warnings,validated,bestChanges,evidence);
        // Acknowledged trade-offs remain review scenarios, not approved recommendations.
        setIcon(save,warnings.length?'Create scenario for review':'Create selected scenario','copy');save.disabled=!validated||warnings.length>0;
        if(!save.disabled)last={changes:bestChanges};
        if(all&&validated&&!includeDOE){rows.forEach(function(r){var found=bestChanges.find(c=>c.equipmentId===r.change.equipmentId&&c.path===r.change.path);r.check.checked=!!found;if(found&&found.after!==r.change.after)r.limit.value=Number((found.after*r.scale).toPrecision(8));});}
      }catch(error){if(!cancelled()){record('ERROR',Object.assign({},evidence,{error:error.message}));status.textContent='Cannot evaluate: '+error.message;status.dataset.state='rejected';}}
      finally{window.dispatchEvent(new CustomEvent('st-calculation-activity',{detail:{active:false}}));searchCanFinish=false;clearInterval(clock);setIcon(run,'Calculate OEE & throughput','search');run.setAttribute('aria-pressed','false');stage=cancelled()?'Stopped':'Finished';updateProgress();locked.forEach(x=>{if(x.element!==save)x.element.disabled=x.disabled;});activeHost=null;activeRecordKey=null;refreshDOE();refreshFactors();if(latest)record(latest.status,latest);}
    }
    if(restored){
      latest=restored;previewRun=restored.run||config(source);contextText();
      (restored.controls||[]).forEach(c=>{var r=rows.find(r=>r.change.equipmentId===c.equipmentId&&r.change.path===c.path);if(!r)return;r.check.checked=c.checked;r.limit.value=c.limit||'';if(r.doe&&c.doe){r.doe.use.checked=c.doe.selected;r.doe.low.value=c.doe.low;r.doe.high.value=c.doe.high;}});refreshFactors();
      var interrupted=['RUNNING','VALIDATING','INTERRUPTED'].includes(restored.status);status.textContent=interrupted?'Previous search interrupted. Run a new search to complete the evaluation.':restored.message||restored.status;progress.textContent=restored.progress||'';
      if(restored.baseline&&restored.candidate)renderMetrics(restored);
      var approved=!interrupted&&restored.evaluatedChanges?.length>0&&restored.independentCheck?.passed&&restored.baseline&&restored.candidate&&improves(restored.baseline,restored.candidate)&&['IMPROVEMENT_REPRODUCED','ENGINEERING_REVIEW_REQUIRED'].includes(restored.status);
      var warnings=restored.warnings||[];renderWarnings(warnings,approved,restored.evaluatedChanges,restored);
      setIcon(save,warnings.length?'Create scenario for review':'Create selected scenario','copy');save.disabled=!approved||!!warnings.length;
      if(approved&&!warnings.length)last={changes:restored.evaluatedChanges};
      if(approved&&warnings.length&&restored.engineeringReviewAcknowledged){var ack=host.querySelector('.scenario-audit-warnings input');ack.checked=true;save.disabled=false;last={changes:restored.evaluatedChanges,reviewRequired:true};}
      if(restored.doe){var summary=el('details','','scenario-doe-results');summary.append(el('summary','Saved DOE results'),el('p',restored.doe.observations.length+' / '+restored.doe.combinations+' combinations · '+(restored.doe.analysis?.interpretation||'Incomplete design')));(restored.doe.analysis?.effects||[]).forEach(effect=>summary.append(el('p',effect.factors.map(i=>{var f=restored.doe.factors[i];return STWhatIf.changeInfo(f,source.equipment).parameter;}).join(' × ')+': ΔOEE '+effect.oee.toFixed(3)+' pp · Δthroughput '+effect.throughput.toFixed(3))));status.after(summary);}
    }
  }

  function tools(target,simulation,plan,create){
    var pool=(plan.candidates||[]).filter(p=>p.canApply).map(p=>({tier:p.tier,changes:p.changes})),container=el('section','','scenario-explorer'),combined=el('div');target.prepend(container);
    (simulation.whatIf?.externalOptions||[]).forEach(option=>{pool=pool.map(p=>({tier:p.tier,changes:p.changes.filter(c=>!option.changes.some(x=>x.equipmentId===c.equipmentId&&x.path===c.path))}));pool.push(option);});
    // Retain previously saved intervention targets in the category cards.
    container.append(combined);
    function rebuild(){
      combined.replaceChildren();combined.className='scenario-tier-grid';
      ['ZERO','MEDIUM','HIGH','ALL'].forEach(function(tier){
        var seen=new Set(),changes=pool.filter(p=>p.tier===tier||tier==='ALL').sort((a,b)=>tier==='ALL'?['ZERO','MEDIUM','HIGH'].indexOf(b.tier)-['ZERO','MEDIUM','HIGH'].indexOf(a.tier):0).flatMap(p=>p.changes).filter(function(c){var key=c.equipmentId+':'+c.path;if(seen.has(key))return false;seen.add(key);return true;});
        if(!changes.length){var empty=el('article','','analysis-recommendation');empty.append(el('h4',tier==='ALL'?'All CAPEX':STScenarioText[tier]),el('p','No supported targets. Add intervention evidence before evaluating.'));combined.append(empty);return;}
        var project={title:tier==='ALL'?'All CAPEX · combined search':'Line-wide '+STScenarioText[tier],description:tier==='ALL'?'Explore Zero, Medium and High measures together. Only the validated selection is saved.':'Evaluate this category independently.',searchScope:tier,kind:'CUSTOM',tier:tier==='ALL'?'HIGH':tier,basis:'STATIC',sourceSimulationId:simulation.id,sourceSignature:STScenarios.signature(simulation),changes:changes,explore:true};combined.append(STWhatIf.card(project,create,simulation.equipment,simulation));
      });
    }
    rebuild();
  }
  return {doeEnabled:doeEnabled,setDOE:setDOE,connectCase:function(provider,changed){caseProvider=provider;caseChanged=changed;},attach:attach,tools:tools,evaluate:evaluate,evaluations:evaluations};
})();
