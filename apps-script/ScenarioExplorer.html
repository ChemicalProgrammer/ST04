      else if(restored.lastResult&&!restored.candidate){status.textContent='Last calculated result shown. Configuration changed; recalculate before creating a scenario.';status.dataset.state='stale';}

    }else{
      var linked=(caseProvider?.()?.simulations||[]).find(s=>s.scenario?.origin==='DEMO'&&s.scenario.sourceSimulationId===simulation.id&&s.scenario.tier===project.tier);

      }
    }
  }

  function tools(target,simulation,plan,create){
    function categoryAllows(change,tier){return tier==='HIGH'||tier==='MEDIUM'&&change.path!=='processData.geometry.lactMm'||tier==='ZERO'&&!change.external&&!change.path.startsWith('noiseProfile.reliability.')&&change.path!=='processData.geometry.lactMm';}

    var equipment=document.createElement('select'),field=document.createElement('select'),tierSelect=document.createElement('select'),targetValue=document.createElement('input'),notice=el('p','','chart-note');
    equipment.setAttribute('aria-label','Intervention equipment');(simulation.equipment||[]).filter(e=>e.type!=='CONVEYOR').forEach(e=>{var option=el('option',e.name);option.value=e.id;equipment.append(option);});
    [['noiseProfile.reliability.mtbfMinutes','MTBF (min)'],['noiseProfile.reliability.mttrMinutes','MTTR (min)']].forEach(pair=>{var option=el('option',pair[1]);option.value=pair[0];field.append(option);});field.setAttribute('aria-label','Intervention parameter');
    ['MEDIUM','HIGH'].forEach(t=>{var option=el('option',STScenarioText[t]);option.value=t;tierSelect.append(option);});tierSelect.setAttribute('aria-label','Intervention CAPEX');
    targetValue.type='number';targetValue.step='any';targetValue.min='.001';targetValue.setAttribute('aria-label','Intervention target (minutes)');
    function interventionBaseline(){var unit=simulation.equipment.find(e=>e.id===equipment.value),before=field.value.split('.').reduce((v,k)=>v?.[k],unit);notice.textContent='Current: '+(before??'missing')+' min. '+(before>0?'Enter a supported target.':'Set a positive baseline in Equipment first.');targetValue.value=before>0?before:'';}
    equipment.onchange=field.onchange=interventionBaseline;interventionBaseline();
    var add=button('Add intervention target',function(){if(activeHost)return;try{var unit=simulation.equipment.find(e=>e.id===equipment.value),before=field.value.split('.').reduce((v,k)=>v?.[k],unit),change={equipmentId:equipment.value,path:field.value,before:before??null,after:Number(targetValue.value),unit:'min',external:true};STScenarios.apply(simulation,[change]);var option={tier:tierSelect.value,changes:[change]};simulation.whatIf=simulation.whatIf||{};simulation.whatIf.externalOptions=(simulation.whatIf.externalOptions||[]).map(p=>({tier:p.tier,changes:p.tier===option.tier?p.changes.filter(c=>c.equipmentId!==change.equipmentId||c.path!==change.path):p.changes})).filter(p=>p.changes.length).concat([option]);pool=pool.map(p=>({tier:p.tier,changes:p.tier===option.tier?p.changes.filter(c=>c.equipmentId!==change.equipmentId||c.path!==change.path):p.changes}));pool.push(option);changed(simulation);notice.textContent='Target saved as a hypothesis. Run Find best scenario in its CAPEX category.';rebuild();}catch(error){notice.textContent='Cannot add target: '+error.message;}});add.classList.add('scenario-add-intervention');
    interventions.append(equipment,field,tierSelect,targetValue,add,notice);
    container.append(el('p','Choose up to four supported DOE variables in each CAPEX category. You can choose them before searching; every combination is simulated and physically validated.','chart-note'),interventions,combined);
    function rebuild(){
      combined.replaceChildren();combined.className='scenario-tier-grid';
      var basic=document.documentElement.dataset.uiMode==='basic';
      interventions.hidden=basic;interventions.style.display=basic?'none':'';
      if(basic){
        var current=el('article','','analysis-recommendation scenario-current'),values=simulation.results?.summary?metric(simulation.results):{},metrics=el('div','','scenario-basic-metrics');
        current.append(el('h4','Current scenario','scenario-current-title'));
        [['OEE','oee','%'],['Throughput','throughput',' '+unitLabel(simulation.unitOfFlow||simulation.results?.unitOfFlow)+'/min']].forEach(function(spec){var item=el('div','','scenario-basic-metric'),value=values[spec[1]];item.append(el('span',spec[0]),el('strong',Number.isFinite(value)?value.toFixed(spec[1]==='oee'?1:2)+spec[2]:'—'));metrics.append(item);});
        current.append(metrics);combined.append(current);
      }
      (basic?['ZERO','MEDIUM','HIGH']:['ZERO','MEDIUM','HIGH','ALL']).forEach(function(tier){
        var seen=new Set(),changes=pool.filter(p=>p.tier===tier||tier==='ALL').sort((a,b)=>tier==='ALL'?['ZERO','MEDIUM','HIGH'].indexOf(b.tier)-['ZERO','MEDIUM','HIGH'].indexOf(a.tier):0).flatMap(p=>p.changes).filter(function(c){var key=c.equipmentId+':'+c.path;if(seen.has(key))return false;seen.add(key);return true;});
        var demo=(caseProvider?.()?.simulations||[]).find(s=>s.scenario?.origin==='DEMO'&&s.scenario.sourceSimulationId===simulation.id&&s.scenario.tier===tier);if(demo?.scenario.changes)changes=demo.scenario.changes;
        if(!changes.length){var empty=el('article','','analysis-recommendation'),badge=el('span',tier==='ALL'?'All CAPEX':STScenarioText[tier],'analysis-capex');badge.dataset.tier=tier==='ALL'?'HIGH':tier;empty.append(badge);empty.append(el('h4',tier==='ALL'?'All CAPEX':STScenarioText[tier]),el('p','No supported targets in this category. Review equipment inputs and available search evidence.'));combined.append(empty);return;}
        var project={catalog:true,searchDerivedDOE:true,title:tier==='ALL'?'All CAPEX · combined search':'Line-wide '+STScenarioText[tier],description:tier==='ALL'?'Explore Zero, Medium and High measures together. Only the validated selection is saved.':'Evaluate this category independently.',searchScope:tier,kind:'CUSTOM',tier:tier==='ALL'?'HIGH':tier,basis:'STATIC',sourceSimulationId:simulation.id,sourceSignature:STScenarios.signature(simulation),changes:changes,explore:true};combined.append(STWhatIf.card(project,create,simulation.equipment,simulation));
      });
    }
    rebuild();
  }
