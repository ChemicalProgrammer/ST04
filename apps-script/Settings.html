<script>
window.STSettings = (function() {
  var save, flushCase, removeKey, applyMode, caseProvider, caseChanged, promptDefinitions=[], modeCount=0, modeStarted=0, timer, version=0, savedVersion=0, sending=false, removing=false, hasKey=false, lastFocus, failure=null, waiters=[];
  function el(id){return document.getElementById(id);}
  function promptOverrides(){var result={};promptDefinitions.forEach(function(def){var card=el('gemini-prompt-'+def.id),text=card.querySelector('textarea').value,enabled=card.querySelector('input').checked;if(!enabled||text!==def.defaultText)result[def.id]={enabled:enabled,text:text};});return result;}
  function request(){var gemini={model:el('gemini-model').value,apiKey:el('gemini-api-key').value};if(promptDefinitions.length)gemini.prompts=promptOverrides();return {workspaceRootFolderId:el('workspace-folder-id').value,gemini:gemini};}
  function selectTab(name,focus){if(name==='case')renderCaseCharts();document.querySelectorAll('[data-settings-tab]').forEach(function(button){var selected=button.dataset.settingsTab===name;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;el(button.getAttribute('aria-controls')).classList.toggle('hidden',!selected);if(selected&&focus)button.focus();});}
  function promptBudget(){var total=0,included=0;promptDefinitions.forEach(function(def){var card=el('gemini-prompt-'+def.id),text=card.querySelector('textarea').value,enabled=card.querySelector('input').checked;total+=text.length;if(enabled)included+=text.length;card.dataset.included=String(enabled);card.querySelector('.gemini-prompt-count').textContent=text.length+' / 8,000';});el('gemini-prompt-budget').textContent=included.toLocaleString()+' included characters before mode filtering · '+total.toLocaleString()+' / 40,000 across all sections. Each section: up to 8,000. Case context and conversation share the existing request budget.';return total;}
  function renderPrompts(overrides){el('gemini-prompt-editor').replaceChildren();promptDefinitions.forEach(function(def){var value=overrides[def.id],card=document.createElement('section');card.id='gemini-prompt-'+def.id;card.className='gemini-prompt-card';var label=document.createElement('label');label.className='scenario-scope';var check=document.createElement('input');check.type='checkbox';check.checked=value?value.enabled:true;check.setAttribute('aria-label','Include '+def.label+' prompt');label.append(check,document.createTextNode(def.label));var text=document.createElement('textarea');text.rows=5;text.maxLength=8000;text.value=value?value.text:def.defaultText;text.setAttribute('aria-label',def.label+' prompt');text.spellcheck=false;var footer=document.createElement('div');footer.className='gemini-prompt-footer';var count=document.createElement('span');count.className='gemini-prompt-count';var reset=document.createElement('button');reset.type='button';reset.className='ghost';reset.textContent='Reset text';reset.onclick=function(){text.value=def.defaultText;text.dispatchEvent(new Event('input',{bubbles:true}));};footer.append(count,reset);card.append(label,text,footer);el('gemini-prompt-editor').append(card);});promptBudget();}
  function activeCase(){return caseProvider?.();}
  function applyCaseCharts(){var colors=activeCase()?.metadata?.chartColors||[],style=document.documentElement.style;for(var i=0;i<13;i++){var name='--series-'+i,value=/^#[0-9a-f]{6}$/i.test(colors[i]||'')?colors[i]:'';if(value){if(style.getPropertyValue(name)!==value)style.setProperty(name,value);}else if(style.getPropertyValue(name))style.removeProperty(name);}}
  function renderCaseCharts(){var record=activeCase();applyCaseCharts();el('settings-case-note').classList.toggle('hidden',!!record);el('settings-doe-section').classList.toggle('hidden',!record);el('settings-chart-section').classList.toggle('hidden',!record);el('settings-chart-colors').replaceChildren();if(!record)return;var computed=getComputedStyle(document.documentElement);for(var i=0;i<13;i++){var label=document.createElement('label'),name=document.createElement('span'),input=document.createElement('input');name.textContent=(i+1)+'. '+(record.equipment?.[i]?.name||'Series '+(i+1));name.title=name.textContent;input.type='color';input.dataset.series=String(i);input.value=computed.getPropertyValue('--series-'+i).trim();input.setAttribute('aria-label',name.textContent+' chart color');label.append(name,input);el('settings-chart-colors').append(label);}}
  function updateChartColors(event){var record=activeCase(),input=event.target;if(!record||input.type!=='color')return;record.metadata=record.metadata||{};record.metadata.chartColors=Array.isArray(record.metadata.chartColors)?record.metadata.chartColors.slice(0,13):[];record.metadata.chartColors[Number(input.dataset.series)]=input.value;applyCaseCharts();caseChanged?.();window.dispatchEvent(new Event('resize'));}
  function refresh(){el('settings-unsaved').textContent=failure?__ST_TEXT__('autosave.error'):sending?__ST_TEXT__('autosave.saving'):version>savedVersion?__ST_TEXT__('autosave.pending'):__ST_TEXT__('autosave.saved');el('settings-retry').classList.toggle('hidden',!failure);}
  function open(){var dialog=el('settings-dialog');if(dialog.open)return;lastFocus=document.activeElement;resetModeSelector();renderCaseCharts();refresh();dialog.showModal();}
  function resetModeSelector(){el('settings-save-section').classList.toggle('hidden',document.documentElement.dataset.uiMode!=='advance');el('settings-autosave').checked=STPreferences.read('autosaveEnabled')!=='no';el('settings-autosave-seconds').value=STPreferences.read('autosaveSeconds')||'10';el('settings-autosave-seconds').disabled=!el('settings-autosave').checked;el('settings-seed-section').classList.toggle('hidden',document.documentElement.dataset.uiMode!=='advance');el('settings-seed-policy').value=STPreferences.read('seedPolicy')||'FIXED';el('settings-scenario-doe').checked=STScenarioExplorer.doeEnabled();el('settings-basic-simulation-note').classList.toggle('hidden',document.documentElement.dataset.uiMode!=='basic');modeCount=0;modeStarted=0;el('settings-interface-section').classList.add('hidden');el('settings-interface-mode').value=document.documentElement.dataset.uiMode==='advance'?'ADVANCE':'BASIC';}
  function unlockMode(event){
    if(!el('settings-dialog').open||event.repeat||event.ctrlKey||event.altKey||event.metaKey||event.target.closest('input,select,textarea,[contenteditable]'))return;
    if(event.key.toLowerCase()!=='m'){modeCount=0;return;}
    var now=Date.now();if(!modeCount||now-modeStarted>3000){modeCount=0;modeStarted=now;}
    if(++modeCount===5){el('settings-interface-section').classList.remove('hidden');selectTab('appearance');el('settings-interface-mode').focus();modeCount=0;}
  }
  function settle(ok){waiters.splice(0).forEach(function(done){done(ok);});}
  function write(){
    clearTimeout(timer);if(sending)return;if(version===savedVersion){settle(true);return;}
    if(promptBudget()>40000){failure=true;el('settings-error').textContent='Prompt sections together must not exceed 40,000 characters.';refresh();settle(false);return;}
    if(!el('workspace-form').checkValidity()){selectTab(el('gemini-model').checkValidity()?'storage':'gemini');failure=true;el('settings-error').textContent=__ST_TEXT__('settings.complete_fields');refresh();settle(false);return;}
    var ticket=version,payload=request();sending=true;failure=null;refresh();
    save(payload,function(response){
      sending=false;
      if(!response.ok){failure=true;el('settings-error').textContent=response.error.message;refresh();settle(false);return;}
      savedVersion=ticket;el('settings-error').textContent='';
      if(version===ticket)el('gemini-api-key').value='';
      if(version>savedVersion)write();else{refresh();settle(true);}
    });
  }
  function flush(){return new Promise(function(resolve){waiters.push(resolve);write();});}
  async function close(){
    if(removing||!await flush())return;
    if(flushCase && !el('settings-case-section').classList.contains('hidden')){
      if(!el('case-editor-form').checkValidity()){selectTab('case');el('case-editor-form').reportValidity();return;}
      try{await flushCase();}catch(error){el('settings-error').textContent=error.message;return;}
    }
    if(!el('settings-save-section').classList.contains('hidden')){
      var seconds=Number(el('settings-autosave-seconds').value);
      if(!Number.isInteger(seconds)||seconds<1||seconds>3600){if(el('settings-autosave').checked){el('settings-error').textContent='Choose a save interval between 1 and 3600 seconds.';return;}seconds=10;}
      if(!STPreferences.write('autosaveEnabled',el('settings-autosave').checked?'yes':'no')||!STPreferences.write('autosaveSeconds',String(seconds))){el('settings-error').textContent=__ST_TEXT__('settings.interface_mode_storage_error');return;}
    }
    if(!el('settings-seed-section').classList.contains('hidden')&&!STPreferences.write('seedPolicy',el('settings-seed-policy').value)){el('settings-error').textContent=__ST_TEXT__('settings.interface_mode_storage_error');return;}
    var changed=!el('settings-interface-section').classList.contains('hidden')&&el('settings-interface-mode').value!==(document.documentElement.dataset.uiMode==='advance'?'ADVANCE':'BASIC');
    var mode=el('settings-interface-mode').value,doe=el('settings-scenario-doe').checked,doeChanged=doe!==STScenarioExplorer.doeEnabled();
    if(doeChanged&&!STScenarioExplorer.setDOE(doe)){el('settings-error').textContent=__ST_TEXT__('settings.interface_mode_storage_error');return;}
    if(changed&&!STPreferences.write('interfaceMode',mode)){el('settings-error').textContent=__ST_TEXT__('settings.interface_mode_storage_error');return;}
    el('settings-error').textContent='';resetModeSelector();el('settings-dialog').close();if(lastFocus?.isConnected)lastFocus.focus();
    if(changed)applyMode?.(mode);
    window.dispatchEvent(new Event('st-save-policy-change'));
  }
  function keyStatus(){el('gemini-api-key').placeholder=hasKey?__ST_TEXT__('settings.api_key_mask'):__ST_TEXT__('settings.enter_api_key');el('gemini-key-status').textContent=removing?__ST_TEXT__('settings.removing_api_key'):hasKey?__ST_TEXT__('settings.api_key_saved_for_your_google_account'):__ST_TEXT__('settings.no_api_key_configured');el('gemini-delete-key').disabled=removing||!hasKey;}
  async function deleteKey(){
    if(removing||!hasKey||!removeKey)return;
    if(!await STDialog.confirm(__ST_TEXT__('settings.delete_api_key_title'),__ST_TEXT__('settings.delete_api_key_message'),true))return;
    if(!await flush())return;
    el('gemini-api-key').value='';removing=true;keyStatus();el('gemini-api-key').disabled=true;
    removeKey(function(response){
      removing=false;el('gemini-api-key').disabled=false;
      if(!response.ok)el('settings-error').textContent=response.error.message;
      else el('settings-error').textContent='';
      keyStatus();
    });
  }
  function init(){
    document.querySelectorAll('[data-settings-tab]').forEach(function(button){button.onclick=function(){selectTab(button.dataset.settingsTab);};button.onkeydown=function(event){var tabs=Array.from(document.querySelectorAll('[data-settings-tab]')),index=tabs.indexOf(button);if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;selectTab(tabs[index].dataset.settingsTab,true);};});
    el('settings-chart-colors').addEventListener('input',updateChartColors);
    el('settings-chart-reset').onclick=function(){var record=activeCase();if(!record?.metadata?.chartColors)return;delete record.metadata.chartColors;renderCaseCharts();caseChanged?.();window.dispatchEvent(new Event('resize'));};
    el('settings-autosave').onchange=function(){el('settings-autosave-seconds').disabled=!this.checked;};
    el('settings-close').onclick=close;el('settings-cancel').onclick=close;el('settings-retry').onclick=write;
    el('gemini-delete-key').onclick=deleteKey;
    el('settings-dialog').addEventListener('keydown',unlockMode);
    el('settings-dialog').addEventListener('close',resetModeSelector);
    el('settings-dialog').addEventListener('cancel',function(e){e.preventDefault();close();});
    function change(){promptBudget();version++;failure=null;refresh();clearTimeout(timer);timer=setTimeout(write,600);}
    el('workspace-form').addEventListener('input',change);el('workspace-form').addEventListener('change',change);el('settings-page-gemini').addEventListener('input',change);el('settings-page-gemini').addEventListener('change',change);
  }
  function configureGemini(config){if(!sending&&version===savedVersion){el('gemini-model').value=config.model||'gemini-2.5-flash';if(Array.isArray(config.prompts)){promptDefinitions=config.prompts;renderPrompts(config.promptOverrides||{});}}hasKey=Boolean(config.configured);keyStatus();}
  function setKeyConfigured(value){hasKey=Boolean(value);keyStatus();}
  return {applyCaseCharts:applyCaseCharts,connectCase:function(provider,changed){caseProvider=provider;caseChanged=changed;},init:init,open:open,close:close,configureGemini:configureGemini,setKeyConfigured:setKeyConfigured,connect:function(fn){save=fn;},connectInterfaceMode:function(fn){applyMode=fn;},connectCaseFlush:function(fn){flushCase=fn;},connectRemoval:function(fn){removeKey=fn;},flush:flush,pending:function(){return sending||version>savedVersion;},error:function(message){failure=true;el('settings-error').textContent=message;refresh();}};
})();
</script>
