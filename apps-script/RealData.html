<script>
window.STRealData=(function(){
  'use strict';
  const M=window.STRealDataModel,finite=Number.isFinite;
  let state,actions,context,owner='',selection='average',data=null,revision=0;
  const selected=new Map(),fmt=v=>finite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';
  const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;};
  const records=()=>state?.activeCase?.metadata?.realData?.records||[];
  const current=()=>records().find(r=>r.id===selected.get(state?.activeCase?.id))||records()[0]||null;
  const source=()=>context?.simulation?.results||context?.live||null;
  function tip(element,text){element.title=text;element.setAttribute('aria-description',text);element.tabIndex=0;}
  function status(text,error){const e=document.getElementById('real-data-status');e.textContent=text;e.classList.toggle('real-data-error',!!error);}
  function persist(record){
    const c=state.activeCase,list=records().slice(),index=list.findIndex(r=>r.id===record.id);
    if(index<0&&list.length>=M.MAX_RECORDS)throw Error('Límite de registros alcanzado.');
    if(index<0)list.push(record);else list[index]=record;
    const next={schema:M.VERSION,records:list};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Los registros exceden 512 KB. Exporta los registros antes de eliminar los que no necesites.');
    c.metadata=c.metadata||{};c.metadata.realData=next;selected.set(c.id,record.id);actions.changed();
  }
  function edit(path,value,equipmentId){
    try{
      const draft=M.normalize(current());
      if(equipmentId){
        let entry=draft.equipment.find(e=>e.equipmentId===equipmentId);
        if(!entry){entry={equipmentId,name:context.simulation?.equipment?.find(e=>e.id===equipmentId)?.name||equipmentId,stopClass:'FAILURES'};draft.equipment.push(entry);}
        entry[path]=value;
      }else {
        M.set(draft,path,value);
        if(path.startsWith('timeBreakdown.')){const branch=path.split('.')[1];draft.timeBreakdown[branch].enabled=true;draft.timeHierarchyEnabled=true;draft.timeOverrides[branch]={...(draft.timeOverrides[branch]||{}),enabled:false};}
        if(path.startsWith('timeOverrides.'))draft.timeHierarchyEnabled=true;
        if(['durationSeconds','rateLossSeconds','aem.scrapSeconds','aem.reworkSeconds'].includes(path))draft.timeHierarchyEnabled=true;
        for(const [id,category] of Object.entries(M.timeCategories))if(path===category.total){draft.timeBreakdown[id].enabled=false;draft.timeHierarchyEnabled=true;}
      }
      if(path==='reportedProductionUnits'||path==='reportedProductionCases'){
        draft.production=draft.reportedProductionUnits??draft.reportedProductionCases;draft.productionUnit=draft.reportedProductionUnits!=null?'BOTTLES':'CASES';
      }
      persist(M.normalize(draft));status('Datos actualizados. Se guardan con el caso.');refresh();
      const option=document.querySelector('#real-data-record option:checked');if(option)option.textContent=draft.name+(draft.date?' · '+draft.date:'');
    }catch(error){status(error.message,true);}
  }
  function control(parent,field,record,equipmentId){
    const [path,label,type,scale=1,options]=field,wrapper=el('label',label),input=el(type==='select'?'select':type==='textarea'?'textarea':'input');
    let value=M.at(record,path);
    const zeroDefault=type==='number'&&(path.startsWith('timeBreakdown.')||path.startsWith('timeOverrides.')||['durationSeconds','rateLossSeconds','aem.scrapSeconds','aem.reworkSeconds'].includes(path));
    if(type==='select')for(const [v,text] of options){const option=el('option',text);option.value=v;input.append(option);}
    else if(type!=='textarea')input.type=type;
    input.dataset.realField=path;if(equipmentId){input.dataset.equipmentId=equipmentId;input.dataset.realEquipmentField=path;}
    if(path.startsWith('aem.')||path==='referenceSpeedBpm')input.dataset.aemField=path;
    if(type==='number'){
      input.min=['referenceSpeedBpm','bottlesPerCase','exposureSeconds'].includes(path)?'0.000001':'0';
      input.step=['failureCount','bottlesPerCase'].includes(path)?'1':'any';if(/Percent$/.test(path))input.max='100';
      input.value=value==null?(zeroDefault?'0':''):value/scale;
    }else input.value=value??'';
    if(type==='text')input.maxLength=path==='source'?2000:160;
    if(type==='textarea')input.maxLength=equipmentId?4000:8000;
    if(path==='downtimeSeconds'&&equipmentId)tip(input,'Downtime anterior del equipo. Solo se usa como falla propia cuando su clase es FAILURES. Se conserva sin reclasificarlo automáticamente.');
    if(path==='failureSeconds')tip(input,'Minutos de falla propia del equipo, asociados a reparación. No incluye starving, blocking, pausas programadas ni rampas posteriores.');
    if(path==='operatingSeconds')tip(input,'Tiempo operativo interno medido, no el período calendario. Se usa para calcular MTBF = tiempo operativo / número de fallas.');
    if(path==='exposureSeconds')tip(input,'Período de observación del equipo. Debe coincidir con el período de la simulación para una comparación equivalente.');
    if(path==='validation.rateLossBasis')tip(input,'La pérdida bruta no resta recuperación. El balance neto es pérdida bruta − recuperación. La selección solo cambia la comparación, no el motor.');
    input.oninput=()=>{if(input.readOnly||input.disabled)return;if(!input.checkValidity()){status('Revisa el valor de '+label+'.',true);return;}edit(path,type==='number'?(input.value===''?(zeroDefault?0:null):Number(input.value)*scale):input.value,equipmentId);};
    wrapper.append(input);parent.append(wrapper);
    if(parent.tagName==='SUMMARY'){input.addEventListener('click',e=>e.stopPropagation());input.addEventListener('keydown',e=>e.stopPropagation());}
    return input;
  }
  function timeTree(target,record){
    function node(parent,id,label,formula){
      const details=el('details',null,'real-data-time-node'),summary=el('summary'),body=el('div',null,'real-data-time-children');details.dataset.timeNode=id;
      const title=el('span',label);summary.append(title);
      if(M.timeSectionIds.includes(id)){
        const group=el('span',null,'switchable-value real-data-time-switch'),toggle=el('input'),value=el('input');toggle.type='checkbox';toggle.dataset.timeToggle=id;toggle.setAttribute('aria-label','Capturar '+label+' manualmente');toggle.title='Marcado: entrada manual. Desmarcado: salida calculada a partir de sus conceptos.';
        value.type='number';value.min='0';value.step='any';value.dataset.timeValue=id;value.dataset.realField='timeOverrides.'+id+'.valueSeconds';value.setAttribute('aria-label',label+' (min)');tip(value,formula+' Marcado: valor manual. Desmarcado: valor calculado.');
        for(const input of [toggle,value]){input.addEventListener('click',e=>e.stopPropagation());input.addEventListener('keydown',e=>e.stopPropagation());}
        toggle.onchange=()=>{
          try{const draft=M.normalize(current()),h=M.timeHierarchy(draft),previous=draft.timeOverrides[id];draft.timeOverrides[id]={enabled:toggle.checked,valueSeconds:previous?.valueSeconds??Math.max(0,h.values[id]||0)};draft.timeHierarchyEnabled=true;if(M.timeCategories[id])draft.timeBreakdown[id].enabled=!toggle.checked;persist(M.normalize(draft));refresh();status('Modo de captura actualizado.');}catch(error){status(error.message,true);}
        };
        value.oninput=()=>{if(value.readOnly||!value.checkValidity())return;edit(value.dataset.realField,value.value===''?0:Number(value.value)*60);};
        group.append(toggle,value,el('span','min'));summary.append(group);
      }
      details.open=['total','plant','production','runtime'].includes(id);details.append(summary,body);parent.append(details);return {details,summary,body};
    }
    const root=node(target,'total','Total Time','Duración total del período observado.');root.summary.replaceChildren();
    control(root.summary,['durationSeconds','Total Time (min)','number',60],record);
    const totalInput=root.summary.querySelector('input');totalInput.addEventListener('click',e=>e.stopPropagation());totalInput.addEventListener('keydown',e=>e.stopPropagation());
    function branch(parent,id){
      const c=M.timeCategories[id],n=node(parent,id,c.label,'Suma de los conceptos de '+c.label+'. Los campos vacíos cuentan como cero.');
      const grid=el('div',null,'real-data-fields');n.body.append(grid);
      for(const [key,label] of c.fields){
        if(id==='unplanned'&&key==='unscheduledMaintenanceSeconds'){
          const concept=el('details',null,'real-data-time-node'),summary=el('summary'),body=el('div',null,'real-data-time-children');concept.dataset.timeConcept='unscheduledMaintenance';concept.append(summary,body);grid.append(concept);
          control(summary,['timeBreakdown.'+id+'.'+key,label+' (min)','number',60],record);registerEquipment(body,record);
        }else control(grid,['timeBreakdown.'+id+'.'+key,label+' (min)','number',60],record);
      }
      return n;
    }
    branch(root.body,'external');
    const plant=node(root.body,'plant','Plant Available Time','Total Time − Business / External Downtime.');branch(plant.body,'decision');
    const production=node(plant.body,'production','Production Available Time','Plant Available Time − Plant Decision Downtime.');branch(production.body,'unplanned');
    const runtime=node(production.body,'runtime','Runtime','Production Available Time − Unplanned Downtime.');
    const losses=node(runtime.body,'losses','Runtime Losses','Production Rate Losses + Scrap + Rework, en minutos equivalentes.');
    const grid=el('div',null,'real-data-fields');losses.body.append(grid);
    for(const field of [['rateLossSeconds','Production Rate Losses (min)','number',60],['aem.scrapSeconds','Scrap (min equivalentes)','number',60],['aem.reworkSeconds','Rework (min equivalentes)','number',60],['validation.rateLossBasis','Definición del rate loss','select',1,[['UNCONFIRMED','Pendiente'],['GROSS','Pérdida bruta'],['NET','Balance neto']]]])control(grid,field,record);
    const effective=el('div',null,'real-data-time-node real-data-time-result'),effectiveValue=el('output',null,'numeric');effective.dataset.timeNode='effective';effectiveValue.dataset.timeValue='effective';effectiveValue.setAttribute('aria-label','Effective Runtime calculado en minutos');tip(effectiveValue,'Effective Runtime = Runtime − Runtime Losses. Runtime Losses = Production Rate Losses + Scrap + Rework. El ajuste calibrado conserva su fórmula específica.');effective.append(el('span','Effective Runtime'),effectiveValue);runtime.body.append(effective);
  }
  function refreshTimeTree(){
    const record=current();if(!record)return;const h=M.timeHierarchy(record);
    for(const output of document.querySelectorAll('[data-time-value]')){
      const id=output.dataset.timeValue;if(output.tagName==='INPUT'){
        const manual=M.timeMode(record,id),wasManual=output.dataset.inputMode==='true';output.readOnly=!manual;output.classList.toggle('calculated-value',!manual);output.dataset.inputMode=String(manual);
        if(document.activeElement!==output||!manual||manual!==wasManual)output.value=finite(h.values[id])?Number((h.values[id]/60).toFixed(6)):'';
        const toggle=document.querySelector('[data-time-toggle="'+id+'"]');toggle.checked=manual;
      }else output.textContent=fmt(h.values[id]==null?null:h.values[id]/60)+' min';
    }
    for(const id of M.timeSectionIds){
      const node=document.querySelector('[data-time-node="'+id+'"]');if(!node)continue;const manual=M.timeMode(record,id);node.dataset.manual=String(manual);
      for(const input of node.querySelectorAll('[data-real-field]'))if(input.closest('[data-time-node]')===node&&!input.dataset.timeValue&&!input.dataset.equipmentId)input.disabled=manual;
    }
  }
  function register(){
    const target=document.getElementById('real-data-editor');target.replaceChildren();const record=current();if(!record){target.append(el('p','Crea o importa un registro.','empty'));return;}
    const r=M.normalize(record);
    if(r.reportedProductionUnits==null&&r.productionUnit==='BOTTLES')r.reportedProductionUnits=r.production;
    if(r.reportedProductionCases==null&&r.productionUnit==='CASES')r.reportedProductionCases=r.production;
    const capturedInTree=new Set(['durationSeconds','rateLossSeconds','aem.scrapSeconds','aem.reworkSeconds','aem.scrapUnits','aem.reworkUnits','validation.rateLossBasis','updtSeconds','updtDefinition','notes']);
    for(const group of M.fieldGroups){
      if(group.id==='times'){timeTree(target,r);continue;}
      const fields=group.fields.filter(([path])=>!capturedInTree.has(path));if(!fields.length)continue;
      const details=el('details',null,'real-data-input-group'),summary=el('summary',group.label),grid=el('div',null,'real-data-fields');details.open=!!group.open;details.append(summary,grid);
      for(const field of fields)control(grid,field,r);target.append(details);
    }
  }
  function registerEquipment(target,r){
    const details=el('details',null,'real-data-input-group'),summary=el('summary','Downtime y confiabilidad por equipo'),note=el('p','Captura las fallas propias relacionadas con MTTR/MTBF. Los minutos de equipos pueden coincidir. Los campos vacíos son desconocidos; cero debe ser un dato confirmado.','chart-note');details.append(summary,note);
    const models=(context.simulation?.equipment||[]).slice();for(const e of r.equipment)if(!models.some(m=>m.id===e.equipmentId))models.push({id:e.equipmentId,name:e.name||e.equipmentId});
    for(const e of models){
      const item=r.equipment.find(o=>o.equipmentId===e.id)||{},sub=el('details'),heading=el('summary',e.name||e.id),grid=el('div',null,'real-data-fields');sub.append(heading,grid);
      const base=[['failureSeconds','Downtime por fallas propias (min)','number',60],['failureCount','Número de fallas','number'],['operatingSeconds','Tiempo operativo interno (min)','number',60],['exposureSeconds','Período observado (min)','number',60],['mtbfMinutes','MTBF reportado (min)','number'],['mttrMinutes','MTTR reportado (min)','number'],['notes','Notas del equipo','textarea']];
      for(const field of base)control(grid,field,item,e.id);
      if(item.downtimeSeconds!=null||item.stopClass&&item.stopClass!=='FAILURES'){
        control(grid,['downtimeSeconds','Downtime previamente capturado (min)','number',60],item,e.id);
        control(grid,['stopClass','Clase del downtime previo','select',1,[['UNKNOWN','Sin confirmar'],['FAILURES','Fallas propias MTTR/MTBF'],['MINOR','Microparos'],['ALL','Todas las causas']]],item,e.id);
      }
      details.append(sub);
    }
    target.append(details);
  }
  function displayText(value){
    const names={T1:'tiempo total',T2:'tiempo disponible de planta',T3:'tiempo disponible para producción',T4:'tiempo de marcha',T5:'tiempo efectivo'};
    return String(value??'').replace(/\s*\(T[1-5]\)/g,'').replace(/\bAEM\b\s*/g,'').replace(/\bT[1-5]\b/g,key=>names[key]).replace(/\s{2,}/g,' ').trim();
  }
  function comparisonHtml(result,knownOnly,openGroups=null){
    const groups=[
      ['calendar','Calendario y disponibilidad de planta',r=>['Total Available Time (T1)','Business / External Downtime','Plant Available Time (T2)'].includes(r.id)],
      ['planned','Paradas planificadas y tiempo disponible para producción',r=>['Plant Decision Downtime','Production Available Time (T3)'].includes(r.id)],
      ['operation','Paradas no planificadas y tiempo de marcha',r=>['Unplanned Downtime','Runtime AEM (T4)'].includes(r.id)],
      ['losses','Pérdidas durante la marcha y tiempo efectivo',r=>r.group==='Tiempos'],
      ['production','Producción',r=>r.group==='Producción'],
      ['inputs','Parámetros de referencia',r=>r.group==='Inputs'],
      ['indicators','Indicadores de desempeño',()=>true]
    ];
    const buckets=groups.map(([id,label])=>({id,label,rows:[]}));
    for(const r of result.rows){
      if(knownOnly&&!finite(r.real)&&!finite(r.simulated)&&!finite(r.reported))continue;
      buckets[groups.findIndex(([, ,matches])=>matches(r))].rows.push(r);
    }
    return buckets.filter(g=>g.rows.length).map(g=>{
      const open=openGroups?.has(g.id)?openGroups.get(g.id):true;
      return '<details class="real-data-comparison-group" data-comparison-group="'+g.id+'"'+(open?' open':'')+'><summary>'+esc(g.label)+'</summary><div class="real-data-comparison-scroll"><table class="real-data-main-table"><thead><tr><th>Parámetro</th><th>Unidad</th><th class="numeric">Real</th><th class="numeric">Simulado</th><th class="numeric">Diferencia</th></tr></thead><tbody>'+g.rows.map(r=>{
        const text=displayText(r.formula)+' Real mostrado: '+r.realSource+'. '+(r.reported!=null?' Reportado en planta: '+fmt(r.reported)+' '+r.unit+'.':'')+' Diferencia = simulado − real.'+(r.unit==='%'?' La diferencia se expresa en pp.':'');
        const attrs=' title="'+esc(text)+'" aria-description="'+esc(text)+'" tabindex="0"';
        return '<tr data-metric="'+esc(r.id)+'"><th scope="row"'+attrs+'>'+esc(displayText(r.metric))+(r.reported!=null?'<small class="real-data-reported">Reportado: '+fmt(r.reported)+' '+esc(r.unit)+'</small>':'')+'</th><td>'+esc(r.unit)+'</td>'+[r.real,r.simulated,r.delta].map(v=>'<td class="numeric"'+attrs+'>'+fmt(v)+'</td>').join('')+'</tr>';
      }).join('')+'</tbody></table></div></details>';
    }).join('');
  }
  function calibrationHtml(result){
    const columns=result.calibration.columns;
    const attrs=c=>' title="'+esc(displayText(c.formula))+'" aria-description="'+esc(displayText(c.formula))+'" tabindex="0"';
    return '<div class="real-data-calibration-scroll" role="region" aria-label="Hoja de cálculo de rate loss calibrado" tabindex="0"><table class="real-data-calibration-table"><thead><tr>'+columns.map(c=>'<th scope="col"'+attrs(c)+'>'+esc(c.label)+(c.unit?'<small>['+esc(c.unit==='pp'?'%':c.unit)+']</small>':'')+'</th>').join('')+'</tr></thead><tbody><tr>'+columns.map(c=>'<td data-calibration="'+esc(c.id)+'" class="'+(c.letter==='A'||c.letter==='B'?'':'numeric')+'"'+attrs(c)+'>'+((c.letter==='A'||c.letter==='B')?esc(c.value||'—'):fmt(c.value))+(c.unit==='%'?' %':'')+'</td>').join('')+'</tr></tbody></table></div><p class="chart-note">'+esc(result.calibration.note)+'</p>';

  }
  function downtimeHtml(result){
    const d=result.downtime;
    return '<table class="real-data-failure-table"><thead><tr><th>Equipo</th><th class="numeric">Real (min)</th><th class="numeric">Simulado (min)</th><th class="numeric">Diferencia (min)</th><th class="numeric">Participación real (%)</th><th class="numeric">Participación simulada (%)</th><th class="numeric">Indisponibilidad real MTBF/MTTR (%)</th><th class="numeric">Indisponibilidad teórica simulada (%)</th></tr></thead><tbody>'+d.rows.map(r=>{
      const help=d.note+' MTBF configurado: '+fmt(r.configuredMtbf)+' min. MTTR configurado: '+fmt(r.configuredMttr)+' min.';
      return '<tr><th scope="row" title="'+esc(help)+'" tabindex="0">'+esc(r.name)+'<details><summary>MTBF / MTTR</summary><p>Reales medidos/reportados: '+fmt(r.realMtbf)+' / '+fmt(r.realMttr)+' min.</p><p>Simulados (inputs): '+fmt(r.configuredMtbf)+' / '+fmt(r.configuredMttr)+' min.</p></details></th>'+[r.real,r.simulated,r.delta,r.realShare,r.simulatedShare,r.realUnavailabilityPercent,r.unavailabilityPercent].map(v=>'<td class="numeric" title="'+esc(help)+'" aria-description="'+esc(help)+'" tabindex="0">'+fmt(v)+'</td>').join('')+'</tr>';
    }).join('')+'</tbody><tfoot><tr><th>Total de equipos</th>'+[d.totalReal,d.totalSim,d.delta,finite(d.totalReal)?d.totalReal>0?100:0:null,finite(d.totalSim)?d.totalSim>0?100:0:null,null,null].map(v=>'<td class="numeric">'+fmt(v)+'</td>').join('')+'</tr></tfoot></table><details><summary>Cómo interpretar minutos y porcentajes</summary><p class="chart-note">'+esc(d.note)+'</p></details>'+((d.totalReal==null&&finite(d.knownReal))?'<p class="chart-note">Subtotal real conocido: '+fmt(d.knownReal)+' min. Total pendiente.</p>':'')+((d.totalSim==null&&finite(d.knownSim))?'<p class="chart-note">Subtotal simulado conocido: '+fmt(d.knownSim)+' min. Total pendiente.</p>':'');
  }
  function refresh(){
    refreshTimeTree();
    const openGroups=new Map([...document.querySelectorAll('[data-comparison-group]')].map(e=>[e.dataset.comparisonGroup,e.open]));
    const r=current();data=r?M.build(r,context.simulation,source(),selection,context.caseRecord):null;
    for(const id of ['real-data-export-json','real-data-export-html'])document.getElementById(id).disabled=!data;
    for(const [id,html] of [['real-data-comparison',data?comparisonHtml(data,document.getElementById('real-data-known-only').checked,openGroups):''],['real-data-calibration',data?calibrationHtml(data):''],['real-data-downtime-comparison',data?downtimeHtml(data):'']])document.getElementById(id).innerHTML=html||'<p class="empty">Sin registro seleccionado.</p>';
    const warnings=document.getElementById('real-data-warnings');warnings.replaceChildren();for(const w of data?.warnings||[])warnings.append(el('li',displayText(w)));
    document.getElementById('real-data-review-summary').textContent='Revisión de datos · '+(data?.warnings.length||0)+' avisos';
    const evidence=document.getElementById('real-data-evidence');evidence.replaceChildren();
    if(data?.run)evidence.append(el('p',data.run.view+' · '+fmt(data.run.duration/60)+' min · '+(data.run.engineVersion||'Versión no registrada')+' · seed '+(data.run.seed??'—'),'chart-note'));
  }
  function render(caseRecord,simulation,live){
    if(!state||!caseRecord)return;
    if(context?.simulation?.id!==simulation?.id||context?.caseRecord?.id!==caseRecord.id)selection='average';
    context={caseRecord,simulation,live};const record=current(),key=caseRecord.id+':'+(record?.id||'')+':'+(simulation?.id||'');
    if(record)selected.set(caseRecord.id,record.id);
    const selector=document.getElementById('real-data-record');selector.replaceChildren();for(const r of records()){const option=el('option',r.name+(r.date?' · '+r.date:''));option.value=r.id;selector.append(option);}selector.value=record?.id||'';
    if(owner!==key){owner=key;register();}
    document.getElementById('real-data-delete').disabled=!record;
    const select=document.getElementById('real-data-view'),result=source(),options=[['average','Promedio de rondas']];
    if(result?.batch?.rows?.length){options.push(['representative','Ronda representativa']);for(const r of result.batch.rows)options.push([String(r.round),'Ronda '+r.round+' · seed '+r.seed]);}
    if(!options.some(([value])=>value===selection))selection='average';select.replaceChildren();for(const [value,text] of options){const o=el('option',text);o.value=value;select.append(o);}select.value=selection;
    document.getElementById('real-data-simulation').textContent='Comparación con: '+(simulation?.name||'sin simulación seleccionada')+'. Los registros reales pertenecen al caso.';
    refresh();
  }
  function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function reportHtml(result){
    const fields=M.fieldGroups.flatMap(g=>g.fields.map(([path,label,type,scale=1])=>({label,value:M.at(result.observation,path),scale,type}))).filter(r=>r.value!=null&&r.value!=='');
    for(const [id,category] of Object.entries(M.timeCategories))for(const [key,label] of category.fields){const value=result.observation.timeBreakdown?.[id]?.[key];if(value!=null)fields.push({label:category.label+' / '+label+' (min)',value,scale:60,type:'number'});}
    for(const [id,mode] of Object.entries(result.observation.timeOverrides||{}))if(mode.enabled)fields.push({label:(M.timeCategories[id]?.label||({plant:'Plant Available Time',production:'Production Available Time',runtime:'Runtime',losses:'Runtime Losses'})[id])+' (entrada manual, min)',value:mode.valueSeconds??0,scale:60,type:'number'});
    if(result.observation.reportedProductionUnits==null&&result.observation.reportedProductionCases==null&&finite(result.observation.production))fields.push({label:'Producción original ('+result.observation.productionUnit+')',value:result.observation.production,scale:1});
    const registration='<table><tbody>'+fields.map(f=>'<tr><th>'+esc(f.label)+'</th><td>'+esc(typeof f.value==='number'?fmt(f.value/f.scale):f.value)+'</td></tr>').join('')+'</tbody></table>';
    return '<!doctype html><html lang="es"><meta charset="utf-8"><title>Comparación de datos reales</title><style>body{font:14px system-ui;max-width:1200px;margin:24px auto;padding:16px;color:#213547}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{padding:8px;border-bottom:1px solid #ccd5dd;text-align:left}.real-data-calibration-scroll{overflow-x:auto}.real-data-calibration-table{min-width:1600px}.real-data-calibration-table thead{background:#24599a;color:white}.real-data-calibration-table th{text-align:center}.real-data-calibration-table small{display:block}.numeric{text-align:right;font-variant-numeric:tabular-nums}.real-data-reported{display:block;font-weight:400}.chart-note{color:#52616c}.real-data-group-row{background:#eef4f7}section{margin:24px 0}@media print{tr{break-inside:avoid}body{max-width:none;margin:0}}</style><h1>'+esc(result.observation.name)+'</h1><section><h2>1. Registro</h2>'+registration+'</section><section><h2>2. Comparación de parámetros</h2>'+comparisonHtml(result,false)+'</section><section><h2>3. Ajuste calibrado de rate loss</h2>'+calibrationHtml(result)+'</section><section><h2>4. Downtime por fallas de equipos</h2>'+downtimeHtml(result)+'</section><details><summary>Datos de equipos capturados</summary><pre>'+esc(JSON.stringify(result.observation.equipment,null,2))+'</pre></details><h2>Revisión de datos</h2><ul>'+result.warnings.map(w=>'<li>'+esc(displayText(w))+'</li>').join('')+'</ul></html>';
  }
  function init(currentState,callbacks){
    state=currentState;actions=callbacks;
    document.getElementById('real-data-new').onclick=()=>{try{const r=M.normalize(M.empty());r.name='Registro '+(records().length+1);persist(r);owner='';render(context.caseRecord,context.simulation,context.live);}catch(error){status(error.message,true);}};
    document.getElementById('real-data-record').onchange=e=>{selected.set(state.activeCase.id,e.target.value);owner='';render(context.caseRecord,context.simulation,context.live);};
    document.getElementById('real-data-view').onchange=e=>{selection=e.target.value;refresh();};
    document.getElementById('real-data-known-only').onchange=refresh;
    document.getElementById('real-data-delete').onclick=async()=>{const c=state.activeCase,r=current();if(!r)return;const answer=await STDialog.open({title:'Eliminar registro',message:'¿Eliminar '+r.name+'? Los resultados de simulación se conservan.',buttons:[{id:'cancel',label:'Cancelar'},{id:'delete',label:'Eliminar',destructive:true}]});if(answer.action!=='delete'||state.activeCase!==c)return;c.metadata.realData={schema:M.VERSION,records:records().filter(row=>row.id!==r.id)};selected.delete(c.id);actions.changed();owner='';render(c,context.simulation,context.live);};
    const input=document.getElementById('real-data-file');document.getElementById('real-data-import').onclick=()=>input.click();
    input.onchange=async()=>{const file=input.files?.[0],c=state.activeCase,ticket=++revision;input.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('El JSON excede 2 MB.');const imported=M.importRecords(JSON.parse(await file.text()));if(state.activeCase!==c||ticket!==revision)return;if(records().length+imported.length>M.MAX_RECORDS)throw Error('Límite de registros alcanzado.');const added=imported.map(r=>({...r,id:M.empty().id})),next={schema:M.VERSION,records:records().concat(added)};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Los registros exceden 512 KB.');c.metadata=c.metadata||{};c.metadata.realData=next;selected.set(c.id,added[0].id);actions.changed();owner='';render(c,context.simulation,context.live);status('Registro importado.');}catch(error){status(error.message,true);}};
    document.getElementById('real-data-template').onclick=()=>download(JSON.stringify(M.template(context?.simulation?.equipment||[]),null,2),'real-data-template.json','application/json');
    document.getElementById('real-data-export-json').onclick=()=>{if(data)download(JSON.stringify(data,null,2),'real-vs-simulated.json','application/json');};
    document.getElementById('real-data-export-html').onclick=()=>{if(data)download(reportHtml(data),'real-vs-simulated.html','text/html;charset=utf-8');};
  }
  function selectRecord(caseId,id){selected.set(caseId,id);owner='';}
  return {init,render,selectRecord,normalize:M.normalize,importRecords:M.importRecords,snapshot:M.snapshot,compare:M.build,template:M.template,reportHtml};
})();
</script>
