    const metrics=[['AEM Asset Effectiveness',null,ratio(t5,total),ratio(effective,predictedTotal),'%'],['AEM Asset Utilization',real.reportedEfficiencyPercent,ratio(t5,plant),ratio(effective,predictedPlant),'%'],['AEM Operating Efficiency',null,ratio(t5,production),ratio(effective,predictedProduction),'%'],['AEM Runtime Efficiency',null,ratio(t5,real.runTimeSeconds),ratio(effective,run),'%'],['Defined UPDT',real.updtSeconds==null?null:real.updtSeconds/60,updtActual==null?null:updtActual/60,updtSim==null?null:updtSim/60,'min'],['Defined UPDT percentage',real.reportedUpdtPercent,ratio(updtActual,actualDen),ratio(updtSim,predictedDen),'%']];

      rows.at(-1).recalculated=recalculated;
    }
  }
  function records(){const value=state?.activeCase?.metadata?.realData?.records;return Array.isArray(value)?value:[];}
  function current(){return records().find(r=>r.id===selected.get(state.activeCase?.id))||records()[0]||null;}
  function persist(record){
    const c=state.activeCase;c.metadata=c.metadata||{};const list=records().slice(),index=list.findIndex(r=>r.id===record.id);if(index<0)list.push(record);else list[index]=record;
    const next={schema:VERSION,records:list};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB. Export or remove older observations first.');c.metadata.realData=next;selected.set(c.id,record.id);actions.changed();
  }
  function el(tag,text,klass){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(klass)e.className=klass;return e;}
  function status(text,error){const e=document.getElementById('real-data-status');e.textContent=text;e.classList.toggle('real-data-error',!!error);}
  function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function escape(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function format(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function reportHtml(data){
    const tables=(rows,equipment)=>'<table><thead><tr>'+[equipment?'Equipment / metric':'Metric','Unit','Real','Simulated','Difference','Difference %','Recalculated real'].map((t,i)=>'<th scope="col"'+(i>=2&&i<=6?' class="numeric"':'')+'>'+t+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+[equipment?r.name+' / '+r.metric:r.metric,r.unit,format(r.real),format(r.simulated),format(r.delta),format(r.relativePercent),format(r.recalculated)].map((t,i)=>'<td'+(i>=2&&i<=6?' class="numeric"':'')+'>'+escape(t)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    const evidence={...data.run};delete evidence.equipment;
    return '<!doctype html><html lang="en"><meta charset="utf-8"><title>Real vs. simulated</title><style>body{font:14px system-ui;max-width:1100px;margin:32px auto;padding:20px;color:#213547}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{border:1px solid #ccd5dd;padding:8px;text-align:left}th{background:#eef4f7}.numeric{text-align:right;font-variant-numeric:tabular-nums}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0}tr{break-inside:avoid}}</style><h1>Real vs. simulated</h1><p>'+escape(data.case.name)+' / '+escape(data.simulation.name)+' / '+escape(data.observation.name)+'</p><p>Production date: '+escape(data.observation.date||'Not specified')+' | Source: '+escape(data.observation.source||'Not specified')+' | Status: '+escape(data.observation.status)+'</p><ul>'+data.warnings.map(w=>'<li>'+escape(w)+'</li>').join('')+'</ul>'+validationHtml(data.validation)+tables(data.rows,false)+tables(data.equipmentRows,true)+'<h2>Run evidence</h2><pre>'+escape(JSON.stringify(evidence,null,2))+'</pre><h2>Observation and notes</h2><pre>'+escape(JSON.stringify(data.observation,null,2))+'</pre><p>'+escape(data.conclusion)+'</p><p>Exported: '+escape(data.exportedAt)+'</p></html>';
  }
  function getComparison(){const record=current();return record?compare(record,context.simulation,sourceResult(context.simulation,context.live),selection,context.caseRecord,{simple:true}):null;}
  function table(target,rows,equipment){
    target.replaceChildren();const t=el('table'),thead=el('thead'),head=el('tr');(equipment?['Equipment','Unit','Real','Simulated','Difference']:['Metric','Unit','Real','Simulated','Difference','Difference %','Recalculated real']).forEach((v,i)=>{const th=el('th',v,i>=2&&i<(equipment?5:7)?'numeric':'');th.scope='col';head.append(th);});thead.append(head);t.append(thead);const body=el('tbody');
    rows.forEach(row=>{const tr=el('tr');let values=[equipment?row.name:row.metric,row.unit,format(row.real),Number.isFinite(row.simulated)?format(row.simulated):'Unavailable',row.comparable?format(row.delta):'—'];if(!equipment)values.push(format(row.relativePercent),format(row.recalculated));tr.title=row.note||'';values.forEach((v,i)=>tr.append(el('td',v,i>=2&&i<(equipment?5:7)?'numeric':'')));body.append(tr);});t.append(body);target.append(t);
  }
  function results(){
    const data=getComparison(),target=document.getElementById('real-data-comparison'),warnings=document.getElementById('real-data-warnings'),evidence=document.getElementById('real-data-evidence');
    target.replaceChildren();warnings.replaceChildren();evidence.replaceChildren();['real-data-export-json','real-data-export-html'].forEach(id=>document.getElementById(id).disabled=!data);
    renderValidation(data);
    if(!data){document.getElementById('real-data-downtime-comparison').replaceChildren();target.append(el('p','Add or import an observation to start.','empty'));return;}
    data.warnings.forEach(w=>warnings.append(el('li',w)));table(target,data.rows,false);
    const equipmentTarget=document.getElementById('real-data-downtime-comparison');equipmentTarget.replaceChildren();table(equipmentTarget,data.equipmentRows,true);
    const sim=data.run;if(sim){
      const stats=sim.statistics;evidence.append(el('p',sim.view+' · '+sim.engine+' · '+format(sim.duration/3600)+' h · seed '+sim.seed));
      if(stats?.n>1)evidence.append(el('p','Batch production: n = '+stats.n+' · mean '+format(stats.mean)+' · sample SD '+format(stats.standardDeviation)+' · min '+format(stats.min)+' · max '+format(stats.max)+' '+sim.unit.toLowerCase()));
      if(stats?.n>1&&stats.n<30)evidence.append(el('p','Few replications: the mean is imprecise. Variation between simulated days is not the uncertainty of real measurements.','chart-note'));
      evidence.append(el('p','Engine version: '+(sim.engineVersion||'Not recorded')+' · Completed: '+(sim.completedAt||'Not recorded')));
      const details=el('details');details.append(el('summary','Saved input signature and recording coverage'));details.append(el('pre',JSON.stringify({inputSignature:sim.inputSignature,detailCoverage:sim.detailCoverage},null,2)));evidence.append(details);
    }
    evidence.append(el('p',data.conclusion,'chart-note'));
  }
  function formRecord(value){
    const r=normalize(value);
    // Earlier observations only carried one production total. Display it without losing metadata.
    if(value.reportedProductionCases===undefined&&value.reportedProductionUnits===undefined){
      if(r.productionUnit==='CASES')r.reportedProductionCases=r.production;
      if(r.productionUnit==='BOTTLES')r.reportedProductionUnits=r.production;
    }
    return r;
  }
  function fillForm(record){
    record=formRecord(record);
    const form=document.getElementById('real-data-fields');form.replaceChildren();
    const fields=[['reportedEfficiencyPercent','AU (%)'],['reportedUpdtPercent','UPDT (%)'],['shiftProduction.0','Shift 1 (Cases)'],['shiftProduction.1','Shift 2 (Cases)'],['shiftProduction.2','Shift 3 (Cases)'],['reportedProductionCases','Total Production Day (Cases)'],['reportedProductionUnits','Total Production Day (Units)'],['durationSeconds','Total Time (min)'],['aem.businessExternalDowntimeSeconds','Business External Time (min)'],['aem.plantAvailableSeconds','Plant Available Time (min)'],['aem.plantDecisionDowntimeSeconds','Plant Decision Time (min)'],['aem.productionAvailableSeconds','Production Available Time (min)'],['downtimeSeconds','Downtime (min)'],['runTimeSeconds','Run Time (min)'],['rateLossSeconds','Rate Loss (min)']];
    fields.forEach(([key,label])=>{
      const wrapper=el('label',label),input=el('input'),parts=key.split('.'),isTime=key.endsWith('Seconds'),stored=parts.length>1?record[parts[0]][parts[1]]:record[key];
      input.type='number';input.id='real-data-'+key;input.dataset.realField=key;input.min=key==='durationSeconds'?'0.000001':'0';input.step='any';if(key.endsWith('Percent'))input.max='100';input.value=stored==null?'':stored/(isTime?60:1);wrapper.append(input);form.append(wrapper);
      input.oninput=()=>{
        if(!input.checkValidity()){status('Correct the highlighted value.',true);return;}
        const draft=formRecord(current()),previousDuration=draft.durationSeconds,value=input.value===''?null:Number(input.value)*(isTime?60:1);
        if(parts.length>1)draft[parts[0]][parts[1]]=value;else draft[key]=value;
        if(key==='reportedProductionCases'||key==='reportedProductionUnits'){
          draft.production=draft.reportedProductionUnits??draft.reportedProductionCases;draft.productionUnit=draft.reportedProductionUnits!=null?'BOTTLES':'CASES';
        }
        if(key==='runTimeSeconds'||key==='rateLossSeconds')draft.effectiveRuntimeSeconds=draft.runTimeSeconds!=null&&draft.rateLossSeconds!=null&&draft.runTimeSeconds>=draft.rateLossSeconds?draft.runTimeSeconds-draft.rateLossSeconds:null;
        if(key==='durationSeconds')draft.equipment.forEach(e=>{if(e.exposureSeconds==null||e.exposureSeconds===previousDuration)e.exposureSeconds=value;});
        try{persist(normalize(draft));status('Observation updated. Follow the case Save / autosave status.');results();}catch(error){status(error.message,true);}
      };
    });
    equipmentForm(record);
  }
  function equipmentForm(record){
    const target=document.getElementById('real-data-equipment');target.replaceChildren();const table=el('table'),head=el('tr');
    ['Equipment','Downtime (min)'].forEach((text,i)=>{const th=el('th',text,i===1?'numeric':'');th.scope='col';head.append(th);});const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');
    const all=(context.simulation?.equipment||[]).slice();record.equipment.filter(o=>!all.some(e=>e.id===o.equipmentId)).forEach(o=>all.push({id:o.equipmentId,name:(o.name||o.equipmentId)+' (not in simulation)'}));
    all.forEach(e=>{
      const tr=el('tr'),name=el('th',e.name);name.scope='row';tr.append(name);const td=el('td',null,'numeric'),input=el('input'),observed=record.equipment.find(o=>o.equipmentId===e.id);
      input.type='number';input.min='0';input.step='any';input.setAttribute('aria-label',e.name+' downtime (min)');input.dataset.equipmentId=e.id;input.dataset.realEquipmentField='downtimeSeconds';input.value=observed?.downtimeSeconds==null?'':observed.downtimeSeconds/60;td.append(input);tr.append(td);tbody.append(tr);
      input.oninput=()=>{
        if(!input.checkValidity()){status('Correct the equipment downtime.',true);return;}
        const draft=formRecord(current()),item=draft.equipment.find(o=>o.equipmentId===e.id)||{equipmentId:e.id,name:e.name,stopClass:'UNKNOWN',exposureSeconds:draft.durationSeconds};
        if(!draft.equipment.includes(item))draft.equipment.push(item);item.downtimeSeconds=input.value===''?null:Number(input.value)*60;
        try{persist(normalize(draft));status('Equipment downtime updated.');results();}catch(error){status(error.message,true);}
      };
    });table.append(tbody);target.append(table);
  }
  function render(caseRecord,simulation,live){
    if(!state||!caseRecord)return;if(context?.caseRecord.id!==caseRecord.id||context?.simulation?.id!==simulation?.id)selection='average';context={caseRecord,simulation,live};const record=current();if(record)selected.set(caseRecord.id,record.id);
    const selector=document.getElementById('real-data-record');selector.replaceChildren();records().forEach(r=>{const o=el('option',r.name+(r.date?' · '+r.date:''));o.value=r.id;selector.append(o);});selector.value=record?.id||'';
    document.getElementById('real-data-editor').hidden=!record;document.getElementById('real-data-delete').disabled=!record;
    const key=caseRecord.id+':'+(record?.id||'')+':'+(simulation?.id||'')+':'+timeUnit;
    if(formOwner!==key){formOwner=key;if(record)fillForm(record);}
    const result=sourceResult(simulation,live),view=document.getElementById('real-data-view');view.replaceChildren();const options=[['average','Average of all rounds']];if(result?.batch?.rows?.length){options.push(['representative','Representative round']);result.batch.rows.forEach(r=>options.push([String(r.round),'Round '+r.round+' · seed '+r.seed]));}if(!options.some(([v])=>v===selection))selection='average';options.forEach(([value,text])=>{const o=el('option',text);o.value=value;view.append(o);});view.value=selection;
    document.getElementById('real-data-simulation').textContent='Compared simulation: '+(simulation?.name||'None')+'. Observations are shared by the case; selecting another simulation reuses the same real record.';results();
  }
  function init(currentState,callbacks){
    state=currentState;actions=callbacks;
    document.getElementById('real-data-new').onclick=()=>{if(records().length>=MAX_RECORDS){status('Limit: '+MAX_RECORDS+' observations per case.',true);return;}const record=empty();record.name='Production day '+(records().length+1);record.source='Manual entry';record.status='MEASURED';record.date=state.activeCase.metadata?.dateOfAnalysis||'';record.bottlesPerCase=context.simulation?.sourceImport?.metadata?.bottlesPerCase??state.activeCase.metadata?.bottlesPerCase??null;try{persist(record);formOwner='';render(context.caseRecord,context.simulation,context.live);status('New observation created.');}catch(error){status(error.message,true);}};
    document.getElementById('real-data-record').onchange=e=>{selected.set(state.activeCase.id,e.target.value);formOwner='';render(context.caseRecord,context.simulation,context.live);status('');};
    document.getElementById('real-data-view').onchange=e=>{selection=e.target.value;results();};
    document.getElementById('real-data-delete').onclick=async()=>{const c=state.activeCase,r=current();if(!r)return;const answer=await STDialog.open({title:'Delete observation',message:'Delete '+r.name+'? Simulation inputs and results are retained.',buttons:[{id:'cancel',label:'Cancel'},{id:'delete',label:'Delete',destructive:true}]});if(answer.action!=='delete'||state.activeCase!==c)return;c.metadata.realData={schema:VERSION,records:records().filter(v=>v.id!==r.id)};selected.delete(c.id);actions.changed();formOwner='';render(c,context.simulation,context.live);};
    const file=document.getElementById('real-data-file');document.getElementById('real-data-import').onclick=()=>file.click();
    file.onchange=async()=>{const f=file.files?.[0],owner=state.activeCase,ticket=++revision;file.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('Real-data JSON must be 2 MB or smaller.');const imported=importRecords(JSON.parse(await f.text()));if(state.activeCase!==owner||ticket!==revision)return;if(records().length+imported.length>MAX_RECORDS)throw Error('Too many observations.');const added=imported.map(r=>({...r,id:empty().id})),next={schema:VERSION,records:records().concat(added)};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB.');owner.metadata=owner.metadata||{};owner.metadata.realData=next;selected.set(owner.id,added[0].id);actions.changed();formOwner='';render(owner,context.simulation,context.live);status('Imported '+added.length+' observation(s). Review source definitions before comparing.');}catch(error){status('Import failed: '+error.message,true);}};
    document.getElementById('real-data-template').onclick=()=>download(JSON.stringify(template(context?.simulation?.equipment||[]),null,2),'real-data-template.json','application/json');
    document.getElementById('real-data-export-json').onclick=()=>{const data=getComparison();if(data)download(JSON.stringify(data,null,2),'real-vs-simulated.json','application/json');};
    document.getElementById('real-data-export-html').onclick=()=>{const data=getComparison();if(data)download(reportHtml(data),'real-vs-simulated.html','text/html;charset=utf-8');};
  }
  function selectRecord(caseId,id){selected.set(caseId,id);formOwner='';}
  return {validationData,init,render,selectRecord,normalize,importRecords,compare,snapshot,reportHtml,template};
})();
