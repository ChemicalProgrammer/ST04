  function addAemRows(real,sim,simulation,result,effective,run,sameFormat,stale,add,rows,warnings){
    const a=real.aem,hasAem=aemTimeKeys.some(k=>a[k]!=null)||a.basis!=='UNCONFIRMED'||real.reportedUpdtPercent!=null||real.updtDefinition!=='UNCONFIRMED';
    if(!hasAem)return;
    const close=(x,y,tolerance=1)=>Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(x-y)<=tolerance;
    const total=real.durationSeconds,plant=a.plantAvailableSeconds??(total!=null&&a.businessExternalDowntimeSeconds!=null?total-a.businessExternalDowntimeSeconds:null),production=a.productionAvailableSeconds??(plant!=null&&a.plantDecisionDowntimeSeconds!=null?plant-a.plantDecisionDowntimeSeconds:null);
    const bottleCount=real.production==null?null:real.productionUnit==='BOTTLES'?real.production:real.productionUnit==='CASES'&&real.bottlesPerCase?real.production*real.bottlesPerCase:null;
    const goodCount=real.outputBasis==='GOOD'?bottleCount:real.outputBasis==='GROSS'&&real.qualityPercent!=null&&bottleCount!=null?bottleCount*real.qualityPercent/100:null;
    const fromOutput=goodCount!=null&&real.referenceSpeedBpm?goodCount/real.referenceSpeedBpm*60:null;
    const t5=real.effectiveRuntimeSeconds??fromOutput??(real.runTimeSeconds!=null&&real.rateLossSeconds!=null?real.runTimeSeconds-real.rateLossSeconds:null);
    const t=[total,plant,production,real.runTimeSeconds,t5];let coherent=true;
    if(fromOutput!=null&&t5!=null&&!close(fromOutput,t5)){coherent=false;warnings.push('AEM effective runtime differs from good output / standard rate.');}
    for(let i=0;i<t.length;i++)if(t[i]!=null&&(t[i]<0||i&&t[i-1]!=null&&t[i]>t[i-1]+1)){coherent=false;warnings.push('AEM time hierarchy is inconsistent. Source values were preserved.');break;}
    for(const [x,y,label] of [[plant,total!=null&&a.businessExternalDowntimeSeconds!=null?total-a.businessExternalDowntimeSeconds:null,'Plant Available'],[production,plant!=null&&a.plantDecisionDowntimeSeconds!=null?plant-a.plantDecisionDowntimeSeconds:null,'Production Available'],[t5,real.runTimeSeconds!=null&&real.rateLossSeconds!=null?real.runTimeSeconds-real.rateLossSeconds:null,'Effective Runtime']])if(x!=null&&y!=null&&!close(x,y)){coherent=false;warnings.push('AEM '+label+' does not reconcile with the source times.');}
    if(real.shiftProduction.length===3&&real.shiftProduction.every(Number.isFinite)&&real.production!=null&&!close(real.shiftProduction.reduce((a,b)=>a+b,0),real.production,0.001))warnings.push('Shift production sum differs from total production; original values retained.');
    if(real.periodStart&&real.periodEnd&&total!=null&&!close((Date.parse(real.periodEnd)-Date.parse(real.periodStart))/1000,total))warnings.push('Start/end period differs from Total Time.');
    const calendar=simulation?.dynamicConfig?.plantCalendar;
    let predictedTotal=sim?.duration??null,predictedPlant=predictedTotal,predictedProduction=predictedTotal;
    if(calendar?.enabled){
      const audit=result?.plantCalendar,source=calendar.appliedCalendar||calendar;
      if(audit?.completePeriod&&close(audit.horizonSeconds,sim?.duration)&&source.totalMinutes>0){
        predictedTotal=source.totalMinutes*60;predictedPlant=predictedTotal-(source.externalMinutes||0)*60;predictedProduction=predictedPlant-(audit.plannedStopSeconds||0)-(source.coReportingErrorMinutes||0)*60;
      }else {predictedTotal=predictedPlant=predictedProduction=null;warnings.push('AEM simulation comparison requires the full scheduled calendar; aggregate calendar projections are not paired automatically.');}
    }
    const confirmed=a.basis==='CALENDAR_OUTPUT_FLOW'&&(real.outputBasis==='GOOD'||real.outputBasis==='GROSS'&&real.qualityPercent===100),period=close(total,predictedTotal),simCoherent=effective!=null&&run!=null&&predictedProduction!=null&&effective<=run+1&&run<=predictedProduction+1;
    const ratio=(n,d)=>Number.isFinite(n)&&d>0?n/d*100:null;
    const actualUpdt=production!=null&&real.runTimeSeconds!=null?production-real.runTimeSeconds:null,predictedUpdt=predictedProduction!=null&&run!=null?predictedProduction-run:null;
    const actualLoss=total!=null&&t5!=null?total-t5:null,predictedLoss=predictedTotal!=null&&effective!=null?predictedTotal-effective:null;
    const updtDen=real.updtPercentDenominator,actualDen={TOTAL:total,PLANT:plant,PRODUCTION:production}[updtDen],predictedDen={TOTAL:predictedTotal,PLANT:predictedPlant,PRODUCTION:predictedProduction}[updtDen];
    const updtActual=real.updtDefinition==='AEM_UNPLANNED'?actualUpdt:real.updtDefinition==='TOTAL_EQUIVALENT_LOSS'?actualLoss:null,updtSim=real.updtDefinition==='AEM_UNPLANNED'?predictedUpdt:real.updtDefinition==='TOTAL_EQUIVALENT_LOSS'?predictedLoss:null;
    const metrics=[['AEM Asset Effectiveness',null,ratio(t5,total),ratio(effective,predictedTotal),'%'],['AEM Asset Utilization',real.reportedEfficiencyPercent,ratio(t5,plant),ratio(effective,predictedPlant),'%'],['AEM Operating Efficiency',null,ratio(t5,production),ratio(effective,predictedProduction),'%'],['AEM Runtime Efficiency',null,ratio(t5,real.runTimeSeconds),ratio(effective,run),'%'],['Defined UPDT',real.updtSeconds==null?null:real.updtSeconds/60,updtActual==null?null:updtActual/60,updtSim==null?null:updtSim/60,'min'],['Defined UPDT percentage',real.reportedUpdtPercent,ratio(updtActual,actualDen),ratio(updtSim,predictedDen),'%']];
    for(const [label,reported,recalculated,predicted,unit] of metrics){
      const difference=reported!=null&&recalculated!=null&&Math.abs(reported-recalculated)>(unit==='%'?.05:1/60);
      if(difference)warnings.push(label+': reported value differs from recalculated source times.');
      const allowed=confirmed&&coherent&&simCoherent&&period&&sameFormat&&!difference&&!stale;
      add(label,reported??recalculated,predicted,unit,allowed,!confirmed?'Confirm AEM basis and GOOD/GROSS output basis in the observation.':difference?'Source values disagree; reconcile before comparing.':!coherent?'Inconsistent observed time hierarchy.':!period?'AEM calendar periods differ or are unavailable.':!simCoherent?'Requires compatible reference speed, full calendar and output running time.':'Same AEM definition, calendar and reference speed; percentage differences are points.');
      rows.at(-1).recalculated=recalculated;
    }
  }
  function records(){const value=state?.activeCase?.metadata?.realData?.records;return Array.isArray(value)?value:[];}
  function current(){return records().find(r=>r.id===selected.get(state.activeCase?.id))||records()[0]||null;}
  function persist(record){
    const c=state.activeCase;c.metadata=c.metadata||{};const list=records().slice(),index=list.findIndex(r=>r.id===record.id);if(index<0)list.push(record);else list[index]=record;
    const next={schema:VERSION,records:list};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB. Export or remove older observations first.');c.metadata.realData=next;selected.set(c.id,record.id);actions.changed();
  }
  function el(tag,text,klass){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(klass)e.className=klass;return e;}
  function status(text,error){const e=document.getElementById('real-data-status');e.textContent=text;e.classList.toggle('real-data-error',!!error);}
  function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function escape(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function format(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function reportHtml(data){
    const tables=(rows,equipment)=>'<table><thead><tr>'+[equipment?'Equipment / metric':'Metric','Unit','Real','Simulated','Difference','Difference %','Recalculated real','Basis'].map((t,i)=>'<th scope="col"'+(i>=2&&i<=6?' class="numeric"':'')+'>'+t+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+[equipment?r.name+' / '+r.metric:r.metric,r.unit,format(r.real),format(r.simulated),format(r.delta),format(r.relativePercent),format(r.recalculated),r.note].map((t,i)=>'<td'+(i>=2&&i<=6?' class="numeric"':'')+'>'+escape(t)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    const evidence={...data.run};delete evidence.equipment;
    return '<!doctype html><html lang="en"><meta charset="utf-8"><title>Real vs. simulated</title><style>body{font:14px system-ui;max-width:1100px;margin:32px auto;padding:20px;color:#213547}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{border:1px solid #ccd5dd;padding:8px;text-align:left}th{background:#eef4f7}.numeric{text-align:right;font-variant-numeric:tabular-nums}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0}tr{break-inside:avoid}}</style><h1>Real vs. simulated</h1><p>'+escape(data.case.name)+' / '+escape(data.simulation.name)+' / '+escape(data.observation.name)+'</p><p>Production date: '+escape(data.observation.date||'Not specified')+' | Source: '+escape(data.observation.source||'Not specified')+' | Status: '+escape(data.observation.status)+'</p><ul>'+data.warnings.map(w=>'<li>'+escape(w)+'</li>').join('')+'</ul>'+tables(data.rows,false)+tables(data.equipmentRows,true)+'<h2>Run evidence</h2><pre>'+escape(JSON.stringify(evidence,null,2))+'</pre><h2>Observation and notes</h2><pre>'+escape(JSON.stringify(data.observation,null,2))+'</pre><p>'+escape(data.conclusion)+'</p><p>Exported: '+escape(data.exportedAt)+'</p></html>';
  }
  function getComparison(){const record=current();return record?compare(record,context.simulation,sourceResult(context.simulation,context.live),selection,context.caseRecord):null;}
  function table(target,rows,equipment){
    target.replaceChildren();const t=el('table'),thead=el('thead'),head=el('tr');(equipment?['Equipment / metric','Unit','Real','Simulated','Difference','Basis']:['Metric','Unit','Real','Simulated','Difference','Difference %','Recalculated real','Basis']).forEach((v,i)=>{const th=el('th',v,i>=2&&i<(equipment?5:7)?'numeric':'');th.scope='col';head.append(th);});thead.append(head);t.append(thead);const body=el('tbody');
    rows.forEach(row=>{const tr=el('tr');let values=[equipment?row.name+' / '+row.metric:row.metric,row.unit,format(row.real),Number.isFinite(row.simulated)?format(row.simulated):'Unavailable',row.comparable?format(row.delta):'Not comparable'];if(!equipment)values.push(format(row.relativePercent),format(row.recalculated));values.push(row.note);values.forEach((v,i)=>tr.append(el('td',v,i>=2&&i<(equipment?5:7)?'numeric':'')));body.append(tr);});t.append(body);target.append(t);
  }
  function results(){
    const data=getComparison(),target=document.getElementById('real-data-comparison'),warnings=document.getElementById('real-data-warnings'),evidence=document.getElementById('real-data-evidence');
    target.replaceChildren();warnings.replaceChildren();evidence.replaceChildren();['real-data-export-json','real-data-export-html'].forEach(id=>document.getElementById(id).disabled=!data);
    if(!data){target.append(el('p','Add or import an observation to start.','empty'));return;}
    data.warnings.forEach(w=>warnings.append(el('li',w)));table(target,data.rows,false);
    if(data.equipmentRows.length){target.append(el('h3','Equipment comparison'));const host=el('div',null,'table-scroll');target.append(host);table(host,data.equipmentRows,true);}
    const sim=data.run;if(sim){
      const stats=sim.statistics;evidence.append(el('p',sim.view+' · '+sim.engine+' · '+format(sim.duration/3600)+' h · seed '+sim.seed));
      if(stats?.n>1)evidence.append(el('p','Batch production: n = '+stats.n+' · mean '+format(stats.mean)+' · sample SD '+format(stats.standardDeviation)+' · min '+format(stats.min)+' · max '+format(stats.max)+' '+sim.unit.toLowerCase()));
      if(stats?.n>1&&stats.n<30)evidence.append(el('p','Few replications: the mean is imprecise. Variation between simulated days is not the uncertainty of real measurements.','chart-note'));
      evidence.append(el('p','Engine version: '+(sim.engineVersion||'Not recorded')+' · Completed: '+(sim.completedAt||'Not recorded')));
      const details=el('details');details.append(el('summary','Saved input signature and recording coverage'));details.append(el('pre',JSON.stringify({inputSignature:sim.inputSignature,detailCoverage:sim.detailCoverage},null,2)));evidence.append(details);
    }

  }
  function fillForm(record){
    record=normalize(record);
    const form=document.getElementById('real-data-fields');form.replaceChildren();const timeDivisor=timeUnit==='HOURS'?3600:timeUnit==='SECONDS'?1:60;
    function field(key,label,type,options){const wrapper=el('label',label),input=el(options?'select':type==='textarea'?'textarea':'input');input.id='real-data-'+key;input.dataset.realField=key;
      if(options)options.forEach(([value,text])=>{const o=el('option',text);o.value=value;input.append(o);});else if(type!=='textarea')input.type=type||'number';
      if(input.type==='number'){input.min=['durationSeconds','bottlesPerCase','referenceSpeedBpm'].includes(key)?'0.000001':'0';input.step=key==='bottlesPerCase'?'1':'any';if(['reportedEfficiencyPercent','reportedUpdtPercent','qualityPercent'].includes(key))input.max='100';}
      if(['name','source','notes'].includes(key))input.maxLength=key==='sourceSnapshot'?64000:key==='notes'?8000:key==='source'?2000:160;
      const stored=key.startsWith('aem.')?record.aem[key.slice(4)]:record[key];input.value=stored==null?'':timeKeys.includes(key)||key.startsWith('aem.')&&key!=='aem.basis'?stored/timeDivisor:stored;wrapper.append(input);form.append(wrapper);if(key==='source'||key==='notes')wrapper.className='real-data-wide';
      input.addEventListener('input',()=>{if(!input.checkValidity()){status('Correct the highlighted field before it can be stored.',true);return;}const draft={...current(),[key]:input.type==='number'?(input.value===''?null:Number(input.value)*(timeKeys.includes(key)||key.startsWith('aem.')&&key!=='aem.basis'?timeDivisor:1)):input.value};if(key.startsWith('aem.')){draft.aem={...current().aem,[key.slice(4)]:draft[key]};delete draft[key];}try{persist(normalize(draft));status('Observation updated. Follow the case Save / autosave status.');results();}catch(error){status(error.message,true);}});
    }
    field('name','Record name','text');field('date','Production date','date');field('status','Data status',null,[['PENDING','Pending confirmation'],['MEASURED','Measured'],['DERIVED','Derived from source'],['ESTIMATED','Estimated']]);field('source','Source / reference','text');
    field('production','Production at final output');field('productionUnit','Production unit',null,[['BOTTLES','Bottles'],['CASES','Cases'],['UNITS','Native units']]);field('bottlesPerCase','Bottles per case');field('referenceSpeedBpm','Confirmed ideal reference (bottles/min)');field('reportedEfficiencyPercent','Reported AU / efficiency (%)');
    timeKeys.forEach(key=>field(key,labels[key]+' ('+(timeUnit==='HOURS'?'h':timeUnit==='SECONDS'?'s':'min')+')'));
    field('lineTimeBasis','Line-time comparison basis',null,[['UNCONFIRMED','Definitions pending — show estimates only'],['OUTPUT_FLOW','Confirmed: final-output flow + ideal reference; UPDT includes all losses']]);
    field('outputBasis','Production basis',null,[['UNCONFIRMED','Unconfirmed'],['GOOD','Good output'],['GROSS','Gross output (simulation assumes no rejects)']]);
    field('periodStart','Period start (ISO)','text');field('periodEnd','Period end (ISO)','text');
    field('reportedUpdtPercent','Reported UPDT (%)');
    field('updtDefinition','UPDT definition',null,[['UNCONFIRMED','Unconfirmed'],['AEM_UNPLANNED','AEM: production available − runtime'],['TOTAL_EQUIVALENT_LOSS','Total calendar − effective runtime']]);
    field('updtPercentDenominator','UPDT percentage denominator',null,[['UNCONFIRMED','Unconfirmed'],['TOTAL','Total time'],['PLANT','Plant available'],['PRODUCTION','Production available']]);
    field('aem.basis','AEM comparison basis',null,[['UNCONFIRMED','Definitions pending'],['CALENDAR_OUTPUT_FLOW','Confirmed: AEM calendar + final-output runtime']]);
    aemTimeKeys.forEach(key=>field('aem.'+key,key.replace(/Seconds$/,'').replace(/([A-Z])/g,' $1')+' ('+(timeUnit==='HOURS'?'h':timeUnit==='SECONDS'?'s':'min')+')'));
    const shifts=el('p','Shift production: '+record.shiftProduction.map(v=>v==null?'—':format(v)).join(' / ')+' '+record.productionUnit.toLowerCase()+'.');shifts.className='chart-note';form.append(shifts);
    field('qualityPercent','Observed quality (%)');field('notes','Notes / unresolved definitions','textarea');equipmentForm(record);
  }
  function equipmentForm(record){
    const target=document.getElementById('real-data-equipment');target.replaceChildren();const table=el('table'),head=el('tr');['Equipment','Stop class','Exposure (min)','Stops','Failure time (min)','Observed downtime (min)','MTBF (min)','MTTR (min)','Notes'].forEach((t,i)=>{const th=el('th',t,i>=2&&i<=7?'numeric':'');th.scope='col';head.append(th);});const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');
    const allEquipment=(context.simulation?.equipment||[]).slice();record.equipment.filter(o=>!allEquipment.some(e=>e.id===o.equipmentId)).forEach(o=>allEquipment.push({id:o.equipmentId,name:(o.name||o.equipmentId)+' (not in simulation)'}));
    allEquipment.forEach(e=>{const tr=el('tr');tr.append(el('th',e.name));const observed=record.equipment.find(o=>o.equipmentId===e.id)||{equipmentId:e.id,name:e.name};
      ['stopClass','exposureSeconds','failureCount','failureSeconds','downtimeSeconds','mtbfMinutes','mttrMinutes','notes'].forEach(key=>{const td=el('td'),input=el(key==='stopClass'?'select':key==='notes'?'textarea':'input');input.setAttribute('aria-label',e.name+' '+key);input.dataset.equipmentId=e.id;input.dataset.realEquipmentField=key;
        if(key==='stopClass')[['UNKNOWN','Unknown'],['FAILURES','Failures / repairs'],['MINOR','Minor stops'],['ALL','All stops']].forEach(([value,text])=>{const o=el('option',text);o.value=value;input.append(o);});else if(key==='notes'){input.maxLength=4000;input.rows=2;}else {input.type='number';input.min=key==='exposureSeconds'?'0.000001':'0';input.step=key==='failureCount'?'1':'any';}
        input.value=observed[key]==null?(key==='stopClass'?'UNKNOWN':''):['exposureSeconds','failureSeconds','downtimeSeconds'].includes(key)?observed[key]/60:observed[key];td.append(input);tr.append(td);
        input.oninput=()=>{if(!input.checkValidity()){status('Correct the equipment observation.',true);return;}const draft=JSON.parse(JSON.stringify(current())),item=draft.equipment.find(o=>o.equipmentId===e.id)||{equipmentId:e.id,name:e.name};if(!draft.equipment.includes(item))draft.equipment.push(item);item[key]=['stopClass','notes'].includes(key)?input.value:input.value===''?null:Number(input.value)*(['exposureSeconds','failureSeconds','downtimeSeconds'].includes(key)?60:1);try{persist(normalize(draft));status('Equipment observation updated.');results();}catch(error){status(error.message,true);}};
      });tbody.append(tr);});table.append(tbody);target.append(table);
  }
  function render(caseRecord,simulation,live){
    if(!state||!caseRecord)return;if(context?.caseRecord.id!==caseRecord.id||context?.simulation?.id!==simulation?.id)selection='average';context={caseRecord,simulation,live};const record=current();if(record)selected.set(caseRecord.id,record.id);
    const selector=document.getElementById('real-data-record');selector.replaceChildren();records().forEach(r=>{const o=el('option',r.name+(r.date?' · '+r.date:''));o.value=r.id;selector.append(o);});selector.value=record?.id||'';
    document.getElementById('real-data-editor').hidden=!record;document.getElementById('real-data-delete').disabled=!record;

    const result=sourceResult(simulation,live),view=document.getElementById('real-data-view');view.replaceChildren();const options=[['average','Average of all rounds']];if(result?.batch?.rows?.length){options.push(['representative','Representative round']);result.batch.rows.forEach(r=>options.push([String(r.round),'Round '+r.round+' · seed '+r.seed]));}if(!options.some(([v])=>v===selection))selection='average';options.forEach(([value,text])=>{const o=el('option',text);o.value=value;view.append(o);});view.value=selection;

  }
  function init(currentState,callbacks){
    state=currentState;actions=callbacks;
    document.getElementById('real-data-new').onclick=()=>{if(records().length>=MAX_RECORDS){status('Limit: '+MAX_RECORDS+' observations per case.',true);return;}const record=empty();try{persist(record);formOwner='';render(context.caseRecord,context.simulation,context.live);status('New observation created.');}catch(error){status(error.message,true);}};
    document.getElementById('real-data-record').onchange=e=>{selected.set(state.activeCase.id,e.target.value);formOwner='';render(context.caseRecord,context.simulation,context.live);status('');};
    document.getElementById('real-data-view').onchange=e=>{selection=e.target.value;results();};
    document.getElementById('real-data-time-unit').onchange=e=>{timeUnit=e.target.value;formOwner='';render(context.caseRecord,context.simulation,context.live);};
    document.getElementById('real-data-delete').onclick=async()=>{const c=state.activeCase,r=current();if(!r)return;const answer=await STDialog.open({title:'Delete observation',message:'Delete '+r.name+'? Simulation inputs and results are retained.',buttons:[{id:'cancel',label:'Cancel'},{id:'delete',label:'Delete',destructive:true}]});if(answer.action!=='delete'||state.activeCase!==c)return;c.metadata.realData={schema:VERSION,records:records().filter(v=>v.id!==r.id)};selected.delete(c.id);actions.changed();formOwner='';render(c,context.simulation,context.live);};
    const file=document.getElementById('real-data-file');document.getElementById('real-data-import').onclick=()=>file.click();
    file.onchange=async()=>{const f=file.files?.[0],owner=state.activeCase,ticket=++revision;file.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('Real-data JSON must be 2 MB or smaller.');const imported=importRecords(JSON.parse(await f.text()));if(state.activeCase!==owner||ticket!==revision)return;if(records().length+imported.length>MAX_RECORDS)throw Error('Too many observations.');const added=imported.map(r=>({...r,id:empty().id})),next={schema:VERSION,records:records().concat(added)};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB.');owner.metadata=owner.metadata||{};owner.metadata.realData=next;selected.set(owner.id,added[0].id);actions.changed();formOwner='';render(owner,context.simulation,context.live);status('Imported '+added.length+' observation(s). Review source definitions before comparing.');}catch(error){status('Import failed: '+error.message,true);}};
    document.getElementById('real-data-template').onclick=()=>download(JSON.stringify(template(context?.simulation?.equipment||[]),null,2),'real-data-template.json','application/json');
    document.getElementById('real-data-export-json').onclick=()=>{const data=getComparison();if(data)download(JSON.stringify(data,null,2),'real-vs-simulated.json','application/json');};
    document.getElementById('real-data-export-html').onclick=()=>{const data=getComparison();if(data)download(reportHtml(data),'real-vs-simulated.html','text/html;charset=utf-8');};
  }
  function selectRecord(caseId,id){selected.set(caseId,id);formOwner='';}
  return {init,render,selectRecord,normalize,importRecords,compare,snapshot,reportHtml,template};
})();
