<script>
window.STRealData=(function(){
  'use strict';
  var state,actions,context,selected=new Map(),timeUnit='MINUTES',selection='average',formOwner='',revision=0;
  const VERSION='st-real-data-v1',MAX_RECORDS=100;
  const timeKeys=['durationSeconds','downtimeSeconds','runTimeSeconds','effectiveRuntimeSeconds','updtSeconds','rateLossSeconds'];
  const labels={durationSeconds:'Observation duration',downtimeSeconds:'Line downtime',runTimeSeconds:'Line run time',effectiveRuntimeSeconds:'Effective runtime',updtSeconds:'UPDT',rateLossSeconds:'Rate loss equivalent'};
  function empty(){return {id:'real-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),name:'Production day',date:'',source:'',notes:'',status:'PENDING',durationSeconds:86400,production:null,productionUnit:'BOTTLES',bottlesPerCase:null,referenceSpeedBpm:null,reportedEfficiencyPercent:null,qualityPercent:null,equipment:[]};}
  function numeric(value,key,positive){if(value===null||value===undefined||value==='')return null;if(typeof value!=='number'||!Number.isFinite(value)||value<0||positive&&value===0)throw Error('Invalid '+key+'. Use a non-negative number or null.');return value;}
  function normalize(value){
    if(!value||typeof value!=='object'||Array.isArray(value))throw Error('A real-data record must be an object.');

    if(!result.name.trim())throw Error('Enter a record name.');

    if(value.status!=null){if(!['MEASURED','DERIVED','ESTIMATED','PENDING'].includes(value.status))throw Error('Unknown data status.');result.status=value.status;}
    if(value.productionUnit!=null){if(!['BOTTLES','CASES','UNITS'].includes(value.productionUnit))throw Error('Unknown production unit.');result.productionUnit=value.productionUnit;}
    timeKeys.concat(['production','bottlesPerCase','referenceSpeedBpm','reportedEfficiencyPercent','qualityPercent']).forEach(key=>{result[key]=numeric(value[key],key,['durationSeconds','bottlesPerCase','referenceSpeedBpm'].includes(key));});
    ['reportedEfficiencyPercent','qualityPercent'].forEach(key=>{if(result[key]>100)throw Error(key+' cannot exceed 100%.');});
    if(result.bottlesPerCase!=null&&!Number.isInteger(result.bottlesPerCase))throw Error('Bottles per case must be an integer.');
    if(value.equipment!=null&&!Array.isArray(value.equipment))throw Error('equipment must be an array.');

      if(!['UNKNOWN','FAILURES','MINOR','ALL'].includes(out.stopClass))throw Error('Unknown stop class.');

      if(out.failureCount!==null&&!Number.isInteger(out.failureCount))throw Error('Stop count must be an integer.');return out;
    });

    return result;
  }
  function template(equipment){
    const sample=empty();timeKeys.forEach(key=>{if(!(key in sample))sample[key]=null;});sample.id='example-day';sample.source='Enter the report, sheet or measurement reference';sample.sourceSnapshot='';sample.notes='Replace example labels and the 86400-second day with your observation. Unknown numeric values are null, not zero.';
    const units=equipment?.length?equipment:[{id:'replace-with-equipment-id',name:'Example equipment'}];
    sample.equipment=units.map(e=>({equipmentId:e.id,name:e.name||e.id,stopClass:'UNKNOWN',exposureSeconds:null,failureCount:null,failureSeconds:null,mtbfMinutes:null,mttrMinutes:null,notes:''}));
    return {schema:VERSION,_guide:{instructions:['Only records is imported. _guide is explanatory reference data.','Duplicate a records entry to capture another day or observation period.','Equipment entries are real observations linked to existing simulation equipment by equipmentId. They do not create or configure physical equipment.','Template IDs and names come from the currently selected simulation, including conveyors. Preserve IDs to match results.','All fields ending in Seconds use seconds. MTBF and MTTR use minutes. Display-unit choices do not change JSON units.','Use null for unknown numeric values and an empty string for unknown text. Zero is a measured zero.','EXAMPLE ONLY: durationSeconds=86400 means 24 hours; replace it if needed.'],recordFields:{id:'Text identifier; fresh IDs are assigned on import.',name:'Required record title.',date:'YYYY-MM-DD, or empty when unknown.',source:'Source / report / reference.',notes:'Free observations and unresolved definitions (up to 8000 characters).',status:['MEASURED','DERIVED','ESTIMATED','PENDING'],production:'Non-negative final-output count, or null.',productionUnit:['BOTTLES','CASES','UNITS'],bottlesPerCase:'Positive integer for case conversion, or null.',referenceSpeedBpm:'Confirmed ideal reference in bottles/min, or null. Not automatically the average running speed.',reportedEfficiencyPercent:'Source AU / efficiency in percent (0-100), or null. Its definition is not assumed to match OEE.',qualityPercent:'Observed quality in percent (0-100), or null.',durationSeconds:'Positive full observation period in seconds, or null.',downtimeSeconds:'Exclusive line downtime in seconds, or null.',runTimeSeconds:'Line run time in seconds, or null.',effectiveRuntimeSeconds:'Effective runtime in seconds, or null.',updtSeconds:'Source UPDT in seconds, or null; confirm its definition.',rateLossSeconds:'Equivalent rate-loss seconds, or null. Not automatically a full stop.',sourceSnapshot:'Optional original source text / serialized JSON. Empty when unavailable; up to 64000 characters.',equipment:'Array of observations, at most one entry per equipmentId in this period.'},equipmentFields:{equipmentId:'Required existing equipment ID. Matching uses this ID, not the display name.',name:'Equipment display name.',stopClass:['UNKNOWN','FAILURES','MINOR','ALL'],exposureSeconds:'Positive observed exposure period in seconds, or null.',failureCount:'Integer count of the selected stop class, or null.',failureSeconds:'Total seconds of the selected stop class, or null.',mtbfMinutes:'Observed MTBF in minutes, or null; compare with the configured input.',mttrMinutes:'Observed MTTR in minutes, or null; compare with the configured input.',notes:'Equipment-specific observations (up to 4000 characters).'},equipmentCatalog:units.map(e=>({equipmentId:e.id,name:e.name||e.id,type:e.type||'Not specified'})),syntheticEquipmentExample:{equipmentId:units[0].id,name:units[0].name||units[0].id,stopClass:'FAILURES',exposureSeconds:86400,failureCount:4,failureSeconds:1200,mtbfMinutes:120,mttrMinutes:5,notes:'Synthetic values for structure only; not measured plant data.'}},records:[sample]};
  }
  function importRecords(payload){

      const t=payload.tiempos_dia,p=payload.produccion_formato,confirmed=p.datos_marcados_confirmados_en_tabla||{},derived=p.derivados||{};

      const record={name:payload.titulo||'Imported production day',date:payload.fecha_produccion||'',source:'Archived transcription: '+(payload.procedencia||''),status:'DERIVED',production:derived.botellas_por_dia?.valor??null,productionUnit:'BOTTLES',bottlesPerCase:confirmed.botellas_por_caja??null,notes:[...(payload.politica_datos||[]),...(payload.pendientes||[])].join('\n'),equipment:[]};
      const map={'Total Time':'durationSeconds',Downtime:'downtimeSeconds','Run Time':'runTimeSeconds','AU / Effective Runtime':'effectiveRuntimeSeconds',UPDT:'updtSeconds','Rate Loss Minutes':'rateLossSeconds'};
      Object.entries(map).forEach(([a,b])=>record[b]=t[a]==null?null:t[a]*60);
      record.reportedEfficiencyPercent=payload.valores_graficas?.find(v=>v.concepto==='AU%')?.valor??null;
      record.sourceSnapshot=JSON.stringify(payload);
      record.notes+='\nAvg Line Speed, MTBF and MTTR units require confirmation; no ideal speed or unidentified equipment was inferred.';
      return [normalize(record)];
    }
    let values;if(payload?.schema===VERSION)values=payload.records;else if(payload?.schema==='st-real-comparison-v1')values=[payload.observation];else if(Array.isArray(payload))values=payload;else if(payload?.durationSeconds!==undefined)values=[payload];else throw Error('Unsupported JSON. Use the real-data template or the archived Caso C record.');
    if(!Array.isArray(values)||!values.length||values.length>MAX_RECORDS)throw Error('Import between 1 and '+MAX_RECORDS+' records.');
    return values.map(normalize);
  }
  function sourceResult(simulation,live){return simulation?.results||live||null;}
  function mean(values){const valid=values.filter(Number.isFinite);return valid.length===values.length&&valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:null;}
  function snapshot(result,view){
    if(!result?.summary||result.provisional||!(result.durationSeconds>0))return null;
    if(result.replicationStatus?.state&&result.replicationStatus.state!=='COMPLETE')return null;
    const rows=result.batch?.rows||[],average=view==='average'&&rows.length,statsOnly=view==='average'&&!rows.length&&result.batch?.statistics;
    let row=view==='representative'?rows.find(r=>r.round===result.batch.representativeRound):rows.find(r=>String(r.round)===view);
    if(!row)row=result;
    const key=k=>average?mean(rows.map(r=>r.summary?.[k])):statsOnly?result.batch.statistics[k]?.mean??null:row.summary?.[k]??null;
    const output=key('outputCount'),duration=result.durationSeconds;
    const metrics=statsOnly?Object.fromEntries(Object.entries(result.batch.equipmentStatistics||{}).map(([id,m])=>[id,Object.fromEntries(['failureCount','failureSeconds'].map(k=>[k,m[k]?.mean??null]))])):average?Object.fromEntries([...new Set(rows.flatMap(r=>Object.keys(r.equipmentMetrics||{})))].map(id=>[id,Object.fromEntries(['failureCount','failureSeconds'].map(k=>[k,mean(rows.map(r=>r.equipmentMetrics?.[id]?.[k]))]))])):row.equipmentMetrics||{};
    const products=average?rows.every(r=>r.products)?rows.flatMap(r=>r.products.rows||[]):null:row.products?.rows||null;
    const factors=products?[...new Set(products.map(p=>p.bottlesPerCase).filter(v=>Number.isFinite(v)&&v>0))]:[];
    const statistics=rows.length?{n:rows.length,mean:mean(rows.map(r=>r.summary?.outputCount))}:statsOnly?{...result.batch.statistics.outputCount}:null;
    if(rows.length&&statistics&&statistics.n>1&&statistics.mean!==null){statistics.standardDeviation=Math.sqrt(rows.reduce((v,r)=>v+(r.summary.outputCount-statistics.mean)**2,0)/(rows.length-1));statistics.min=Math.min(...rows.map(r=>r.summary.outputCount));statistics.max=Math.max(...rows.map(r=>r.summary.outputCount));}
    return {output,duration,unit:String(result.unitOfFlow||result.replay?.unitOfFlow||'units').toUpperCase(),oee:key('lineOeePercent'),idealOutput:key('idealBottleOutput'),equipment:metrics,packFactor:factors.length===1?factors[0]:null,view:average?'Average of '+rows.length+' rounds':statsOnly?'Average of '+statistics.n+' saved rounds':row.round?'Round '+row.round:'Saved run',seed:row?.seed??result.batch?.baseSeed??result.seed,statistics,engine:result.engineId||result.replay?.engineId,engineVersion:result.replay?.engineVersion||null,completedAt:result.completedAt||null,inputSignature:result.inputSignature||result.replay?.inputSignature||null,qualityAssumption:result.summary.qualityAssumption||null,detailCoverage:result.detailCoverage||null};
  }
  function compare(record,simulation,result,view,caseRecord){
    const real=normalize(record),sim=snapshot(result,view||'average'),warnings=[],rows=[],equipmentRows=[];
    if(real.status==='PENDING')warnings.push('Real data are pending confirmation.');
    if(!real.date)warnings.push('The production date is not specified.');if(!real.source.trim())warnings.push('The real-data source is not specified.');
    const realDuration=real.durationSeconds;
    if(realDuration){if(real.downtimeSeconds!=null&&real.runTimeSeconds!=null&&Math.abs(real.downtimeSeconds+real.runTimeSeconds-realDuration)>1)warnings.push('Real downtime + run time does not equal the observation duration.');if(real.effectiveRuntimeSeconds!=null&&real.updtSeconds!=null&&Math.abs(real.effectiveRuntimeSeconds+real.updtSeconds-realDuration)>1)warnings.push('Real effective runtime + UPDT does not equal the observation duration.');}
    if(real.runTimeSeconds!=null&&real.effectiveRuntimeSeconds!=null&&real.rateLossSeconds!=null&&Math.abs(real.runTimeSeconds-real.effectiveRuntimeSeconds-real.rateLossSeconds)>1)warnings.push('Real run time - effective runtime differs from rate loss.');
    if(timeKeys.filter(k=>k!=='durationSeconds').some(k=>real[k]!=null&&realDuration&&real[k]>realDuration))warnings.push('A real line-time value exceeds the observation duration.');
    if(real.reportedEfficiencyPercent!=null)warnings.push('Reported AU / efficiency is retained as a source value; its definition is not assumed to match simulated OEE.');
    let stale=false;
    if(sim?.inputSignature&&window.SimulatorEngine?.inputSignature&&simulation?.equipment&&caseRecord){
      try{stale=SimulatorEngine.inputSignature({case:{unitOfFlow:caseRecord.unitOfFlow,equipment:simulation.equipment},run:simulation.dynamicConfig||{}})!==sim.inputSignature;}catch(ignore){warnings.push('Current-input matching could not be checked.');}
    }
    if(sim&&!sim.inputSignature)warnings.push('No saved input signature: the run configuration cannot be verified.');
    if(stale)warnings.push('Saved results do not match the current simulation inputs. Run again before comparing.');
    if(!sim)warnings.push('Complete and save a simulation to compare. Partial batches are not compared.');
    const sameFormat=!(sim?.packFactor&&real.bottlesPerCase&&sim.packFactor!==real.bottlesPerCase);
    const samePeriod=!!(sim&&realDuration&&Math.abs(sim.duration-realDuration)<=.001);
    if(sim&&!samePeriod)warnings.push('Observation and simulation durations differ. Production totals are not compared; rates use their own full periods.');
    let realOutput=null,simOutput=null,unit=null;
    if(sim){
      if(sim.unit==='BOTTLES'||sim.unit==='BOTTLE'){unit='bottles';simOutput=sim.output;realOutput=real.productionUnit==='BOTTLES'?real.production:real.productionUnit==='CASES'&&real.bottlesPerCase?real.production*real.bottlesPerCase:null;}
      else if(sim.unit==='CASES'||sim.unit==='CASE'){unit='cases';simOutput=sim.output;realOutput=real.productionUnit==='CASES'?real.production:real.productionUnit==='BOTTLES'&&real.bottlesPerCase?real.production/real.bottlesPerCase:null;}
      else if(real.productionUnit==='UNITS'){unit=sim.unit.toLowerCase();realOutput=real.production;simOutput=sim.output;}
      if(real.production===null)realOutput=null;
      if(!unit||realOutput===null)warnings.push('Production units cannot be matched. Enter the measured production and, when converting cases, bottles per case.');
      if(real.bottlesPerCase&&sim.packFactor&&real.bottlesPerCase!==sim.packFactor)warnings.push('Real and simulated bottles per case differ. Confirm that the same packing format is being compared.');
      if(sim.qualityAssumption)warnings.push('The simulation assumes 100% quality without a reject model. Align gross versus good output before interpreting the gap.');
      if(sim.engine==='DES_SIMPY_EXPERIMENTAL')warnings.push('The selected simulation uses the experimental engine; OEE is not validated.');
    }
    function add(label,actual,predicted,units,allowed,note){const valid=Number.isFinite(actual)&&Number.isFinite(predicted)&&allowed&&!stale;rows.push({metric:label,unit:units,real:actual??null,simulated:predicted??null,delta:valid?predicted-actual:null,relativePercent:valid&&actual!==0?(predicted-actual)/Math.abs(actual)*100:null,comparable:!!valid,note:stale?'Stale simulation inputs':note||(!Number.isFinite(actual)?'Real value missing':!Number.isFinite(predicted)?'No matching simulated metric':!allowed?'Different periods':'')});}
    add('Observation duration',realDuration?realDuration/60:null,sim?.duration?sim.duration/60:null,'min',true);
    add('Production',realOutput,simOutput,unit||'unmatched',samePeriod&&sameFormat,'Totals require the same period and output boundary.');
    const rateActual=realDuration&&realOutput!==null?realOutput/realDuration*60:null,rateSim=sim?.duration&&simOutput!==null?simOutput/sim.duration*60:null;
    add('Average throughput',rateActual,rateSim,(unit||'unmatched')+'/min',true,'Full-period average; different periods may describe different operating conditions.');
    const actualBottles=real.productionUnit==='BOTTLES'?real.production:real.productionUnit==='CASES'&&real.bottlesPerCase&&real.production!==null?real.production*real.bottlesPerCase:null;
    const simBottles=sim&&(sim.unit==='BOTTLES'||sim.unit==='BOTTLE')?sim.output:sim&&(sim.unit==='CASES'||sim.unit==='CASE')&&sim.packFactor?sim.output*sim.packFactor:null;
    const reference=real.referenceSpeedBpm;
    add('Efficiency at common reference',reference&&realDuration&&actualBottles!==null?actualBottles/(reference*realDuration/60)*100:null,reference&&sim?.duration&&simBottles!==null?simBottles/(reference*sim.duration/60)*100:null,'%',samePeriod&&sameFormat,'Calculated using the real reference speed in bottles/min; absolute difference is percentage points.');
    add('Quality',real.qualityPercent,sim?.qualityAssumption?100:null,'%',false,'Simulation quality is an assumption, not a prediction.');
    add('Reported AU / efficiency',real.reportedEfficiencyPercent,null,'%',false,'Definition / denominator must be confirmed; no automatic OEE equivalence.');
    add('Saved simulated OEE',null,sim?.oee??null,'%',false,'Uses the saved ideal output; not automatically equivalent to AU.');
    ['downtimeSeconds','runTimeSeconds','effectiveRuntimeSeconds','updtSeconds','rateLossSeconds'].forEach(k=>add(labels[k],real[k]===null?null:real[k]/60,null,'min',false,'No validated exclusive line-level counterpart. Equipment times are not line downtime.'));
    real.equipment.forEach(e=>{
      const target=(simulation?.equipment||[]).find(t=>t.id===e.equipmentId),m=sim?.equipment[e.equipmentId],exposure=e.exposureSeconds!=null&&sim&&Math.abs(e.exposureSeconds-sim.duration)<.001;
      const reliability=target?.noiseProfile?.reliability||{};
      [['Failure count',e.failureCount,m?.failureCount,'stops'],['Failure duration',e.failureSeconds===null?null:e.failureSeconds/60,m?.failureSeconds==null?null:m.failureSeconds/60,'min'],['MTBF input',e.mtbfMinutes,reliability.mtbfMinutes,'min'],['MTTR input',e.mttrMinutes,reliability.mttrMinutes,'min']].forEach(([metric,a,b,u],index)=>{if(a==null)return;const matching=index<2?exposure&&e.stopClass==='FAILURES':false;equipmentRows.push({equipmentId:e.equipmentId,name:target?.name||e.name||e.equipmentId,metric,unit:u,real:a,simulated:b??null,delta:matching&&!stale&&Number.isFinite(b)?b-a:null,comparable:!!matching&&!stale&&Number.isFinite(b),note:!target?'Equipment no longer present':index>=2?'Configured input; not an achieved reliability estimate':!exposure?'Observation exposure must match the simulation':e.stopClass!=='FAILURES'?'Stop class is not confirmed as failures':stale?'Stale simulation inputs':'Matched failure definition and exposure'});});
    });
    return {schema:'st-real-comparison-v1',exportedAt:new Date().toISOString(),case:{id:caseRecord?.id,name:caseRecord?.name},simulation:{id:simulation?.id,name:simulation?.name},observation:real,run:sim,warnings,rows,equipmentRows,conclusion:'Descriptive comparison only. A close result for one day does not validate predictive accuracy.'};
  }
  function records(){const value=state?.activeCase?.metadata?.realData?.records;return Array.isArray(value)?value:[];}
  function current(){return records().find(r=>r.id===selected.get(state.activeCase?.id))||records()[0]||null;}
  function persist(record){
    const c=state.activeCase;c.metadata=c.metadata||{};const list=records().slice(),index=list.findIndex(r=>r.id===record.id);if(index<0)list.push(record);else list[index]=record;
    const next={schema:VERSION,records:list};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB. Export or remove older observations first.');c.metadata.realData=next;selected.set(c.id,record.id);actions.changed();
  }
  function el(tag,text,klass){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(klass)e.className=klass;return e;}
  function status(text,error){const e=document.getElementById('real-data-status');e.textContent=text;e.classList.toggle('real-data-error',!!error);}
  function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function escape(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function format(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function reportHtml(data){
    const tables=(rows,equipment)=>'<table><thead><tr>'+[equipment?'Equipment / metric':'Metric','Unit','Real','Simulated','Difference','Difference %','Basis'].map((t,i)=>'<th scope="col"'+(i>=2&&i<=5?' class="numeric"':'')+'>'+t+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+[equipment?r.name+' / '+r.metric:r.metric,r.unit,format(r.real),format(r.simulated),format(r.delta),format(r.relativePercent),r.note].map((t,i)=>'<td'+(i>=2&&i<=5?' class="numeric"':'')+'>'+escape(t)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    const evidence={...data.run};delete evidence.equipment;
    return '<!doctype html><html lang="en"><meta charset="utf-8"><title>Real vs. simulated</title><style>body{font:14px system-ui;max-width:1100px;margin:32px auto;padding:20px;color:#213547}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{border:1px solid #ccd5dd;padding:8px;text-align:left}th{background:#eef4f7}.numeric{text-align:right;font-variant-numeric:tabular-nums}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:0}tr{break-inside:avoid}}</style><h1>Real vs. simulated</h1><p>'+escape(data.case.name)+' / '+escape(data.simulation.name)+' / '+escape(data.observation.name)+'</p><p>Production date: '+escape(data.observation.date||'Not specified')+' | Source: '+escape(data.observation.source||'Not specified')+' | Status: '+escape(data.observation.status)+'</p><ul>'+data.warnings.map(w=>'<li>'+escape(w)+'</li>').join('')+'</ul>'+tables(data.rows,false)+tables(data.equipmentRows,true)+'<h2>Run evidence</h2><pre>'+escape(JSON.stringify(evidence,null,2))+'</pre><h2>Observation and notes</h2><pre>'+escape(JSON.stringify(data.observation,null,2))+'</pre><p>'+escape(data.conclusion)+'</p><p>Exported: '+escape(data.exportedAt)+'</p></html>';
  }
  function getComparison(){const record=current();return record?compare(record,context.simulation,sourceResult(context.simulation,context.live),selection,context.caseRecord):null;}
  function table(target,rows,equipment){
    target.replaceChildren();const t=el('table'),thead=el('thead'),head=el('tr');(equipment?['Equipment / metric','Unit','Real','Simulated','Difference','Basis']:['Metric','Unit','Real','Simulated','Difference','Difference %','Basis']).forEach((v,i)=>{const th=el('th',v,i>=2&&i<(equipment?5:6)?'numeric':'');th.scope='col';head.append(th);});thead.append(head);t.append(thead);const body=el('tbody');
    rows.forEach(row=>{const tr=el('tr');let values=[equipment?row.name+' / '+row.metric:row.metric,row.unit,format(row.real),format(row.simulated),format(row.delta)];if(!equipment)values.push(format(row.relativePercent));values.push(row.note);values.forEach((v,i)=>tr.append(el('td',v,i>=2&&i<(equipment?5:6)?'numeric':'')));body.append(tr);});t.append(body);target.append(t);
  }
  function results(){
    const data=getComparison(),target=document.getElementById('real-data-comparison'),warnings=document.getElementById('real-data-warnings'),evidence=document.getElementById('real-data-evidence');
    target.replaceChildren();warnings.replaceChildren();evidence.replaceChildren();['real-data-export-json','real-data-export-html'].forEach(id=>document.getElementById(id).disabled=!data);
    if(!data){target.append(el('p','Add or import an observation to start.','empty'));return;}
    data.warnings.forEach(w=>warnings.append(el('li',w)));table(target,data.rows,false);
    if(data.equipmentRows.length){target.append(el('h3','Equipment comparison'));const host=el('div',null,'table-scroll');target.append(host);table(host,data.equipmentRows,true);}
    const sim=data.run;if(sim){
      const stats=sim.statistics;evidence.append(el('p',sim.view+' · '+sim.engine+' · '+format(sim.duration/3600)+' h · seed '+sim.seed));
      if(stats?.n>1)evidence.append(el('p','Batch production: n = '+stats.n+' · mean '+format(stats.mean)+' · sample SD '+format(stats.standardDeviation)+' · min '+format(stats.min)+' · max '+format(stats.max)+' '+sim.unit.toLowerCase()));
      if(stats?.n>1&&stats.n<30)evidence.append(el('p','Few replications: the mean is imprecise. Variation between simulated days is not the uncertainty of real measurements.','chart-note'));
      evidence.append(el('p','Engine version: '+(sim.engineVersion||'Not recorded')+' · Completed: '+(sim.completedAt||'Not recorded')));
      const details=el('details');details.append(el('summary','Saved input signature and recording coverage'));details.append(el('pre',JSON.stringify({inputSignature:sim.inputSignature,detailCoverage:sim.detailCoverage},null,2)));evidence.append(details);
    }
    evidence.append(el('p',data.conclusion,'chart-note'));
  }
  function fillForm(record){
    const form=document.getElementById('real-data-fields');form.replaceChildren();const timeDivisor=timeUnit==='HOURS'?3600:timeUnit==='SECONDS'?1:60;
    function field(key,label,type,options){const wrapper=el('label',label),input=el(options?'select':type==='textarea'?'textarea':'input');input.id='real-data-'+key;input.dataset.realField=key;
      if(options)options.forEach(([value,text])=>{const o=el('option',text);o.value=value;input.append(o);});else if(type!=='textarea')input.type=type||'number';
      if(input.type==='number'){input.min=['durationSeconds','bottlesPerCase','referenceSpeedBpm'].includes(key)?'0.000001':'0';input.step=key==='bottlesPerCase'?'1':'any';if(['reportedEfficiencyPercent','qualityPercent'].includes(key))input.max='100';}
      if(['name','source','notes'].includes(key))input.maxLength=key==='sourceSnapshot'?64000:key==='notes'?8000:key==='source'?2000:160;
      input.value=record[key]==null?'':timeKeys.includes(key)?record[key]/timeDivisor:record[key];wrapper.append(input);form.append(wrapper);if(key==='source'||key==='notes')wrapper.className='real-data-wide';
      input.addEventListener('input',()=>{if(!input.checkValidity()){status('Correct the highlighted field before it can be stored.',true);return;}const draft={...current(),[key]:input.type==='number'?(input.value===''?null:Number(input.value)*(timeKeys.includes(key)?timeDivisor:1)):input.value};try{persist(normalize(draft));status('Observation updated. Follow the case Save / autosave status.');results();}catch(error){status(error.message,true);}});
    }
    field('name','Record name','text');field('date','Production date','date');field('status','Data status',null,[['PENDING','Pending confirmation'],['MEASURED','Measured'],['DERIVED','Derived from source'],['ESTIMATED','Estimated']]);field('source','Source / reference','text');
    field('production','Production at final output');field('productionUnit','Production unit',null,[['BOTTLES','Bottles'],['CASES','Cases'],['UNITS','Native units']]);field('bottlesPerCase','Bottles per case');field('referenceSpeedBpm','Confirmed ideal reference (bottles/min)');field('reportedEfficiencyPercent','Reported AU / efficiency (%)');
    timeKeys.forEach(key=>field(key,labels[key]+' ('+(timeUnit==='HOURS'?'h':timeUnit==='SECONDS'?'s':'min')+')'));
    field('qualityPercent','Observed quality (%)');field('notes','Notes / unresolved definitions','textarea');equipmentForm(record);
  }
  function equipmentForm(record){
    const target=document.getElementById('real-data-equipment');target.replaceChildren();const table=el('table'),head=el('tr');['Equipment','Stop class','Exposure (min)','Stops','Failure time (min)','MTBF (min)','MTTR (min)','Notes'].forEach((t,i)=>{const th=el('th',t,i>=2&&i<=6?'numeric':'');th.scope='col';head.append(th);});const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');
    const allEquipment=(context.simulation?.equipment||[]).slice();record.equipment.filter(o=>!allEquipment.some(e=>e.id===o.equipmentId)).forEach(o=>allEquipment.push({id:o.equipmentId,name:(o.name||o.equipmentId)+' (not in simulation)'}));
    allEquipment.forEach(e=>{const tr=el('tr');tr.append(el('th',e.name));const observed=record.equipment.find(o=>o.equipmentId===e.id)||{equipmentId:e.id,name:e.name};
      ['stopClass','exposureSeconds','failureCount','failureSeconds','mtbfMinutes','mttrMinutes','notes'].forEach(key=>{const td=el('td'),input=el(key==='stopClass'?'select':key==='notes'?'textarea':'input');input.setAttribute('aria-label',e.name+' '+key);input.dataset.equipmentId=e.id;input.dataset.realEquipmentField=key;
        if(key==='stopClass')[['UNKNOWN','Unknown'],['FAILURES','Failures / repairs'],['MINOR','Minor stops'],['ALL','All stops']].forEach(([value,text])=>{const o=el('option',text);o.value=value;input.append(o);});else if(key==='notes'){input.maxLength=4000;input.rows=2;}else {input.type='number';input.min=key==='exposureSeconds'?'0.000001':'0';input.step=key==='failureCount'?'1':'any';}
        input.value=observed[key]==null?(key==='stopClass'?'UNKNOWN':''):['exposureSeconds','failureSeconds'].includes(key)?observed[key]/60:observed[key];td.append(input);tr.append(td);
        input.oninput=()=>{if(!input.checkValidity()){status('Correct the equipment observation.',true);return;}const draft=JSON.parse(JSON.stringify(current())),item=draft.equipment.find(o=>o.equipmentId===e.id)||{equipmentId:e.id,name:e.name};if(!draft.equipment.includes(item))draft.equipment.push(item);item[key]=['stopClass','notes'].includes(key)?input.value:input.value===''?null:Number(input.value)*(['exposureSeconds','failureSeconds'].includes(key)?60:1);try{persist(normalize(draft));status('Equipment observation updated.');results();}catch(error){status(error.message,true);}};
      });tbody.append(tr);});table.append(tbody);target.append(table);
  }
  function render(caseRecord,simulation,live){
    if(!state||!caseRecord)return;if(context?.caseRecord.id!==caseRecord.id||context?.simulation?.id!==simulation?.id)selection='average';context={caseRecord,simulation,live};const record=current();if(record)selected.set(caseRecord.id,record.id);
    const selector=document.getElementById('real-data-record');selector.replaceChildren();records().forEach(r=>{const o=el('option',r.name+(r.date?' · '+r.date:''));o.value=r.id;selector.append(o);});selector.value=record?.id||'';
    document.getElementById('real-data-editor').hidden=!record;document.getElementById('real-data-delete').disabled=!record;
    const key=caseRecord.id+':'+(record?.id||'')+':'+(simulation?.id||'')+':'+timeUnit;
    if(formOwner!==key){formOwner=key;if(record)fillForm(record);}
    const result=sourceResult(simulation,live),view=document.getElementById('real-data-view');view.replaceChildren();const options=[['average','Average of all rounds']];if(result?.batch?.rows?.length){options.push(['representative','Representative round']);result.batch.rows.forEach(r=>options.push([String(r.round),'Round '+r.round+' · seed '+r.seed]));}if(!options.some(([v])=>v===selection))selection='average';options.forEach(([value,text])=>{const o=el('option',text);o.value=value;view.append(o);});view.value=selection;
    document.getElementById('real-data-simulation').textContent='Compared simulation: '+(simulation?.name||'None')+'. Observations are shared by the case; selecting another simulation reuses the same real record.';results();
  }
  function init(currentState,callbacks){
    state=currentState;actions=callbacks;
    document.getElementById('real-data-new').onclick=()=>{if(records().length>=MAX_RECORDS){status('Limit: '+MAX_RECORDS+' observations per case.',true);return;}const record=empty();try{persist(record);formOwner='';render(context.caseRecord,context.simulation,context.live);status('New observation created.');}catch(error){status(error.message,true);}};
    document.getElementById('real-data-record').onchange=e=>{selected.set(state.activeCase.id,e.target.value);formOwner='';render(context.caseRecord,context.simulation,context.live);status('');};
    document.getElementById('real-data-view').onchange=e=>{selection=e.target.value;results();};
    document.getElementById('real-data-time-unit').onchange=e=>{timeUnit=e.target.value;formOwner='';render(context.caseRecord,context.simulation,context.live);};
    document.getElementById('real-data-delete').onclick=async()=>{const c=state.activeCase,r=current();if(!r)return;const answer=await STDialog.open({title:'Delete observation',message:'Delete '+r.name+'? Simulation inputs and results are retained.',buttons:[{id:'cancel',label:'Cancel'},{id:'delete',label:'Delete',destructive:true}]});if(answer.action!=='delete'||state.activeCase!==c)return;c.metadata.realData={schema:VERSION,records:records().filter(v=>v.id!==r.id)};selected.delete(c.id);actions.changed();formOwner='';render(c,context.simulation,context.live);};
    const file=document.getElementById('real-data-file');document.getElementById('real-data-import').onclick=()=>file.click();
    file.onchange=async()=>{const f=file.files?.[0],owner=state.activeCase,ticket=++revision;file.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('Real-data JSON must be 2 MB or smaller.');const imported=importRecords(JSON.parse(await f.text()));if(state.activeCase!==owner||ticket!==revision)return;if(records().length+imported.length>MAX_RECORDS)throw Error('Too many observations.');const added=imported.map(r=>({...r,id:empty().id})),next={schema:VERSION,records:records().concat(added)};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Real-data records exceed 512 KB.');owner.metadata=owner.metadata||{};owner.metadata.realData=next;selected.set(owner.id,added[0].id);actions.changed();formOwner='';render(owner,context.simulation,context.live);status('Imported '+added.length+' observation(s). Review source definitions before comparing.');}catch(error){status('Import failed: '+error.message,true);}};
    document.getElementById('real-data-template').onclick=()=>download(JSON.stringify(template(context?.simulation?.equipment||[]),null,2),'real-data-template.json','application/json');
    document.getElementById('real-data-export-json').onclick=()=>{const data=getComparison();if(data)download(JSON.stringify(data,null,2),'real-vs-simulated.json','application/json');};
    document.getElementById('real-data-export-html').onclick=()=>{const data=getComparison();if(data)download(reportHtml(data),'real-vs-simulated.html','text/html;charset=utf-8');};
  }
  return {init,render,normalize,importRecords,compare,snapshot,reportHtml,template};
})();
</script>
