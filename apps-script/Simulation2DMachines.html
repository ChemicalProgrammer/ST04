<script>
window.STSimulation2DMachines=(function(){
  const blower={kind:'blower',width:.76,height:1.28,floor:88};
  const designs={
    BLOWER:blower,BLOWMOLDER:blower,
    FILLER:{kind:'filler',width:.98,height:1.09,floor:84,viewWidth:184},
    SLEEVER:{kind:'sleever',width:.57,height:1.04,floor:89},
    CASE_PACKER:{kind:'packer',width:1.14,height:1.03,floor:87,viewWidth:226},
    PALLETIZER:{kind:'palletizer',width:.94,height:1.42,floor:90}
  };
  function dimensions(type){
    return Object.hasOwn(designs,type)?designs[type]:null;
  }
  function drawCase(context,x,y,width,height,colors){
    context.save();
    context.fillStyle=colors.belt;
    context.fillRect(x,y,width,height);
    context.globalAlpha=.24;context.fillStyle='#fff';
    context.fillRect(x,y,width,height);
    context.globalAlpha=1;context.fillStyle=colors.accent;
    context.fillRect(x+width*.39,y,width*.22,height*.4);
    context.restore();
  }
  function draw(context,type,x,y,width,height,colors,seconds){
    const design=dimensions(type);
    if(!design)return false;
    const phase=(1-Math.cos(seconds*Math.PI*2))/2;
    const {ink,soft,surface,accent,belt}=colors;
    context.save();
    context.translate(x,y);
    const viewWidth=design.viewWidth??120;
    context.scale(width/viewWidth,height/100);
    context.lineWidth=.8;
    context.lineJoin='round';
    context.strokeStyle=belt;
    function box(x,y,w,h,fill,radius=2){
      context.fillStyle=fill;
      context.beginPath();context.roundRect(x,y,w,h,radius);context.fill();context.stroke();
    }
    function line(...points){
      context.beginPath();context.moveTo(points[0],points[1]);
      for(let i=2;i<points.length;i+=2)context.lineTo(points[i],points[i+1]);
      context.stroke();
    }
    function circle(x,y,radius,fill){
      context.fillStyle=fill;
      context.beginPath();context.arc(x,y,radius,0,2*Math.PI);context.fill();context.stroke();
    }
    function reel(x,y,radius){
      circle(x,y,radius,soft);circle(x,y,radius-3,surface);
      for(let spoke=0;spoke<3;spoke++){
        const angle=seconds*Math.PI+spoke*2*Math.PI/3;
        line(x,y,x+(radius-3)*Math.cos(angle),y+(radius-3)*Math.sin(angle));
      }
      circle(x,y,2,accent);
    }
    function foot(x,offset=0){box(x,design.floor-3+offset,15,3,belt,1);}
    function track(){
      const inset=viewWidth*.1;
      box(inset,50,viewWidth-2*inset,3,belt,1.5);
      for(let x=inset+7;x<viewWidth-inset;x+=12)circle(x,51.5,1,surface);
    }
    switch(design.kind){
      case 'blower':
        // Tall oven with a separate, open mold station.
        box(14,9,38,76,soft,5);
        box(22,22,22,40,surface,3);
        for(let i=0;i<4;i++)box(26+i*4,27,2,27,i<phase*4?accent:belt,1);
        box(20,14,20,2,belt,1);
        box(56,18,50,7,belt);
        box(98,25,8,60,soft);
        box(56,69,42,16,soft,3);
        box(72,25,10,12+7*phase,accent);
        box(58+5*phase,38,12,10,soft);
        box(84-5*phase,38,12,10,soft);
        foot(23);foot(86);
        track();
        break;
      case 'filler':
        // A raised, compact manifold and a separate cap-feed tower.
        box(25,62,132,19,soft,4);
        box(34,29,8,33,belt,2);
        box(126,29,8,33,belt,2);
        box(33,20,101,10,soft,4);
        box(39,22,89,2,surface,1);
        box(70,8,31,13,accent,5);
        for(let i=0;i<4;i++){
          const x=52+i*19;
          box(x,30,5,8+6*phase,accent,1);
          line(x+2.5,38+6*phase,x+2.5,44+3*phase);
        }
        box(146,24,10,38,soft,3);
        box(143,14,16,12,accent,3);
        line(147,26,149,34,153,34,155,26);
        line(86,69,86,79);
        foot(33);foot(134);
        track();
        break;
      case 'sleever':
        // Narrow single column and exposed film reels.
        box(50,10,19,77,soft,5);
        box(43,70,34,13,soft,3);
        reel(39,23,14);reel(80,35,10);
        line(53,23,74,26);line(72,42,66,47,59,47);
        box(47,41+4*phase,19,5,accent,2);
        foot(44);foot(61);
        track();
        break;
      case 'packer': {
        // Open loading bay, traversing gripper and offset closing station.
        box(27,20,127,7,belt,3);
        box(28,27,8,57,soft,2);box(146,27,8,57,soft,2);
        line(36,35,44,27);line(138,27,146,35);
        box(44,68,92,15,soft,4);
        box(56,73,20,2,surface,1);
        const carriageX=53+49*phase;
        const reach=4+5*phase;
        box(carriageX,20,22,9,accent,3);
        box(carriageX+9,29,4,reach,belt,1);
        box(carriageX+1,29+reach,20,4,soft,1);
        for(let i=0;i<3;i++)line(carriageX+4+i*6,33+reach,carriageX+4+i*6,39+reach);
        box(167,33,25,50,soft,4);
        box(173,39,13,7,accent,2);
        line(160,42,164,46,171,46);
        line(163,57,187,57);
        foot(24);foot(140);foot(171,-1);
        track();
        break;
      }
      case 'palletizer':
        box(13,8,94,7,belt,3);
        box(15,15,8,72,soft);box(97,15,8,72,soft);
        line(23,22,31,15);line(89,15,97,22);
        box(47+16*phase,18,18,7,accent,2);
        box(35,69,50,4,belt,1);
        box(39,73,7,4,ink,1);box(74,73,7,4,ink,1);
        foot(11);foot(94);
        track();
        // Boxes already admitted by the simulation travel inside the palletizer.
        for(let i=0;i<Math.min(3,colors.resident||0);i++){
          const caseWidth=(colors.caseWidth||27)*viewWidth/width;
          const caseHeight=(colors.caseHeight||20.25)*100/height;
          drawCase(context,25+i*(caseWidth+4)+phase*5,50-caseHeight,caseWidth,caseHeight,colors);
        }
        break;
    }
    context.restore();
    return true;
  }
  function drawPalletOutput(context,x,y,outlet,colors,produced,progress){
    const {ink,soft,surface,accent,belt}=colors;
    context.save();context.lineWidth=1;context.strokeStyle=belt;
    function box(left,top,width,height,color){
      context.fillStyle=color;context.beginPath();context.roundRect(left,top,width,height,1.5);context.fill();context.stroke();
    }
    const caseWidth=colors.caseWidth||27,caseHeight=colors.caseHeight||20.25;
    const palletWidth=caseWidth*3+12,palletPitch=palletWidth+20;
    const floor=y+90,completed=Math.floor(produced/12),active=produced%12;
    const transferring=produced>0&&progress<.6;
    const current=transferring?(produced-1)%12:active;
    const completedShown=Math.min(2,transferring?Math.floor((produced-1)/12):completed);
    for(let slot=0;slot<3;slot++){
      const px=x+100+slot*palletPitch,count=slot===0?current:slot<=completedShown?12:0;
      if(slot>0&&!count)continue;
      box(px,floor,palletWidth,5,belt);
      for(let leg=0;leg<3;leg++)box(px+5+leg*(palletWidth-18)/2,floor+5,8,7,belt);
      box(px,floor+12,palletWidth,4,belt);
      for(let i=0;i<count;i++){
        drawCase(context,px+6+i%3*caseWidth,floor-(Math.floor(i/3)+1)*caseHeight,caseWidth,caseHeight,colors);
      }
    }
    const placement=Math.max(0,produced-1)%12;
    const targetX=x+106+placement%3*caseWidth,targetY=floor-(Math.floor(placement/3)+1)*caseHeight;
    // Both legs share their end positions and stop smoothly while the gripper releases.
    const returning=progress>=.68;
    const phase=returning?(progress-.68)/.32:Math.min(1,progress/.6);
    const t=Math.max(0,Math.min(1,phase));
    const eased=t*t*t*(t*(t*6-15)+10);
    const fraction=returning?1-eased:eased;
    const movingX=outlet+(targetX-outlet)*fraction;
    const movingY=y-caseHeight+(targetY-y+caseHeight)*fraction-70*Math.sin(eased*Math.PI);
    const gripX=produced>0?movingX+caseWidth/2:outlet+caseWidth/2;
    const gripY=produced>0?movingY-5:y-caseHeight-5;
    const baseX=x+24,baseY=floor-4,shoulderY=baseY-48;
    const reach=Math.max(
      Math.hypot(outlet+caseWidth/2-baseX,y-caseHeight-17-shoulderY),
      Math.hypot(x+106+2.5*caseWidth-baseX,floor-4*caseHeight-17-shoulderY)
    );
    const upper=Math.max(125,reach*.58),forearm=Math.max(135,reach*.62);
    const dx=gripX-baseX,dy=gripY-12-shoulderY;
    const distance=Math.max(1,Math.hypot(dx,dy));
    const angle=Math.atan2(dy,dx)-Math.acos(Math.max(-1,Math.min(1,(upper*upper+distance*distance-forearm*forearm)/(2*upper*distance))));
    const elbowX=baseX+upper*Math.cos(angle),elbowY=shoulderY+upper*Math.sin(angle);
    box(baseX-31,baseY,62,18,belt);
    box(baseX-24,baseY-9,48,9,soft);
    box(baseX-17,shoulderY,34,42,accent);
    box(baseX+18,baseY-32,13,25,soft);
    for(const side of [-1,1]){
      context.fillStyle=surface;context.beginPath();context.arc(baseX+side*24,baseY+9,2,0,2*Math.PI);context.fill();
    }
    function link(ax,ay,bx,by,width){
      context.lineCap='round';context.strokeStyle=belt;context.lineWidth=width+3;
      context.beginPath();context.moveTo(ax,ay);context.lineTo(bx,by);context.stroke();
      context.strokeStyle=accent;context.lineWidth=width;context.stroke();
      context.strokeStyle=soft;context.lineWidth=3;
      context.beginPath();context.moveTo(ax-3,ay);context.lineTo(bx-3,by);context.stroke();
    }
    link(baseX,shoulderY,elbowX,elbowY,25);
    link(elbowX,elbowY,gripX,gripY-12,19);
    context.strokeStyle=belt;context.lineWidth=2;
    context.beginPath();context.moveTo(baseX+8,shoulderY);
    context.quadraticCurveTo(elbowX+22,elbowY-22,gripX+7,gripY-12);context.stroke();
    for(const [cx,cy,radius] of [[baseX,shoulderY,17],[elbowX,elbowY,15],[gripX,gripY-12,10]]){
      context.lineWidth=1;context.fillStyle=belt;context.beginPath();context.arc(cx,cy,radius,0,2*Math.PI);context.fill();
      context.fillStyle=soft;context.beginPath();context.arc(cx,cy,radius*.67,0,2*Math.PI);context.fill();context.stroke();
      context.fillStyle=accent;context.beginPath();context.arc(cx,cy,3,0,2*Math.PI);context.fill();
    }
    context.lineWidth=1;context.strokeStyle=belt;
    box(gripX-7,gripY-6,14,7,soft);
    box(gripX-caseWidth/2-5,gripY,caseWidth+10,4,belt);
    for(const side of [-1,1]){
      box(gripX+side*(caseWidth/2+3)-2,gripY+4,4,8,soft);
    }
    if(transferring)drawCase(context,movingX,movingY,caseWidth,caseHeight,colors);
    context.font='6.75px system-ui';context.fillStyle=ink;context.textAlign='center';
    context.fillText('Pallet staging · schematic',x+100+(3*palletPitch-20)/2,floor+32);
    context.restore();
  }
  return {draw,dimensions,drawCase,drawPalletOutput};
})();
</script>
