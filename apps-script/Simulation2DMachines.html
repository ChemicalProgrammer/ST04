<script>
window.STSimulation2DMachines=(function(){
  const designs={
    BLOWER:'blower',BLOWMOLDER:'blower',FILLER:'filler',SLEEVER:'sleever',
    CASE_PACKER:'packer',PALLETIZER:'palletizer'
  };
  function draw(context,type,x,y,width,height,colors,seconds){
    const design=Object.hasOwn(designs,type)?designs[type]:null;
    if(!design)return false;
    const phase=(1-Math.cos(seconds*Math.PI*2))/2;
    const {ink,soft,surface,accent}=colors;
    context.save();
    context.translate(x,y);
    context.scale(width/120,height/100);
    context.lineWidth=.8;
    context.strokeStyle=ink;
    function box(x,y,w,h,fill){
      context.fillStyle=fill;
      context.beginPath();context.roundRect(x,y,w,h,1.4);context.fill();context.stroke();
    }
    function line(...points){
      context.beginPath();
      context.moveTo(points[0],points[1]);
      for(let i=2;i<points.length;i+=2)context.lineTo(points[i],points[i+1]);
      context.stroke();
    }
    function reel(x,y,radius){
      context.fillStyle=soft;
      context.beginPath();context.arc(x,y,radius,0,2*Math.PI);context.fill();context.stroke();
      for(let spoke=0;spoke<3;spoke++){
        const angle=seconds*Math.PI+spoke*2*Math.PI/3;
        line(x,y,x+radius*.73*Math.cos(angle),y+radius*.73*Math.sin(angle));
      }
    }
    function housing(left,right,top=7){
      box(left,top,right-left,86-top,soft);
      box(left+4,top+6,right-left-8,64-top,surface);
      box(left+4,73,right-left-8,9,surface);
      box(left+5,86,7,6,ink);box(right-12,86,7,6,ink);
    }
    function rail(left,right){box(left,49,right-left,3,soft);}
    switch(design){
      case 'blower':
        housing(12,108);
        box(19,17,29,44,ink);
        for(let i=0;i<4;i++)box(22+i*6,22,3,34,i<phase*4?'#ecaa58':'#ae7244');
        box(60,19,35,39,soft);
        box(64,31,10+5*phase,17,accent);
        box(81-5*phase,31,10+5*phase,17,accent);
        rail(52,110);
        break;
      case 'filler':
        housing(6,114,12);
        box(91,3,18,10,accent);
        line(100,13,100,30,91,30);
        box(24,24,64,5,soft);
        for(let i=0;i<3;i++){
          box(33+i*20,29,6,10+7*phase,accent);
          line(36+i*20,39+7*phase,36+i*20,43+5*phase);
        }
        rail(10,110);
        break;
      case 'sleever':
        housing(18,102);
        reel(40,29,11);reel(77,29,11);
        line(51,29,63,37,63,45);line(66,29,63,37);
        box(54,40+4*phase,18,6,accent);
        rail(21,100);
        break;
      case 'packer':
        housing(5,115,15);
        box(12,22,94,5,soft);
        box(30+26*phase,27,15,13,accent);
        line(30+26*phase,40,30+26*phase,45,45+26*phase,45,45+26*phase,40);
        box(84,36,20,13,'#c99557');
        line(84,36,80,31,100,31,104,36);
        rail(9,111);
        break;
      case 'palletizer':
        box(9,7,102,9,soft);
        box(9,16,7,70,soft);box(104,16,7,70,soft);
        box(13,86,93,6,ink);
        box(55,16,10,14+10*phase,accent);
        box(43,30+10*phase,34,5,soft);
        box(39,46,20,12,'#c99557');box(60,46,20,12,'#c99557');
        box(36,58,48,4,soft);
        rail(17,35);rail(85,104);
        break;
    }
    context.restore();
    return true;
  }
  return {draw};
})();
</script>
