<script>
window.STSimulation2DMachines=(function(){
  const blower={kind:'blower',width:.76,height:1.28,floor:88};
  const designs={
    BLOWER:blower,BLOWMOLDER:blower,
    PUCKER:{kind:'pucker',width:.82,height:1.12,floor:86},
    DEPUCKER:{kind:'depucker',width:.84,height:1.14,floor:86},
    FEEDER:{kind:'feeder',width:.9,height:1.18,floor:88},
    CUSTOM:{kind:'custom',width:1,height:1,floor:86},
    CAPPER:{kind:'capper',width:.7,height:1.15,floor:87},
    FILLER:{kind:'filler',width:.98,height:1.09,floor:84,viewWidth:184},
    SLEEVER:{kind:'sleever',width:.57,height:1.04,floor:89},
    CASE_PACKER:{kind:'packer',width:1.14,height:1.03,floor:87,viewWidth:226},
    PALLETIZER:{kind:'palletizer',width:.94,height:1.42,floor:90}
  };
  function dimensions(type){
    return Object.hasOwn(designs,type)?designs[type]:null;
  }
  function bottleNeck(type){
    return type==='softener'?{x:30,width:29,y:0}:type==='jug'?{x:20,width:39,y:0}:type==='shampoo'?{x:27,width:46,y:0}:type==='pump'?{x:44,width:12,y:27}:{x:38,width:24,y:0};
  }
  function drawBottle(context,x,y,width,height,colors,type='classic',stage=0){
    if(!(width>0&&height>0))return;
    const bounds=type==='softener'||type==='jug'?[3,98]:type==='pump'?[6,94]:[4,96];
    context.save();context.translate(x-bounds[0]*width/(bounds[1]-bounds[0]),y);context.scale(width/(bounds[1]-bounds[0]),height/200);
    function path(){
      context.beginPath();
      if(type==='softener'||type==='jug'){
        context.moveTo(type==='jug'?20:30,0);context.lineTo(59,0);context.lineTo(61,35);
        context.quadraticCurveTo(97,42,98,84);context.lineTo(95,184);
        context.quadraticCurveTo(92,200,78,200);context.lineTo(20,200);
        context.quadraticCurveTo(3,198,3,179);context.lineTo(9,88);
        context.quadraticCurveTo(12,54,29,37);context.closePath();
        context.moveTo(69,55);context.quadraticCurveTo(88,56,88,82);
        context.lineTo(86,108);context.quadraticCurveTo(67,106,67,86);context.closePath();
      }else if(type==='shampoo'){
        context.moveTo(27,0);context.lineTo(73,0);context.lineTo(73,29);
        context.quadraticCurveTo(97,39,96,69);context.lineTo(91,185);
        context.quadraticCurveTo(90,200,74,200);context.lineTo(26,200);
        context.quadraticCurveTo(10,200,9,185);context.lineTo(4,69);
        context.quadraticCurveTo(3,39,27,29);context.closePath();
      }else if(type==='pump'){
        context.moveTo(44,27);context.lineTo(56,27);context.lineTo(56,56);
        context.quadraticCurveTo(93,59,94,85);context.lineTo(94,183);
        context.quadraticCurveTo(94,200,77,200);context.lineTo(23,200);
        context.quadraticCurveTo(6,200,6,183);context.lineTo(6,85);
        context.quadraticCurveTo(7,59,44,56);context.closePath();
      }else{
        const narrow=type==='cleaner';
        context.moveTo(38,0);context.lineTo(62,0);context.lineTo(64,narrow?55:38);
        context.quadraticCurveTo(96,narrow?69:50,96,narrow?95:73);
        context.lineTo(91,186);context.quadraticCurveTo(90,200,76,200);
        context.lineTo(24,200);context.quadraticCurveTo(10,200,9,186);
        context.lineTo(4,narrow?95:73);context.quadraticCurveTo(4,narrow?69:50,36,narrow?55:38);context.closePath();
      }
    }
    path();context.fillStyle=colors.surface;context.fill('evenodd');
    if(stage&2){context.save();path();context.clip('evenodd');context.fillStyle=colors.liquid||colors.accent;context.fillRect(0,65,100,135);context.restore();}
    path();context.strokeStyle=colors.belt;context.lineWidth=2;context.stroke();
    if(stage&1){context.fillStyle='#fff';context.fillRect(16,128,68,28);context.strokeRect(16,128,68,28);}
    if(type==='cleaner'){context.strokeStyle=colors.belt;for(let rib=0;rib<3;rib++){context.beginPath();context.moveTo(17,158+rib*9);context.lineTo(83,158+rib*9);context.stroke();}}
    if(stage&4){
      const neck=bottleNeck(type);context.fillStyle=colors.cap||colors.belt;
      if(type==='pump'){
        context.fillRect(neck.x-3,neck.y-4,neck.width+6,8);
        context.fillRect(46,13,8,14);context.fillRect(38,6,42,8);context.fillRect(75,10,5,12);
      }else{
        context.fillRect(neck.x-2,neck.y,neck.width+4,12);
        context.strokeStyle=colors.belt;context.lineWidth=1;context.strokeRect(neck.x-2,neck.y,neck.width+4,12);
      }
    }
    if(stage&8){context.fillStyle=colors.belt;context.fillRect(-5,173,110,27);}
    context.restore();
  }
  function drawCase(context,x,y,width,height,colors){
    context.save();
    context.fillStyle=colors.caseColor||colors.belt;
    context.fillRect(x,y,width,height);
    context.globalAlpha=.24;context.fillStyle='#fff';
    context.fillRect(x,y,width,height);
    context.globalAlpha=1;context.fillStyle=colors.caseAccent||colors.accent;
    context.fillRect(x+width*.39,y,width*.22,height*.4);
    const edge=Math.min(.85,width*.035,height*.035);context.lineWidth=edge;
    context.strokeStyle=colors.caseLine||colors.surface||'#eef2f6';
    context.strokeRect(x+edge/2,y+edge/2,width-edge,height-edge);
    context.restore();
  }
  function draw(context,type,x,y,width,height,colors,seconds){
    const design=dimensions(type);
    if(!design)return false;
    const phase=(1-Math.cos(seconds*Math.PI*2))/2;
    const {ink,soft,surface,accent,belt}=colors;
    context.save();
    context.translate(x,y);
    const viewWidth=design.viewWidth??120;
    context.scale(width/viewWidth,height/100);
    context.lineWidth=.8;
    context.lineJoin='round';
    context.strokeStyle=belt;
    function box(x,y,w,h,fill,radius=2){
      context.fillStyle=fill;
      context.beginPath();context.roundRect(x,y,w,h,radius);context.fill();context.stroke();
    }
    function line(...points){
      context.beginPath();context.moveTo(points[0],points[1]);
      for(let i=2;i<points.length;i+=2)context.lineTo(points[i],points[i+1]);
      context.stroke();
    }
    function circle(x,y,radius,fill){
      context.fillStyle=fill;
      context.beginPath();context.arc(x,y,radius,0,2*Math.PI);context.fill();context.stroke();
    }
    function reel(x,y,radius){
      circle(x,y,radius,soft);circle(x,y,radius-3,surface);
      for(let spoke=0;spoke<3;spoke++){
        const angle=seconds*Math.PI+spoke*2*Math.PI/3;
        line(x,y,x+(radius-3)*Math.cos(angle),y+(radius-3)*Math.sin(angle));
      }
      circle(x,y,2,accent);
    }
    function foot(x,offset=0){box(x,design.floor-3+offset,15,3,belt,1);}
    function track(){
      const inset=viewWidth*.1;
      box(inset,50,viewWidth-2*inset,3,belt,1.5);
      for(let x=inset+7;x<viewWidth-inset;x+=12)circle(x,51.5,1,surface);
    }
    switch(design.kind){
      case 'blower':
        // Tall oven with a separate, open mold station.
        box(14,9,38,76,soft,5);
        box(22,22,22,40,surface,3);
        for(let i=0;i<4;i++)box(26+i*4,27,2,27,i<phase*4?accent:belt,1);
        box(20,14,20,2,belt,1);
        box(56,18,50,7,belt);
        box(98,25,8,60,soft);
        box(56,69,42,16,soft,3);
        box(72,25,10,12+7*phase,accent);
        box(58+5*phase,38,12,10,soft);
        box(84-5*phase,38,12,10,soft);
        foot(23);foot(86);
        track();
        break;
      case 'pucker':
      case 'depucker': {
        const removing=design.kind==='depucker';
        box(18,18,84,8,belt,3);box(22,26,7,60,soft);box(91,26,7,60,soft);
        box(28,65,65,18,soft,4);box(38,69,43,6,accent,2);
        const angle=seconds*.8;
        circle(60,57,25,soft);circle(60,57,17,surface);
        for(let i=0;i<4;i++){
          const a=angle+i*Math.PI/2,px=60+20*Math.cos(a),py=57+8*Math.sin(a);
          box(px-5,py+8,10,5,belt,1);
          const lift=removing?10*phase:10*(1-phase);
          box(px-3,py-9-lift,6,17,accent,2);box(px-1.5,py-13-lift,3,5,soft,1);
        }
        box(52,26,16,6,accent);line(60,32,60,38+8*phase);
        line(8,64,30,64);line(89,64,113,64);foot(20);foot(88);
        break;
      }
      case 'capper':
        box(20,65,82,18,soft,4);box(24,17,8,48,belt);box(91,17,8,48,belt);
        box(21,14,80,9,soft,3);box(39,3,43,11,soft,4);
        for(let i=0;i<4;i++)box(45+i*9,8,6,3,accent,1);
        line(47,23,47,30,66,30,66,35);
        const headY=29+13*phase;
        box(57,headY,19,11,accent,3);box(61,headY+11,11,5,belt,1);
        for(let i=0;i<3;i++)line(60+i*6,headY+3,60+i*6,headY+8);
        box(62,55,9,10,surface,2);box(64,49,5,7,surface,1);
        if(phase>.65)box(63,48,7,3,accent,1);
        track();foot(22);foot(88);
        break;
      case 'feeder': {
        // Hopper, elevator and rotary orienting bowl; output is an upright bottle.
        box(9,15,35,33,soft,5);line(10,45,23,60,35,60,43,45);
        box(25,54,12,30,belt);box(43,49,60,30,soft,7);
        circle(73,53,25,soft);circle(73,53,19,surface);
        for(let i=0;i<5;i++){
          const a=seconds*.7+i*Math.PI*2/5;
          box(70+16*Math.cos(a),49+7*Math.sin(a),6,10,accent,2);
        }
        box(96,56,22,6,belt);box(104+5*phase,44,5,13,accent,2);
        foot(25);foot(88);
        break;
      }
      case 'custom':
        box(15,22,90,59,soft,5);box(22,29,57,31,surface,3);
        box(85,31,12,22,belt,2);circle(91,37,3,accent);
        box(28+35*phase,35,13,18,accent,3);line(26,63,81,63);
        foot(23);foot(83);track();
        break;
      case 'filler':
        // A raised, compact manifold and a separate cap-feed tower.
        box(25,62,132,19,soft,4);
        box(34,29,8,33,belt,2);
        box(126,29,8,33,belt,2);
        box(33,20,101,10,soft,4);
        box(39,22,89,2,surface,1);
        box(70,8,31,13,accent,5);
        for(let i=0;i<4;i++){
          const x=52+i*19;
          box(x,30,5,8+6*phase,accent,1);
          line(x+2.5,38+6*phase,x+2.5,44+3*phase);
        }
        box(146,24,10,38,soft,3);
        box(143,14,16,12,accent,3);
        line(147,26,149,34,153,34,155,26);
        line(86,69,86,79);
        foot(33);foot(134);
        track();
        break;
      case 'sleever':
        // Narrow single column and exposed film reels.
        box(50,10,19,77,soft,5);
        box(43,70,34,13,soft,3);
        reel(39,23,14);reel(80,35,10);
        line(53,23,74,26);line(72,42,66,47,59,47);
        box(47,41+4*phase,19,5,accent,2);
        foot(44);foot(61);
        track();
        break;
      case 'packer': {
        // Open loading bay, traversing gripper and offset closing station.
        box(27,20,127,7,belt,3);
        box(28,27,8,57,soft,2);box(146,27,8,57,soft,2);
        line(36,35,44,27);line(138,27,146,35);
        box(44,68,92,15,soft,4);
        box(56,73,20,2,surface,1);
        const carriageX=53+49*phase;
        const reach=4+5*phase;
        box(carriageX,20,22,9,accent,3);
        box(carriageX+9,29,4,reach,belt,1);
        box(carriageX+1,29+reach,20,4,soft,1);
        for(let i=0;i<3;i++)line(carriageX+4+i*6,33+reach,carriageX+4+i*6,39+reach);
        box(167,33,25,50,soft,4);
        box(173,39,13,7,accent,2);
        line(160,42,164,46,171,46);
        line(163,57,187,57);
        foot(24);foot(140);foot(171,-1);
        track();
        break;
      }
      case 'palletizer':
        box(13,8,94,7,belt,3);
        box(15,15,8,72,soft);box(97,15,8,72,soft);
        line(23,22,31,15);line(89,15,97,22);
        box(47+16*phase,18,18,7,accent,2);
        foot(11);foot(94);
        break;
    }
    context.restore();
    return true;
  }
  function smooth(value){
    const t=Math.max(0,Math.min(1,value));
    return t*t*t*(t*(t*6-15)+10);
  }
  function palletStage(produced,progress,forkClock,forkGroup){
    const index=produced>0?(produced-1)%36:-1;
    const completed=produced>0?Math.floor((produced-1)/36):0;
    const exchange=index===35;
    const shift=exchange?smooth((progress-.6)/.34):0;
    const forklift=Number.isFinite(forkClock)||completed>=2&&index>=33;
    const forkProgress=forklift?Math.max(0,Math.min(1,Number.isFinite(forkClock)?forkClock:(index+progress-33)/2.3)):0;
    return {
      index,exchange,shift,completed,
      count:index<0?0:index+(progress>=.6?1:0),
      forkProgress,forkVisible:forklift&&forkProgress<1,
      forkLoaded:forklift&&forkProgress>=.38,
      thirdRemoved:forklift&&forkProgress>=.38&&(forkGroup===undefined||forkGroup===completed)
    };
  }
  function drawPalletOutput(context,x,y,outlet,colors,produced,progress,layer='all'){
    const {ink,soft,surface,accent,belt}=colors;
    context.save();context.lineWidth=1;context.strokeStyle=belt;
    function box(left,top,width,height,color){
      context.fillStyle=color;context.beginPath();context.roundRect(left,top,width,height,1.5);context.fill();context.stroke();
    }
    const caseWidth=colors.caseWidth||27,caseHeight=colors.caseHeight||20.25;
    const depthX=0,depthY=0;
    const palletWidth=caseWidth*3+2*depthX+12,palletPitch=palletWidth+20;
    const floor=y+90,stage=palletStage(produced,progress,colors.forkProgress,colors.forkGroup);
    const transferring=produced>0&&progress<.6;
    const activeX=x+100,rackX=x-85,rackY=floor+17;
    function pallet(px,py,count){
      box(px,py,palletWidth,5,colors.palletColor||belt);
      for(let leg=0;leg<3;leg++)box(px+5+leg*(palletWidth-18)/2,py+5,8,7,belt);
      box(px,py+12,palletWidth,4,belt);
      for(let level=0;level<4;level++)for(let column=0;column<3;column++){
        const occupied=Math.max(0,Math.min(3,Math.ceil((Math.min(36,count)-level*9-column)/3)));
        if(!occupied)continue;
        const left=px+6+column*caseWidth,top=py-(level+1)*caseHeight;
        drawCase(context,left,top,caseWidth,caseHeight,colors);
        // Three small depth markers encode nine positions per level without overlapping cartons.
        context.fillStyle=colors.caseAccent||accent;
        for(let mark=0;mark<occupied;mark++)context.fillRect(left+caseWidth*(.18+mark*.23),top+caseHeight*.84,caseWidth*.12,Math.max(.7,caseHeight*.035));
      }
    }
    if(layer!=='foreground'){
      // Empty pallets wait behind the robot, ready for the next change.
      pallet(rackX,rackY+12,0);
      pallet(rackX,rackY+6,0);
      if(!stage.exchange||progress<.74)pallet(rackX,rackY,0);
    }
    if(layer!=='robot'){
      pallet(activeX+stage.shift*palletPitch,floor,stage.count);
      if(stage.completed>=1)pallet(activeX+(1+stage.shift)*palletPitch,floor,36);
      if(stage.completed>=2&&!stage.thirdRemoved)pallet(activeX+2*palletPitch,floor,36);
      if(stage.exchange&&progress>=.94)pallet(activeX,floor,0);
    }
    const placement=Math.max(0,produced-1)%36;
    const row=Math.floor(placement%9/3),level=Math.floor(placement/9);
    const targetX=x+106+placement%3*caseWidth+row*depthX,targetY=floor-(level+1)*caseHeight-row*depthY;
    const returning=progress>=.6;
    const phase=returning?smooth((progress-.6)/.4):smooth((progress-.04)/.56);
    const fraction=returning?1-phase:phase;
    const movingX=outlet+(targetX-outlet)*fraction;
    const movingY=y-caseHeight+(targetY-y+caseHeight)*fraction-70*Math.sin(phase*Math.PI);
    const approaching=progress<.04;
    const clearance=approaching?30*(1-smooth(progress/.04)):
      returning?30*smooth((progress-.6)/.4):0;
    let gripX=produced>0?movingX+caseWidth/2:outlet+caseWidth/2;
    let gripY=produced>0?movingY-5-clearance:y-caseHeight-35;
    const gripperWidth=caseWidth;
    let emptyPallet=null;
    if(stage.exchange&&progress>=.6){
      const depositX=targetX+caseWidth/2,depositY=targetY-5;
      const rackGripX=rackX+palletWidth/2,rackGripY=rackY-5;
      if(progress<.74){
        const t=smooth((progress-.6)/.14);
        gripX=depositX+(rackGripX-depositX)*t;
        gripY=depositY+(rackGripY-depositY)*t-55*Math.sin(t*Math.PI);

      }else if(progress<.94){
        const t=smooth((progress-.74)/.2);
        const left=rackX+(activeX-rackX)*t,top=rackY+(floor-rackY)*t-60*Math.sin(t*Math.PI);
        emptyPallet={left,top};
        gripX=left+palletWidth/2;gripY=top-5;
      }else{
        const t=smooth((progress-.94)/.06);
        const dockX=activeX+palletWidth/2,dockY=floor-5;
        gripX=dockX+(outlet+caseWidth/2-dockX)*t;
        gripY=dockY+(y-caseHeight-35-dockY)*t-65*Math.sin(t*Math.PI);

      }
    }
    const baseX=x+24,baseY=floor-4,shoulderY=baseY-48;
    const reach=Math.max(
      Math.hypot(outlet+caseWidth/2-baseX,y-caseHeight-17-shoulderY),
      Math.hypot(x+106+3.02*caseWidth-baseX,floor-4.4*caseHeight-17-shoulderY),
      Math.hypot(rackX+palletWidth/2-baseX,rackY-17-shoulderY)
    );
    // Equal, fixed links cover all pickup, stacking and pallet-rack paths, including the lift arc.
    const upper=Math.max(160,(reach+140)*.6),forearm=upper;
    const dx=gripX-baseX,dy=gripY-12-shoulderY;
    const distance=Math.max(1,Math.hypot(dx,dy));
    const angle=Math.atan2(dy,dx)-Math.acos(Math.max(-1,Math.min(1,(upper*upper+distance*distance-forearm*forearm)/(2*upper*distance))));
    const elbowX=baseX+upper*Math.cos(angle),elbowY=shoulderY+upper*Math.sin(angle);
    if(layer!=='foreground'){
      box(baseX-31,baseY,62,18,belt);
      box(baseX-24,baseY-9,48,9,soft);
      box(baseX-22,shoulderY+7,44,34,soft);
      box(baseX-18,shoulderY+12,36,22,accent);
      for(let rib=0;rib<4;rib++)box(baseX-12+rib*7,shoulderY+16,3,13,belt);
      box(baseX+24,baseY-32,13,25,soft);
      const yaw=Math.atan2(gripX-baseX,150);
      context.fillStyle=belt;context.beginPath();
      context.ellipse(baseX,shoulderY+5,27,10,0,0,2*Math.PI);context.fill();context.stroke();
      context.fillStyle=accent;context.beginPath();
      context.ellipse(baseX,shoulderY,24,9,0,0,2*Math.PI);context.fill();context.stroke();
      context.lineWidth=3;context.strokeStyle=soft;
      context.beginPath();context.moveTo(baseX,shoulderY);
      context.lineTo(baseX+22*Math.sin(yaw),shoulderY+8*Math.cos(yaw));context.stroke();
      for(const side of [-1,1]){
        context.fillStyle=surface;context.beginPath();context.arc(baseX+side*24,baseY+9,2,0,2*Math.PI);context.fill();
      }
      function link(ax,ay,bx,by,width){
        context.lineCap='round';context.strokeStyle=belt;context.lineWidth=width+3;
        context.beginPath();context.moveTo(ax,ay);context.lineTo(bx,by);context.stroke();
        context.strokeStyle=accent;context.lineWidth=width;context.stroke();
        context.strokeStyle=soft;context.lineWidth=3;
        context.beginPath();context.moveTo(ax-3,ay);context.lineTo(bx-3,by);context.stroke();
      }
      link(baseX,shoulderY,elbowX,elbowY,25);
      link(elbowX,elbowY,gripX,gripY-12,19);
      context.strokeStyle=belt;context.lineWidth=2;
      context.beginPath();context.moveTo(baseX+8,shoulderY);
      context.quadraticCurveTo(elbowX+22,elbowY-22,gripX+7,gripY-12);context.stroke();
      for(const [cx,cy,radius] of [[baseX,shoulderY,17],[elbowX,elbowY,15],[gripX,gripY-12,10]]){
        context.lineWidth=1;context.fillStyle=belt;context.beginPath();context.arc(cx,cy,radius,0,2*Math.PI);context.fill();
        context.fillStyle=soft;context.beginPath();context.arc(cx,cy,radius*.67,0,2*Math.PI);context.fill();context.stroke();
        context.fillStyle=accent;context.beginPath();context.arc(cx,cy,3,0,2*Math.PI);context.fill();
      }
      context.lineWidth=1;context.strokeStyle=belt;
      box(gripX-7,gripY-6,14,7,soft);
      box(gripX-gripperWidth/2-5,gripY,gripperWidth+10,4,belt);
      for(const side of [-1,1]){
        box(gripX+side*(gripperWidth/2+3)-2,gripY+4,4,8,soft);
      }
    }
    if(layer!=='robot'){
      if(emptyPallet)pallet(emptyPallet.left,emptyPallet.top,0);
      if(stage.forkVisible){
        const pickup=activeX+2*palletPitch;
        const exit=Math.max(colors.exitX||0,activeX+3*palletPitch+260);
        const t=stage.forkProgress;
        const forkX=t<.28?exit+(pickup-exit)*smooth(t/.28):
          t<.5?pickup:pickup+(exit-pickup)*smooth((t-.5)/.5);
        const lift=t<.28?18*(1-smooth(t/.28)):10*smooth((t-.38)/.1);
        const truckX=forkX+palletWidth+8,truckY=floor+16;
        context.strokeStyle=belt;context.lineWidth=2;
        // Forks point toward the pallet so the truck reverses out to the right.
        box(forkX,truckY-8-lift,palletWidth+10,4,belt);
        box(truckX-4,truckY-94,7,98,belt);
        box(truckX+8,truckY-90,5,70,belt);
        box(truckX+8,truckY-92,72,6,soft);
        box(truckX+75,truckY-86,5,63,belt);
        box(truckX+15,truckY-43,66,32,accent);
        box(truckX+66,truckY-49,24,38,soft);
        box(truckX+27,truckY-65,22,5,belt);
        box(truckX+30,truckY-62,5,19,belt);
        context.beginPath();context.moveTo(truckX+18,truckY-62);context.lineTo(truckX+26,truckY-45);context.stroke();
        for(const wheel of [truckX+18,truckX+76]){
          context.fillStyle=belt;context.beginPath();context.arc(wheel,truckY-8,12,0,Math.PI*2);context.fill();
          context.fillStyle=soft;context.beginPath();context.arc(wheel,truckY-8,5,0,Math.PI*2);context.fill();
        }
        if(stage.forkLoaded)pallet(forkX,floor-lift,36);
      }
      if(transferring){
        drawCase(context,movingX,movingY,caseWidth,caseHeight,colors);
      }
      context.font='6.75px system-ui';context.fillStyle=ink;context.textAlign='center';
      context.fillText('36 symbolic spaces · 9 per level × 4',x+100+(3*palletPitch-20)/2,floor+32);
    }
    context.restore();
  }
  return {draw,dimensions,bottleNeck,drawBottle,drawCase,drawPalletOutput,palletStage};
})();
</script>
