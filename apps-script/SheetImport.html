      function finish(response){finishActivity?.();if(ticket!==sequence||!validContext())return;busy(false);if(response?.ok&&(response.importVersion!==importVersion||response.data?.contractVersion&&response.data.contractVersion!==importVersion)){
        el('sheet-import-error').textContent='The import client and server versions do not match. Update Main.gs, SheetImportService.gs and the import interface files together, update the deployment, then reopen the app. Client: '+importVersion+'; server: '+(response.importVersion||'unavailable')+'. No changes were applied.';return;
      }if(!response||!response.ok){var error=response?.error||{message:__ST_TEXT__('sheetimport.no_response_received_from_apps_script')};var details=(error.details||[]).map(function(d){return typeof d==='string'?d:JSON.stringify(d);});el('sheet-import-error').textContent=[error.message,...details,!response?.importVersion?'Client '+importVersion+': server version unavailable. Update Main.gs, SheetImportService.gs and the import interface files together.':''].filter(Boolean).join('\n');STErrors.capture('sheet-import-error',error);return;}preview=response.data;plan=merge.create(preview,snapshot.equipment,snapshot.sourceImport);packingDraft=STSheetPackingImport.create(merge.build(preview,plan,snapshot.equipment,snapshot.sourceImport),snapshot);observationDraft=STSheetRealData.create(preview,plan,snapshot.equipment);render();}
      google.script.run.withFailureHandler(function(error){finish({ok:false,error:{message:__ST_TEXT__('sheetimport.apps_script_request_failed')+String(error?.message||error||__ST_TEXT__('sheetimport.unknown_transport_error')).slice(0,500)}});}).withSuccessHandler(finish).previewSheetImport({caseId:context.caseId,spreadsheet:el('sheet-import-url').value,sheetName:el('sheet-import-tab').value});
    };
    el('sheet-import-apply').onclick=function(){if(!validContext()||!preview||!plan||!el('sheet-import-ack').checked)return;var result=buildResult();if(result.errors.length||!result.hasChanges)return;var current=actions.capture();if(!current||!merge.equal(current,snapshot)){el('sheet-import-error').textContent=__ST_TEXT__('sheetimport.the_simulation_changed_after_preview_preview_again_before_applying');return;}if(actions.apply(result))close();};
  }
  return {init:init,close:close};
};
</script>
