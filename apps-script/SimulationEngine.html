    }
  });
}

function validateNoiseProfile(noiseProfile, equipmentPath, details) {
  if (noiseProfile === undefined) return;
  if (!noiseProfile || typeof noiseProfile !== 'object' || Array.isArray(noiseProfile)) {
    details.push(invalid(equipmentPath + '.noiseProfile', 'must be an object'));
    return;
  }
  if (noiseProfile.microStop !== undefined) validateMicroStop(noiseProfile.microStop, equipmentPath, details);

function initializeInitialMaterialStates(runtime) {

    } else if (equipment.calendarStopped) {
      equipment.availabilityState = 'PLANNED_STOP';
    } else if (equipment.mode === 'PAUSE') {
      equipment.availabilityState = 'PAUSED';
    } else if (!isOperationalMode(equipment)) {
      equipment.availabilityState = 'STOPPED';
    } else if (requiresPrime(equipment)) {
      equipment.availabilityState = 'WAITING_FOR_PRIME';
    } else if (isStartDelayed(equipment)) {
      equipment.availabilityState = 'STARTING';
    } else if (isRampingUp(equipment)) {
      equipment.availabilityState = 'RAMPING_UP';

function advanceAccumulationZones(runtime) {

    const owner = getEquipment(runtime, zone.ownerEquipmentId);
    const conveyorStopped = zone.physicalModelEnabled && owner && (!isAvailable(owner) || isStartDelayed(owner));
    if (conveyorStopped) {
      zone.transit.forEach((packet) => {
        delayTransitPacket(packet, runtime.run.tickSeconds);
      });
      updateZonePhotoeyes(runtime, zone);
      return;
    }

    // A moving head packet awaiting this tick's discharge is not a stationary
    // queue. Subtract the discharge the downstream can accept before locating
    // the tail; otherwise equal-rate flow falsely compresses on every tick.
    const downstream = getEquipment(runtime, zone.downstreamControlEquipmentId);

      const queueArrival = stationaryQueueUnits > 1e-9
        ? packet.arrivesAtVirtualSecond - (zone.usableLengthMm - queueTailMm) / zone.conveyorSpeedMmPerSecond
        : packet.arrivesAtVirtualSecond;
      const arrivedFraction = Math.max(packet.arrivedFraction,
        fractionPassed(endSecond, queueArrival, packet.entryDurationSeconds));
      // Each packet represents uniform flow during its entry tick. Split a
      // crossing packet instead of rounding its whole travel to the next tick.
      // This prevents discretization from becoming a fictitious bottleneck.
      for (const sensor of zone.transportPhotoeyes) {
        const position = zone[sensor.position];
        if (position > queueTailMm && stationaryQueueUnits > 1e-9) continue;
        const fraction = fractionPassed(endSecond, packet[sensor.at], packet.entryDurationSeconds);
        const previous = packet[sensor.fraction] || 0;

function updateZonePhotoeyes(runtime, zone) {

function updatePrimeSensorSignal(runtime, zone) {

}

function recordNormalPhotoeyePass(runtime, zone, sensor, units) {
  const duration = sensorBlockedDurationSeconds(zone, units);
  const fields = PHOTOEYE_FIELDS[sensor];
  zone[fields.units] += units;
  zone[fields.last] = runtime.virtualSecond;
  if (!(duration > 0)) return;
  const untilField = fields.pulse;
  zone[untilField] = Math.max(runtime.virtualSecond, zone[untilField] || 0) + duration;
}

function sensorBlockedDurationSeconds(zone, units) {
  return isFiniteNumber(zone.packagePassSensorSeconds) && units > 0
    ? zone.packagePassSensorSeconds * units
    : 0;
}

function isNormalPulseActive(pulseUntilVirtualSecond, virtualSecond) {
  return isFiniteNumber(pulseUntilVirtualSecond) && pulseUntilVirtualSecond > virtualSecond;
}

function triggerPrimeSensor(runtime, zone) {
  if (zone.primeDetected) return;
  zone.primeDetected = true;
  zone.primeDetectedAtVirtualSecond = runtime.virtualSecond;
  zone.primeTriggerCount += 1;
  const downstream = getEquipment(runtime, zone.downstreamControlEquipmentId);
  if (downstream) {
    downstream.primeStartAuthorized = true;
    requestEquipmentStart(runtime, downstream, 'PRIME_SENSOR', {
      rampUpSeconds: zone.downstreamRampUpSeconds
    });
  }
  runtime.events.push({
    type: 'PRIME_SENSOR_TRIGGERED',
    atVirtualSecond: runtime.virtualSecond,
    zoneId: zone.id,
    downstreamEquipmentId: zone.downstreamControlEquipmentId,
    sensorPositionMm: zone.primeSensorPositionMm
  });
}

function updateBackupSensor(runtime, zone) {
  if (!zone.hasBackupSensor) return;
  const queueCoversBackup = zone.waitingUnits >= zone.backupTriggerWaitingUnits;
  const signalState = queueCoversBackup
    ? 'BLOCKED'
    : isNormalPulseActive(zone.backupPulseUntilVirtualSecond, runtime.virtualSecond)
      ? 'PULSING'
      : 'CLEAR';
  zone.backupSignalState = signalState;
  recordBackupSignalDuration(zone, signalState, runtime.run.tickSeconds);

  // A normal stream can pulse the photoeye on every product.  Only a queue
  // covering the sensor creates a continuously BLOCKED signal and starts the
  // blocked-delay timer.
  if (!zone.backupActive && signalState === 'BLOCKED') {
    zone.backupBlockedCandidateSeconds += runtime.run.tickSeconds;
    if (zone.backupBlockedCandidateSeconds < zone.blockedTimeDelaySeconds) return;
    zone.backupActive = true;
    zone.backupBlockedCandidateSeconds = 0;
    zone.backupClearCandidateSeconds = 0;
    zone.backupTriggeredAtVirtualSecond = runtime.virtualSecond;
    zone.backupTriggerCount += 1;
    const upstream = getEquipment(runtime, zone.upstreamControlEquipmentId);
    if (upstream) {
      upstream.backupControl = {
        zoneId: zone.id,
        active: true,
        responseRemainingSeconds: zone.upstreamStopResponseSeconds,
        residualRemainingUnits: zone.bottlesDischargedAtStop
      };
    }
    runtime.events.push({
      type: 'BACKUP_SENSOR_BLOCKED',
      atVirtualSecond: runtime.virtualSecond,
      zoneId: zone.id,
      upstreamEquipmentId: zone.upstreamControlEquipmentId,
      waitingUnits: round(zone.waitingUnits),
    queueLengthMm: round(zone.waitingUnits * zone.accumulatedPitchMm),
    queueTailPositionMm: round(Math.max(0, zone.usableLengthMm - zone.waitingUnits * zone.accumulatedPitchMm)),
      thresholdUnits: round(zone.backupTriggerWaitingUnits)
    });
    return;
  }

  if (!zone.backupActive) {
    zone.backupBlockedCandidateSeconds = 0;
    return;
  }

  // The signal must stay continuously clear. A passing package restarts the
  // clear timer instead of releasing an upstream stop from one normal gap.
  if (zone.backupActive && signalState === 'CLEAR' && zone.waitingUnits <= zone.backupRestartWaitingUnits) {
    zone.backupClearCandidateSeconds += runtime.run.tickSeconds;
    if (zone.backupClearCandidateSeconds < zone.clearTimeDelaySeconds) return;
    zone.backupActive = false;
    zone.backupClearCandidateSeconds = 0;
    zone.backupBlockedCandidateSeconds = 0;
    const upstream = getEquipment(runtime, zone.upstreamControlEquipmentId);
    if (upstream && upstream.backupControl?.zoneId === zone.id) {
      const completedBackupStop = upstream.backupControl.responseRemainingSeconds <= 0 &&
        upstream.backupControl.residualRemainingUnits <= 0;
      upstream.backupControl.active = false;
      upstream.backupControl = null;
      if (completedBackupStop && isOperationalMode(upstream) && !upstream.emergencyStopLatched) {
        requestEquipmentStart(runtime, upstream, 'BACKUP_SENSOR_CLEAR', {
          delaySeconds: zone.upstreamRestartDelaySeconds,
          rampUpSeconds: zone.upstreamRestartRampUpSeconds
        });
      }
    }
    runtime.events.push({
      type: 'BACKUP_SENSOR_CLEARED',
      atVirtualSecond: runtime.virtualSecond,
      zoneId: zone.id,
      upstreamEquipmentId: zone.upstreamControlEquipmentId,
      waitingUnits: round(zone.waitingUnits),
    queueLengthMm: round(zone.waitingUnits * zone.accumulatedPitchMm),
    queueTailPositionMm: round(Math.max(0, zone.usableLengthMm - zone.waitingUnits * zone.accumulatedPitchMm)),
      restartThresholdUnits: round(zone.backupRestartWaitingUnits)
    });
    return;
  }

  zone.backupClearCandidateSeconds = 0;
}

function recordBackupSignalDuration(zone, signalState, tickSeconds) {
  if (signalState === 'BLOCKED') zone.backupSignalBlockedSeconds += tickSeconds;
  else if (signalState === 'PULSING') zone.backupSignalPulsingSeconds += tickSeconds;
  else zone.backupSignalClearSeconds += tickSeconds;
}

function advanceEquipmentControlTimers(runtime) {
  runtime.equipment.forEach((equipment) => {
    const control = equipment.backupControl;
    if (control?.active && control.responseRemainingSeconds > 0) {
      control.responseRemainingSeconds = Math.max(0, control.responseRemainingSeconds - runtime.run.tickSeconds);
      if (control.responseRemainingSeconds === 0) {
        runtime.events.push({
          type: 'BACKUP_STOP_RESPONSE_COMPLETED',
          atVirtualSecond: runtime.virtualSecond,
          equipmentId: equipment.id,
          zoneId: control.zoneId
        });
      }
    }

    advanceEquipmentStart(runtime, equipment);
  });
}

function updateReliabilityFailures(runtime) {
  if (runtime.run.reliabilityEnabled === false) return;
  runtime.equipment.forEach((equipment) => {
    if (equipment.emergencyStopLatched) return;
    const profile = equipment.noiseProfile?.reliability;
    if (!profile) return;

    if (equipment.failureRemainingSeconds > 0) {
      equipment.failureRemainingSeconds = Math.max(0, equipment.failureRemainingSeconds - runtime.run.tickSeconds);
      if (equipment.failureRemainingSeconds === 0) {
        runtime.events.push({ type: 'REPAIR_COMPLETED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id });
        equipment.timeToFailureRemainingSeconds = randomExponentialSeconds(equipment.failureRandom, profile.mtbfMinutes * 60);
      }
      return;
    }

    if (!isOperationalMode(equipment) || equipment.microStopRemainingSeconds > 0) return;
    if (equipment.timeToFailureRemainingSeconds === null) {
      equipment.timeToFailureRemainingSeconds = randomExponentialSeconds(equipment.failureRandom, profile.mtbfMinutes * 60);
    }
    equipment.timeToFailureRemainingSeconds -= runtime.run.tickSeconds;
    if (equipment.timeToFailureRemainingSeconds > 0) return;

    equipment.failureRemainingSeconds = profile.mttrMinutes * 60;
    equipment.failureCount += 1;
    runtime.events.push({
      type: 'FAILURE_STARTED',
      atVirtualSecond: runtime.virtualSecond,
      equipmentId: equipment.id,
      durationSeconds: equipment.failureRemainingSeconds,
      mtbfMinutes: profile.mtbfMinutes,
      mttrMinutes: profile.mttrMinutes
    });
  });
}

function applyDueCommands(runtime) {
  while (runtime.commandIndex < runtime.commands.length) {
    const command = runtime.commands[runtime.commandIndex];
    if (command.atVirtualSecond > runtime.virtualSecond) return;
    const equipment = getEquipment(runtime, command.equipmentId);
    if (equipment && isSupportedAction(command.action)) {
      applyCommand(runtime, equipment, command.action);
    }
    runtime.commandIndex += 1;
  }
}

function updatePlantCalendar(runtime, countTick=true) {
  const now=runtime.virtualSecond;
  if(runtime.calendarActive && now>=runtime.calendarActive.endSeconds){
    runtime.events.push({type:'PLANT_STOP_ENDED',atVirtualSecond:now,category:runtime.calendarActive.category});
    const target=runtime.calendarActive.targetProductId;
    if(target&&runtime.product&&target!==runtime.product.id)switchRuntimeProduct(runtime,target);
    runtime.calendarActive=null;
    runtime.equipment.forEach(e=>{e.calendarStopped=false;if(runtime.calendarActivePolicy==='RESTART')requestEquipmentStart(runtime,e,'PLANT_CALENDAR_RESTART');});
  }
  const next=runtime.calendar.events[runtime.calendarIndex];
  if(!runtime.calendarActive&&next&&now>=next.startSeconds){
    runtime.calendarIndex++;runtime.calendarActive=next;runtime.calendarActivePolicy=next.restartPolicy||runtime.calendar.restartPolicy;
    runtime.equipment.forEach(e=>{e.calendarStopped=true;if(runtime.calendarActivePolicy==='RESTART')cancelEquipmentStart(e);});
    runtime.events.push({type:'PLANT_STOP_STARTED',atVirtualSecond:now,category:next.category,untilVirtualSecond:next.endSeconds});
  }
  if(runtime.calendarActive&&countTick)runtime.calendarStopSeconds+=runtime.run.tickSeconds;
}

function applyCommand(runtime, equipment, action) {
  if (action === 'EMERGENCY_STOP') {
    equipment.emergencyStopLatched = true;
    equipment.mode = 'STOP';
    cancelEquipmentStart(equipment);
    runtime.events.push({ type: 'EMERGENCY_STOP_APPLIED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id });
    return;
  }

  if (action === 'RESET') {
    if (!equipment.emergencyStopLatched) {
      runtime.events.push({ type: 'COMMAND_REJECTED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id, action, reason: 'NO_EMERGENCY_STOP_TO_RESET' });
      return;
    }
    equipment.emergencyStopLatched = false;
    equipment.mode = 'STOP';
    cancelEquipmentStart(equipment);
    runtime.events.push({ type: 'EMERGENCY_STOP_RESET', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id });
    return;
  }

  if (equipment.emergencyStopLatched) {
    runtime.events.push({ type: 'COMMAND_REJECTED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id, action, reason: 'EMERGENCY_STOP_LATCHED' });
    return;
  }

  const wasOperational = isOperationalMode(equipment);
  equipment.mode = action === 'RUN' ? 'AUTO' : action;
  if (!isOperationalMode(equipment)) cancelEquipmentStart(equipment);
  runtime.events.push({ type: 'COMMAND_APPLIED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id, action });

  if (isOperationalMode(equipment) && !wasOperational) {
    requestEquipmentStart(runtime, equipment, 'COMMAND_' + action);
  }
}

function updateMicroStops(runtime) {
  runtime.equipment.forEach((equipment) => {
    if (equipment.emergencyStopLatched) return;
    if (equipment.failureRemainingSeconds > 0) return;
    if (equipment.microStopRemainingSeconds > 0) {
      equipment.microStopRemainingSeconds = Math.max(0, equipment.microStopRemainingSeconds - runtime.run.tickSeconds);
      return;
    }
    if (equipment.mode !== 'AUTO') return;
    const profile = equipment.noiseProfile?.microStop;
    if (!profile) return;
    const probability = (profile.probabilityPerMinute || 0) * runtime.run.tickSeconds / 60;
    if (equipment.microStopRandom.next() < probability) {
      equipment.microStopRemainingSeconds = randomDuration(equipment.microStopDurationRandom, profile);
      runtime.events.push({ type: 'MICRO_STOP_STARTED', atVirtualSecond: runtime.virtualSecond, equipmentId: equipment.id, durationSeconds: equipment.microStopRemainingSeconds });
    }
  });
}

function processLineFromDownstream(runtime) {
  for (let index = runtime.equipment.length - 1; index >= 0; index -= 1) {
    processEquipment(runtime, index);
  }
}

function processEquipment(runtime, index) {
  const equipment = runtime.equipment[index];
  const tickSeconds = runtime.run.tickSeconds;
  if (!isAvailable(equipment)) {
    recordUnavailable(equipment, tickSeconds);
    return;
  }

  if (requiresPrime(equipment)) {
    equipment.actualRatePerSecond = 0;
    equipment.waitingForPrimeSeconds += tickSeconds;
    equipment.availabilityState = 'WAITING_FOR_PRIME';
    return;
  }

  const control = activeBackupControl(equipment);
  if (control && control.responseRemainingSeconds <= 0 && control.residualRemainingUnits <= 0) {
    equipment.actualRatePerSecond = 0;
    equipment.backupStopSeconds += tickSeconds;
    equipment.availabilityState = 'BACKUP_STOP';
    return;
  }

  if (isStartDelayed(equipment)) {
    equipment.actualRatePerSecond = 0;
    equipment.availabilityState = 'STARTING';
    return;
  }

  const residualDischarge = Boolean(control && control.responseRemainingSeconds <= 0 && control.residualRemainingUnits > 0);
  const requestedFlow = residualDischarge
    ? Math.min(equipment.nominalRatePerSecond * tickSeconds, control.residualRemainingUnits)
    : getRequestedFlow(equipment, tickSeconds);

  if (requestedFlow <= 0) {
    equipment.actualRatePerSecond = 0;
    equipment.availabilityState = 'RAMPING_UP';
    return;
  }

  const incomingZone = runtime.zones[index - 1];
  const ratio=equipment.inputPerOutput||1;
  const inputAvailable = index === 0 ? requestedFlow : Math.min(incomingZone.waitingUnits,
    incomingZone.physicalModelEnabled ? (isTransportAvailable(getEquipment(runtime, incomingZone.ownerEquipmentId))
      ? incomingZone.conveyorSpeedMmPerSecond / incomingZone.accumulatedPitchMm * tickSeconds : 0) : Infinity) / ratio;
  const downstreamSpace = getDownstreamSpace(runtime, index);
  const flow = Math.max(0, Math.min(requestedFlow, inputAvailable, residualDischarge ? requestedFlow : downstreamSpace));
  recordMaterialState(equipment, requestedFlow, inputAvailable, downstreamSpace, flow, tickSeconds, control, residualDischarge);
  moveFlow(runtime, index, flow, residualDischarge);
  equipment.outputCount += flow;
  if(runtime.product)equipment.productiveNativeSeconds=(equipment.productiveNativeSeconds||0)+flow/equipment.nominalRatePerSecond;
  equipment.actualRatePerSecond = flow / tickSeconds;

  if (residualDischarge) {
    control.residualRemainingUnits = Math.max(0, control.residualRemainingUnits - flow);
  }
}

function getRequestedFlow(equipment, tickSeconds) {
  if (isStartDelayed(equipment)) return 0;
  if (isRampingUp(equipment)) {
    const rampFactor = equipment.startRampDurationSeconds <= 0
      ? 1
      : equipment.startRampElapsedSeconds / equipment.startRampDurationSeconds;
    return equipment.nominalRatePerSecond * tickSeconds * rampFactor;
  }
  return equipment.nominalRatePerSecond * tickSeconds;
}

function hasStartProfile(equipment) {
  return equipment.startupDelaySeconds > 0 || equipment.restartRampUpSeconds > 0;
}

function requestEquipmentStart(runtime, equipment, reason, options = {}) {
  if (!equipment || equipment.emergencyStopLatched || !isOperationalMode(equipment)) return false;
  const delaySeconds = firstNonNegative(options.delaySeconds, equipment.startupDelaySeconds);
  const rampUpSeconds = firstNonNegative(options.rampUpSeconds, equipment.restartRampUpSeconds);
  equipment.startDelayRemainingSeconds = delaySeconds;
  equipment.startRampDurationSeconds = rampUpSeconds;
  equipment.startRampElapsedSeconds = 0;
  equipment.startReason = reason;
  runtime.events.push({
    type: 'EQUIPMENT_START_SEQUENCE_REQUESTED',
    atVirtualSecond: runtime.virtualSecond,
    equipmentId: equipment.id,
    reason,
    delaySeconds,
    rampUpSeconds
  });
  return true;
}

function cancelEquipmentStart(equipment) {
  equipment.startDelayRemainingSeconds = 0;
  equipment.startRampDurationSeconds = 0;
  equipment.startRampElapsedSeconds = 0;
  equipment.startReason = null;
}

function advanceEquipmentStart(runtime, equipment) {
  if (!isAvailable(equipment) || activeBackupControl(equipment)) return;
  if (isStartDelayed(equipment)) {
    equipment.startDelayRemainingSeconds = Math.max(0, equipment.startDelayRemainingSeconds - runtime.run.tickSeconds);
    return;
  }
  if (isRampingUp(equipment)) {
    equipment.startRampElapsedSeconds = Math.min(
      equipment.startRampDurationSeconds,
      equipment.startRampElapsedSeconds + runtime.run.tickSeconds
    );
  }
}

function isStartDelayed(equipment) {
  return equipment.startDelayRemainingSeconds > 0;
}

function isRampingUp(equipment) {
  return equipment.startRampElapsedSeconds < equipment.startRampDurationSeconds;
}

function resolveStartupDelaySeconds(equipment) {
  return firstNonNegative(
    equipment.startupDelaySeconds,
    equipment.processData?.upstream?.startupTimeSeconds
  );
}

function resolveRestartRampUpSeconds(equipment) {
  return firstNonNegative(
    equipment.restartRampUpSeconds,
    equipment.processData?.downstream?.rampUpTimeSeconds
  );
}

function firstNonNegative(...values) {
  for (const value of values) {
    if (typeof value === 'number' && Number.isFinite(value) && value >= 0) return value;
  }
  return 0;
}

function firstFinite(...values) {
  return values.find(isFiniteNumber) ?? null;
}

function safePositiveDivide(numerator, denominator) {
  return isFiniteNumber(numerator) && numerator > 0 && isFiniteNumber(denominator) && denominator > 0
    ? numerator / denominator
    : null;
}

function safeNonNegativeDivide(numerator, denominator) {
  return isFiniteNumber(numerator) && numerator >= 0 && isFiniteNumber(denominator) && denominator > 0
    ? numerator / denominator
    : null;
}

function getDownstreamSpace(runtime, index) {
  if (index === runtime.equipment.length - 1) return Number.POSITIVE_INFINITY;
  const zone = runtime.zones[index];
  return getZoneEntrySpace(zone);
}

function moveFlow(runtime, index, flow, allowOverflow) {
  if(runtime.product&&index===0)runtime.inputBottleEquivalents+=flow*runtime.equipment[index].outputBottleFactor;
  if (index > 0) {
    runtime.zones[index - 1].waitingUnits = Math.max(0, runtime.zones[index - 1].waitingUnits - flow*(runtime.equipment[index].inputPerOutput||1));
  }
  if (index === runtime.equipment.length - 1) {
    runtime.outputCount += flow*(runtime.equipment[index].outputBottleFactor||1);
    if(runtime.product){const row=currentProductRow(runtime);row.outputNative+=flow;row.outputBottleEquivalents+=flow*runtime.equipment[index].outputBottleFactor;}
    return;
  }
  addFlowToZone(runtime, runtime.zones[index], flow, allowOverflow);
}

function addFlowToZone(runtime, zone, flow, allowOverflow) {
  const availableSpace = getZoneEntrySpace(zone);
  const accepted = Math.min(flow, availableSpace);
  const overflow = allowOverflow ? Math.max(0, flow - accepted) : 0;

  if (accepted > 0) {
    if (zone.travelSeconds <= 0) {
      zone.waitingUnits += accepted;
      if (zone.hasBackupSensor && zone.backupSensorPositionMm <= 0) {
        recordNormalPhotoeyePass(runtime, zone, 'backup', accepted);
      }
      if (zone.hasPrimeSensor && zone.primeTravelSeconds <= 0) {
        recordNormalPhotoeyePass(runtime, zone, 'prime', accepted);
        triggerPrimeSensor(runtime, zone);
      }
    } else {
      zone.transit.push({
        units: accepted,
        initialUnits: accepted,
        entryDurationSeconds: runtime.run.tickSeconds,
        arrivedFraction: 0,
        backupDetected: false,
        backupAtVirtualSecond: zone.hasBackupSensor
          ? runtime.virtualSecond + zone.backupSensorPositionMm / zone.conveyorSpeedMmPerSecond
          : null,
        primeDetected: false,
        primeAtVirtualSecond: zone.hasPrimeSensor
          ? runtime.virtualSecond + zone.primeTravelSeconds
          : null,
        arrivesAtVirtualSecond: runtime.virtualSecond + zone.travelSeconds
      });
    }
  }

  if (overflow > 0) {
    zone.overflowUnits += overflow;
    if(runtime.product)runtime.overflowBottleEquivalents+=overflow*(zone.bottleFactor||1);
    zone.overflowEvents += 1;
    runtime.events.push({
      type: 'OVERFLOW',
      atVirtualSecond: runtime.virtualSecond,
      zoneId: zone.id,
      upstreamEquipmentId: zone.upstreamControlEquipmentId,
      lostUnits: round(overflow),
      totalOverflowUnits: round(zone.overflowUnits)
    });
  }
}

function recordMaterialState(equipment, requestedFlow, inputAvailable, downstreamSpace, flow, tickSeconds, control, residualDischarge) {
  if (control && flow <= 0) equipment.backupStopSeconds += tickSeconds;

  if (flow > 0) {
    equipment.runningSeconds += tickSeconds;
    if(runtimeProductEquipment(equipment))equipment.idealRunningNativeOutput=(equipment.idealRunningNativeOutput||0)+equipment.nominalRatePerSecond*tickSeconds;
    if (control) {
      equipment.availabilityState = control.responseRemainingSeconds > 0 || residualDischarge
        ? 'BACKUP_STOPPING'
        : 'BACKUP_STOP';
    } else if (isRampingUp(equipment)) {
      equipment.availabilityState = 'RAMPING_UP';
    } else {
      equipment.availabilityState = 'RUNNING';
    }
    if (!control) recordPartialConstraintLoss(equipment, requestedFlow, inputAvailable, downstreamSpace, tickSeconds);
    return;
  }

  equipment.actualRatePerSecond = 0;
  if (control) {
    equipment.availabilityState = control.responseRemainingSeconds > 0 || residualDischarge
      ? 'BACKUP_STOPPING'
      : 'BACKUP_STOP';
    return;
  }
  if (downstreamSpace <= 0) {
    equipment.blockedSeconds += tickSeconds;
    equipment.availabilityState = 'BLOCKED';
    return;
  }
  if (inputAvailable <= 0) {
    equipment.starvedSeconds += tickSeconds;
    equipment.availabilityState = 'STARVED';
    return;
  }
  equipment.availabilityState = 'IDLE';
}

function recordPartialConstraintLoss(equipment, requestedFlow, inputAvailable, downstreamSpace, tickSeconds) {
  if (requestedFlow <= 0) return;
  if (inputAvailable < requestedFlow && inputAvailable <= downstreamSpace) {
    equipment.partialStarvationLossSeconds += (1 - inputAvailable / requestedFlow) * tickSeconds;
  } else if (downstreamSpace < requestedFlow) {
    equipment.partialBlockingLossSeconds += (1 - downstreamSpace / requestedFlow) * tickSeconds;
  }
}

function recordUnavailable(equipment, tickSeconds) {
  equipment.actualRatePerSecond = 0;
  if (equipment.emergencyStopLatched) {
    equipment.stoppedSeconds += tickSeconds;
    equipment.emergencyStopSeconds += tickSeconds;
    equipment.availabilityState = 'EMERGENCY_STOP';
  } else if (equipment.calendarStopped) {
    equipment.stoppedSeconds += tickSeconds;
    equipment.plannedStopSeconds = (equipment.plannedStopSeconds || 0) + tickSeconds;
    equipment.availabilityState = 'PLANNED_STOP';
  } else if (equipment.failureRemainingSeconds > 0) {
    equipment.stoppedSeconds += tickSeconds;
    equipment.failureSeconds += tickSeconds;
    equipment.availabilityState = 'FAILURE';
  } else if (equipment.microStopRemainingSeconds > 0) {
    equipment.stoppedSeconds += tickSeconds;
    equipment.microStopSeconds += tickSeconds;
    equipment.availabilityState = 'MICRO_STOP';
  } else if (equipment.mode === 'PAUSE') {
    equipment.pausedSeconds += tickSeconds;
    equipment.availabilityState = 'PAUSED';
  } else {
    equipment.stoppedSeconds += tickSeconds;
    equipment.availabilityState = 'STOPPED';
  }
}

function isTransportAvailable(equipment) {
  return equipment && isAvailable(equipment) && !isStartDelayed(equipment);
}

function isAvailable(equipment) {
  return !equipment.emergencyStopLatched && isOperationalMode(equipment) &&
    equipment.microStopRemainingSeconds <= 0 && equipment.failureRemainingSeconds <= 0;
}

function requiresPrime(equipment) {
  return equipment.mode === 'AUTO' && equipment.primeStartAuthorized === false;
}

function activeBackupControl(equipment) {
  return equipment.backupControl?.active ? equipment.backupControl : null;
}

function getEquipment(runtime, equipmentId) {
  return runtime.equipmentById.get(equipmentId);
}

function getZoneEntrySpace(zone) {
  const transitUnits = getTransitUnits(zone);
  const inventory = zone.waitingUnits + transitUnits;
  if (!zone.physicalModelEnabled) return Math.max(0, zone.capacityUnits - inventory);
  const occupiedLength = zone.waitingUnits * zone.accumulatedPitchMm + transitUnits * zone.productPitchMm;
  return Math.max(0, Math.min(zone.capacityUnits - inventory, (zone.usableLengthMm - occupiedLength) / zone.productPitchMm));
}

function getZoneInventory(zone) {
  return zone.waitingUnits + getTransitUnits(zone);
}

function getTransitUnits(zone) {
  // Keep the original addition order; incremental inventory counters would
  // accumulate different floating-point errors over long replications.
  let total = 0;
  for (let i = 0; i < zone.transit.length; i++) total += zone.transit[i].units;
  return total;
}

function addSampleIfDue(runtime) {
  if(runtime.summaryOnly)return;
  if(runtime.virtualSecond+1e-8<runtime.nextSampleAt&&runtime.virtualSecond<runtime.run.durationSeconds)return;
  addSample(runtime);
}

function addSample(runtime) {
  if(runtime.summaryOnly)return;
  const visibleZones = runtime.zones.filter((zone) => zone.visible);
  runtime.nextSampleAt=runtime.virtualSecond+runtime.sampleInterval;
  runtime.samples.push({
    virtualSecond: runtime.virtualSecond,
    productId:runtime.product?.id,
    outputCount: round(runtime.outputCount),
    buffers: visibleZones.map((zone) => round(getZoneInventory(zone))),
    accumulationZones: visibleZones.map(zone=>createRecordedZoneSample(runtime,zone)),
    equipment: runtime.equipment.map((item) => {
      const effectiveness = createEquipmentEffectiveness(item, runtime.virtualSecond);
      return {
        id: item.id,
        mode: item.mode,
        availabilityState: item.availabilityState,
        outputCount: round(item.outputCount),
        processedUnits: round(item.outputCount),
        meanRatePerSecond:round(runtime.historyTicks?(item.historySum||0)/runtime.historyTicks:item.actualRatePerSecond),

// Strip replay frames only AFTER Python finishes all events and calculations.

// A module worker owns Python and SimPy. Cancelling terminates it immediately,
// including synchronous Python execution, without SharedArrayBuffer/COOP/COEP.
function simPyWorkerMain(compactResponse) {
  let pyodide;
  self.onmessage=async event=>{
    const task=event.data;
    let phase=pyodide?'simulation':'runtime';
    try {
      if(!pyodide) {
        self.postMessage({type:'loading',id:task.id});
        const {loadPyodide}=await import(task.indexURL+'pyodide.mjs');
        pyodide=await loadPyodide({indexURL:task.indexURL});
        phase='model';
        for(const [name,source] of Object.entries(task.files)) {
          const destination='/home/pyodide/'+name;
          pyodide.FS.mkdirTree(destination.slice(0,destination.lastIndexOf('/')));
          pyodide.FS.writeFile(destination,source,{encoding:'utf8'});
        }
        pyodide.runPython('import sys\nsys.path.insert(0, "/home/pyodide")\nimport simpy\nassert simpy.__version__ == "4.1.2"\nfrom st_simpy_engine import simulate_line');
      }
      phase='simulation';
      self.postMessage({type:'ready',id:task.id});
      pyodide.globals.set('_st_input',JSON.stringify(task.payload));
      let lastProgressAt=0;
      pyodide.globals.set('_st_progress',value=>{const now=Date.now();if(value===0||value===1||now-lastProgressAt>=50){lastProgressAt=now;self.postMessage({type:'progress',id:task.id,value});}});

      pyodide.globals.set('_st_summary_only',task.summaryOnly===true);
      try {
        const json=pyodide.runPython('import json\njson.dumps(simulate_line(json.loads(_st_input), progress=_st_progress, on_partial=_st_partial, summary_only=_st_summary_only), allow_nan=False)');
        const response=JSON.parse(json);

    if(!worker) {
      url=host.URL.createObjectURL(new host.Blob(['('+simPyWorkerMain.toString()+')('+compactSimPyResponse.toString()+');'],{type:'text/javascript'}));

// Python runtimes are substantially heavier than JS workers. Reuse at most two,
// or one on low-memory / dual-core devices, across every batch in this page.
function createSimPyBrowserEngine(host, files) {
  const size=(host.navigator?.deviceMemory!=null&&host.navigator.deviceMemory<4)?1:Math.min(2,Math.max(1,(host.navigator?.hardwareConcurrency||2)-1));
  const slots=[];
  let closed=false;
  return {size,run(input,options={}) {
    if(closed||options.cancelled?.())return Promise.reject(new Error('BATCH_CANCELLED'));
    let slot=slots.reduce((best,item)=>!best||item.pending<best.pending?item:best,null);
    if(!slot||slot.pending>0&&slots.length<size){slot={engine:createSerialSimPyBrowserEngine(host,files),pending:0};slots.push(slot);}
    slot.pending++;
    return slot.engine.run(input,options).finally(()=>slot.pending--);
  },close(){closed=true;slots.forEach(slot=>slot.engine.close());}};
}




/** Design targets and observed flow. Recovery is an explicit planning estimate. */
function analyzeLinePerformance(equipment, result) {
  const machines = (equipment || []).filter(item => item.type !== 'CONVEYOR' && item.processData?.role !== 'CONVEYOR');
  const duration = Number(result?.durationSeconds) || 0;
  const referenceId = machines.find(item => item.type === 'PACEMAKER' || item.processData?.role === 'PACEMAKER' || item.characteristics?.isPacemaker)?.id ||
    machines.find(item => item.id === result?.summary?.lineOeePacemakerEquipmentId)?.id ||
    machines.find(item => item.type === 'FILLER')?.id || machines[0]?.id;
  const reference = machines.find(item => item.id === referenceId);
  const baselineBpm = Number(reference?.nominalRatePerSecond) * 60;
  const points = machines.map(item => {
    const configuredBpm = Number(item.nominalRatePerSecond) * 60;
    // The V-Graph shows configured machine speeds. Average production flow
    // is reported separately and must not flatten speeds to the pacemaker.
    const normalBpm = configuredBpm;
    const recovery = estimateRecoveryTarget(equipment || [], item, referenceId, normalBpm);
    const configuredMaximum = item.processData?.equipment?.maximumSpeedBpm;
    const maximumBpm = configuredMaximum === null || configuredMaximum === undefined || configuredMaximum === ''
      ? null : Number(configuredMaximum);
    const validMaximum = Number.isFinite(maximumBpm) && maximumBpm >= normalBpm && normalBpm > 0;
    const metrics = result?.equipmentMetrics?.[item.id];
    const output = Number(metrics?.outputCount);
    const stopped = Number(metrics?.stoppedSeconds);
    // Availability excludes line interactions; starvation and blocking therefore
    // reduce the operational-efficiency component of effective throughput.
    const availableSeconds = duration > 0 && Number.isFinite(stopped)
      ? Math.max(0, duration - stopped) : 0;
    const availability = duration > 0 && Number.isFinite(stopped) ? availableSeconds / duration : null;
    // Availability-only capacity estimate. Buffer recovery requires the actual
    // deviation from desired inventory and a recovery time, neither supplied here.
    // The pacemaker is the reference, not a machine to overspeed for recovery.
    const capacityEstimateBpm = item.id !== referenceId && baselineBpm > 0 && configuredBpm > 0 && availability > 0
      ? Math.max(configuredBpm, baselineBpm / availability) : null;

  \"\"\"Schedule an *event* with a given *priority* and a *delay*.\"\"\"\n        heappush(self._queue, (self._now + delay, priority, next(self._eid), event))\n\n    def peek(self) -> SimTime:\n        \"\"\"Get the time of the next scheduled event. Return\n        :data:`~simpy.core.Infinity` if there is no further event.\"\"\"\n        try:\n            return self._queue[0][0]\n        except IndexError:\n            return Infinity\n\n    def step(self) -> None:\n        \"\"\"Process the next event.\n\n        Raise an :exc:`EmptySchedule` if no further events are available.\n\n        \"\"\"\n        try:\n            self._now, _, _, event = heappop(self._queue)\n        except IndexError:\n            raise EmptySchedule from None\n\n        # Process callbacks of the event. Set the events callbacks to None\n        # immediately to prevent concurrent modifications.\n        callbacks, event.callbacks = event.callbacks, None  # type: ignore\n        try:\n            for callback in callbacks:\n                callback(event)\n        except StopSimulation:\n            # Reassociate any remaining callbacks with the event and reschedule\n            # the event to be processed when the simulation resumes.\n            event.callbacks = callbacks[callbacks.index(callback) + 1 :]\n            self.schedule(event, EventPriority(-1))\n            raise\n\n        if not event._ok and not hasattr(event, '_defused'):\n            # The event has failed and has not been defused. Crash the\n            # environment.\n            # Create a copy of the failure exception with a new traceback.\n            exc = type(event._value)(*event._value.args)\n            exc.__cause__ = event._value\n            raise exc\n\n    def run(self, until: Optional[Union[SimTime, Event]] = None) -> Optional[Any]:\n        \"\"\"Executes :meth:`step()` until the given criterion *until* is met.\n\n        - If it is ``None`` (which is the default), this method will return\n          when there are no further events to be processed.\n\n        - If it is an :class:`~simpy.events.Event`, the method will continue\n          stepping until this event has been triggered and will return its\n          value.  Raises a :exc:`RuntimeError` if there are no further events\n          to be processed and the *until* event was not triggered.\n\n        - If it is a number, the method will continue stepping\n          until the environment's time reaches *until*.\n\n        \"\"\"\n        if until is not None:\n            if not isinstance(until, Event):\n                # Assume that *until* is a number if it is not None and\n                # not an event.  Create a Timeout(until) in this case.\n                at: SimTime = until if isinstance(until, int) else float(until)\n\n                if at \u003c= self.now:\n                    raise ValueError(\n                        f'until ({at}) must be greater than the current simulation time'\n                    )\n\n                # Schedule the event before all regular timeouts.\n                until = Event(self)\n                until._ok = True\n                until._value = None\n                self.schedule(until, URGENT, at - self.now)\n\n            elif until.callbacks is None:\n                # Until event has already been processed.\n                return until.value\n\n            until.callbacks.append(StopSimulation.callback)\n\n        try:\n            while True:\n                self.step()\n        except StopSimulation as exc:\n            return exc.args[0]  # == until.value\n        except EmptySchedule:\n            if until is not None:\n                assert not until.triggered\n                raise RuntimeError(\n                    f'No scheduled events left but \"until\" event was not '\n                    f'triggered: {until}'\n                ) from None\n        return None\n","simpy/events.py":"\"\"\"\nThis module contains the basic event types used in SimPy.\n\nThe base class for all events is :class:`Event`. Though it can be directly\nused, there are several specialized subclasses of it.\n\n.. autosummary::\n\n    ~simpy.events.Event\n    ~simpy.events.Timeout\n    ~simpy.events.Process\n    ~simpy.events.AnyOf\n    ~simpy.events.AllOf\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import (\n    TYPE_CHECKING,\n    Any,\n    Callable,\n    Dict,\n    Generator,\n    Iterable,\n    Iterator,\n    List,\n    NewType,\n    Optional,\n    Tuple,\n    TypeVar,\n)\n\nfrom simpy.exceptions import Interrupt\n\nif TYPE_CHECKING:\n    from types import FrameType\n\n    from simpy.core import Environment, SimTime\n\nPENDING: object = object()\n\"\"\"Unique object to identify pending values of events.\"\"\"\n\nEventPriority = NewType('EventPriority', int)\n\nURGENT: EventPriority = EventPriority(0)\n\"\"\"Priority of interrupts and process initialization events.\"\"\"\nNORMAL: EventPriority = EventPriority(1)\n\"\"\"Default priority used by events.\"\"\"\n\n\nclass Event:\n    \"\"\"An event that may happen at some point in time.\n\n    An event\n\n    - may happen (:attr:`triggered` is ``False``),\n    - is going to happen (:attr:`triggered` is ``True``) or\n    - has happened (:attr:`processed` is ``True``).\n\n    Every event is bound to an environment *env* and is initially not\n    triggered. Events are scheduled for processing by the environment after\n    they are triggered by either :meth:`succeed`, :meth:`fail` or\n    :meth:`trigger`. These methods also set the *ok* flag and the *value* of\n    the event.\n\n    An event has a list of :attr:`callbacks`. A callback can be any callable.\n    Once an event gets processed, all callbacks will be invoked with the event\n    as the single argument. Callbacks can check if the event was successful by\n    examining *ok* and do further processing with the *value* it has produced.\n\n    Failed events are never silently ignored and will raise an exception upon\n    being processed. If a callback handles an exception, it must set\n    :attr:`defused` to ``True`` to prevent this.\n\n    This class also implements ``__and__()`` (``&``) and ``__or__()`` (``|``).\n    If you concatenate two events using one of these operators,\n    a :class:`Condition` event is generated that lets you wait for both or one\n    of them.\n\n    \"\"\"\n\n    _ok: bool\n    _defused: bool\n    _value: Any = PENDING\n\n    def __init__(self, env: Environment):\n        self.env = env\n        \"\"\"The :class:`~simpy.core.Environment` the event lives in.\"\"\"\n        self.callbacks: EventCallbacks = []\n        \"\"\"List of functions that are called when the event is processed.\"\"\"\n\n    def __repr__(self) -> str:\n        \"\"\"Return the description of the event (see :meth:`_desc`) with the id\n        of the event.\"\"\"\n        return f'\u003c{self._desc()} object at {id(self):#x}>'\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Event()*.\"\"\"\n        return f'{self.__class__.__name__}()'\n\n    @property\n    def triggered(self) -> bool:\n        \"\"\"Becomes ``True`` if the event has been triggered and its callbacks\n        are about to be invoked.\"\"\"\n        return self._value is not PENDING\n\n    @property\n    def processed(self) -> bool:\n        \"\"\"Becomes ``True`` if the event has been processed (e.g., its\n        callbacks have been invoked).\"\"\"\n        return self.callbacks is None\n\n    @property\n    def ok(self) -> bool:\n        \"\"\"Becomes ``True`` when the event has been triggered successfully.\n\n        A \"successful\" event is one triggered with :meth:`succeed()`.\n\n        :raises AttributeError: if accessed before the event is triggered.\n\n        \"\"\"\n        return self._ok\n\n    @property\n    def defused(self) -> bool:\n        \"\"\"Becomes ``True`` when the failed event's exception is \"defused\".\n\n        When an event fails (i.e. with :meth:`fail()`), the failed event's\n        `value` is an exception that will be re-raised when the\n        :class:`~simpy.core.Environment` processes the event (i.e. in\n        :meth:`~simpy.core.Environment.step()`).\n\n        It is also possible for the failed event's exception to be defused by\n        setting :attr:`defused` to ``True`` from an event callback. Doing so\n        prevents the event's exception from being re-raised when the event is\n        processed by the :class:`~simpy.core.Environment`.\n\n        \"\"\"\n        return hasattr(self, '_defused')\n\n    @defused.setter\n    def defused(self, value: bool) -> None:\n        self._defused = True\n\n    @property\n    def value(self) -> Optional[Any]:\n        \"\"\"The value of the event if it is available.\n\n        The value is available when the event has been triggered.\n\n        Raises :exc:`AttributeError` if the value is not yet available.\n\n        \"\"\"\n        if self._value is PENDING:\n            raise AttributeError(f'Value of {self} is not yet available')\n        return self._value\n\n    def trigger(self, event: Event) -> None:\n        \"\"\"Trigger the event with the state and value of the provided *event*.\n        Return *self* (this event instance).\n\n        This method can be used directly as a callback function to trigger\n        chain reactions.\n\n        \"\"\"\n        self._ok = event._ok\n        self._value = event._value\n        self.env.schedule(self)\n\n    def succeed(self, value: Optional[Any] = None) -> Event:\n        \"\"\"Set the event's value, mark it as successful and schedule it for\n        processing by the environment. Returns the event instance.\n\n        Raises :exc:`RuntimeError` if this event has already been triggered.\n\n        \"\"\"\n        if self._value is not PENDING:\n            raise RuntimeError(f'{self} has already been triggered')\n\n        self._ok = True\n        self._value = value\n        self.env.schedule(self)\n        return self\n\n    def fail(self, exception: Exception) -> Event:\n        \"\"\"Set *exception* as the events value, mark it as failed and schedule\n        it for processing by the environment. Returns the event instance.\n\n        Raises :exc:`TypeError` if *exception* is not an :exc:`Exception`.\n\n        Raises :exc:`RuntimeError` if this event has already been triggered.\n\n        \"\"\"\n        if self._value is not PENDING:\n            raise RuntimeError(f'{self} has already been triggered')\n        if not isinstance(exception, BaseException):\n            raise TypeError(f'{exception} is not an exception.')\n        self._ok = False\n        self._value = exception\n        self.env.schedule(self)\n        return self\n\n    def __and__(self, other: Event) -> Condition:\n        \"\"\"Return a :class:`~simpy.events.Condition` that will be triggered if\n        both, this event and *other*, have been processed.\"\"\"\n        return Condition(self.env, Condition.all_events, [self, other])\n\n    def __or__(self, other: Event) -> Condition:\n        \"\"\"Return a :class:`~simpy.events.Condition` that will be triggered if\n        either this event or *other* have been processed (or even both, if they\n        happened concurrently).\"\"\"\n        return Condition(self.env, Condition.any_events, [self, other])\n\n\nEventType = TypeVar('EventType', bound=Event)\nEventCallback = Callable[[EventType], None]\nEventCallbacks = List[EventCallback]\n\n\nclass Timeout(Event):\n    \"\"\"A :class:`~simpy.events.Event` that gets processed after a *delay* has\n    passed.\n\n    This event is automatically triggered when it is created.\n\n\n    \"\"\"\n\n    def __init__(\n        self,\n        env: Environment,\n        delay: SimTime,\n        value: Optional[Any] = None,\n    ):\n        if delay \u003c 0:\n            raise ValueError(f'Negative delay {delay}')\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = []\n        self._value = value\n        self._delay = delay\n        self._ok = True\n        env.schedule(self, NORMAL, delay)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Timeout(delay[, value=value])*.\"\"\"\n        value_str = '' if self._value is None else f', value={self.value}'\n        return f'{self.__class__.__name__}({self._delay}{value_str})'\n\n\nclass Initialize(Event):\n    \"\"\"Initializes a process. Only used internally by :class:`Process`.\n\n    This event is automatically triggered when it is created.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, process: Process):\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = [process._resume]\n        self._value: Any = None\n\n        # The initialization events needs to be scheduled as urgent so that it\n        # will be handled before interrupts. Otherwise, a process whose\n        # generator has not yet been started could be interrupted.\n        self._ok = True\n        env.schedule(self, URGENT)\n\n\nclass Interruption(Event):\n    \"\"\"Immediately schedules an :class:`~simpy.exceptions.Interrupt` exception\n    with the given *cause* to be thrown into *process*.\n\n    This event is automatically triggered when it is created.\n\n    \"\"\"\n\n    def __init__(self, process: Process, cause: Optional[Any]):\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = process.env\n        self.callbacks: EventCallbacks = [self._interrupt]\n        self._value = Interrupt(cause)\n        self._ok = False\n        self._defused = True\n\n        if process._value is not PENDING:\n            raise RuntimeError(f'{process} has terminated and cannot be interrupted.')\n\n        if process is self.env.active_process:\n            raise RuntimeError('A process is not allowed to interrupt itself.')\n\n        self.process = process\n        self.env.schedule(self, URGENT)\n\n    def _interrupt(self, event: Event) -> None:\n        # Ignore dead processes. Multiple concurrently scheduled interrupts\n        # cause this situation. If the process dies while handling the first\n        # one, the remaining interrupts must be ignored.\n        if self.process._value is not PENDING:\n            return\n\n        # A process never expects an interrupt and is always waiting for a\n        # target event. Remove the process from the callbacks of the target.\n        self.process._target.callbacks.remove(self.process._resume)\n\n        self.process._resume(self)\n\n\nProcessGenerator = Generator[Event, Any, Any]\n\n\nclass Process(Event):\n    \"\"\"Process an event yielding generator.\n\n    A generator (also known as a coroutine) can suspend its execution by\n    yielding an event. ``Process`` will take care of resuming the generator\n    with the value of that event once it has happened. The exception of failed\n    events is thrown into the generator.\n\n    ``Process`` itself is an event, too. It is triggered, once the generator\n    returns or raises an exception. The value of the process is the return\n    value of the generator or the exception, respectively.\n\n    Processes can be interrupted during their execution by :meth:`interrupt`.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, generator: ProcessGenerator):\n        if not hasattr(generator, 'throw'):\n            # Implementation note: Python implementations differ in the\n            # generator types they provide. Cython adds its own generator type\n            # in addition to the CPython type, which renders a type check\n            # impractical. To work around this issue, we check for attribute\n            # name instead of type and optimistically assume that all objects\n            # with a ``throw`` attribute are generators.\n            # Remove this workaround if it causes issues in production!\n            raise ValueError(f'{generator} is not a generator.')\n\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = []\n\n        self._generator = generator\n\n        # Schedule the start of the execution of the process.\n        self._target: Event = Initialize(env, self)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Process(process_func_name)*.\"\"\"\n        return f'{self.__class__.__name__}({self.name})'\n\n    @property\n    def target(self) -> Event:\n        \"\"\"The event that the process is currently waiting for.\n\n        Returns ``None`` if the process is dead, or it is currently being\n        interrupted.\n\n        \"\"\"\n        return self._target\n\n    @property\n    def name(self) -> str:\n        \"\"\"Name of the function used to start the process.\"\"\"\n        return self._generator.__name__  # type: ignore\n\n    @property\n    def is_alive(self) -> bool:\n        \"\"\"``True`` until the process generator exits.\"\"\"\n        return self._value is PENDING\n\n    def interrupt(self, cause: Optional[Any] = None) -> None:\n        \"\"\"Interrupt this process optionally providing a *cause*.\n\n        A process cannot be interrupted if it already terminated. A process can\n        also not interrupt itself. Raise a :exc:`RuntimeError` in these\n        cases.\n\n        \"\"\"\n        Interruption(self, cause)\n\n    def _resume(self, event: Event) -> None:\n        \"\"\"Resumes the execution of the process with the value of *event*. If\n        the process generator exits, the process itself will get triggered with\n        the return value or the exception of the generator.\"\"\"\n        # Mark the current process as active.\n        self.env._active_proc = self\n\n        while True:\n            # Get next event from process\n            try:\n                if event._ok:\n                    event = self._generator.send(event._value)\n                else:\n                    # The process has no choice but to handle the failed event\n                    # (or fail itself).\n                    event._defused = True\n\n                    # Create an exclusive copy of the exception for this\n                    # process to prevent traceback modifications by other\n                    # processes.\n                    exc = type(event._value)(*event._value.args)\n                    exc.__cause__ = event._value\n                    event = self._generator.throw(exc)\n            except StopIteration as e:\n                # Process has terminated.\n                event = None  # type: ignore\n                self._ok = True\n                self._value = e.args[0] if len(e.args) else None\n                self.env.schedule(self)\n                break\n            except BaseException as e:\n                # Process has failed.\n                event = None  # type: ignore\n                self._ok = False\n                # Strip the frame of this function from the traceback as it\n                # does not add any useful information.\n                e.__traceback__ = e.__traceback__.tb_next  # type: ignore\n                self._value = e\n                self.env.schedule(self)\n                break\n\n            # Process returned another event to wait upon.\n            try:\n                # Be optimistic and blindly access the callbacks attribute.\n                if event.callbacks is not None:\n                    # The event has not yet been triggered. Register callback\n                    # to resume the process if that happens.\n                    event.callbacks.append(self._resume)\n                    break\n            except AttributeError:\n                # Our optimism didn't work out, figure out what went wrong and\n                # inform the user.\n                if hasattr(event, 'callbacks'):\n                    raise\n\n                msg = f'Invalid yield value \"{event}\"'\n                descr = _describe_frame(self._generator.gi_frame)  # type: ignore[attr-defined]\n                raise RuntimeError(f'\\n{descr}{msg}') from None\n\n        self._target = event\n        self.env._active_proc = None\n\n\nclass ConditionValue:\n    \"\"\"Result of a :class:`~simpy.events.Condition`. It supports convenient\n    dict-like access to the triggered events and their values. The events are\n    ordered by their occurrences in the condition.\"\"\"\n\n    def __init__(self) -> None:\n        self.events: List[Event] = []\n\n    def __getitem__(self, key: Event) -> Any:\n        if key not in self.events:\n            raise KeyError(str(key))\n\n        return key._value\n\n    def __contains__(self, key: Event) -> bool:\n        return key in self.events\n\n    def __eq__(self, other: object) -> bool:\n        if isinstance(other, ConditionValue):\n            return self.events == other.events\n        elif isinstance(other, dict):\n            return self.todict() == other\n        else:\n            return NotImplemented\n\n    __hash__ = None  # type: ignore[assignment]\n\n    def __repr__(self) -> str:\n        return f'\u003cConditionValue {self.todict()}>'\n\n    def __iter__(self) -> Iterator[Event]:\n        return self.keys()\n\n    def keys(self) -> Iterator[Event]:\n        return (event for event in self.events)\n\n    def values(self) -> Iterator[Any]:\n        return (event._value for event in self.events)\n\n    def items(self) -> Iterator[Tuple[Event, Any]]:\n        return ((event, event._value) for event in self.events)\n\n    def todict(self) -> Dict[Event, Any]:\n        return {event: event._value for event in self.events}\n\n\nclass Condition(Event):\n    \"\"\"An event that gets triggered once the condition function *evaluate*\n    returns ``True`` on the given list of *events*.\n\n    The value of the condition event is an instance of :class:`ConditionValue`\n    which allows convenient access to the input events and their values. The\n    :class:`ConditionValue` will only contain entries for those events that\n    occurred before the condition is processed.\n\n    If one of the events fails, the condition also fails and forwards the\n    exception of the failing event.\n\n    The *evaluate* function receives the list of target events and the number\n    of processed events in this list: ``evaluate(events, processed_count)``. If\n    it returns ``True``, the condition is triggered. The\n    :func:`Condition.all_events()` and :func:`Condition.any_events()` functions\n    are used to implement *and* (``&``) and *or* (``|``) for events.\n\n    Condition events can be nested.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        env: Environment,\n        evaluate: Callable[[Tuple[Event, ...], int], bool],\n        events: Iterable[Event],\n    ):\n        super().__init__(env)\n        self._evaluate = evaluate\n        self._events = tuple(events)\n        self._count = 0\n\n        if not self._events:\n            # Immediately succeed if no events are provided.\n            self.succeed(ConditionValue())\n            return\n\n        # Check if events belong to the same environment.\n        for event in self._events:\n            if self.env != event.env:\n                raise ValueError(\n                    'It is not allowed to mix events from different environments'\n                )\n\n        # Check if the condition is met for each processed event. Attach\n        # _check() as a callback otherwise.\n        for event in self._events:\n            if event.callbacks is None:\n                self._check(event)\n            else:\n                event.callbacks.append(self._check)\n\n        # Register a callback which will build the value of this condition\n        # after it has been triggered.\n        assert isinstance(self.callbacks, list)\n        self.callbacks.append(self._build_value)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Condition(evaluate, [events])*.\"\"\"\n        return f'{self.__class__.__name__}({self._evaluate.__name__}, {self._events})'\n\n    def _populate_value(self, value: ConditionValue) -> None:\n        \"\"\"Populate the *value* by recursively visiting all nested\n        conditions.\"\"\"\n\n        for event in self._events:\n            if isinstance(event, Condition):\n                event._populate_value(value)\n            elif event.callbacks is None:\n                value.events.append(event)\n\n    def _build_value(self, event: Event) -> None:\n        \"\"\"Build the value of this condition.\"\"\"\n        self._remove_check_callbacks()\n        if event._ok:\n            self._value = ConditionValue()\n            self._populate_value(self._value)\n\n    def _remove_check_callbacks(self) -> None:\n        \"\"\"Remove _check() callbacks from events recursively.\n\n        Once the condition has triggered, the condition's events no longer need\n        to have _check() callbacks. Removing the _check() callbacks is\n        important to break circular references between the condition and\n        untriggered events.\n\n        \"\"\"\n        for event in self._events:\n            if event.callbacks and self._check in event.callbacks:\n                event.callbacks.remove(self._check)\n            if isinstance(event, Condition):\n                event._remove_check_callbacks()\n\n    def _check(self, event: Event) -> None:\n        \"\"\"Check if the condition was already met and schedule the *event* if\n        so.\"\"\"\n        if self._value is not PENDING:\n            return\n\n        self._count += 1\n\n        if not event._ok:\n            # Abort if the event has failed.\n            event._defused = True\n            self.fail(event._value)\n        elif self._evaluate(self._events, self._count):\n            # The condition has been met. The _build_value() callback will\n            # populate the ConditionValue once this condition is processed.\n            self.succeed()\n\n    @staticmethod\n    def all_events(events: Tuple[Event, ...], count: int) -> bool:\n        \"\"\"An evaluation function that returns ``True`` if all *events* have\n        been triggered.\"\"\"\n        return len(events) == count\n\n    @staticmethod\n    def any_events(events: Tuple[Event, ...], count: int) -> bool:\n        \"\"\"An evaluation function that returns ``True`` if at least one of\n        *events* has been triggered.\"\"\"\n        return count > 0 or len(events) == 0\n\n\nclass AllOf(Condition):\n    \"\"\"A :class:`~simpy.events.Condition` event that is triggered if all of\n    a list of *events* have been successfully triggered. Fails immediately if\n    any of *events* failed.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, events: Iterable[Event]):\n        super().__init__(env, Condition.all_events, events)\n\n\nclass AnyOf(Condition):\n    \"\"\"A :class:`~simpy.events.Condition` event that is triggered if any of\n    a list of *events* has been successfully triggered. Fails immediately if\n    any of *events* failed.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, events: Iterable[Event]):\n        super().__init__(env, Condition.any_events, events)\n\n\ndef _describe_frame(frame: FrameType) -> str:\n    \"\"\"Print filename, line number and function name of a stack frame.\"\"\"\n    filename, name = frame.f_code.co_filename, frame.f_code.co_name\n    lineno = frame.f_lineno\n\n    with open(filename) as f:\n        for no, line in enumerate(f):\n            if no + 1 == lineno:\n                return (\n                    f'  File \"{filename}\", line {lineno}, in {name}\\n'\n                    f'    {line.strip()}\\n'\n                )\n        return f'  File \"{filename}\", line {lineno}, in {name}\\n'\n","simpy/exceptions.py":"\"\"\"\nSimPy specific exceptions.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Any, Optional\n\n\nclass SimPyException(Exception):\n    \"\"\"Base class for all SimPy specific exceptions.\"\"\"\n\n\nclass Interrupt(SimPyException):\n    \"\"\"Exception thrown into a process if it is interrupted (see\n    :func:`~simpy.events.Process.interrupt()`).\n\n    :attr:`cause` provides the reason for the interrupt, if any.\n\n    If a process is interrupted concurrently, all interrupts will be thrown\n    into the process in the same order as they occurred.\n\n\n    \"\"\"\n\n    def __init__(self, cause: Optional[Any]):\n        super().__init__(cause)\n\n    def __str__(self) -> str:\n        return f'{self.__class__.__name__}({self.cause!r})'\n\n    @property\n    def cause(self) -> Optional[Any]:\n        \"\"\"The cause of the interrupt or ``None`` if no cause was provided.\"\"\"\n        return self.args[0]\n","simpy/py.typed":"","simpy/rt.py":"\"\"\"Execution environment for events that synchronizes passing of time\nwith the real-time (aka *wall-clock time*).\n\n\"\"\"\n\nfrom time import monotonic, sleep\n\nfrom simpy.core import EmptySchedule, Environment, Infinity, SimTime\n\n\nclass RealtimeEnvironment(Environment):\n    \"\"\"Execution environment for an event-based simulation which is\n    synchronized with the real-time (also known as wall-clock time). A time\n    step will take *factor* seconds of real time (one second by default).\n    A step from ``0`` to ``3`` with a ``factor=0.5`` will, for example, take at\n    least\n    1.5 seconds.\n\n    The :meth:`step()` method will raise a :exc:`RuntimeError` if a time step\n    took too long to compute. This behaviour can be disabled by setting\n    *strict* to ``False``.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        initial_time: SimTime = 0,\n        factor: float = 1.0,\n        strict: bool = True,\n    ):\n        Environment.__init__(self, initial_time)\n\n        self.env_start = initial_time\n        self.real_start = monotonic()\n        self._factor = factor\n        self._strict = strict\n\n    @property\n    def factor(self) -> float:\n        \"\"\"Scaling factor of the real-time.\"\"\"\n        return self._factor\n\n    @property\n    def strict(self) -> bool:\n        \"\"\"Running mode of the environment. :meth:`step()` will raise a\n        :exc:`RuntimeError` if this is set to ``True`` and the processing of\n        events takes too long.\"\"\"\n        return self._strict\n\n    def sync(self) -> None:\n        \"\"\"Synchronize the internal time with the current wall-clock time.\n\n        This can be useful to prevent :meth:`step()` from raising an error if\n        a lot of time passes between creating the RealtimeEnvironment and\n        calling :meth:`run()` or :meth:`step()`.\n\n        \"\"\"\n        self.real_start = monotonic()\n\n    def step(self) -> None:\n        \"\"\"Process the next event after enough real-time has passed for the\n        event to happen.\n\n        The delay is scaled according to the real-time :attr:`factor`. With\n        :attr:`strict` mode enabled, a :exc:`RuntimeError` will be raised, if\n        the event is processed too slowly.\n\n        \"\"\"\n        evt_time = self.peek()\n\n        if evt_time is Infinity:\n            raise EmptySchedule\n\n        real_time = self.real_start + (evt_time - self.env_start) * self.factor\n\n        if self.strict and monotonic() - real_time > self.factor:\n            # Events scheduled for time *t* may take just up to *t+1*\n            # for their computation, before an error is raised.\n            delta = monotonic() - real_time\n            raise RuntimeError(f'Simulation too slow for real time ({delta:.3f}s).')\n\n        # Sleep in a loop to fix inaccuracies of windows (see\n        #  for details) and to ignore\n        # interrupts.\n        while True:\n            delta = real_time - monotonic()\n            if delta \u003c= 0:\n                break\n            sleep(delta)\n\n        Environment.step(self)\n","simpy/util.py":"\"\"\"\nA collection of utility functions:\n\n.. autosummary::\n   start_delayed\n\n\"\"\"\n\nfrom typing import Generator\n\nfrom simpy.core import Environment, SimTime\nfrom simpy.events import Event, Process, ProcessGenerator\n\n\ndef start_delayed(\n    env: Environment, generator: ProcessGenerator, delay: SimTime\n) -> Process:\n    \"\"\"Return a helper process that starts another process for *generator*\n    after a certain *delay*.\n\n    :meth:`~simpy.core.Environment.process()` starts a process at the current\n    simulation time. This helper allows you to start a process after a delay of\n    *delay* simulation time units::\n\n        >>> from simpy import Environment\n        >>> from simpy.util import start_delayed\n        >>> def my_process(env, x):\n        ...     print(f'{env.now}, {x}')\n        ...     yield env.timeout(1)\n        ...\n        >>> env = Environment()\n        >>> proc = start_delayed(env, my_process(env, 3), 5)\n        >>> env.run()\n        5, 3\n\n    Raise a :exc:`ValueError` if ``delay \u003c= 0``.\n\n    \"\"\"\n    if delay \u003c= 0:\n        raise ValueError(f'delay(={delay}) must be > 0.')\n\n    def starter() -> Generator[Event, None, Process]:\n        yield env.timeout(delay)\n        proc = env.process(generator)\n        return proc\n\n    return env.process(starter())\n\n\ndef subscribe_at(event: Event) -> None:\n    \"\"\"Register at the *event* to receive an interrupt when it occurs.\n\n    The most common use case for this is to pass\n    a :class:`~simpy.events.Process` to get notified when it terminates.\n\n    Raise a :exc:`RuntimeError` if ``event`` has already occurred.\n\n    \"\"\"\n    env = event.env\n    assert env.active_process is not None\n    subscriber = env.active_process\n\n    def signaller(signaller: Event, receiver: Process) -> ProcessGenerator:\n        result = yield signaller\n        if receiver.is_alive:\n            receiver.interrupt((signaller, result))\n\n    if event.callbacks is not None:\n        env.process(signaller(event, subscriber))\n    else:\n        raise RuntimeError(f'{event} has already terminated.')\n","simpy/resources/__init__.py":"\"\"\"\nSimPy implements three types of resources that can be used to synchronize\nprocesses or to model congestion points:\n\n.. currentmodule:: simpy.resources\n\n.. autosummary::\n\n   resource\n   container\n   store\n\nThey are derived from the base classes defined in the\n:mod:`~simpy.resources.base` module. These classes are also meant to support\nthe implementation of custom resource types.\n\n\"\"\"\n","simpy/resources/base.py":"\"\"\"\nBase classes of for SimPy's shared resource types.\n\n:class:`BaseResource` defines the abstract base resource. It supports *get* and\n*put* requests, which return :class:`Put` and :class:`Get` events respectively.\nThese events are triggered once the request has been completed.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import (\n    TYPE_CHECKING,\n    ClassVar,\n    ContextManager,\n    Generic,\n    MutableSequence,\n    Optional,\n    Type,\n    TypeVar,\n    Union,\n)\n\nfrom simpy.core import BoundClass, Environment\nfrom simpy.events import Event, Process\n\nif TYPE_CHECKING:\n    from types import TracebackType\n\nResourceType = TypeVar('ResourceType', bound='BaseResource')\n\n\nclass Put(Event, ContextManager['Put'], Generic[ResourceType]):\n    \"\"\"Generic event for requesting to put something into the *resource*.\n\n    This event (and all of its subclasses) can act as context manager and can\n    be used with the :keyword:`with` statement to automatically cancel the\n    request if an exception (like an :class:`simpy.exceptions.Interrupt` for\n    example) occurs:\n\n    .. code-block:: python\n\n        with res.put(item) as request:\n            yield request\n\n    \"\"\"\n\n    def __init__(self, resource: ResourceType):\n        super().__init__(resource._env)\n        self.resource = resource\n        self.proc: Optional[Process] = self.env.active_process\n\n        resource.put_queue.append(self)  # pyright: ignore\n        self.callbacks.append(resource._trigger_get)\n        resource._trigger_put(None)\n\n    def __enter__(self) -> Put:\n        return self\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_value: Optional[BaseException],\n        traceback: Optional[TracebackType],\n    ) -> Optional[bool]:\n        self.cancel()\n        return None\n\n    def cancel(self) -> None:\n        \"\"\"Cancel this put request.\n\n        This method has to be called if the put request must be aborted, for\n        example if a process needs to handle an exception like an\n        :class:`~simpy.exceptions.Interrupt`.\n\n        If the put request was created in a :keyword:`with` statement, this\n        method is called automatically.\n\n        \"\"\"\n        if not self.triggered:\n            self.resource.put_queue.remove(self)  # pyright: ignore\n\n\nclass Get(Event, ContextManager['Get'], Generic[ResourceType]):\n    \"\"\"Generic event for requesting to get something from the *resource*.\n\n    This event (and all of its subclasses) can act as context manager and can\n    be used with the :keyword:`with` statement to automatically cancel the\n    request if an exception (like an :class:`simpy.exceptions.Interrupt` for\n    example) occurs:\n\n    .. code-block:: python\n\n        with res.get() as request:\n            item = yield request\n\n    \"\"\"\n\n    def __init__(self, resource: ResourceType):\n        super().__init__(resource._env)\n        self.resource = resource\n        self.proc = self.env.active_process\n\n        resource.get_queue.append(self)  # pyright: ignore\n        self.callbacks.append(resource._trigger_put)\n        resource._trigger_get(None)\n\n    def __enter__(self) -> Get:\n        return self\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_value: Optional[BaseException],\n        traceback: Optional[TracebackType],\n    ) -> Optional[bool]:\n        self.cancel()\n        return None\n\n    def cancel(self) -> None:\n        \"\"\"Cancel this get request.\n\n        This method has to be called if the get request must be aborted, for\n        example if a process needs to handle an exception like an\n        :class:`~simpy.exceptions.Interrupt`.\n\n        If the get request was created in a :keyword:`with` statement, this\n        method is called automatically.\n\n        \"\"\"\n        if not self.triggered:\n            self.resource.get_queue.remove(self)  # pyright: ignore\n\n\nPutType = TypeVar('PutType', bound=Put)\nGetType = TypeVar('GetType', bound=Get)\n\n\nclass BaseResource(Generic[PutType, GetType]):\n    \"\"\"Abstract base class for a shared resource.\n\n    You can :meth:`put()` something into the resources or :meth:`get()`\n    something out of it. Both methods return an event that is triggered once\n    the operation is completed. If a :meth:`put()` request cannot complete\n    immediately (for example if the resource has reached a capacity limit) it\n    is enqueued in the :attr:`put_queue` for later processing. Likewise for\n    :meth:`get()` requests.\n\n    Subclasses can customize the resource by:\n\n    - providing custom :attr:`PutQueue` and :attr:`GetQueue` types,\n    - providing custom :class:`Put` respectively :class:`Get` events,\n    - and implementing the request processing behaviour through the methods\n      ``_do_get()`` and ``_do_put()``.\n\n    \"\"\"\n\n    PutQueue: ClassVar[Type[MutableSequence]] = list\n    \"\"\"The type to be used for the :attr:`put_queue`. It is a plain\n    :class:`list` by default. The type must support index access (e.g.\n    ``__getitem__()`` and ``__len__()``) as well as provide ``append()`` and\n    ``pop()`` operations.\"\"\"\n\n    GetQueue: ClassVar[Type[MutableSequence]] = list\n    \"\"\"The type to be used for the :attr:`get_queue`. It is a plain\n    :class:`list` by default. The type must support index access (e.g.\n    ``__getitem__()`` and ``__len__()``) as well as provide ``append()`` and\n    ``pop()`` operations.\"\"\"\n\n    def __init__(self, env: Environment, capacity: Union[float, int]):\n        self._env = env\n        self._capacity = capacity\n        self.put_queue: MutableSequence[PutType] = self.PutQueue()\n        \"\"\"Queue of pending *put* requests.\"\"\"\n        self.get_queue: MutableSequence[GetType] = self.GetQueue()\n        \"\"\"Queue of pending *get* requests.\"\"\"\n\n        # Bind event constructors as methods\n        BoundClass.bind_early(self)\n\n    @property\n    def capacity(self) -> Union[float, int]:\n        \"\"\"Maximum capacity of the resource.\"\"\"\n        return self._capacity\n\n    if TYPE_CHECKING:\n\n        def put(self) -> Put:\n            \"\"\"Request to put something into the resource and return a\n            :class:`Put` event, which gets triggered once the request\n            succeeds.\"\"\"\n            return Put(self)\n\n        def get(self) -> Get:\n            \"\"\"Request to get something from the resource and return a\n            :class:`Get` event, which gets triggered once the request\n            succeeds.\"\"\"\n            return Get(self)\n\n    else:\n        put = BoundClass(Put)\n        get = BoundClass(Get)\n\n    def _do_put(self, event: PutType) -> Optional[bool]:\n        \"\"\"Perform the *put* operation.\n\n        This method needs to be implemented by subclasses. If the conditions\n        for the put *event* are met, the method must trigger the event (e.g.\n        call :meth:`Event.succeed()` with an appropriate value).\n\n        This method is called by :meth:`_trigger_put` for every event in the\n        :attr:`put_queue`, as long as the return value does not evaluate\n        ``False``.\n        \"\"\"\n        raise NotImplementedError(self)\n\n    def _trigger_put(self, get_event: Optional[GetType]) -> None:\n        \"\"\"This method is called once a new put event has been created or a get\n        event has been processed.\n\n        The method iterates over all put events in the :attr:`put_queue` and\n        calls :meth:`_do_put` to check if the conditions for the event are met.\n        If :meth:`_do_put` returns ``False``, the iteration is stopped early.\n        \"\"\"\n\n        # Maintain queue invariant: All put requests must be untriggered.\n        # This code is not very pythonic because the queue interface should be\n        # simple (only append(), pop(), __getitem__() and __len__() are\n        # required).\n        idx = 0\n        while idx \u003c len(self.put_queue):\n            put_event = self.put_queue[idx]\n            proceed = self._do_put(put_event)\n            if not put_event.triggered:\n                idx += 1\n            elif self.put_queue.pop(idx) != put_event:\n                raise RuntimeError('Put queue invariant violated')\n\n            if not proceed:\n                break\n\n    def _do_get(self, event: GetType) -> Optional[bool]:\n        \"\"\"Perform the *get* operation.\n\n        This method needs to be implemented by subclasses. If the conditions\n        for the get *event* are met, the method must trigger the event (e.g.\n        call :meth:`Event.succeed()` with an appropriate value).\n\n        This method is called by :meth:`_trigger_get` for every event in the\n        :attr:`get_queue`, as long as the return value does not evaluate\n        ``False``.\n        \"\"\"\n        raise NotImplementedError(self)\n\n    def _trigger_get(self, put_event: Optional[PutType]) -> None:\n        \"\"\"Trigger get events.\n\n        This method is called once a new get event has been created or a put\n        event has been processed.\n\n        The method iterates o
