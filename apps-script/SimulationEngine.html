ver all get events in the :attr:`get_queue` and\n        calls :meth:`_do_get` to check if the conditions for the event are met.\n        If :meth:`_do_get` returns ``False``, the iteration is stopped early.\n        \"\"\"\n\n        # Maintain queue invariant: All get requests must be untriggered.\n        # This code is not very pythonic because the queue interface should be\n        # simple (only append(), pop(), __getitem__() and __len__() are\n        # required).\n        idx = 0\n        while idx \u003c len(self.get_queue):\n            get_event = self.get_queue[idx]\n            proceed = self._do_get(get_event)\n            if not get_event.triggered:\n                idx += 1\n            elif self.get_queue.pop(idx) != get_event:\n                raise RuntimeError('Get queue invariant violated')\n\n            if not proceed:\n                break\n","simpy/resources/container.py":"\"\"\"\nResource for sharing homogeneous matter between processes, either continuous\n(like water) or discrete (like apples).\n\nA :class:`Container` can be used to model the fuel tank of a gasoline station.\nTankers increase and refuelled cars decrease the amount of gas in the station's\nfuel tanks.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import TYPE_CHECKING, Optional, Union\n\nfrom simpy.core import BoundClass, Environment\nfrom simpy.resources import base\n\nContainerAmount = Union[int, float]\n\n\nclass ContainerPut(base.Put):\n    \"\"\"Request to put *amount* of matter into the *container*. The request will\n    be triggered once there is enough space in the *container* available.\n\n    Raise a :exc:`ValueError` if ``amount \u003c= 0``.\n\n    \"\"\"\n\n    def __init__(self, container: Container, amount: ContainerAmount):\n        if amount \u003c= 0:\n            raise ValueError(f'amount(={amount}) must be > 0.')\n        self.amount = amount\n        \"\"\"The amount of matter to be put into the container.\"\"\"\n\n        super().__init__(container)\n\n\nclass ContainerGet(base.Get):\n    \"\"\"Request to get *amount* of matter from the *container*. The request will\n    be triggered once there is enough matter available in the *container*.\n\n    Raise a :exc:`ValueError` if ``amount \u003c= 0``.\n\n    \"\"\"\n\n    def __init__(self, container: Container, amount: ContainerAmount):\n        if amount \u003c= 0:\n            raise ValueError(f'amount(={amount}) must be > 0.')\n        self.amount = amount\n        \"\"\"The amount of matter to be taken out of the container.\"\"\"\n\n        super().__init__(container)\n\n\nclass Container(base.BaseResource):\n    \"\"\"Resource containing up to *capacity* of matter which may either be\n    continuous (like water) or discrete (like apples). It supports requests to\n    put or get matter into/from the container.\n\n    The *env* parameter is the :class:`~simpy.core.Environment` instance the\n    container is bound to.\n\n    The *capacity* defines the size of the container. By default, a container\n    is of unlimited size. The initial amount of matter is specified by *init*\n    and defaults to ``0``.\n\n    Raise a :exc:`ValueError` if ``capacity \u003c= 0``, ``init \u003c 0`` or\n    ``init > capacity``.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        env: Environment,\n        capacity: ContainerAmount = float('inf'),\n        init: ContainerAmount = 0,\n    ):\n        if capacity \u003c= 0:\n            raise ValueError('\"capacity\" must be > 0.')\n        if init \u003c 0:\n            raise ValueError('\"init\" must be >= 0.')\n        if init > capacity:\n            raise ValueError('\"init\" must be \u003c= \"capacity\".')\n\n        super().__init__(env, capacity)\n\n        self._level = init\n\n    @property\n    def level(self) -> ContainerAmount:\n        \"\"\"The current amount of the matter in the container.\"\"\"\n        return self._level\n\n    if TYPE_CHECKING:\n\n        def put(  # type: ignore[override]\n            self, amount: ContainerAmount\n        ) -> ContainerPut:\n            \"\"\"Request to put *amount* of matter into the container.\"\"\"\n            return ContainerPut(self, amount)\n\n        def get(  # type: ignore[override]\n            self, amount: ContainerAmount\n        ) -> ContainerGet:\n            \"\"\"Request to get *amount* of matter out of the container.\"\"\"\n            return ContainerGet(self, amount)\n\n    else:\n        put = BoundClass(ContainerPut)\n        get = BoundClass(ContainerGet)\n\n    def _do_put(self, event: ContainerPut) -> Optional[bool]:\n        if self._capacity - self._level >= event.amount:\n            self._level += event.amount\n            event.succeed()\n            return True\n        else:\n            return None\n\n    def _do_get(self, event: ContainerGet) -> Optional[bool]:\n        if self._level >= event.amount:\n            self._level -= event.amount\n            event.succeed()\n            return True\n        else:\n            return None\n","simpy/resources/resource.py":"\"\"\"\nShared resources supporting priorities and preemption.\n\nThese resources can be used to limit the number of processes using them\nconcurrently. A process needs to *request* the usage right to a resource. Once\nthe usage right is not needed any more it has to be *released*. A gas station\ncan be modelled as a resource with a limited amount of fuel-pumps. Vehicles\narrive at the gas station and request to use a fuel-pump. If all fuel-pumps are\nin use, the vehicle needs to wait until one of the users has finished refueling\nand releases its fuel-pump.\n\nThese resources can be used by a limited number of processes at a time.\nProcesses *request* these resources to become a user and have to *release* them\nonce they are done. For example, a gas station with a limited number of fuel\npumps can be modeled with a `Resource`. Arriving vehicles request a fuel-pump.\nOnce one is available they refuel. When they are done, the release the\nfuel-pump and leave the gas station.\n\nRequesting a resource is modelled as \"putting a process' token into the\nresources\" and releasing a resources correspondingly as \"getting a process'\ntoken out of the resource\". Thus, calling ``request()``/``release()`` is\nequivalent to calling ``put()``/``get()``. Note, that releasing a resource will\nalways succeed immediately, no matter if a process is actually using a resource\nor not.\n\nBesides :class:`Resource`, there is a :class:`PriorityResource`, where\nprocesses can define a request priority, and a :class:`PreemptiveResource`\nwhose resource users can be preempted by requests with a higher priority.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import TYPE_CHECKING, Any, List, Optional, Type\n\nfrom simpy.core import BoundClass, Environment, SimTime\nfrom simpy.resources import base\n\nif TYPE_CHECKING:\n    from types import TracebackType\n\n    from simpy.events import Process\n\n\nclass Preempted:\n    \"\"\"Cause of a preemption :class:`~simpy.exceptions.Interrupt` containing\n    information about the preemption.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        by: Optional[Process],\n        usage_since: Optional[SimTime],\n        resource: Resource,\n    ):\n        self.by = by\n        \"\"\"The preempting :class:`simpy.events.Process`.\"\"\"\n        self.usage_since = usage_since\n        \"\"\"The simulation time at which the preempted process started to use\n        the resource.\"\"\"\n        self.resource = resource\n        \"\"\"The resource which was lost, i.e., caused the preemption.\"\"\"\n\n\nclass Request(base.Put):\n    \"\"\"Request usage of the *resource*. The event is triggered once access is\n    granted. Subclass of :class:`simpy.resources.base.Put`.\n\n    If the maximum capacity of users has not yet been reached, the request is\n    triggered immediately. If the maximum capacity has been\n    reached, the request is triggered once an earlier usage request on the\n    resource is released.\n\n    The request is automatically released when the request was created within\n    a :keyword:`with` statement.\n\n    \"\"\"\n\n    resource: Resource\n\n    #: The time at which the request succeeded.\n    usage_since: Optional[SimTime] = None\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_value: Optional[BaseException],\n        traceback: Optional[TracebackType],\n    ) -> Optional[bool]:\n        super().__exit__(exc_type, exc_value, traceback)\n        # Don't release the resource on generator cleanups. This seems to\n        # create un-claimable circular references otherwise.\n        if exc_type is not GeneratorExit:\n            self.resource.release(self)\n        return None\n\n\nclass Release(base.Get):\n    \"\"\"Releases the usage of *resource* granted by *request*. This event is\n    triggered immediately. Subclass of :class:`simpy.resources.base.Get`.\n\n    \"\"\"\n\n    def __init__(self, resource: Resource, request: Request):\n        self.request = request\n        \"\"\"The request (:class:`Request`) that is to be released.\"\"\"\n        super().__init__(resource)\n\n\nclass PriorityRequest(Request):\n    \"\"\"Request the usage of *resource* with a given *priority*. If the\n    *resource* supports preemption and *preempt* is ``True`` other usage\n    requests of the *resource* may be preempted (see\n    :class:`PreemptiveResource` for details).\n\n    This event type inherits :class:`Request` and adds some additional\n    attributes needed by :class:`PriorityResource` and\n    :class:`PreemptiveResource`\n\n    \"\"\"\n\n    def __init__(self, resource: Resource, priority: int = 0, preempt: bool = True):\n        self.priority = priority\n        \"\"\"The priority of this request. A smaller number means higher\n        priority.\"\"\"\n\n        self.preempt = preempt\n        \"\"\"Indicates whether the request should preempt a resource user or not\n        (:class:`PriorityResource` ignores this flag).\"\"\"\n\n        self.time = resource._env.now\n        \"\"\"The time at which the request was made.\"\"\"\n\n        self.key = (self.priority, self.time, not self.preempt)\n        \"\"\"Key for sorting events. Consists of the priority (lower value is\n        more important), the time at which the request was made (earlier\n        requests are more important) and finally the preemption flag (preempt\n        requests are more important).\"\"\"\n\n        super().__init__(resource)\n\n\nclass SortedQueue(list):\n    \"\"\"Queue for sorting events by their :attr:`~PriorityRequest.key`\n    attribute.\n\n    \"\"\"\n\n    def __init__(self, maxlen: Optional[int] = None):\n        super().__init__()\n        self.maxlen = maxlen\n        \"\"\"Maximum length of the queue.\"\"\"\n\n    def append(self, item: Any) -> None:\n        \"\"\"Sort *item* into the queue.\n\n        Raise a :exc:`RuntimeError` if the queue is full.\n\n        \"\"\"\n        if self.maxlen is not None and len(self) >= self.maxlen:\n            raise RuntimeError('Cannot append event. Queue is full.')\n\n        super().append(item)\n        super().sort(key=lambda e: e.key)\n\n\nclass Resource(base.BaseResource):\n    \"\"\"Resource with *capacity* of usage slots that can be requested by\n    processes.\n\n    If all slots are taken, requests are enqueued. Once a usage request is\n    released, a pending request will be triggered.\n\n    The *env* parameter is the :class:`~simpy.core.Environment` instance the\n    resource is bound to.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, capacity: int = 1):\n        if capacity \u003c= 0:\n            raise ValueError('\"capacity\" must be > 0.')\n\n        super().__init__(env, capacity)\n\n        self.users: List[Request] = []\n        \"\"\"List of :class:`Request` events for the processes that are currently\n        using the resource.\"\"\"\n        self.queue = self.put_queue\n        \"\"\"Queue of pending :class:`Request` events. Alias of\n        :attr:`~simpy.resources.base.BaseResource.put_queue`.\n        \"\"\"\n\n    @property\n    def count(self) -> int:\n        \"\"\"Number of users currently using the resource.\"\"\"\n        return len(self.users)\n\n    if TYPE_CHECKING:\n\n        def request(self) -> Request:\n            \"\"\"Request a usage slot.\"\"\"\n            return Request(self)\n\n        def release(self, request: Request) -> Release:\n            \"\"\"Release a usage slot.\"\"\"\n            return Release(self, request)\n\n    else:\n        request = BoundClass(Request)\n        release = BoundClass(Release)\n\n    def _do_put(self, event: Request) -> None:\n        if len(self.users) \u003c self.capacity:\n            self.users.append(event)\n            event.usage_since = self._env.now\n            event.succeed()\n\n    def _do_get(self, event: Release) -> None:\n        try:\n            self.users.remove(event.request)  # type: ignore\n        except ValueError:\n            pass\n        event.succeed()\n\n\nclass PriorityResource(Resource):\n    \"\"\"A :class:`~simpy.resources.resource.Resource` supporting prioritized\n    requests.\n\n    Pending requests in the :attr:`~Resource.queue` are sorted in ascending\n    order by their *priority* (that means lower values are more important).\n\n    \"\"\"\n\n    PutQueue = SortedQueue\n    \"\"\"Type of the put queue. See\n    :attr:`~simpy.resources.base.BaseResource.put_queue` for details.\"\"\"\n\n    GetQueue = list\n    \"\"\"Type of the get queue. See\n    :attr:`~simpy.resources.base.BaseResource.get_queue` for details.\"\"\"\n\n    def __init__(self, env: Environment, capacity: int = 1):\n        super().__init__(env, capacity)\n\n    if TYPE_CHECKING:\n\n        def request(self, priority: int = 0, preempt: bool = True) -> PriorityRequest:\n            \"\"\"Request a usage slot with the given *priority*.\"\"\"\n            return PriorityRequest(self, priority, preempt)\n\n        def release(  # type: ignore[override]\n            self, request: PriorityRequest\n        ) -> Release:\n            \"\"\"Release a usage slot.\"\"\"\n            return Release(self, request)\n\n    else:\n        request = BoundClass(PriorityRequest)\n        release = BoundClass(Release)\n\n\nclass PreemptiveResource(PriorityResource):\n    \"\"\"A :class:`~simpy.resources.resource.PriorityResource` with preemption.\n\n    If a request is preempted, the process of that request will receive an\n    :class:`~simpy.exceptions.Interrupt` with a :class:`Preempted` instance as\n    cause.\n\n    \"\"\"\n\n    users: List[PriorityRequest]  # type: ignore\n\n    def _do_put(  # type: ignore[override]\n        self, event: PriorityRequest\n    ) -> None:\n        if len(self.users) >= self.capacity and event.preempt:\n            # Check if we can preempt another process\n            preempt = max(self.users, key=lambda e: e.key)\n            if preempt.key > event.key:\n                self.users.remove(preempt)\n                preempt.proc.interrupt(  # type: ignore\n                    Preempted(\n                        by=event.proc,\n                        usage_since=preempt.usage_since,\n                        resource=self,\n                    )\n                )\n\n        return super()._do_put(event)\n","simpy/resources/store.py":"\"\"\"\nShared resources for storing a possibly unlimited amount of objects supporting\nrequests for specific objects.\n\nThe :class:`Store` operates in a FIFO (first-in, first-out) order. Objects are\nretrieved from the store in the order they were put in. The *get* requests of a\n:class:`FilterStore` can be customized by a filter to only retrieve objects\nmatching a given criterion.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom heapq import heappop, heappush\nfrom typing import (\n    TYPE_CHECKING,\n    Any,\n    Callable,\n    List,\n    NamedTuple,\n    Optional,\n    Union,\n)\n\nfrom simpy.core import BoundClass, Environment\nfrom simpy.resources import base\n\n\nclass StorePut(base.Put):\n    \"\"\"Request to put *item* into the *store*. The request is triggered once\n    there is space for the item in the store.\n\n    \"\"\"\n\n    def __init__(self, store: Store, item: Any):\n        self.item = item\n        \"\"\"The item to put into the store.\"\"\"\n        super().__init__(store)\n\n\nclass StoreGet(base.Get):\n    \"\"\"Request to get an *item* from the *store*. The request is triggered\n    once there is an item available in the store.\n\n    \"\"\"\n\n\nclass FilterStoreGet(StoreGet):\n    \"\"\"Request to get an *item* from the *store* matching the *filter*. The\n    request is triggered once there is such an item available in the store.\n\n    *filter* is a function receiving one item. It should return ``True`` for\n    items matching the filter criterion. The default function returns ``True``\n    for all items, which makes the request to behave exactly like\n    :class:`StoreGet`.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        resource: FilterStore,\n        filter: Callable[[Any], bool] = lambda item: True,\n    ):\n        self.filter = filter\n        \"\"\"The filter function to filter items in the store.\"\"\"\n        super().__init__(resource)\n\n\nclass Store(base.BaseResource):\n    \"\"\"Resource with *capacity* slots for storing arbitrary objects. By\n    default, the *capacity* is unlimited and objects are put and retrieved from\n    the store in a first-in first-out order.\n\n    The *env* parameter is the :class:`~simpy.core.Environment` instance the\n    container is bound to.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, capacity: Union[float, int] = float('inf')):\n        if capacity \u003c= 0:\n            raise ValueError('\"capacity\" must be > 0.')\n\n        super().__init__(env, capacity)\n\n        self.items: List[Any] = []\n        \"\"\"List of the items available in the store.\"\"\"\n\n    if TYPE_CHECKING:\n\n        def put(  # type: ignore[override]\n            self, item: Any\n        ) -> StorePut:\n            \"\"\"Request to put *item* into the store.\"\"\"\n            return StorePut(self, item)\n\n        def get(self) -> StoreGet:  # type: ignore[override]\n            \"\"\"Request to get an *item* out of the store.\"\"\"\n            return StoreGet(self)\n\n    else:\n        put = BoundClass(StorePut)\n        get = BoundClass(StoreGet)\n\n    def _do_put(self, event: StorePut) -> Optional[bool]:\n        if len(self.items) \u003c self._capacity:\n            self.items.append(event.item)\n            event.succeed()\n        return None\n\n    def _do_get(self, event: StoreGet) -> Optional[bool]:\n        if self.items:\n            event.succeed(self.items.pop(0))\n        return None\n\n\nclass PriorityItem(NamedTuple):\n    \"\"\"Wrap an arbitrary *item* with an order-able *priority*.\n\n    Pairs a *priority* with an arbitrary *item*. Comparisons of *PriorityItem*\n    instances only consider the *priority* attribute, thus supporting use of\n    unorderable items in a :class:`PriorityStore` instance.\n\n    \"\"\"\n\n    #: Priority of the item.\n    priority: Any\n\n    #: The item to be stored.\n    item: Any\n\n    def __lt__(  # type: ignore[override]\n        self, other: PriorityItem\n    ) -> bool:\n        return self.priority \u003c other.priority\n\n\nclass PriorityStore(Store):\n    \"\"\"Resource with *capacity* slots for storing objects in priority order.\n\n    Unlike :class:`Store` which provides first-in first-out discipline,\n    :class:`PriorityStore` maintains items in sorted order such that\n    the smallest items value are retrieved first from the store.\n\n    All items in a *PriorityStore* instance must be order-able; which is to say\n    that items must implement :meth:`~object.__lt__()`. To use unorderable\n    items with *PriorityStore*, use :class:`PriorityItem`.\n\n    \"\"\"\n\n    def _do_put(self, event: StorePut) -> Optional[bool]:\n        if len(self.items) \u003c self._capacity:\n            heappush(self.items, event.item)\n            event.succeed()\n        return None\n\n    def _do_get(self, event: StoreGet) -> Optional[bool]:\n        if self.items:\n            event.succeed(heappop(self.items))\n        return None\n\n\nclass FilterStore(Store):\n    \"\"\"Resource with *capacity* slots for storing arbitrary objects supporting\n    filtered get requests. Like the :class:`Store`, the *capacity* is unlimited\n    by default and objects are put and retrieved from the store in a first-in\n    first-out order.\n\n    Get requests can be customized with a filter function to only trigger for\n    items for which said filter function returns ``True``.\n\n    .. note::\n\n        In contrast to :class:`Store`, get requests of a :class:`FilterStore`\n        won't necessarily be triggered in the same order they were issued.\n\n        *Example:* The store is empty. *Process 1* tries to get an item of type\n        *a*, *Process 2* an item of type *b*. Another process puts one item of\n        type *b* into the store. Though *Process 2* made his request after\n        *Process 1*, it will receive that new item because *Process 1* doesn't\n        want it.\n\n    \"\"\"\n\n    if TYPE_CHECKING:\n\n        def get(\n            self, filter: Callable[[Any], bool] = lambda item: True\n        ) -> FilterStoreGet:\n            \"\"\"Request to get an *item*, for which *filter* returns ``True``,\n            out of the store.\"\"\"\n            return FilterStoreGet(self, filter)\n\n    else:\n        get = BoundClass(FilterStoreGet)\n\n    def _do_get(  # type: ignore[override]\n        self, event: FilterStoreGet\n    ) -> Optional[bool]:\n        for item in self.items:\n            if event.filter(item):\n                self.items.remove(item)\n                event.succeed(item)\n                break\n        return True\n","simpy-4.1.2.dist-info/licenses/LICENSE.rst":"The MIT License (MIT)\n\nCopyright (c) 2013 Ontje Lünsdorf and Stefan Scherfke (also see AUTHORS.txt)\n\nPermission is hereby granted, free of charge, to any person obtaining a copy of\nthis software and associated documentation files (the \"Software\"), to deal in\nthe Software without restriction, including without limitation the rights to\nuse, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of\nthe Software, and to permit persons to whom the Software is furnished to do so,\nsubject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS\nFOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR\nCOPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER\nIN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN\nCONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.\n","simpy-4.1.2.dist-info/METADATA":"Metadata-Version: 2.4\nName: simpy\nVersion: 4.1.2\nSummary: Event discrete, process based simulation for Python.\nAuthor-email: Ontje Lünsdorf \u003cthe_com@gmx.de>, Stefan Scherfke \u003cstefan@sofa-rockers.org>\nLicense: MIT\nProject-URL: Homepage, \nProject-URL: Documentation, \nProject-URL: Source code, \nClassifier: Development Status :: 5 - Production/Stable\nClassifier: Environment :: Console\nClassifier: Intended Audience :: Developers\nClassifier: Intended Audience :: Education\nClassifier: Intended Audience :: Science/Research\nClassifier: License :: OSI Approved :: MIT License\nClassifier: Natural Language :: English\nClassifier: Operating System :: OS Independent\nClassifier: Programming Language :: Python\nClassifier: Programming Language :: Python :: 3\nClassifier: Programming Language :: Python :: 3.8\nClassifier: Programming Language :: Python :: 3.9\nClassifier: Programming Language :: Python :: 3.10\nClassifier: Programming Language :: Python :: 3.11\nClassifier: Programming Language :: Python :: 3.12\nClassifier: Programming Language :: Python :: 3.13\nClassifier: Programming Language :: Python :: 3.14\nClassifier: Programming Language :: Python :: Implementation :: CPython\nClassifier: Programming Language :: Python :: Implementation :: PyPy\nClassifier: Topic :: Scientific/Engineering\nRequires-Python: >=3.8\nDescription-Content-Type: text/x-rst\nLicense-File: LICENSE.rst\nDynamic: license-file\n\nSimPy\n=====\n\nSimPy is a process-based discrete-event simulation framework based on standard\nPython. Processes in SimPy are defined by Python `generator`__ functions and\ncan, for example, be used to model active components like customers, vehicles or\nagents.  SimPy also provides various types of shared resources to model\nlimited capacity congestion points (like servers, checkout counters and\ntunnels).\n\nSimulations can be performed “as fast as possible”, in real time (wall clock\ntime) or by manually stepping through the events.\n\nThough it is theoretically possible to do continuous simulations with SimPy, it\nhas no features that help you with that. Also, SimPy is not really required for\nsimulations with a fixed step size and where your processes don’t interact with\neach other or with shared resources.\n\nThe `documentation`__ contains a `tutorial`__, `several guides`__ explaining key\nconcepts, a number of `examples`__ and the `API reference`__.\n\nSimPy is released under the MIT License. Simulation model developers are\nencouraged to share their SimPy modeling techniques with the SimPy community.\nPlease post a message to the `SimPy mailing list`__.\n\nThere is an introductory talk that explains SimPy’s concepts and provides some\nexamples: `watch the video`__ or `get the slides`__.\n\n__ \n__ \n__ \n__ \n__ \n__ \n__ \n__ \n__ \n\n\nA Simple Example\n----------------\n\nOne of SimPy's main goals is to be easy to use. Here is an example for a simple\nSimPy simulation: a *clock* process that prints the current simulation time at\neach step:\n\n.. code-block:: python\n\n    >>> import simpy\n    >>>\n    >>> def clock(env, name, tick):\n    ...     while True:\n    ...         print(name, env.now)\n    ...         yield env.timeout(tick)\n    ...\n    >>> env = simpy.Environment()\n    >>> env.process(clock(env, 'fast', 0.5))\n    \u003cProcess(clock) object at 0x...>\n    >>> env.process(clock(env, 'slow', 1))\n    \u003cProcess(clock) object at 0x...>\n    >>> env.run(until=2)\n    fast 0\n    slow 0\n    fast 0.5\n    slow 1\n    fast 1.0\n    fast 1.5\n\n\nInstallation\n------------\n\nSimPy requires Python >= 3.8, both CPython and PyPy3 are known to work.\n\nYou can install SimPy easily via `pip \u003c>`_:\n\n.. code-block:: bash\n\n    $ python -m pip install simpy\n\nYou can also download and install SimPy manually:\n\n.. code-block:: bash\n\n    $ cd where/you/put/simpy/\n    $ python -m build\n    $ python -m pip install dist/simpy-*.whl\n\nTo run SimPy’s test suite on your installation, execute:\n\n.. code-block:: bash\n\n    $ python -m tox\n\n\nGetting started\n---------------\n\nIf you’ve never used SimPy before, the `SimPy tutorial`__ is a good starting\npoint for you. You can also try out some of the `Examples`__ shipped with\nSimPy.\n\n__ \n__ \n\n\nDocumentation and Help\n----------------------\n\nYou can find `a tutorial`__, `examples`__, `topical guides`__ and an `API\nreference`__, as well as some information about `SimPy and its history`__ in\nour `online documentation`__. For more help, contact the `SimPy mailing\nlist`__. SimPy users are pretty helpful. You can, of course, also dig through\nthe `source code`__.\n\nIf you find any bugs, please post them on our `issue tracker`__.\n\n__ \n__ \n__ \n__ \n__ \n__ \n__ mailto:python-simpy@googlegroups.com\n__ \n__ \n\nEnjoy simulation programming in SimPy!\n\n\nPorts and comparable libraries\n------------------------------\n\nRe-implementations of SimPy and libraries similar to SimPy are available in the\nfollowing languages:\n\n- C#: `SimSharp \u003c>`_ (written by Andreas Beham)\n- Julia: `ConcurrentSim \u003c>`_\n- R: `Simmer \u003c>`_\n","simpy-4.1.2.dist-info/WHEEL":"Wheel-Version: 1.0\nGenerator: setuptools (82.0.1)\nRoot-Is-Purelib: true\nTag: py3-none-any\n\n","simpy-4.1.2.dist-info/top_level.txt":"simpy\n","simpy-4.1.2.dist-info/RECORD":"simpy/__init__.py,sha256=W7azKczvkGVvQ2ITOn2DRuGbLEYBbMD_CmtvT2D_OqI,2601\nsimpy/core.py,sha256=Bavd9G3KVoWYAG_UJyf5tJE7R6ivtZNZ-ZmHiij79Dc,8709\nsimpy/events.py,sha256=tYqO5d9oPP0M_Ar6Cl4-eNsWytDKAWlLaTzGkUACtXA,23146\nsimpy/exceptions.py,sha256=gZAzu5DaXp7q5Dx9k2yA1FwCERv8473q0iOYEbwZ6_k,885\nsimpy/py.typed,sha256=47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU,0\nsimpy/rt.py,sha256=Af6hGuIX107VFYM5TUsMp_VzghUMv6geVIe1I-wX8ic,3008\nsimpy/util.py,sha256=0huNIKE0PDmII1TKNTNpp6UQgvEK2M14_GOHQCI5Dbw,2038\nsimpy/resources/__init__.py,sha256=hTdtIY-FKnZkJ9EHQ3mqebdru_p0bUlvi9_2YhwlQlU,390\nsimpy/resources/base.py,sha256=kV5rZuJuVz_dd0Codu6uIkKE4JrUPVvs5n7seAksIrA,9730\nsimpy/resources/container.py,sha256=mJQX7b06vRAvPZlG-1tUTLjcXYEg32lo8bQiRZYcaHY,3884\nsimpy/resources/resource.py,sha256=eAvNR0klrHTqPgHGgKBfIccjLEO5qXPhxlUOXSDUGk8,9856\nsimpy/resources/store.py,sha256=D3s_TqtxWzZQkSFcHGZNIeCLO3z584rJfs1ATQ-_9IE,6277\nsimpy-4.1.2.dist-info/licenses/LICENSE.rst,sha256=XwmnvfCPI5JxsV3xy-K6f2Jkn4tJeYgnRib0hji4SAI,1125\nsimpy-4.1.2.dist-info/METADATA,sha256=mxDoA1ANVUhRsxcNsJ41syt3OnytY8SUkf0Y_cYQGbY,6199\nsimpy-4.1.2.dist-info/WHEEL,sha256=aeYiig01lYGDzBgS8HxWXOg3uV61G9ijOsup-k9o1sk,91\nsimpy-4.1.2.dist-info/top_level.txt,sha256=vdS1DpN8n_e_HAhQUBG9Kuoa1u2-37OCb1YP0JyJ6kE,6\nsimpy-4.1.2.dist-info/RECORD,,\n","st_des_engine.py":"#!/usr/bin/env python3\n\"\"\"ST experimental discrete-event engine, Python 3.10+, standard library only.\n\nModel: serial single-item processors, finite FIFO delay/accumulation conveyors,\nblocking after service, preempt/resume downtime, linear ramps and machine microstops. This is NOT a spatial conveyor\nor sensor model and NOT an interchangeable implementation of ST's fluid engine.\nSee README.md for supported physics, adapter restrictions and comparison rules.\nPublic API: simulate_line(payload), returning {ok, result} or {ok, error}.\nCLI: python st_des_engine.py input.json --output result.json --rounds 1\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nfrom collections import deque\nfrom copy import deepcopy\nfrom dataclasses import dataclass, field\nimport hashlib\nimport heapq\nimport json\nimport math\nfrom pathlib import Path\nimport statistics\nimport sys\nimport time\n\nVERSION = \"0.2.0-experimental\"\nSCHEMA = \"st-des/1\"\nEPS = 1e-10\nSTATES = (\"RUNNING\", \"STARVED\", \"BLOCKED\", \"FAILED\", \"PAUSED\", \"STOPPED\", \"STARTING\", \"MICRO_STOP\")\nACTIONS = (\"RUN\", \"AUTO\", \"MANUAL\", \"PAUSE\", \"STOP\", \"EMERGENCY_STOP\", \"RESET\")\n\n\nclass InputError(ValueError):\n    pass\n\n\ndef number(value, path, minimum=0, positive=False):\n    if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):\n        raise InputError(f\"{path}: finite number required\")\n    if value \u003c minimum or (positive and value \u003c= minimum):\n        raise InputError(f\"{path}: must be {'greater than' if positive else 'at least'} {minimum}\")\n    return float(value)\n\n\ndef integer(value, path, minimum=0):\n    number(value, path, minimum)\n    if int(value) != value:\n        raise InputError(f\"{path}: integer required\")\n    return int(value)\n\n\ndef keys(obj, allowed, path):\n    if not isinstance(obj, dict):\n        raise InputError(f\"{path}: object required\")\n    extra = set(obj) - set(allowed)\n    if extra:\n        raise InputError(f\"{path}: unsupported fields {sorted(extra)}\")\n\n\ndef validate(payload):\n    keys(payload, (\"schema\", \"caseId\", \"unitOfFlow\", \"machines\", \"conveyors\", \"run\", \"metadata\"), \"input\")\n    if payload.get(\"schema\") != SCHEMA:\n        raise InputError(\"schema: use st-des/1; native ST JSON needs export_st_to_des.mjs\")\n    machines, conveyors, run = payload.get(\"machines\"), payload.get(\"conveyors\"), payload.get(\"run\")\n    if not isinstance(machines, list) or len(machines) \u003c 2:\n        raise InputError(\"machines: at least two serial processors required\")\n    if not isinstance(conveyors, list) or len(conveyors) != len(machines) - 1:\n        raise InputError(\"conveyors: one between each pair of processors required\")\n    keys(run, (\"durationSeconds\", \"seed\", \"sampleEverySeconds\", \"eventLogLimit\", \"maxEvents\", \"commands\", \"shiftSeconds\"), \"run\")\n    if \"shiftSeconds\" in run:\n        number(run[\"shiftSeconds\"], \"run.shiftSeconds\", positive=True)\n    duration = number(run.get(\"durationSeconds\"), \"run.durationSeconds\", positive=True)\n    seed = run.get(\"seed\", 1)\n    if isinstance(seed, bool) or not isinstance(seed, int):\n        raise InputError(\"run.seed: integer required\")\n    sample = number(run.get(\"sampleEverySeconds\", 5), \"run.sampleEverySeconds\", positive=True)\n    if math.ceil(duration / sample) + (math.ceil(duration / run[\"shiftSeconds\"]) if \"shiftSeconds\" in run else 0) + 1 > 10000:\n        raise InputError(\"run.sampleEverySeconds: at most 10,000 sample frames supported\")\n    integer(run.get(\"eventLogLimit\", 1000), \"run.eventLogLimit\")\n    integer(run.get(\"maxEvents\", 2000000), \"run.maxEvents\", 1)\n    ids = set()\n    for i, model in enumerate(machines):\n        p = f\"machines[{i}]\"\n        keys(model, (\"id\", \"name\", \"rateBpm\", \"critical\", \"initialMode\", \"startupSeconds\", \"rampUpSeconds\", \"microStop\", \"reliability\", \"failures\"), p)\n        uid = model.get(\"id\")\n        if not isinstance(uid, str) or not uid or uid in ids:\n            raise InputError(f\"{p}.id: unique nonempty string required\")\n        ids.add(uid)\n        number(model.get(\"rateBpm\"), p + \".rateBpm\", positive=True)\n        if model.get(\"initialMode\", \"AUTO\") not in (\"AUTO\", \"MANUAL\", \"PAUSE\", \"STOP\"):\n            raise InputError(p + \".initialMode: unsupported\")\n        number(model.get(\"startupSeconds\", 0), p + \".startupSeconds\")\n        number(model.get(\"rampUpSeconds\", 0), p + \".rampUpSeconds\")\n        micro = model.get(\"microStop\")\n        if micro is not None:\n            keys(micro, (\"probabilityPerMinute\", \"minDurationSeconds\", \"maxDurationSeconds\"), p + \".microStop\")\n            number(micro.get(\"probabilityPerMinute\", 0), p + \".microStop.probabilityPerMinute\")\n            low = number(micro.get(\"minDurationSeconds\", 0), p + \".microStop.minDurationSeconds\")\n            high = number(micro.get(\"maxDurationSeconds\", low), p + \".microStop.maxDurationSeconds\")\n            if high \u003c low:\n                raise InputError(p + \".microStop: maximum duration must be at least minimum\")\n        rel = model.get(\"reliability\")\n        if rel is not None:\n            keys(rel, (\"mtbfMinutes\", \"mttrMinutes\"), p + \".reliability\")\n            number(rel.get(\"mtbfMinutes\"), p + \".mtbfMinutes\", positive=True)\n            number(rel.get(\"mttrMinutes\"), p + \".mttrMinutes\", positive=True)\n        windows = model.get(\"failures\", [])\n        if not isinstance(windows, list):\n            raise InputError(p + \".failures: array required\")\n        if rel and windows:\n            raise InputError(p + \": use stochastic reliability OR explicit failure calendar\")\n        end = -1.0\n        for failure in sorted(windows, key=lambda f: f.get(\"atSecond\", -1) if isinstance(f, dict) else -1):\n            keys(failure, (\"atSecond\", \"durationSeconds\"), p + \".failures[]\")\n            start = number(failure.get(\"atSecond\"), p + \".failures[].atSecond\")\n            length = number(failure.get(\"durationSeconds\"), p + \".failures[].durationSeconds\", positive=True)\n            if start \u003c end - EPS:\n                raise InputError(p + \".failures: overlapping intervals unsupported\")\n            end = start + length\n    for i, model in enumerate(conveyors):\n        p = f\"conveyors[{i}]\"\n        keys(model, (\"id\", \"name\", \"lengthMm\", \"speedMmPerSecond\", \"movingPitchMm\", \"accumulatedPitchMm\", \"initialReadyUnits\"), p)\n        uid = model.get(\"id\")\n        if not isinstance(uid, str) or not uid or uid in ids:\n            raise InputError(p + \".id: unique nonempty string required\")\n        ids.add(uid)\n        length = number(model.get(\"lengthMm\"), p + \".lengthMm\", positive=True)\n        number(model.get(\"speedMmPerSecond\"), p + \".speedMmPerSecond\", positive=True)\n        pitch = number(model.get(\"movingPitchMm\"), p + \".movingPitchMm\", positive=True)\n        packed = number(model.get(\"accumulatedPitchMm\", pitch), p + \".accumulatedPitchMm\", positive=True)\n        if packed > pitch + EPS or length \u003c pitch:\n            raise InputError(p + \": require accumulated pitch \u003c= moving pitch \u003c= length\")\n        initial = integer(model.get(\"initialReadyUnits\", 0), p + \".initialReadyUnits\")\n        if initial > math.floor(length / packed + EPS):\n            raise InputError(p + \": initial inventory exceeds packed capacity\")\n    commands = run.get(\"commands\", [])\n    if not isinstance(commands, list):\n        raise InputError(\"run.commands: array required\")\n    machine_ids = {m[\"id\"] for m in machines}\n    for command in commands:\n        keys(command, (\"atSecond\", \"equipmentId\", \"action\"), \"run.commands[]\")\n        number(command.get(\"atSecond\"), \"run.commands[].atSecond\")\n        if command.get(\"equipmentId\") not in machine_ids or command.get(\"action\") not in ACTIONS:\n            raise InputError(\"run.commands[]: supported action and machine id required; belt stops are not supported\")\n    critical = [m for m in machines if m.get(\"critical\")]\n    if len(critical) > 1:\n        raise InputError(\"machines: at most one critical processor supported for reference capacity\")\n\n\nclass RandomStream:\n    \"\"\"Mulberry32 arithmetic, independent seed derived from stable equipment id.\n    Same numeric seed alone does not pair schedules with ST's shared RNG stream.\n    \"\"\"\n    def __init__(self, seed, uid):\n        digest = hashlib.sha256(f\"{seed}:{uid}\".encode()).digest()\n        self.state = int.from_bytes(digest[:4], \"little\")\n\n    def uniform(self):\n        self.state = (self.state + 0x6D2B79F5) & 0xFFFFFFFF\n        value = ((self.state ^ (self.state >> 15)) * (self.state | 1)) & 0xFFFFFFFF\n        value ^= (value + (((value ^ (value >> 7)) * (value | 61)) & 0xFFFFFFFF)) & 0xFFFFFFFF\n        return ((value ^ (value >> 14)) & 0xFFFFFFFF) / 4294967296\n\n    def exponential(self, mean):\n        return -math.log1p(-max(self.uniform(), 1e-12)) * mean\n\n\n@dataclass\nclass Machine:\n    model: dict\n    index: int\n    rng: RandomStream\n    mode: str = \"AUTO\"\n    emergency: bool = False\n    failed: bool = False\n    busy: bool = False\n    completed: bool = False\n    item: int | None = None\n    remaining: float = 0\n    finish_at: float | None = None\n    service_started_at: float | None = None\n    process_token: int = 0\n    failure_token: int = 0\n    failure_due: float | None = None\n    failure_remaining: float | None = None\n    startup_until: float = 0\n    state: str = \"STARVED\"\n    state_seconds: dict = field(default_factory=lambda: {state: 0.0 for state in STATES})\n    output: int = 0\n    processed: int = 0\n    failure_count: int = 0\n    micro_stopped: bool = False\n    micro_started_at: float = 0\n    micro_profile_origin: float = 0\n    micro_token: int = 0\n    micro_due: float | None = None\n    micro_remaining: float | None = None\n    micro_count: int = 0\n\n    @property\n    def enabled(self):\n        return self.mode in (\"AUTO\", \"MANUAL\") and not self.emergency\n\n    @property\n    def rate(self):\n        return self.model[\"rateBpm\"] / 60\n\n\n@dataclass\nclass Conveyor:\n    model: dict\n    index: int\n    ready: deque = field(default_factory=deque)\n    moving: dict = field(default_factory=dict)\n    next_entry: float = 0\n    next_exit: float = 0\n    integral: float = 0\n    maximum: int = 0\n    admitted: int = 0\n    released: int = 0\n\n    @property\n    def inventory(self):\n        return len(self.ready) + len(self.moving)\n\n    @property\n    def capacity(self):\n        return math.floor(self.model[\"lengthMm\"] / self.model.get(\"accumulatedPitchMm\", self.model[\"movingPitchMm\"]) + EPS)\n\n    @property\n    def travel(self):\n        return self.model[\"lengthMm\"] / self.model[\"speedMmPerSecond\"]\n\n    @property\n    def entry_headway(self):\n        return self.model[\"movingPitchMm\"] / self.model[\"speedMmPerSecond\"]\n\n    @property\n    def exit_headway(self):\n        return self.model.get(\"accumulatedPitchMm\", self.model[\"movingPitchMm\"]) / self.model[\"speedMmPerSecond\"]\n\n\nclass Simulation:\n    def __init__(self, payload):\n        self.payload = payload\n        self.run = payload[\"run\"]\n        self.duration = self.run[\"durationSeconds\"]\n        self.now = 0.0\n        self.queue = []\n        self.sequence = 0\n        self.executed = 0\n        self.event_counts = {}\n        self.events = []\n        self.omitted_events = 0\n        self.samples = []\n        self.output = 0\n        self.source_started = 0\n        self.initial_inventory = 0\n        self.item_sequence = 0\n        self.wakes = set()\n        self.machines = [Machine(m, i, RandomStream(self.run.get(\"seed\", 1), m[\"id\"]), mode=m.get(\"initialMode\", \"AUTO\")) for i, m in enumerate(payload[\"machines\"])]\n        self.micro_rng = {m.index: RandomStream(self.run.get(\"seed\", 1), m.model[\"id\"] + \":microstop\") for m in self.machines}\n        self.conveyors = [Conveyor(c, i) for i, c in enumerate(payload[\"conveyors\"])]\n        for belt in self.conveyors:\n            for _ in range(belt.model.get(\"initialReadyUnits\", 0)):\n                belt.ready.append(self.new_item())\n                self.initial_inventory += 1\n            belt.maximum = belt.inventory\n        for machine in self.machines:\n            if machine.enabled:\n                machine.startup_until = machine.model.get(\"startupSeconds\", 0)\n                self.wake(machine.startup_until)\n            rel = machine.model.get(\"reliability\")\n            if rel:\n                machine.failure_remaining = machine.rng.exponential(rel[\"mtbfMinutes\"] * 60)\n                self.arm_failure(machine)\n            for window in machine.model.get(\"failures\", []):\n                self.schedule(window[\"atSecond\"], 2, \"FAILURE\", (machine.index, None, window[\"durationSeconds\"]))\n            self.arm_microstop(machine)\n        ids = {m.model[\"id\"]: m.index for m in self.machines}\n        for command in self.run.get(\"commands\", []):\n            self.schedule(command[\"atSecond\"], 0, \"COMMAND\", (ids[command[\"equipmentId\"]], command[\"action\"]))\n        self.schedule(0, 9, \"SAMPLE\", 0)\n\n    def new_item(self):\n        self.item_sequence += 1\n        return self.item_sequence\n\n    def schedule(self, at, priority, kind, data=None):\n        if at \u003c self.now - EPS:\n            raise RuntimeError(\"Attempt to schedule an event in the past\")\n        if at \u003c= self.duration + EPS:\n            self.sequence += 1\n            heapq.heappush(self.queue, (min(float(at), self.duration), priority, self.sequence, kind, data))\n\n    def wake(self, at):\n        if at \u003c= self.now + EPS or at > self.duration + EPS:\n            return\n        if at not in self.wakes:\n            self.wakes.add(at)\n            self.schedule(at, 5, \"WAKE\", at)\n\n    def log(self, kind, uid=None, **details):\n        record = dict(type=kind, atVirtualSecond=self.now, **details)\n        if uid is not None:\n            record[\"equipmentId\"] = uid\n        if len(self.events) \u003c self.run.get(\"eventLogLimit\", 1000):\n            self.events.append(record)\n        else:\n            self.omitted_events += 1\n\n    def arm_failure(self, machine):\n        if not machine.enabled or machine.failed or machine.failure_remaining is None:\n            return\n        machine.failure_token += 1\n        machine.failure_due = self.now + machine.failure_remaining\n        rel = machine.model[\"reliability\"]\n        self.schedule(machine.failure_due, 2, \"FAILURE\", (machine.index, machine.failure_token, rel[\"mttrMinutes\"] * 60))\n\n    def suspend_failure(self, machine):\n        if machine.failure_due is not None:\n            machine.failure_remaining = max(0.0, machine.failure_due - self.now)\n            machine.failure_due = None\n            machine.failure_token += 1\n\n    def suspend_service(self, machine):\n        if machine.finish_at is not None:\n            machine.remaining = max(0.0, machine.remaining - self.service_work(machine, machine.service_started_at, self.now))\n            machine.finish_at = None\n            machine.service_started_at = None\n            machine.process_token += 1\n\n    def service_work(self, machine, start, end):\n        ramp = machine.model.get(\"rampUpSeconds\", 0)\n        origin = machine.startup_until\n        def integral(at):\n            elapsed = max(0.0, at - origin)\n            if ramp \u003c= EPS:\n                return machine.rate * elapsed\n            return machine.rate * (elapsed * elapsed / (2 * ramp) if elapsed \u003c ramp else elapsed - ramp / 2)\n        return integral(end) - integral(start)\n\n    def resume_service(self, machine):\n        machine.process_token += 1\n        ramp = machine.model.get(\"rampUpSeconds\", 0)\n        elapsed = max(0.0, self.now - machine.startup_until)\n        work_seconds = machine.remaining / machine.rate\n        if ramp > EPS and elapsed \u003c ramp:\n            available = (ramp * ramp - elapsed * elapsed) / (2 * ramp)\n            delay = math.sqrt(elapsed * elapsed + 2 * ramp * work_seconds) - elapsed if work_seconds \u003c= available else ramp - elapsed + work_seconds - available\n        else:\n            delay = work_seconds\n        machine.service_started_at = self.now\n        machine.finish_at = self.now + delay\n        self.schedule(machine.finish_at, 3, \"COMPLETE\", (machine.index, machine.process_token))\n\n    def suspend_microstop_clock(self, machine):\n        if machine.micro_due is not None:\n            machine.micro_remaining = max(0.0, machine.micro_due - self.now)\n            machine.micro_due = None\n            machine.micro_token += 1\n\n    def arm_microstop(self, machine):\n        profile = machine.model.get(\"microStop\") or {}\n        rate = profile.get(\"probabilityPerMinute\", 0)\n        if rate \u003c= 0 or machine.mode != \"AUTO\" or not machine.enabled or machine.failed or machine.micro_stopped or machine.micro_due is not None:\n            return\n        if machine.micro_remaining is None:\n            machine.micro_remaining = self.micro_rng[machine.index].exponential(60 / rate)\n        machine.micro_token += 1\n        machine.micro_due = self.now + machine.micro_remaining\n        self.schedule(machine.micro_due, 2, \"MICRO_STOP\", (machine.index, machine.micro_token))\n\n    def dispatch(self, kind, data):\n        if kind == \"WAKE\":\n            self.wakes.discard(data)\n        elif kind == \"COMMAND\":\n            index, action = data\n            machine = self.machines[index]\n            was_enabled = machine.enabled\n            if action in (\"RUN\", \"AUTO\", \"MANUAL\"):\n                machine.mode = \"MANUAL\" if action == \"MANUAL\" else \"AUTO\"\n            elif action == \"EMERGENCY_STOP\":\n                machine.emergency = True\n            elif action == \"RESET\":\n                machine.emergency = False  # preserves AUTO/PAUSE/STOP selection\n            else:\n                machine.mode = action\n            if not machine.enabled or machine.mode != \"AUTO\":\n                self.suspend_microstop_clock(machine)\n            else:\n                self.arm_microstop(machine)\n            if was_enabled and not machine.enabled:\n                self.suspend_failure(machine)\n                self.suspend_service(machine)\n            elif not was_enabled and machine.enabled:\n                machine.startup_until = self.now + machine.model.get(\"startupSeconds\", 0)\n                self.wake(machine.startup_until)\n                self.arm_failure(machine)\n            self.log(\"COMMAND\", machine.model[\"id\"], action=action)\n        elif kind == \"FAILURE\":\n            index, token, repair_seconds = data\n            machine = self.machines[index]\n            if token is not None and token != machine.failure_token:\n                return\n            if token is not None and not machine.enabled:\n                return\n            machine.failure_due = None\n            machine.failure_remaining = None\n            machine.failed = True\n            self.suspend_microstop_clock(machine)\n            machine.failure_count += 1\n            self.suspend_service(machine)\n            self.schedule(self.now + repair_seconds, 1, \"REPAIR\", index)\n            self.log(\"FAILURE_STARTED\", machine.model[\"id\"], durationSeconds=repair_seconds)\n        elif kind == \"REPAIR\":\n            machine = self.machines[data]\n            machine.failed = False\n            machine.startup_until = self.now + machine.model.get(\"startupSeconds\", 0)\n            self.wake(machine.startup_until)\n            if machine.model.get(\"reliability\"):\n                machine.failure_remaining = machine.rng.exponential(machine.model[\"reliability\"][\"mtbfMinutes\"] * 60)\n                self.arm_failure(machine)\n            self.log(\"REPAIR_COMPLETED\", machine.model[\"id\"])\n            self.arm_microstop(machine)\n        elif kind == \"MICRO_STOP\":\n            index, token = data\n            machine = self.machines[index]\n            if token != machine.micro_token or machine.failed or not machine.enabled or machine.mode != \"AUTO\":\n                return\n            machine.micro_due = None\n            machine.micro_remaining = None\n            machine.micro_stopped = True\n            machine.micro_started_at = self.now\n            machine.micro_profile_origin = machine.startup_until\n            machine.micro_count += 1\n            self.suspend_service(machine)\n            profile = machine.model[\"microStop\"]\n            low = profile.get(\"minDurationSeconds\", 0)\n            high = profile.get(\"maxDurationSeconds\", low)\n            length = low + (high - low) * self.micro_rng[index].uniform()\n            self.schedule(self.now + length, 1, \"MICRO_STOP_END\", index)\n            self.log(\"MICRO_STOP_STARTED\", machine.model[\"id\"], durationSeconds=length)\n        elif kind == \"MICRO_STOP_END\":\n            machine = self.machines[data]\n            # Freeze the unfinished start profile during a microstop. A repair\n            # or explicit restart already establishes a new profile instead.\n            if not machine.failed and machine.startup_until == machine.micro_profile_origin:\n                machine.startup_until += self.now - machine.micro_started_at\n                self.wake(machine.startup_until)\n            machine.micro_stopped = False\n            self.arm_microstop(machine)\n            self.log(\"MICRO_STOP_COMPLETED\", machine.model[\"id\"])\n        elif kind == \"COMPLETE\":\n            index, token = data\n            machine = self.machines[index]\n            if token != machine.process_token:\n                return\n            machine.busy = False\n            machine.completed = True\n            machine.finish_at = None\n            machine.service_started_at = None\n            machine.remaining = 0\n            machine.processed += 1\n            self.log(\"PROCESS_COMPLETED\", machine.model[\"id\"], itemId=machine.item)\n        elif kind == \"ARRIVAL\":\n            index, item = data\n            belt = self.conveyors[index]\n            del belt.moving[item]\n            belt.ready.append(item)\n        elif kind == \"SAMPLE\":\n            pass  # observe after all physical events and fixed-point transfers\n\n    def settle(self):\n        # Blocking-after-service: completed products occupy their processor until\n        # the receiving conveyor has capacity AND admission headway is satisfied.\n        # Downstream-first fixpoint makes zero-time releases causal and repeatable.\n        for _ in range(2 * len(self.machines) + 2):\n            changed = False\n            for machine in reversed(self.machines):\n                operational = machine.enabled and not machine.failed and not machine.micro_stopped and self.now >= machine.startup_until - EPS\n                if not operational:\n                    continue\n                if machine.completed:\n                    if machine.index == len(self.machines) - 1:\n                        self.output += 1\n                    else:\n                        belt = self.conveyors[machine.index]\n                        if belt.inventory >= belt.capacity:\n                            continue\n                        if self.now \u003c belt.next_entry - EPS:\n                            self.wake(belt.next_entry)\n                            continue\n                        item = machine.item\n                        at = self.now + belt.travel\n                        belt.moving[item] = at\n                        belt.admitted += 1\n                        belt.next_entry = self.now + belt.entry_headway\n                        belt.maximum = max(belt.maximum, belt.inventory)\n                        self.schedule(at, 4, \"ARRIVAL\", (belt.index, item))\n                    machine.output += 1\n                    machine.completed = False\n                    machine.item = None\n                    changed = True\n                if machine.busy:\n                    if machine.finish_at is None:\n                        self.resume_service(machine)\n                        changed = True\n                    continue\n                if machine.item is None and self.now \u003c self.duration - EPS:\n                    if machine.index == 0:\n                        machine.item = self.new_item()\n                        self.source_started += 1\n                    else:\n                        belt = self.conveyors[machine.index - 1]\n                        if not belt.ready:\n                            continue\n                        if self.now \u003c belt.next_exit - EPS:\n                            self.wake(belt.next_exit)\n                            continue\n                        machine.item = belt.ready.popleft()\n                        belt.released += 1\n                        belt.next_exit = self.now + belt.exit_headway\n                    machine.busy = True\n                    machine.remaining = 1.0\n                    self.resume_service(machine)\n                    changed = True\n            if not changed:\n                break\n        else:\n            raise RuntimeError(\"Instantaneous transfer fixed point did not converge\")\n        for machine in self.machines:\n            if machine.failed:\n                state = \"FAILED\"\n            elif not machine.enabled:\n                state = \"PAUSED\" if machine.mode == \"PAUSE\" and not machine.emergency else \"STOPPED\"\n            elif machine.micro_stopped:\n                state = \"MICRO_STOP\"\n            elif self.now \u003c machine.startup_until - EPS:\n                state = \"STARTING\"\n            elif machine.completed:\n                state = \"BLOCKED\"\n            elif machine.busy:\n                state = \"RUNNING\"\n            else:\n                state = \"STARVED\"\n            machine.state = state\n        self.check_invariants()\n\n    def check_invariants(self):\n        inventory = sum(b.inventory for b in self.conveyors) + sum(m.item is not None for m in self.machines)\n        if self.initial_inventory + self.source_started != self.output + inventory:\n            raise RuntimeError(\"Material conservation violation\")\n        for belt in self.conveyors:\n            if not 0 \u003c= belt.inventory \u003c= belt.capacity:\n                raise RuntimeError(\"Conveyor capacity violation\")\n\n    def advance(self, at):\n        elapsed = max(0.0, at - self.now)\n        for machine in self.machines:\n            machine.state_seconds[machine.state] += elapsed\n        for belt in self.conveyors:\n            belt.integral += belt.inventory * elapsed\n        self.now = at\n\n    def sample(self):\n        self.samples.append({\"virtualSecond\": self.now, \"outputCount\": self.output,\n                             \"equipment\": [{\"id\": m.model[\"id\"], \"mode\": m.mode, \"state\": m.state, \"outputCount\": m.output,\n                                            \"stateSeconds\": dict(m.state_seconds)} for m in self.machines],\n                             \"zones\": [{\"id\": b.model[\"id\"], \"inventoryUnits\": b.inventory, \"readyUnits\": len(b.ready),\n                                        \"movingUnits\": len(b.moving), \"releasedUnits\": b.released} for b in self.conveyors]})\n\n    def execute(self):\n        while self.queue:\n            at = self.queue[0][0]\n            self.advance(at)\n            sampling = False\n            while self.queue and abs(self.queue[0][0] - at) \u003c= EPS:\n                _, _, _, kind, data = heapq.heappop(self.queue)\n                self.executed += 1\n                if self.executed > self.run.get(\"maxEvents\", 2000000):\n                    raise InputError(\"EVENT_LIMIT: increase run.maxEvents or shorten the run; no partial result returned\")\n                self.event_counts[kind] = self.event_counts.get(kind, 0) + 1\n                if kind == \"SAMPLE\":\n                    sampling = True\n                    sample_index = data + 1\n                    self.schedule(sample_index * self.run.get(\"sampleEverySeconds\", 5), 9, \"SAMPLE\", sample_index)\n                self.dispatch(kind, data)\n            # Inclusive horizon: deliver completed items, do not start new cycles.\n            self.settle()\n            if sampling:\n                self.sample()\n        self.advance(self.duration)\n        if not self.samples or self.samples[-1][\"virtualSecond\"] != self.duration:\n            self.sample()\n        self.check_invariants()\n        return self.result()\n\n    def result(self):\n        critical = next((m for m in self.machines if m.model.get(\"critical\")), None)\n        reference = critical or min(self.machines, key=lambda m: m.rate)\n        equipment = []\n        for machine in self.machines:\n            equipment.append({\"id\": machine.model[\"id\"], \"name\": machine.model.get(\"name\", machine.model[\"id\"]),\n                \"outputCount\": machine.output, \"processedCount\": machine.processed,\n                \"stateSeconds\": machine.state_seconds,\n                \"runningSeconds\": machine.state_seconds[\"RUNNING\"], \"starvedSeconds\": machine.state_seconds[\"STARVED\"],\n                \"blockedSeconds\": machine.state_seconds[\"BLOCKED\"], \"failureSeconds\": machine.state_seconds[\"FAILED\"],\n                \"failureCount\": machine.failure_count,\n                \"microStopCount\": machine.micro_count, \"microStopSeconds\": machine.state_seconds[\"MICRO_STOP\"],\n                \"startupSeconds\": machine.state_seconds[\"STARTING\"],\n                \"processingUtilizationPercent\": 100 * machine.state_seconds[\"RUNNING\"] / self.duration,\n                \"productiveCapacityPercent\": 100 * machine.output / (machine.rate * self.duration)})\n        zones = [{\"id\": b.model[\"id\"], \"capacityUnits\": b.capacity, \"inventoryUnits\": b.inventory,\n                  \"readyUnits\": len(b.ready), \"movingUnits\": len(b.moving), \"maximumInventoryUnits\": b.maximum,\n                  \"averageInventoryUnits\": b.integral / self.duration, \"travelSeconds\": b.travel,\n                  \"entryHeadwaySeconds\": b.entry_headway, \"exitHeadwaySeconds\": b.exit_headway} for b in self.conveyors]\n        wip = sum(z[\"inventoryUnits\"] for z in zones) + sum(m.item is not None for m in self.machines)\n        return {\"engine\": {\"id\": \"DES_PYTHON_EXPERIMENTAL\", \"version\": VERSION, \"method\": \"NEXT_EVENT\",\n                  \"conveyorModel\": \"FINITE_FIFO_DELAY_WITH_ACCUMULATION\", \"modelEquivalentToST\": False,\n                  \"schema\": SCHEMA, \"source\": self.payload.get(\"metadata\", {})},\n                \"caseId\": self.payload.get(\"caseId\", \"des-case\"), \"unitOfFlow\": self.payload.get(\"unitOfFlow\", \"units\"),\n                \"run\": deepcopy(self.run), \"summary\": {\"outputCount\": self.output,\n                  \"throughputPerMinute\": self.output / self.duration * 60,\n                  \"capacityAchievementPercent\": 100 * self.output / (reference.rate * self.duration),\n                  \"referenceEquipmentId\": reference.model[\"id\"], \"qualityModel\": \"NO_REJECTS\",\n                  \"lineOeePercent\": None, \"materialBalance\": {\"initialInventory\": self.initial_inventory,\n                    \"sourceStarted\": self.source_started, \"outletOutput\": self.output, \"totalInventory\": wip,\n                    \"residualUnits\": self.initial_inventory + self.source_started - self.output - wip}},\n                \"equipment\": equipment, \"zones\": zones, \"samples\": self.samples, \"events\": self.events,\n                \"detailCoverage\": {\"omittedEvents\": self.omitted_events},\n                \"diagnostics\": {\"eventsProcessed\": self.executed, \"eventsByType\": self.event_counts,\n                  \"fixedTimeStep\": None, \"physicalEventHorizon\": \"inclusive\",\n                  \"failureClock\": \"enabled non-failed elapsed time, including starvation/blocking\",\n                  \"repairDistribution\": \"deterministic MTTR\", \"failureDistribution\": \"exponential MTBF\",\n                  \"rampModel\": \"linear rate ramp, analytical work integral and next-completion inversion\",\n                  \"microStopClock\": \"AUTO enabled non-failed time, exponential interval, uniform duration, separate random stream\",\n                  \"sameTimeOrder\": \"commands, repairs, failures, processing completions, arrivals; downstream-first transfers\"},\n                \"limitations\": [\"No spatial queue-tail, Prime/Back-up sensors or belt stop logic.\",\n                  \"No overflow runout, conveyor downtime, rejects, batches, conversion ratios, merges or splits.\",\n                  \"Constant full-length travel delay; queue growth does not shorten incoming travel.\",\n                  \"No spatial occupied-length constraint; packed capacity plus admission/exit headway only.\",\n                  \"Machine holds one item; blocking after service; pause/failure resumes remaining work.\",\n                  \"Capacity achievement is not validated plant OEE; lineOeePercent is intentionally null.\"]}\n\n\ndef simulate_line(payload):\n    started = time.perf_counter()\n    try:\n        validate(payload)\n        result = Simulation(deepcopy(payload)).execute()\n        result[\"diagnostics\"][\"wallTimeSeconds\"] = time.perf_counter() - started\n        return {\"ok\": True, \"result\": result}\n    except InputError as error:\n        return {\"ok\": False, \"error\": {\"code\": \"INVALID_DES_INPUT\", \"message\": str(error)}}\n\n\ndef simulate_batch(payload, rounds):\n    if isinstance(rounds, bool) or not isinstance(rounds, int) or not 1 \u003c= rounds \u003c= 1000:\n        return {\"ok\": False, \"error\": {\"code\": \"INVALID_ROUNDS\", \"message\": \"rounds must be 1..1000\"}}\n    results = []\n    for index in range(rounds):\n        copy = deepcopy(payload)\n        copy.setdefault(\"run\", {})[\"seed\"] = payload.get(\"run\", {}).get(\"seed\", 1) + index\n        response = simulate_line(copy)\n        if not response[\"ok\"]:\n            return response\n        results.append(response[\"result\"])\n    values = [r[\"summary\"][\"throughputPerMinute\"] for r in results]\n    return {\"ok\": True, \"batch\": {\"rounds\": rounds, \"seeds\": [r[\"run\"][\"seed\"] for r in results],\n              \"meanThroughputPerMinute\": statistics.mean(values),\n              \"standardDeviationThroughput\": statistics.stdev(values) if rounds > 1 else None,\n              \"results\": results}}\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"input\", type=Path)\n    parser.add_argument(\"--output\", type=Path)\n    parser.add_argument(\"--rounds\", type=int, default=1)\n    args = parser.parse_args()\n    try:\n        payload = json.loads(args.input.read_text(encoding=\"utf-8\"))\n        result = simulate_line(payload) if args.rounds == 1 else simulate_batch(payload, args.rounds)\n    except (OSError, json.JSONDecodeError) as error:\n        result = {\"ok\": False, \"error\": {\"code\": \"FILE_ERROR\", \"message\": str(error)}}\n    serialized = json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False)\n    if args.output:\n        args.output.write_text(serialized + \"\\n\", encoding=\"utf-8\")\n    else:\n        print(serialized)\n    return 0 if result[\"ok\"] else 2\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n","st_simpy_engine.py":"#!/usr/bin/env python3\n\"\"\"ST DES engine using the real SimPy event scheduler, Python 3.10+.\n\nInstall requirements.txt. CLI: python st_simpy_engine.py input.json --output result.json\nThe validated physical model is shared with st_des_engine.py (legacy heap oracle).\nThis module never runs that oracle's scheduler. SimPy owns the event agenda and\nclock; the shared model owns item transfer, downtime and statistical accounting.\nEvent callbacks are used instead of Store/Resource so the existing deterministic\nsame-time priority, blocking-after-service and inclusive horizon stay explicit.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nfrom copy import deepcopy\nimport json\nimport math\nfrom pathlib import Path\nimport statistics\nimport sys\nimport time\n\ntry:\n    import simpy\nexcept ImportError:\n    simpy = None\n\nfrom st_des_engine import EPS, InputError, Simulation, validate\n\nVERSION = \"0.3.0-experimental\"\nTESTED_SIMPY_VERSION = \"4.1.2\"\n\n\nclass Cancelled(Exception):\n    pass\n\n\nif simpy is not None:\n    class PriorityEnvironment(simpy.Environment):\n        \"\"\"Public Timeout/schedule API adapter for ST's event priorities.\n\n        Timeout schedules itself with NORMAL priority. We temporarily choose\n        the model priority during its construction, delegating the entire\n        agenda to Environment.schedule(). No SimPy private queue is accessed.\n        SimPy is single-threaded; this context is local to this environment.\n        \"\"\"\n        def __init__(self):\n            self.model_priority = None\n            super().__init__()\n\n        def schedule(self, event, priority=1, delay=0):\n            selected = self.model_priority if self.model_priority is not None else priority\n            return super().schedule(event, selected, delay)\n\n        def priority_timeout(self, delay, priority, value=None):\n            previous = self.model_priority\n            self.model_priority = priority\n            try:\n                return self.timeout(delay, value)\n            finally:\n                self.model_priority = previous\n\n\nclass SimPySimulation(Simulation):\n    def __init__(self, payload, progress=None, cancelled=None, on_partial=None, summary_only=False):\n        self.env = PriorityEnvironment()\n        self.progress = progress\n        self.cancelled = cancelled\n        self.summary_only = summary_only\n        self.on_partial = on_partial\n        self.partial_sent_samples = 0\n        self.partial_sent_at = None\n        self.progress_events = 0\n        self.progress_sent_at = time.perf_counter()\n        self.pending_sample = False\n        super().__init__(payload)\n        shift = self.run.get(\"shiftSeconds\", self.duration)\n        at = shift\n        while at \u003c self.duration - EPS:\n            self.schedule(at, 9, \"SHIFT_SAMPLE\")\n            at += shift\n        # The domain constructor has compatibility attributes for the legacy\n        # implementation. Removing them makes accidental scheduler use fail.\n        del self.queue\n        del self.sequence\n\n    def schedule(self, at, priority, kind, data=None):\n        if at \u003c self.now - EPS:\n            raise RuntimeError(\"Attempt to schedule an event in the past\")\n        if at > self.duration + EPS:\n            return\n        target = min(float(at), self.duration)\n        event = self.env.priority_timeout(max(0.0, target - self.env.now), priority, (kind, data))\n        event.callbacks.append(self.handle_event)\n\n    def handle_event(self, event):\n        # Nearby floating-point timestamps can share a dispatch group; physical\n        # coordinates must still advance to each actual scheduler timestamp.\n        self.advance(self.env.now)\n        kind, data = event.value\n        self.executed += 1\n        if self.executed > self.run.get(\"maxEvents\", 2000000):\n            raise InputError(\"EVENT_LIMIT: increase run.maxEvents or shorten the run; no partial result returned\")\n        self.event_counts[kind] = self.event_counts.get(kind, 0) + 1\n        if kind == \"SAMPLE\":\n            self.pending_sample = True\n            index = data + 1\n            self.schedule(index * self.run.get(\"sampleEverySeconds\", 5), 9, \"SAMPLE\", index)\n        if kind == \"SHIFT_SAMPLE\":\n            self.pending_sample = True\n        self.dispatch(kind, data)\n\n    def execute(self):\n        # env.run(until=T) stops before normal-priority events exactly at T.\n        # Explicit stepping preserves ST DES's documented inclusive horizon.\n        # No fixed time increments: env.peek() jumps to each next event time.\n        while math.isfinite(self.env.peek()):\n            if self.cancelled and self.cancelled():\n                raise Cancelled(\"Simulation cancelled; no partial result returned\")\n            at = self.env.peek()\n            self.advance(at)\n            self.pending_sample = False\n            while True:\n                while self.env.peek() \u003c= at + EPS:\n                    self.env.step()\n                self.settle()\n                if self.env.peek() > at + EPS:\n                    break\n            if self.pending_sample:\n                self.sample()\n                if self.progress:\n                    self.progress(min(1.0, self.now / self.duration))\n                    self.progress_sent_at = time.perf_counter()\n                self.publish_partial()\n            if self.progress and self.executed - self.progress_events >= 256:\n                self.progress_events = self.executed\n                wall = time.perf_counter()\n                if wall - self.progress_sent_at >= 0.5:\n                    self.progress(min(1.0, self.now / self.duration))\n                    self.progress_sent_at = wall\n        self.advance(self.duration)\n        if not self.samples or self.samples[-1][\"virtualSecond\"] != self.duration:\n            self.sample()\n        self.check_invariants()\n        if self.progress:\n            self.progress(1.0)\n        return self.result()\n\n    def should_sample(self):\n        shift = self.run.get('shiftSeconds', self.duration)\n        return not self.summary_only or self.now \u003c= EPS or self.now >= self.duration - EPS or abs(self.now / shift - round(self.now / shift)) \u003c EPS\n\n    def sample(self):\n        if self.should_sample(): super().sample()\n\n    def publish_partial(self):\n        if not self.on_partial or self.now \u003c= EPS or self.now >= self.duration - EPS:\n            return\n        wall = time.perf_counter()\n        if self.partial_sent_at is not None and wall - self.partial_sent_at \u003c 0.5:\n            return\n        planned_duration = self.duration\n        try:\n            # Reporting uses elapsed time; the scheduler keeps its full horizon.\n            self.duration = self.now\n            snapshot = self.result()\n        finally:\n            self.duration = planned_duration\n        shift = self.run.get('shiftSeconds', planned_duration)\n        start = max(1, self.partial_sent_samples - 1)\n        snapshot['samples'] = [frame for index, frame in enumerate(self.samples)\n            if index == 0 or index >= start or abs(frame['virtualSecond'] / shift - round(frame['virtualSecond'] / shift)) \u003c EPS]\n        snapshot['events'] = []\n        snapshot['calculatedThroughSeconds'] = self.now\n        # Serialize now so subsequent events cannot mutate the published snapshot.\n        self.on_partial(json.dumps(snapshot, allow_nan=False))\n        self.partial_sent_samples = len(self.samples)\n        self.partial_sent_at = wall\n\n    def result(self):\n        result = super().result()\n        result[\"engine\"].update(id=\"DES_SIMPY_EXPERIMENTAL\", version=VERSION,\n            library=\"SimPy\", libraryVersion=simpy.__version__, scheduler=\"simpy.Environment\")\n        result[\"diagnostics\"].update(library=\"SimPy\", libraryVersion=simpy.__version__,\n            testedLibraryVersion=TESTED_SIMPY_VERSION,\n            libraryVersionMatchesValidation=simpy.__version__ == TESTED_SIMPY_VERSION)\n        return result\n\n\ndef simulate_line(payload, progress=None, cancelled=None, on_partial=None, summary_only=False):\n    if simpy is None:\n        return {\"ok\": False, \"error\": {\"code\": \"MISSING_DEPENDENCY\",\n            \"message\": \"Install SimPy locally: python -m pip install -r requirements.txt\"}}\n    started = time.perf_counter()\n    try:\n        if isinstance(payload, dict) and isinstance(payload.get('metadata'), dict) and payload['metadata'].get('conveyorModel') == 'SPATIAL_FINITE_PRODUCTS':\n            from st_spatial_engine import SpatialSimulation, validate as validate_spatial\n            validate_spatial(payload)\n            result = SpatialSimulation(deepcopy(payload), progress, cancelled, on_partial, summary_only).execute()\n        else:\n            validate(payload)\n            result = SimPySimulation(deepcopy(payload), progress, cancelled, on_partial, summary_only).execute()\n        result[\"diagnostics\"][\"wallTimeSeconds\"] = time.perf_counter() - started\n        return {\"ok\": True, \"result\": result}\n    except Cancelled as error:\n        return {\"ok\": False, \"error\": {\"code\": \"CANCELLED\", \"message\": str(error)}}\n    except InputError as error:\n        return {\"ok\": False, \"error\": {\"code\": \"INVALID_DES_INPUT\", \"message\": str(error)}}\n\n\ndef simulate_batch(payload, rounds, progress=None, cancelled=None):\n    if isinstance(rounds, bool) or not isinstance(rounds, int) or not 1 \u003c= rounds \u003c= 1000:\n        return {\"ok\": False, \"error\": {\"code\": \"INVALID_ROUNDS\", \"message\": \"rounds must be 1..1000\"}}\n    base_seed = payload.get(\"run\", {}).get(\"seed\", 1) if isinstance(payload, dict) else 1\n    if isinstance(base_seed, bool) or not isinstance(base_seed, int):\n        return {\"ok\": False, \"error\": {\"code\": \"INVALID_DES_INPUT\", \"message\": \"run.seed: integer required\"}}\n    results = []\n    for index in range(rounds):\n        copy = deepcopy(payload)\n        if not isinstance(copy, dict) or not isinstance(copy.get(\"run\"), dict):\n            return simulate_line(copy)\n        copy[\"run\"][\"seed\"] = base_seed + index\n        report = (lambda value, index=index: progress((index + value) / rounds)) if progress else None\n        response = simulate_line(copy, report, cancelled)\n        if not response[\"ok\"]:\n            return response\n        results.append(response[\"result\"])\n    values = [r[\"summary\"][\"throughputPerMinute\"] for r in results]\n    return {\"ok\": True, \"batch\": {\"rounds\": rounds, \"engineId\": \"DES_SIMPY_EXPERIMENTAL\",\n        \"engineVersion\": results[0][\"engine\"][\"version\"], \"libraryVersion\": simpy.__version__ if simpy else None,\n        \"seeds\": [r[\"run\"][\"seed\"] for r in results],\n        \"meanThroughputPerMinute\": statistics.mean(values),\n        \"standardDeviationThroughput\": statistics.stdev(values) if rounds > 1 else None,\n        \"results\": results}}\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"input\", type=Path)\n    parser.add_argument(\"--output\", type=Path)\n    parser.add_argument(\"--rounds\", type=int, default=1)\n    args = parser.parse_args()\n    try:\n        payload = json.loads(args.input.read_text(encoding=\"utf-8\"))\n        response = simulate_line(payload) if args.rounds == 1 else simulate_batch(payload, args.rounds)\n    except (OSError, json.JSONDecodeError) as error:\n        response = {\"ok\": False, \"error\": {\"code\": \"FILE_ERROR\", \"message\": str(error)}}\n    serialized = json.dumps(response, indent=2, ensure_ascii=False, allow_nan=False) + \"\\n\"\n    if args.output:\n        args.output.write_text(serialized, encoding=\"utf-8\")\n    else:\n        print(serialized, end=\"\")\n    return 0 if response[\"ok\"] else 2\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n\n","st_spatial_engine.py":"\"\"\"Spatial serial DES: product leading edges, finite packing, photoeyes and belt stops.\"\"\"\nfrom collections import deque\nfrom copy import deepcopy\nfrom dataclasses import dataclass, field\nimport math\n\nfrom st_des_engine import EPS, Conveyor, InputError, RandomStream, STATES, number, integer, keys, validate as validate_fifo\nfrom st_simpy_engine import SimPySimulation\n\nSPATIAL_VERSION = '0.4.0-experimental'\n\n\ndef validate(payload):\n    if not isinstance(payload, dict) or not isinstance(payload.get('run'), dict) or not isinstance(payload.get('machines'), list) or not payload['machines'] or not isinstance(payload.get('conveyors'), list) or any(not isinstance(c, dict) or 'id' not in c or 'lengthMm' not in c or 'movingPitchMm' not in c for c in payload['conveyors']):\n        raise InputError('Spatial DES requires machines, conveyor geometry and run configuration')\n    copy = deepcopy(payload)\n    spatial_keys = ('productLengthMm', 'primeSensorPositionMm', 'backupSensorPositionMm', 'backupRestartPositionMm', 'upstreamRestartDelaySeconds', 'downstreamRampUpSeconds', 'blockedTimeDelaySeconds',\n                    'clearTimeDelaySeconds', 'upstreamStopResponseSeconds', 'bottlesDischargedAtStop', 'initialMode', 'reliability', 'microStop', 'failures')\n    ids = {c.get('id') for c in copy['conveyors'] if isinstance(c.get('id'), str)}\n    commands = copy['run'].get('commands', [])\n    if not isinstance(commands, list) or any(not isinstance(c, dict) for c in commands):\n        raise InputError('run.commands must contain command objects')\n    copy['run']['commands'] = [c for c in commands if not isinstance(c.get('equipmentId'), str) or c.get('equipmentId') not in ids]\n    for belt in copy['conveyors']:\n        for name in spatial_keys:\n            belt.pop(name, None)\n    validate_fifo(copy)\n    for i, belt in enumerate(copy.get('conveyors', [])):\n        original = payload['conveyors'][i]\n        keys(ori
