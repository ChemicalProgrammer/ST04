<style>
.app-shell { width: 100%; min-height: 100vh; padding: 0; }
.app-shell.case-open { padding-left: var(--sidebar-width); }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); z-index: var(--z-sidebar); background: var(--surface-soft); border-right: var(--border-width) solid var(--line); display: flex; flex-direction: column; padding: var(--space-3); gap: var(--space-5); transition: width var(--duration-normal) var(--ease); }
.brand { display: flex; align-items: center; gap: var(--space-2); white-space: nowrap; min-height: var(--control-height); color: var(--ink); font-weight: var(--weight-semibold); }
.brand-mark { background: var(--accent); color: var(--on-accent); display: grid; place-items: center; width: var(--size-28); height: var(--size-28); border-radius: var(--radius-sm); font-size: var(--font-secondary); flex-shrink: 0; }
.sidebar nav { display: grid; gap: var(--space-1); }
.nav-caption { padding: 0 var(--space-2); font-size: var(--font-caption); color: var(--muted); }
.nav-item { position: relative; justify-content: flex-start; width: 100%; background: transparent; color: var(--muted); border-radius: var(--radius-sm); white-space: nowrap; }
.nav-item:hover { background: var(--surface-hover); color: var(--ink); }
.nav-item[aria-current=page] { background: var(--selected); color: var(--selected-text); }
.sidebar-footer { margin-top: auto; display: grid; gap: var(--space-2); }
.app-shell.case-open.sidebar-collapsed { padding-left: var(--sidebar-collapsed); }
.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed); }
.sidebar-collapsed .nav-label,.sidebar-collapsed .nav-caption,.sidebar-collapsed .brand-name { display: none; }
.sidebar-collapsed .nav-item { justify-content: center; padding: var(--space-2); }
.sidebar-collapsed .nav-item:hover::after,.sidebar-collapsed .nav-item:focus-visible::after { content: attr(aria-label); position: absolute; left: calc(100% + var(--space-3)); border: var(--border-width) solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); z-index: var(--z-overlay); box-shadow: var(--shadow-dialog); }
.topbar { height: var(--header-height); padding: 0 var(--page-padding); display: flex; align-items: center; gap: var(--space-3); border-bottom: var(--border-width) solid var(--line); background: var(--surface); }
.breadcrumb { color: var(--muted); display: flex; gap: var(--space-2); align-items: center; min-width: 0; flex: 1; }
#breadcrumb-case { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } #breadcrumb-view { color: var(--ink); }
.user-chip { max-width: var(--size-220); overflow: hidden; text-overflow: ellipsis; font-size: var(--font-secondary); color: var(--muted); }
.workspace-content { padding: 0 var(--page-padding) var(--space-8); min-width: 0; }
.workspace-content > .card { border: 0; border-radius: 0; padding: var(--space-4) 0; background: transparent; }
 .sidebar-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-1); }
.sidebar-section + .sidebar-section { border-top:var(--border-width) solid var(--line); padding-top:var(--space-3); }
.sidebar-simulations { min-height:0; overflow-y:auto; }
.simulation-navigation .nav-label { overflow:hidden; text-overflow:ellipsis; }
.workspace-tab { border:0; border-radius:var(--radius-sm); box-shadow:none; }
.sidebar-collapsed .sidebar-heading .brand { display:none; }
.sidebar-collapsed .sidebar-heading { justify-content:center; }
.sidebar-collapsed .sidebar { gap:var(--space-3); }
.auth-shell { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); background: var(--surface-soft); }
.auth-card { width: min(100%,var(--size-420)); padding: var(--space-8); background: var(--surface); border: var(--border-width) solid var(--line); border-radius: var(--radius-lg); }
.auth-card .brand { margin-bottom: var(--space-8); } .auth-card form { margin-top: var(--space-6); }
.remember { display: flex; align-items: center; gap: var(--space-2); }
.auth-note,#auth-status { font-size: var(--font-secondary); margin-top: var(--space-4); } #auth-status { color: var(--danger); }
.theme-control { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-6); }
.theme-control select { max-width: var(--size-150); }
#mobile-menu { display: none; }
@media(max-width:760px) {
  .app-shell,.app-shell.app-shell.case-open.sidebar-collapsed { padding-left: 0; }
  .sidebar,.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed); padding: var(--space-2); }
  .app-shell.case-open { padding-left: var(--sidebar-collapsed); }
  .sidebar .nav-label,.sidebar .brand-name,.sidebar .nav-caption { display: none; }
  .sidebar .nav-item { justify-content: center; padding: var(--space-2); }
  #collapse-sidebar { display: none; } .user-chip { display: none; }
  .workspace-content { padding: 0 var(--space-3) var(--space-6); } .topbar { padding: 0 var(--space-3); flex-direction: row; align-items: center; }
  .section-heading { align-items: flex-start; flex-direction: column; }
  .breadcrumb { font-size: var(--font-secondary); }
}

.sidebar { overflow-y:auto; }
.sidebar-simulations { flex:1; }
.sidebar-section { flex-shrink:0; }
.sidebar-simulations { flex-shrink:1; }
.topbar { min-width:0; }
@media(max-width:600px) {
 .topbar { gap:var(--space-1); flex-wrap:wrap; height:auto; min-height:var(--header-height); padding-top:var(--space-2); padding-bottom:var(--space-2); }
 .topbar .breadcrumb { flex-basis:100%; }
 .topbar .button-row { flex-wrap:wrap; }
 .app-shell:not(.case-open) { padding:0; }
}

.sidebar,.sidebar-simulations,.simulation-navigation { overflow-x:hidden; min-width:0; }
.sidebar .nav-item { min-width:0; white-space:normal; overflow-wrap:anywhere; }
.sidebar .nav-item .icon { flex-shrink:0; }
.sidebar .nav-label { min-width:0; }
#breadcrumb-case { font-size:var(--font-page); font-weight:var(--weight-semibold); color:var(--ink); letter-spacing:var(--tracking-tight); }
#breadcrumb-view { font-size:var(--font-secondary); color:var(--muted); }
#status:empty { display:none; }
.sidebar-collapsed .sidebar,.sidebar-collapsed .sidebar-simulations { scrollbar-width:none; }
.sidebar-collapsed .sidebar::-webkit-scrollbar,.sidebar-collapsed .sidebar-simulations::-webkit-scrollbar { display:none; }
#session-restore { display:none; }
.restoring-session #auth-panel { display:none; }
.restoring-session #session-restore { display:grid; }
#autosave-indicator { display:flex; align-items:center; gap:var(--space-2); color:var(--muted); font-size:var(--font-caption); }
#autosave-status[data-state=error] { color:var(--danger); }
@media(max-width:760px){.sidebar,.sidebar-simulations{scrollbar-width:none;}.sidebar::-webkit-scrollbar,.sidebar-simulations::-webkit-scrollbar{display:none;}}
/* Active simulation controls share one toolbar in both interface modes. */
.simulation-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-3); padding:var(--space-3); margin-top:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); }
.simulation-picker { display:flex; align-items:center; gap:var(--space-3); min-width:0; font-size:var(--font-secondary); }
#simulation-selector { width:var(--size-220); max-width:100%; }
.simulation-actions { display:flex; align-items:center; flex-wrap:wrap; gap:var(--space-2); }
.simulation-actions button { white-space:nowrap; }
@media(max-width:760px){
 .simulation-picker { flex:1; }
 #simulation-selector { flex:1; width:auto; }
 .simulation-actions { flex-basis:100%; }
}
html[data-ui-mode=advance] .simulation-picker { display:none; }
html[data-ui-mode=advance] .simulation-toolbar { justify-content:flex-end; padding:0; margin:0 0 0 auto; border:0; border-radius:0; background:transparent; }
html[data-ui-mode=advance] .simulation-actions { justify-content:flex-end; }
html[data-ui-mode=advance] .workspace-content > .card > .section-heading { flex-wrap:wrap; }
</style>
