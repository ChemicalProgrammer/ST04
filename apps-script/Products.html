<script>
window.STProducts=(function(){
  var state,hooks,currentTab='products',selectedFormatId;
  function copy(value){return JSON.parse(JSON.stringify(value));}
  function data(){return SimulatorEngine.normalizeFormatCatalog(state?.activeCase?.metadata||{});}
  function catalog(){return SimulatorEngine.resolvePackingFormats(data());}
  function initialId(sim){return sim?.dynamicConfig?.initialFormatId??sim?.dynamicConfig?.initialProductId??'';}
  function currentFormat(){try{return catalog().find(f=>f.id===initialId(hooks?.simulation()));}catch(ignore){return null;}}
  function hasFormats(){return !!data().formats.length;}
  function packSize(format){return format?.bottlesPerCase??format?.presentations?.case?.bottlesPerCase;}
  function id(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
  function unit(e,side,format){side=side||'output';var base=e.processData?.flowUnits?.[side]||'BOTTLES';if(format)return format.equipment?.[e.id]?.[side+'Unit']||base;var metadata=state.activeCase.metadata||{},formats=metadata.formatCatalog?.formats||metadata.products||[],values=formats.map(f=>f.equipment?.[e.id]?.[side+'Unit']||base);return values.length&&values.every(value=>value===values[0])?values[0]:base;}
  function defaultProfile(e,index){
    var a=e.processData?.accumulation||{},u=e.processData?.upstream||{},definition;
    if(e.type!=='CONVEYOR')return {applies:true,inputUnit:unit(e,'input'),outputUnit:unit(e,'output'),ratePerMinute:e.nominalRatePerSecond*60};
    try{definition=SimulatorEngine.resolveProductConveyor?.(state.activeCase.equipment,index);}catch(ignore){}
    var length=u.packageLengthMm??a.productLengthMm;
    return {applies:true,inputUnit:unit(e,'input'),outputUnit:unit(e,'output'),movingGapMm:a.movingGapMm??definition?.gapMm,accumulatedGapMm:a.accumulatedGapMm??0,
      dischargeGapMm:Number.isFinite(u.dischargePitchMm)&&Number.isFinite(length)?Math.max(0,u.dischargePitchMm-length):undefined,
      infeedGapMm:Number.isFinite(e.processData?.downstream?.infeedPitchMm)&&Number.isFinite(length)?Math.max(0,e.processData.downstream.infeedPitchMm-length):undefined,
      speedMmPerSecond:a.speedMode==='MANUAL'?a.conveyorSpeedMmPerSecond:undefined};
  }
  function alignFormats(formats){
    var all=state.activeCase.equipment||[],keep=new Set(all.map(e=>e.id)),activeId=hooks.simulation()?.id||state.activeSimulationId;
    (state.activeCase.simulations||[]).filter(s=>s.id!==activeId).forEach(s=>(s.equipment||[]).forEach(e=>keep.add(e.id)));
    formats.forEach(function(f){f.equipment=f.equipment||{};all.forEach(function(e,i){if(!Object.prototype.hasOwnProperty.call(f.equipment,e.id))f.equipment[e.id]=defaultProfile(e,i);});Object.keys(f.equipment).forEach(key=>{if(!keep.has(key))delete f.equipment[key];});});return formats;
  }
  function reconcile(){if(!state?.activeCase)return false;var metadata=state.activeCase.metadata||{},formats=metadata.formatCatalog?.formats||metadata.products||[];if(!formats.length)return false;var before=JSON.stringify(formats);alignFormats(formats);return before!==JSON.stringify(formats);}
  function setPhysicalUnits(equipmentId,input,output){
    var metadata=state.activeCase.metadata||{},formats=metadata.formatCatalog?.formats||metadata.products||[];
    formats.forEach(function(f){f.equipment=f.equipment||{};var profile=f.equipment[equipmentId]||(f.equipment[equipmentId]={});profile.inputUnit=input;profile.outputUnit=output;});
  }
  function references(formatId){
    var active=hooks.simulation(),sims=(state.activeCase.simulations||[]).slice();if(active&&!sims.some(s=>s.id===active.id))sims.push(active);var refs=[];
    sims.forEach(function(sim){if(sim.id!==active?.id&&initialId(sim)===formatId)refs.push((sim.name||sim.id)+' initial format');var events=sim.id===active?.id?(state.run?.plannedStops||sim.dynamicConfig?.plannedStops):sim.dynamicConfig?.plannedStops;if(events?.some(e=>(e.targetFormatId??e.targetProductId)===formatId))refs.push((sim.name||sim.id)+' changeover');});return refs;
  }
  function render(force){
    var target=document.getElementById('products-workspace');if(!target||state?.uiView!=='products')return;

    if(force!==true&&target._formatIdentity===identity&&target.querySelector('.products-editor'))return;target._formatIdentity=identity;target.replaceChildren();if(state.activeCase)open(true);

    var ownerCase=state.activeCase,ownerSimulation=hooks.simulation(),focus=document.activeElement;
    var dialog=document.createElement(inline?'section':'dialog');dialog.className=inline?'products-editor':'settings-dialog products-dialog';dialog.setAttribute('aria-labelledby',inline?'products-title':'formats-dialog-title');
    var heading=document.createElement('header');heading.className='dialog-heading';var title=document.createElement('h2');title.id='formats-dialog-title';title.textContent='Formats';heading.hidden=inline;heading.append(title);

    var footer=document.createElement('footer');footer.className='dialog-actions';dialog.append(heading,tabs,body,footer);if(inline)document.getElementById('products-workspace').append(dialog);else document.body.append(dialog);

    var cancel=document.createElement('button');cancel.type='button';cancel.className='ghost';cancel.textContent=inline?'Discard edits':'Cancel';cancel.onclick=closeEditor;
    var save=document.createElement('button');save.type='button';save.textContent='Save formats';footer.append(cancel,save);
    var error=document.createElement('p');error.className='notice product-error hidden';error.setAttribute('role','alert');
    function showError(message){error.textContent=message;error.classList.remove('hidden');}
    function section(text){var section=document.createElement('section');section.className='settings-section product-subsection';var heading=document.createElement('div');heading.className='editor-subheading compact-heading';var h=document.createElement('h3');h.textContent=text;heading.append(h);section.append(heading);body.append(section);return section;}

    function field(parent,labelText,obj,key,options){var label=document.createElement('label');label.textContent=labelText;var input=control(obj,key,labelText,options);label.append(input);parent.append(label);return input;}

      var head=document.createElement('thead'),row=document.createElement('tr');columns.forEach(function(text,index){var cell=document.createElement('th');cell.scope='col';cell.textContent=text;if(index>1)cell.className='numeric';row.append(cell);});head.append(row);table.append(head);var body=document.createElement('tbody');
      equipment.forEach(function(e){var row=document.createElement('tr');row.dataset.equipmentId=e.id;drawRow(row,e);body.append(row);});
      if(!equipment.length){var row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=columns.length;cell.className='empty';cell.textContent='No '+caption.toLowerCase()+' in this simulation.';row.append(cell);body.append(row);}
      table.append(body);scroll.append(table);parent.append(scroll);return table;
    }
    function textCell(row,text){var td=document.createElement('td');td.textContent=text;row.append(td);}
    function inputCell(row,e,profile,key,label,options){var td=document.createElement('td');td.className='numeric';td.append(control(profile,key,e.name+' · '+label,options));row.append(td);}
    function selectField(parent,labelText,value,choices,changed){
      var label=document.createElement('label');label.textContent=labelText;var select=document.createElement('select');select.setAttribute('aria-label',labelText);
      var blank=document.createElement('option');blank.value='';blank.textContent='Select '+labelText.toLowerCase();select.append(blank);
      choices.forEach(function(item){var option=document.createElement('option');option.value=item.id;option.textContent=item.name;select.append(option);});select.value=value||'';select.onchange=function(){changed(select.value);};label.append(select);parent.append(label);return select;
    }
    function icon(parent,name,label,handler){var b=document.createElement('button');b.type='button';b.className='ghost icon-button';b.innerHTML=STIcons.svg(name);b.title=label;b.setAttribute('aria-label',label);b.onclick=handler;parent.append(b);return b;}
    function nameCell(row,obj,label){var td=document.createElement('td');td.append(control(obj,'name',label,{text:true,required:true}));row.append(td);}
    function removeCell(row,label,handler){var td=document.createElement('td');icon(td,'trash',label,handler);row.append(td);}
    function actionHeading(parent,label,handler){var heading=parent.querySelector('.editor-subheading'),actions=document.createElement('div');actions.className='button-row';icon(actions,'plus',label,handler);heading.append(actions);}
    function renderProducts(){
      var sectionNode=section('Products');actionHeading(sectionNode,'Add product',function(){draft.products.push({id:id('product'),name:'Product '+(draft.products.length+1),bottle:{}});draw();});
      note(sectionNode,'Product identity and bottle dimensions. Reuse the same product in multiple packing formats.');
      table(sectionNode,'Product catalog',['Product','Volume (mL)','Bottle length (mm)','Width (mm)','Height (mm)',''],draft.products,function(row,p){p.bottle=p.bottle||{};nameCell(row,p,'Product name');inputCell(row,p,p,'volumeMl','Volume (mL)');[['lengthMm','Bottle length (mm)'],['widthMm','Bottle width (mm)'],['heightMm','Bottle height (mm)']].forEach(spec=>inputCell(row,p,p.bottle,spec[0],spec[1],{min:'0.001'}));removeCell(row,'Delete product '+p.name,function(){var used=draft.formats.filter(f=>f.productId===p.id);if(used.length){showError('Product is used by: '+used.map(f=>f.name).join(', ')+'. Reassign or remove those formats first.');return;}draft.products=draft.products.filter(item=>item.id!==p.id);draw();});});
    }
    function renderBoxes(){
      var sectionNode=section('Boxes');actionHeading(sectionNode,'Add box',function(){draft.boxes.push({id:id('box'),name:'Box '+(draft.boxes.length+1)});draw();});note(sectionNode,'Box dimensions are shared. Bottles per case and packing pattern belong to each packing format.');
      table(sectionNode,'Box catalog',['Box','Length along travel (mm)','Width (mm)','Height (mm)',''],draft.boxes,function(row,b){nameCell(row,b,'Box name');[['lengthMm','Box length (mm)'],['widthMm','Box width (mm)'],['heightMm','Box height (mm)']].forEach(spec=>inputCell(row,b,b,spec[0],spec[1],{min:'0.001'}));removeCell(row,'Delete box '+b.name,function(){var used=draft.formats.filter(f=>f.boxId===b.id);if(used.length){showError('Box is used by: '+used.map(f=>f.name).join(', ')+'. Reassign or remove those formats first.');return;}draft.boxes=draft.boxes.filter(item=>item.id!==b.id);draw();});});
    }
    function renderFormats(){
      var choose=section('Packing formats'),tools=document.createElement('div');tools.className='product-selector-row';
      selectField(tools,'Packing format',selected,draft.formats,function(value){selected=value;selectedFormatId=value;draw();});
      var add=icon(tools,'plus','Add packing format',function(){var f={id:id('format'),name:'Packing format '+(draft.formats.length+1),productId:draft.products[0]?.id,boxId:draft.boxes[0]?.id,bottlesPerCase:12,packPattern:'',equipment:{}};alignFormats([f]);draft.formats.push(f);selected=f.id;selectedFormatId=selected;draw();});add.disabled=!draft.products.length||!draft.boxes.length;
      var remove=icon(tools,'trash','Delete packing format',function(){var used=references(selected);if(used.length){showError('Format is used by '+used.join(', ')+'. Choose a replacement there first.');return;}draft.formats=draft.formats.filter(f=>f.id!==selected);if(initial===selected)initial='';selected=draft.formats[0]?.id;selectedFormatId=selected;draw();});remove.disabled=!selected;choose.append(tools);
      var f=draft.formats.find(f=>f.id===selected);if(!f){note(choose,'Create products and boxes first, then combine them in a packing format.');return;}
      var initialLabel=document.createElement('label');initialLabel.className='checkbox-label product-initial-choice';var check=document.createElement('input');check.type='checkbox';check.id='format-use-initial';check.checked=initial===f.id;check.onchange=function(){initial=check.checked?f.id:'';};initialLabel.append(check,document.createTextNode('Use as initial format for '+(ownerSimulation?.name||'this simulation')));choose.append(initialLabel);
      var general=section('Format configuration'),grid=document.createElement('div');grid.className='settings-simulation-grid product-general-grid';general.append(grid);
      field(grid,'Format name',f,'name',{text:true,required:true});selectField(grid,'Product',f.productId,draft.products,value=>{f.productId=value;});selectField(grid,'Box',f.boxId,draft.boxes,value=>{f.boxId=value;});field(grid,'Bottles per case',f,'bottlesPerCase',{min:'1',step:'1',required:true});field(grid,'Packing pattern',f,'packPattern',{text:true});
      note(general,'One product + one box + a bottle count and packing pattern. Changeovers select a packing format. The suggested count of 12 must be confirmed.');
      var inputs=section('Equipment inputs');note(inputs,'Operating settings belong to this format. Input/output units describe equipment function and are configured once in Equipment / Conveyors. MTBF / MTTR and installation geometry remain shared.');var all=state.activeCase.equipment||[];
      function name(row,e){var cell=document.createElement('th');cell.scope='row';cell.textContent=e.name;row.append(cell);}
      function applies(row,e){var td=document.createElement('td'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=f.equipment[e.id].applies!==false;checkbox.setAttribute('aria-label',e.name+' · Applies');checkbox.onchange=function(){f.equipment[e.id].applies=checkbox.checked;draw();};td.append(checkbox);row.append(td);if(!checkbox.checked)row.classList.add('product-row-inactive');}
      function disable(row,e){if(f.equipment[e.id].applies===false)row.querySelectorAll('input:not([type=checkbox])').forEach(i=>i.disabled=true);}
      table(inputs,'Machines',['Equipment','Applies','Input → output','Rate (output/min)','Startup (s)','Ramp up (s)'],all.filter(e=>e.type!=='CONVEYOR'),function(row,e){name(row,e);applies(row,e);textCell(row,unit(e,'input',f).toLowerCase()+' → '+unit(e,'output',f).toLowerCase());var p=f.equipment[e.id];inputCell(row,e,p,'ratePerMinute','Rate ('+unit(e,'output',f).toLowerCase()+'/min)',{min:'0.001'});inputCell(row,e,p,'startupSeconds','Startup (s)');inputCell(row,e,p,'rampSeconds','Ramp up (s)');disable(row,e);});
      table(inputs,'Conveyors',['Conveyor','Applies','Transported unit','Moving gap (mm)','Accumulated gap (mm)','Discharge gap (mm)','Infeed gap (mm)','Manual speed (m/min)'],all.filter(e=>e.type==='CONVEYOR'),function(row,e){name(row,e);applies(row,e);textCell(row,unit(e,'output',f).toLowerCase());var p=f.equipment[e.id];[['movingGapMm','Moving gap (mm)'],['accumulatedGapMm','Accumulated gap (mm)'],['dischargeGapMm','Discharge gap (mm)'],['infeedGapMm','Infeed gap (mm)'],['speedMmPerSecond','Manual speed (m/min)',{min:'0.001',scale:.06}]].forEach(spec=>inputCell(row,e,p,spec[0],spec[1],spec[2]));disable(row,e);});
      note(inputs,'Applies records compatibility, not a bypass. All steps must be compatible to run this serial line.');
    }
    [['products','Products'],['boxes','Boxes'],['formats','Packing formats']].forEach(function(pair,index){var b=document.createElement('button');b.type='button';b.id='formats-tab-'+pair[0];b.dataset.formatTab=pair[0];b.setAttribute('role','tab');b.setAttribute('aria-controls',body.id);b.textContent=pair[1];b.onclick=function(){currentTab=pair[0];draw();};b.onkeydown=function(event){var next=event.key==='ArrowRight'?(index+1)%3:event.key==='ArrowLeft'?(index+2)%3:event.key==='Home'?0:event.key==='End'?2:-1;if(next>=0){event.preventDefault();tabs.children[next].click();tabs.children[next].focus();}};tabs.append(b);});
    function draw(){

  function runFields(){var selected=initialId(hooks?.simulation());return {initialFormatId:selected||undefined,initialProductId:selected||undefined,productCatalog:selected?catalog():undefined};}
  function destinationCell(row,event,changed){

  function results(target,result){
    target.replaceChildren();target.classList.toggle('hidden',!result?.products);if(!result?.products)return;
    var h=document.createElement('h3');h.textContent='Production by packing format';target.append(h);var wrap=document.createElement('div');wrap.className='table-scroll';var table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');['Packing format','Product','Box','Output unit','Processed output','Complete cases','Partial case equivalent','Bottle equivalents','Clear-out (bottles)'].forEach(function(t){var th=document.createElement('th');th.textContent=t;tr.append(th);});head.append(tr);table.append(head);var body=document.createElement('tbody');result.products.rows.forEach(function(r){var row=document.createElement('tr');[r.name,r.productName||r.name,r.boxName||'—',r.outputUnit,r.outputNative,r.completeCases,r.partialCaseEquivalent,r.outputBottleEquivalents,r.clearoutBottleEquivalents].forEach(function(v,i){var td=document.createElement('td');td.textContent=v==null?'—':typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:2}):v;if(i>3)td.className='numeric';row.append(td);});body.append(row);});table.append(body);wrap.append(table);target.append(wrap);var note=document.createElement('p');note.className='chart-note';note.textContent='Representative round. Global production uses bottle equivalents. Continuous conversion permits fractional case equivalents; clear-out is removed inventory, not production. Product changes use an empty-line reset.';target.append(note);

</script>
