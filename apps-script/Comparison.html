<script>
window.STComparison=function(state,isFiniteNumber){
    function renderCaseComparison() {
      var a = (state.activeCase.simulations || []).find(function(sim) { return sim.id === document.getElementById('case-compare-a').value; });
      var b = (state.activeCase.simulations || []).find(function(sim) { return sim.id === document.getElementById('case-compare-b').value; });
      var target = document.getElementById('case-comparison-content'); target.textContent = '';
      STReports.bindComparison(state.activeCase,a,b);
      if (!a || !b || a.id === b.id) { target.textContent = __ST_TEXT__('comparison.select_two_different_simulations'); return; }
      STResults.compare(target,a,b);
      STResults.compareEquipmentOee(target,a,b);
      appendComparisonContext(target, a, b);
      var basic=Boolean(window.STBasicMode?.isBasic());
      if(basic){appendChangedInputs(target,a,b,true);return;}
      if(a.results?.batch||b.results?.batch){
        var note=document.createElement('p');note.className='notice';note.textContent=__ST_TEXT__('batch.compare_note');target.appendChild(note);
        appendComparisonSection(target,__ST_TEXT__('batch.title'),a.results?.batch?.statistics||{},b.results?.batch?.statistics||{});
        appendComparisonSection(target,__ST_TEXT__('batch.rounds'),{rounds:a.results?.batch?.rounds||1,seeds:a.results?.batch?.rows.map(function(r){return r.seed;})||[a.results?.seed]},{rounds:b.results?.batch?.rounds||1,seeds:b.results?.batch?.rows.map(function(r){return r.seed;})||[b.results?.seed]});
      }
      appendChangedInputs(target,a,b);
      appendComparisonSection(target, __ST_TEXT__('comparison.scenario_provenance'), a.scenario || {}, b.scenario || {});
      appendComparisonSection(target, __ST_TEXT__('comparison.simulation_configuration'), a.dynamicConfig || {}, b.dynamicConfig || {});
      appendComparisonSection(target, __ST_TEXT__('comparison.simulation_results'), a.results?.summary || {}, b.results?.summary || {});
      appendComparisonSection(target, __ST_TEXT__('comparison.saved_result_metadata'), comparisonResultMetadata(a.results), comparisonResultMetadata(b.results));
      var byIdA = Object.fromEntries((a.equipment || []).map(function(item) { return [item.id, item]; }));
      var byIdB = Object.fromEntries((b.equipment || []).map(function(item) { return [item.id, item]; }));
      var equipmentIds = (a.equipment || []).map(function(item) { return item.id; });
      (b.equipment || []).forEach(function(item) { if (equipmentIds.indexOf(item.id) === -1) equipmentIds.push(item.id); });
      var metricA = a.results?.equipmentMetrics || {};
      var metricB = b.results?.equipmentMetrics || {};
      equipmentIds.forEach(function(equipmentId) {
        appendComparisonSection(target, __ST_TEXT__('comparison.equipment') + equipmentId, byIdA[equipmentId] || {}, byIdB[equipmentId] || {});
        appendComparisonSection(target, __ST_TEXT__('comparison.simulation_metrics') + equipmentId, metricA[equipmentId] || {}, metricB[equipmentId] || {});
      });
    }

    function appendChangedInputs(target,a,b,basic) {
      var changes=[],affected=new Set();
      var right=Object.fromEntries((b.equipment||[]).map(function(e){return [e.id,e];}));
      (a.equipment||[]).forEach(function(e){
        if(!right[e.id]){changes.push([e.name||e.id,'Removed equipment',e.type,'—']);affected.add(e.id);return;}
        var l=flattenComparisonValues(equipmentInputs(e)),r=flattenComparisonValues(equipmentInputs(right[e.id]));
        Array.from(new Set(Object.keys(l).concat(Object.keys(r)))).forEach(function(key){
          if(JSON.stringify(l[key])!==JSON.stringify(r[key])){var info=basic?STWhatIf.changeInfo({equipmentId:e.id,path:key,before:l[key],after:r[key]},a.equipment):null;changes.push(info?[info.equipment,info.parameter,info.before,info.after]:[e.name||e.id,key,formatComparisonValue(l[key]),formatComparisonValue(r[key])]);affected.add(e.id);}
        });
      });
      (b.equipment||[]).filter(function(e){return !(a.equipment||[]).some(function(x){return x.id===e.id;});}).forEach(function(e){changes.push([e.name||e.id,__ST_TEXT__('comparison.added_equipment'),'—',e.type]);affected.add(e.id);});
      var section=document.createElement('section');section.className='comparison-section';
      var title=document.createElement('h3');title.textContent=__ST_TEXT__('comparison.changed_inputs')+changes.length+__ST_TEXT__('comparison.changes')+affected.size+__ST_TEXT__('comparison.equipment_affected');section.appendChild(title);
      if(!changes.length){var message=document.createElement('p');message.className='chart-note';message.textContent=__ST_TEXT__('comparison.no_equipment_input_differences_run_settings_are_listed_below');section.appendChild(message);}
      else {
        var scroll=document.createElement('div');scroll.className='table-scroll';var table=document.createElement('table');table.innerHTML='<thead><tr><th>Equipment</th><th>Parameter</th><th>Baseline</th><th>Proposed</th></tr></thead><tbody></tbody>';
        changes.forEach(function(change){var tr=document.createElement('tr');change.forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td);});table.querySelector('tbody').appendChild(tr);});scroll.appendChild(table);section.appendChild(scroll);
      }
      target.appendChild(section);
    }
    function equipmentInputs(e) {
      // Saved configuration only; runtime state, calculated metrics and provenance are excluded.
      var inputs={};
      ['name','type','unitOfFlow','nominalRatePerSecond','initialMode','characteristics','noiseProfile','processData'].forEach(function(key){if(e[key]!==undefined)inputs[key]=e[key];});
      return inputs;
    }
    function appendComparisonContext(target, left, right) {
      var context = document.createElement('section');
      context.className = 'comparison-context';
      var leftSeed = left.results?.seed;
      var rightSeed = right.results?.seed;
      var leftDuration = left.results?.durationSeconds;
      var rightDuration = right.results?.durationSeconds;
      var bothSaved = hasSavedSimulationResult(left.results) && hasSavedSimulationResult(right.results);
      var sameRounds=(left.results?.batch?.rounds||1)===(right.results?.batch?.rounds||1),sameEngine=(left.results?.engineId||'ST_CURRENT')===(right.results?.engineId||'ST_CURRENT');
      var paired = bothSaved && leftSeed === rightSeed && leftDuration === rightDuration && sameRounds && sameEngine;
      context.classList.add(paired ? 'comparison-context-paired' : 'comparison-context-caution');
      var heading = document.createElement('strong');
      heading.textContent = left.name + __ST_TEXT__('comparison.vs') + right.name;
      context.appendChild(heading);
      var detail = document.createElement('p');
      if (!bothSaved) {
        detail.textContent = __ST_TEXT__('comparison.configuration_can_be_compared_now_run_and_save_both_simulations_before_inte');
      } else if (paired) {
        detail.textContent = __ST_TEXT__('comparison.paired_run_both_used_seed') + leftSeed + __ST_TEXT__('comparison.and') + leftDuration + __ST_TEXT__('comparison.virtual_seconds_result_differences_can_be_attributed_to_the_saved_configura');
      } else if(!sameRounds||!sameEngine){
        detail.textContent='Different replication counts or simulation engines. Rerun both with matching settings before attributing the result difference to configuration changes.';
      } else {
        detail.textContent = __ST_TEXT__('comparison.comparison_caution_saved_seed_or_virtual_duration_differs') + leftSeed + ' / ' + leftDuration + __ST_TEXT__('comparison.s_vs') + rightSeed + ' / ' + rightDuration + __ST_TEXT__('comparison.s_configuration_differences_remain_valid_but_rerun_both_with_the_same_seed_');
      }
      context.appendChild(detail);
      target.appendChild(context);
    }

    function hasSavedSimulationResult(result) {
      return Boolean(result && result.replay && result.summary &&
        isFiniteNumber(result.seed) && isFiniteNumber(result.durationSeconds));
    }

    function comparisonResultMetadata(result) {
      if (!hasSavedSimulationResult(result)) return {};
      return {
        seed: result.seed,
        durationSeconds: result.durationSeconds,
        completedAt: result.completedAt,
        replaySampleCount: Array.isArray(result.replay?.samples) ? result.replay.samples.length : undefined,
        eventCount: Array.isArray(result.replay?.events) ? result.replay.events.length : undefined
      };
    }

    function appendComparisonSection(target, title, left, right) {
      var section = document.createElement('details'); section.className = 'comparison-section';
      var heading = document.createElement('summary'); heading.textContent = title; section.appendChild(heading);
      var flatLeft = flattenComparisonValues(left); var flatRight = flattenComparisonValues(right);
      section.open = title === __ST_TEXT__('comparison.scenario_provenance') || title === __ST_TEXT__('comparison.simulation_configuration');
      var keys = Array.from(new Set(Object.keys(flatLeft).concat(Object.keys(flatRight)))).sort();
      if (!keys.length) { section.appendChild(document.createTextNode(__ST_TEXT__('comparison.no_saved_values'))); target.appendChild(section); return; }
      keys.forEach(function(key) {
        var leftValue = flatLeft[key]; var rightValue = flatRight[key];
        var row = document.createElement('div'); row.className = 'comparison-row' + (String(leftValue) !== String(rightValue) ? __ST_TEXT__('comparison.comparison_changed') : '');
        row.innerHTML = '<strong></strong><span></span><span></span>';
        row.children[0].textContent = key; row.children[1].textContent = formatComparisonValue(leftValue); row.children[2].textContent = formatComparisonValue(rightValue);
        section.appendChild(row);
      });
      target.appendChild(section);
    }

    function flattenComparisonValues(value, prefix, output) {
      var result = output || {}; var base = prefix || '';
      if (value === null || value === undefined || typeof value !== 'object' || Array.isArray(value)) { result[base || 'value'] = value; return result; }
      Object.keys(value).forEach(function(key) { var path = base ? base + '.' + key : key; var item = value[key]; if (item && typeof item === 'object' && !Array.isArray(item)) flattenComparisonValues(item, path, result); else result[path] = item; });
      return result;
    }

    function formatComparisonValue(value) { return value === undefined || value === null || value === '' ? '—' : Array.isArray(value) ? JSON.stringify(value) : String(value); }


return {render:renderCaseComparison};
};
</script>
