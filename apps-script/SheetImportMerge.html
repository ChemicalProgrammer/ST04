    try{engine().validateFormatCatalog(catalog);}catch(error){issues.push(error.message);}
    result.formatCatalog=catalog;result.initialFormatId=format.id;result.hasChanges=true;
    result.equipmentChanged=!STSheetImportMerge.equal(equipment,snapshot.equipment)||snapshot.initialFormatId!==format.id;
    result.updated=equipment.filter(e=>snapshot.equipment.some(old=>old.id===e.id&&!STSheetImportMerge.equal(old,e))).length;
    result.sourceImport.packingSetup={version:1,sourceKey:sourceKey(result.sourceImport.source),sourceRateBasis:draft.sourceRateBasis,bottlesPerCase:draft.bottlesPerCase,productId:product.id,formatId:format.id,caseEquipmentIds:equipment.slice(index).map(e=>e.id)};
    result.sourceImport.lastApplied.packingSetup=copy(result.sourceImport.packingSetup);
    return result;
  }
  return {create:create,apply:apply,candidates:candidates};
})();
