<style>
.app-shell.case-open.assistant-open { padding-right:var(--assistant-width); }
.gemini-panel { position:fixed; inset:0 0 0 auto; width:var(--assistant-width); z-index:var(--z-sidebar); border-left:var(--border-width) solid var(--line); background:var(--surface); display:flex; flex-direction:column; padding:var(--space-4); gap:var(--space-3); }
.gemini-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-2); }
.gemini-heading h2 { margin:0; } .gemini-heading p { margin:var(--space-1) 0 0; }
#gemini-notice { color:var(--muted); font-size:var(--font-secondary); }
#gemini-messages { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); }
.gemini-message { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; padding:var(--space-3); background:var(--surface-soft); border-radius:var(--radius-md); }
.gemini-message[data-role=user] { background:var(--accent-soft); }
.gemini-message strong { display:block; margin-bottom:var(--space-1); }
.gemini-composer { display:grid; gap:var(--space-2); }
.gemini-composer textarea { resize:vertical; max-height:var(--size-220); width:100%; }
.gemini-actions { display:flex; justify-content:space-between; }
@media(max-width:1100px) { .app-shell.case-open.assistant-open { padding-right:0; } .gemini-panel { width:min(var(--assistant-width),calc(100% - var(--sidebar-collapsed))); box-shadow:var(--shadow-dialog); z-index:var(--z-overlay); } }

#gemini-resize { position:absolute; z-index:1; top:0; bottom:0; left:calc(-1 * var(--space-2)); width:var(--space-4); cursor:col-resize; touch-action:none; }
#gemini-resize:hover,#gemini-resize:focus-visible { background:var(--accent-soft); outline:var(--border-width) solid var(--accent); }
.gemini-heading { flex-shrink:0; }
 .gemini-progress { list-style: none; margin: 0; padding: var(--space-2) var(--space-4); font-size: var(--font-secondary); color: var(--muted); }
 .gemini-progress li { padding: var(--space-1) 0; }
 .gemini-progress li::before { content: '○'; margin-right: var(--space-2); }
 .gemini-progress [data-state="active"] { color: var(--accent); font-weight: var(--weight-medium); }
 .gemini-progress [data-state="active"]::before { content: '◉'; }
 .gemini-progress [data-state="done"]::before { content: '✓'; color: var(--success); }

 .gemini-progress [data-state="error"]::before { content: '!'; }
</style>
