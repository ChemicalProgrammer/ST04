<style>
#faq-dialog{width:min(850px,calc(100vw - 24px));max-height:90dvh;padding:0}
#faq-dialog .dialog-body{overflow:auto;max-height:calc(90dvh - 150px)}
#faq-dialog details{padding:12px 0;border-bottom:1px solid var(--border,#ccd5dd)}
#faq-dialog summary{cursor:pointer;font-weight:600}
#faq-dialog p{line-height:1.55;overflow-wrap:anywhere}
#faq-dialog code{white-space:normal;overflow-wrap:anywhere}
#faq-dialog th,#faq-dialog td{padding:8px;text-align:left;vertical-align:top}
#faq-dialog table{width:100%;border-collapse:collapse}
#faq-dialog .faq-formula{padding:10px;background:var(--surface);border-radius:8px}
html[data-ui-mode="basic"] #faq-advance-controls,.app-shell:not(.case-open) #faq-advance-controls{display:none}
</style>
<dialog id="faq-dialog" class="settings-dialog" aria-labelledby="faq-title">
  <header class="dialog-heading"><h2 id="faq-title">Preguntas frecuentes</h2><button id="faq-close" type="button" class="ghost icon-button" aria-label="Cerrar / Close">×</button></header>
  <div class="dialog-body"><label for="faq-language">Idioma / Language</label><select id="faq-language"><option value="es">Español</option><option value="en">English</option></select><p id="faq-scope" class="chart-note"></p><div id="faq-answers"></div></div>
</dialog>
<script>
window.STFaq=(function(){
  const copy={
  "es": {
    "title": "Preguntas frecuentes",
    "scope": "Comportamiento del motor ST actual. El motor DES experimental tiene reglas distintas; sus indicadores no deben interpretarse como equivalentes.",
    "questions": [
      {
        "q": "¿Qué debemos hacer con las rampas después de un paro?",
        "p": [
          "Definir una política por causa de paro y contrastarla con la operación de cada equipo: reinicio completo, reanudación o recuperación de velocidad. No basta con detectar flujo cero: una máquina puede seguir en marcha sin producto o sin espacio aguas abajo.",
          "Recomendación para una mejora posterior: permitir configurar esa política por equipo y causa. Tras una reparación o un paro físico completo suele corresponder un nuevo arranque si así opera la máquina. En microparos, falta de producto o bloqueo, primero hay que distinguir si el equipo se detuvo físicamente. No reiniciar la rampa en cada tick sin flujo, ni acumular varias rampas simultáneas.",
          "Ramp after repair ya permite una excepción por equipo, apagada por defecto. Las políticas configurables para otras causas siguen siendo una mejora posterior."
        ]
      },
      {
        "q": "¿Cuándo se genera una rampa y cuándo no?",
        "p": [
          "Los contadores acumulan todas las rampas ejecutadas durante la simulación. MTTR mide desde la detención hasta finalizar la reparación. La rampa tras reparación está desactivada por defecto; se habilita por equipo en Additional options > Ramp after repair solo si físicamente existe. Las rampas de inicio, comandos y sensores siguen sus propias reglas. Repair restarts cuenta recuperaciones solicitadas, incluso sin rampa; Start ramps cuenta rampas ejecutadas."
        ],
        "headers": [
          "Situación",
          "Comportamiento actual"
        ],
        "rows": [
          [
            "Inicio de la simulación",
            "Se solicita el arranque de la fuente; los equipos aguas abajo pueden arrancar al recibir la señal Prime."
          ],
          [
            "STOP / PAUSE → RUN",
            "Solicita una nueva secuencia de arranque y la rampa configurada."
          ],
          [
            "Emergencia → RESET → RUN",
            "RESET libera el enclavamiento; RUN solicita el nuevo arranque."
          ],
          [
            "Se libera Back-up",
            "Solicita nuevo arranque si se completó el paro de respuesta y descarga residual. Si se liberó antes, no crea una nueva rampa."
          ],
          [
            "Calendario con RESTART",
            "Cancela la secuencia anterior durante el paro y solicita un nuevo arranque al terminar."
          ],
          [
            "Calendario con RESUME",
            "Conserva la secuencia anterior; no solicita un arranque completo."
          ],
          [
            "Falla → reparación",
            "MTTR termina al finalizar la reparación. Por defecto recupera operación sin retraso ni rampa adicional, sujeto a los demás controles. Solo aplica rampa si activas Ramp after repair en ese equipo; usa su rampa de aceleración configurada."
          ],
          [
            "Microparo",
            "No solicita automáticamente una nueva rampa."
          ],
          [
            "Starving / blocking",
            "No genera por sí solo una nueva rampa. Un reinicio asociado a un sensor sí puede hacerlo."
          ],
          [
            "Paro",
            "Actualmente puede tener respuesta y descarga residual. No hay una desaceleración gradual modelada."
          ]
        ]
      },
      {
        "q": "¿Cómo se calcula la eficiencia teórica?",
        "formula": "Aᵢ = MTBFᵢ / (MTBFᵢ + MTTRᵢ) · Eficiencia teórica = 100 × ∏ Aᵢ",
        "p": [
          "Theoretical equipment efficiency multiplica las disponibilidades de las máquinas, excluyendo conveyors. MTBF y MTTR deben usar la misma unidad. Si faltan datos válidos, el resultado no se interpreta como una medición.",
          "Ejemplo: dos máquinas con 90 % de disponibilidad dan 0.90 × 0.90 × 100 = 81 %. Es una aproximación de disponibilidad de un sistema en serie con fallas independientes y sin desacoplamiento por buffers. No incluye velocidades, rampas, transporte, calendario ni calidad. No es un límite superior de la eficiencia simulada: los buffers pueden desacoplar los paros.",
          "El techo por velocidades es otra métrica: mínimo de las velocidades nominales de máquinas / velocidad de referencia × 100, limitado a 100 %. Con varios formatos se pondera por la producción ideal de cada formato. La velocidad máxima instalada no sustituye automáticamente la nominal configurada."
        ]
      },
      {
        "q": "¿Cómo se calcula la eficiencia simulada?",
        "formula": "Eficiencia simulada (%) = 100 × producción final / producción ideal",
        "p": [
          "Para un formato: producción ideal = velocidad nominal de referencia × duración. El motor limita el porcentaje mostrado al intervalo 0–100 %. La referencia se elige por pacemaker explícito; después Filler; después la primera máquina disponible como referencia.",
          "Con varios formatos, suma la producción ideal de cada período usando velocidades y conversiones a botellas equivalentes de ese formato. El tiempo del calendario incluido en el horizonte permanece en el denominador ideal; los paros reducen la producción. Revisa si usas el período completo o un horizonte ya reducido por el calendario.",
          "La producción final refleja fallas, microparos, retrasos, rampas, transporte, starving, blocking y eventos que el motor efectivamente modela. La calidad se asume 100 % porque no se simulan rechazos. Con varias rondas, Results muestra por defecto el promedio de sus eficiencias; también permite elegir una ronda. El indicador AU de planta requiere su propio denominador y no es automáticamente idéntico a este OEE."
        ]
      },
      {
        "q": "¿Cómo se evalúa Rate Loss?",
        "formula": "Pérdida bruta = Σ max(0, Δt − producción / referencia) · Recuperación = Σ max(0, producción / referencia − Δt) · Runtime − tiempo equivalente = pérdida − recuperación",
        "p": [
          "El cálculo integra cada tick con flujo positivo a la salida final y usa la referencia nominal del formato activo. Registra por separado pérdida bruta por flujo menor a la referencia, recuperación por flujo mayor y balance neto firmado. Los intervalos sin flujo no se suman a Rate Loss.",
          "Una descarga de producto acumulado o una máquina final más rápida puede superar temporalmente al pacemaker. Eso no prueba una referencia incorrecta. ABOVE_REFERENCE_OUTPUT identifica este caso; el balance neto puede ser negativo sin borrar las pérdidas de otros ticks.",
          "Por ejemplo, dos ticks de un minuto a 150 y 450 botellas/min, con referencia de 300, generan 0.5 min de pérdida y 0.5 min de recuperación: balance cero. Convertir el balance negativo a cero no mide las pérdidas por separado.",
          "El valor de planta es solo comparativo. Si existe recuperación, Real Data muestra la pérdida bruta simulada pero retiene la diferencia de Rate Loss hasta confirmar si la fuente usa pérdidas brutas o balance neto. No añade campos de captura ni modifica las otras diferencias.",
          "No sumes fallas o rampas de equipos para obtener downtime o Rate Loss exclusivo de línea. Repair restarts puede ser mayor que cero con repairRampEnabled=false: el equipo reinicia sin rampa. Los parámetros de sensores de un conveyor pueden activar la rampa de una máquina vecina.",
          "Vuelve a simular resultados antiguos para obtener las nuevas mediciones. La calidad sigue asumida al 100 %; una señal Runtime del PLC puede usar una definición distinta de flujo positivo."
        ]
      },
      {
        "q": "¿Cómo trabaja un equipo con estados, rampas y buffers?",
        "p": [
          "El motor avanza en pasos de tiempo. Evalúa eventos y disponibilidad, mueve producto en conveyors y procesa desde la salida hacia la entrada. El flujo de cada equipo está limitado por su capacidad en ese paso, producto disponible y espacio aguas abajo. Las conversiones de cajas y botellas dependen del formato.",
          "Los estados describen lo ocurrido en cada paso. Los tiempos de equipos distintos pueden coincidir; no deben sumarse como downtime exclusivo de línea. Las botellas de rampas son unidades procesadas durante esas fases, no botellas rechazadas ni necesariamente perdidas."
        ],
        "headers": [
          "Estado / fase",
          "Interpretación"
        ],
        "rows": [
          [
            "RUNNING",
            "Procesa producto; restricciones parciales pueden reducir el flujo."
          ],
          [
            "STARTING",
            "Retraso previo al arranque; no es tiempo de rampa."
          ],
          [
            "RAMPING_UP",
            "La capacidad aumenta con el progreso de la rampa, hasta la nominal configurada."
          ],
          [
            "STARVED / WAITING_FOR_PRIME",
            "No tiene producto suficiente o espera autorización por Prime."
          ],
          [
            "BLOCKED / BACKUP_STOP",
            "No tiene espacio de descarga o está detenido por control Back-up."
          ],
          [
            "BACKUP_STOPPING",
            "Tiempo de respuesta y descarga residual; no representa una rampa de desaceleración."
          ],
          [
            "FAILURE / MICRO_STOP",
            "La reparación permite recuperación sin rampa por defecto; Ramp after repair habilita una excepción por equipo. Los microparos conservan su reanudación."
          ],
          [
            "PLANNED_STOP / PAUSED / STOPPED",
            "Paro de calendario o comando; las reglas de reanudación dependen de la causa."
          ],
          [
            "EMERGENCY_STOP",
            "Enclavamiento que requiere RESET y después RUN."
          ]
        ]
      }
    ]
  },
  "en": {
    "title": "Frequently asked questions",
    "scope": "Current ST engine behavior. Experimental DES has different rules; its indicators are not equivalent.",
    "questions": [
      {
        "q": "What should we do about ramps after a stop?",
        "p": [
          "Define and validate a restart policy per equipment and stop cause: full restart, resume or speed recovery. Zero output does not prove the machine physically stopped.",
          "A future improvement should make these policies configurable. Repairs and complete physical stops may require a fresh start; microstops, starvation and blocking depend on actual machine controls. Do not reset a ramp every zero-flow tick or stack concurrent ramps.",
          "Ramp after repair already provides an equipment-specific exception, off by default. Configurable policies for other stop causes remain a future improvement."
        ]
      },
      {
        "q": "When is a ramp generated?",
        "p": [
          "Counters accumulate executed ramps throughout the run. MTTR is measured from machine stop until repair ends. Repair ramps default to off; enable Additional options > Ramp after repair only for equipment that physically requires it. Initial, command and sensor ramps remain independent. Repair restarts counts requested recoveries, including immediate ones; Start ramps counts executed ramps."
        ],
        "headers": [
          "Situation",
          "Current behavior"
        ],
        "rows": [
          [
            "Initial start",
            "The source requests startup; downstream equipment can start on Prime authorization."
          ],
          [
            "STOP / PAUSE → RUN",
            "Requests a new startup sequence with the configured ramp."
          ],
          [
            "Emergency → RESET → RUN",
            "RESET releases the latch; RUN requests startup."
          ],
          [
            "Back-up clears",
            "Requests startup only if the response/residual-discharge stop completed. Early release does not create another ramp."
          ],
          [
            "Calendar RESTART",
            "Cancels the previous sequence and requests a new one after the stop."
          ],
          [
            "Calendar RESUME",
            "Retains the previous sequence; no full restart is requested."
          ],
          [
            "Repair completes",
            "MTTR ends when repair is finished. Recovery has no extra delay or ramp by default, subject to other controls. Enable Ramp after repair for this equipment only if actual speed recovery is required; it uses the configured acceleration ramp."
          ],
          [
            "Microstop ends",
            "Does not automatically request another ramp."
          ],
          [
            "Starvation / blocking",
            "Does not automatically create a ramp. A sensor-related restart can do so."
          ],
          [
            "Stopping",
            "Response and residual discharge can be modeled; gradual deceleration is not modeled."
          ]
        ]
      },
      {
        "q": "How is theoretical efficiency calculated?",
        "formula": "Aᵢ = MTBFᵢ / (MTBFᵢ + MTTRᵢ) · Theoretical efficiency = 100 × ∏ Aᵢ",
        "p": [
          "Theoretical equipment efficiency multiplies machine availabilities, excluding conveyors. MTBF and MTTR must use the same unit. Missing valid inputs do not represent measured availability.",
          "Two machines at 90% availability give 81%. This is a series-system approximation with independent failures and no buffer decoupling. It excludes speed, ramps, transport, calendar and quality. It is not an upper bound for simulated efficiency: buffers can decouple stops.",
          "The nominal speed ceiling is different: minimum nominal machine rate / reference rate × 100, capped at 100%. Multiple formats use ideal-output weighting. Installed maximum speed does not automatically replace the configured nominal rate."
        ]
      },
      {
        "q": "How is simulated efficiency calculated?",
        "formula": "Simulated efficiency (%) = 100 × final output / ideal output",
        "p": [
          "For one format, ideal output = nominal reference speed × duration. The displayed engine percentage is clamped to 0–100%. Reference selection: explicit pacemaker, then Filler, then the first fallback machine.",
          "Multiple formats sum ideal output for each period using their reference rates and bottle-equivalent conversions. Calendar time included in the horizon remains in the ideal denominator while stops reduce output. Check whether the horizon is the full calendar period or was already reduced.",
          "Final output reflects the failures, microstops, delays, ramps, transport, starvation, blocking and events actually represented by the engine. Quality is assumed 100%; rejects are not modeled. Results defaults to the mean of round efficiencies; individual rounds can be selected. Plant AU uses its own denominator and is not automatically identical to simulated OEE."
        ]
      },
      {
        "q": "How is Rate Loss evaluated?",
        "formula": "Gross loss = Σ max(0, Δt − output / reference) · Recovery = Σ max(0, output / reference − Δt) · Runtime − effective time = loss − recovery",
        "p": [
          "Integrate each positive final-output tick using its active format nominal reference. Record gross below-reference shortfall, above-reference recovery and signed net balance separately. No-flow intervals are not Rate Loss.",
          "Buffer discharge or faster final equipment can temporarily exceed the pacemaker rate. That alone does not invalidate the reference. ABOVE_REFERENCE_OUTPUT identifies this case; net balance can be negative without erasing other ticks of shortfall.",
          "For example, one minute at 150 followed by one minute at 450 bottles/min, at a 300 reference, gives 0.5 min gross loss and 0.5 min recovery: zero net balance. Clipping a negative total balance to zero is not separate loss accounting.",
          "Plant Rate Loss is observation-only. When recovery is present, Real Data displays simulated gross loss but withholds only its difference pending confirmation of the source gross/net definition. No additional capture fields are required.",
          "Equipment failures and ramps must not be summed as exclusive line downtime or Rate Loss. Repair restarts with repairRampEnabled=false are valid immediate restarts. Conveyor sensor ramp settings can control neighboring machines.",
          "Re-run old results for the new metrics. Quality remains assumed 100%; PLC runtime may differ from the positive-flow convention."
        ]
      },
      {
        "q": "How do equipment states, ramps and buffers work?",
        "p": [
          "Each time step evaluates events and availability, moves conveyor product and processes equipment from downstream to upstream. Flow is limited by capacity, available product and downstream space. Case/bottle conversions depend on the format.",
          "States describe observed steps. Equipment times can overlap and must not be summed as exclusive line downtime. Ramp bottle counts are processed units, not rejected or necessarily lost bottles."
        ],
        "headers": [
          "State / phase",
          "Meaning"
        ],
        "rows": [
          [
            "RUNNING",
            "Processes product; partial constraints can reduce flow."
          ],
          [
            "STARTING",
            "Startup delay, separate from ramp time."
          ],
          [
            "RAMPING_UP",
            "Capacity increases with ramp progress up to configured nominal speed."
          ],
          [
            "STARVED / WAITING_FOR_PRIME",
            "Insufficient product or pending Prime authorization."
          ],
          [
            "BLOCKED / BACKUP_STOP",
            "Insufficient downstream space or Back-up control stop."
          ],
          [
            "BACKUP_STOPPING",
            "Response and residual discharge; not a deceleration ramp."
          ],
          [
            "FAILURE / MICRO_STOP",
            "Repairs recover without a ramp by default; Ramp after repair enables an equipment-specific exception. Microstops retain their resume behavior."
          ],
          [
            "PLANNED_STOP / PAUSED / STOPPED",
            "Calendar or commanded stop; resume rules depend on the cause."
          ],
          [
            "EMERGENCY_STOP",
            "Latched stop requiring RESET followed by RUN."
          ]
        ]
      }
    ]
  }
};
  let lastFocus;
  function icon(){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.5 2.5 0 0 1 5 .5c0 1.8-2.5 2-2.5 4M12 17h.01"/></svg>';}
  function render(){
    const lang=document.getElementById('faq-language').value,c=copy[lang]||copy.en,body=document.getElementById('faq-answers');
    document.getElementById('faq-dialog').lang=lang;document.getElementById('faq-title').textContent=c.title;document.getElementById('faq-scope').textContent=c.scope;body.replaceChildren();
    c.questions.forEach((item,index)=>{const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent=item.q;details.append(summary);details.open=index===0;
      if(item.formula){const formula=document.createElement('p');formula.className='faq-formula';formula.textContent=item.formula;details.append(formula);}
      item.p.forEach(text=>{const p=document.createElement('p');p.textContent=text;details.append(p);});
      if(item.rows){const scroll=document.createElement('div');scroll.className='table-scroll';const table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr'),rows=document.createElement('tbody');item.headers.forEach(text=>{const th=document.createElement('th');th.scope='col';th.textContent=text;hr.append(th);});head.append(hr);item.rows.forEach(row=>{const tr=document.createElement('tr');row.forEach((text,i)=>{const cell=document.createElement(i?'td':'th');if(!i)cell.scope='row';cell.textContent=text;tr.append(cell);});rows.append(tr);});table.append(head,rows);scroll.append(table);details.append(scroll);}body.append(details);
    });
  }
  function open(){const dialog=document.getElementById('faq-dialog');if(dialog.open)return;lastFocus=document.activeElement;render();dialog.showModal();}
  function init(){
    document.querySelectorAll('[data-faq-trigger]').forEach(b=>{b.innerHTML=icon();b.addEventListener('click',open);});
    document.getElementById('faq-header-settings').onclick=()=>window.STSettings.open();
    document.getElementById('faq-close').onclick=()=>document.getElementById('faq-dialog').close();
    document.getElementById('faq-dialog').addEventListener('close',()=>lastFocus?.isConnected&&lastFocus.focus());
    document.getElementById('faq-language').onchange=render;render();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
  return {open,render,icon};
})();
</script>
