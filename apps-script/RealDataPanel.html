<section id="realdata-panel" class="card hidden" aria-labelledby="real-data-title">
  <div class="section-heading"><div><h2 id="real-data-title">Real Data</h2><p id="real-data-simulation"></p></div><div class="button-row"><button id="real-data-export-json" type="button" class="secondary" disabled>Exportar JSON</button><button id="real-data-export-html" type="button" class="secondary" disabled>Exportar reporte</button></div></div>
  <div class="real-data-toolbar"><label>Registro<select id="real-data-record"></select></label><div class="button-row"><button id="real-data-new" type="button" class="secondary">Nuevo registro</button><button id="real-data-import" type="button" class="secondary">Importar JSON</button><button id="real-data-template" type="button" class="ghost">Template</button><button id="real-data-delete" type="button" class="ghost" disabled>Eliminar registro</button><input id="real-data-file" type="file" accept=".json,application/json" hidden></div></div>
  <p id="real-data-status" class="chart-note" role="status" aria-live="polite"></p>
  <section class="real-data-block" aria-labelledby="real-data-register-title"><h3 id="real-data-register-title">1. Registro</h3><div id="real-data-editor"><p>Selecciona o crea un registro para capturar los datos de planta.</p></div></section>
  <section class="real-data-block" aria-labelledby="real-data-compare-title"><div class="real-data-block-heading"><h3 id="real-data-compare-title">2. Comparación de parámetros</h3><label>Resultados guardados<select id="real-data-view"><option value="average">Promedio de rondas</option></select></label></div><label class="real-data-filter"><input id="real-data-known-only" type="checkbox" checked>Mostrar solo parámetros con datos</label><div id="real-data-comparison" class="table-scroll"></div></section>
  <section class="real-data-block" aria-labelledby="real-data-calibration-title"><h3 id="real-data-calibration-title">3. Ajuste calibrado de rate loss</h3><div id="real-data-calibration"></div></section>
  <section class="real-data-block" aria-labelledby="real-data-downtime-title"><h3 id="real-data-downtime-title">4. Downtime por fallas de equipos</h3><div id="real-data-downtime-comparison" class="table-scroll"></div></section>
  <details id="real-data-review" class="real-data-review"><summary id="real-data-review-summary">Revisión de datos</summary><ul id="real-data-warnings"></ul><div id="real-data-evidence"></div></details>
</section>
