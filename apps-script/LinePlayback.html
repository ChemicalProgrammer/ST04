<style>
.line-layout-toolbar,.line-layout-legend { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3); }
.line-layout-toolbar { justify-content:space-between; }
.line-layout-toolbar label { display:flex; align-items:center; gap:var(--space-2); }
.line-layout-scroll { position:relative; height:clamp(210px,34vh,420px); overflow:hidden; touch-action:none; cursor:grab; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); }
.line-layout-scroll:active { cursor:grabbing; }
.line-layout-stage { position:absolute; inset:0 auto auto 0; transform-origin:0 0; }
.line-layout-track { display:flex; align-items:center; width:max-content; }
.line-layout-tabs [aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
.line-layout-toolbar { margin-bottom:var(--space-2); }
.line-layout-legend { margin-top:var(--space-2); }
.line-layout-track > * { flex:none; box-sizing:border-box; }
.line-layout-machine { display:grid; align-content:center; gap:var(--space-1); width:128px; min-height:92px; padding:var(--space-2); border:1px solid var(--line); border-inline-start:4px solid var(--line-state,var(--line)); border-radius:var(--radius-md); background:color-mix(in srgb,var(--line-state,var(--line)) 12%,var(--surface)); }
.line-layout-machine strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line-layout-machine small,.line-layout-belt small { color:var(--muted); font-size:var(--font-secondary); }
.line-layout-belt { position:relative; height:94px; min-width:1px; text-align:center; }
.line-layout-belt > strong,.line-layout-belt > small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line-layout-belt > small { position:absolute; inset-inline:0; bottom:0; }
.line-layout-rail { position:absolute; inset:38px 0 auto; height:25px; border-block:2px solid var(--line-strong); background:var(--surface); }
.line-layout-rail.line-belt-stopped { border-block-color:var(--line-state); }
.line-layout-products { display:block; width:100%; height:100%; }
.line-layout-sensor { position:absolute; top:0; z-index:1; display:grid; place-items:center; width:20px; height:20px; transform:translate(-50%,-65%); border:1px solid var(--line-strong); border-radius:50%; background:var(--surface); color:var(--ink); font-size:11px; }
.line-layout-sensor.is-active { border:2px solid var(--line-state); font-weight:700; }
.line-layout-legend span::before { content:""; display:inline-block; width:.6em; height:.6em; margin-inline-end:.4em; border-radius:50%; background:var(--line-state); }
.line-running { --line-state:#259565; }
.line-ramp { --line-state:#267cc8; }
.line-waiting { --line-state:#b88925; }
.line-blocked { --line-state:#b16931; }
.line-stopped { --line-state:#c15362; }
</style>
<script>
window.STLinePlayback=(function(){
  var current,animationFrame,camera={x:0,y:0,scale:1,fit:true},drag;
  var bottle=window.Path2D?new Path2D('M0 30V17Q0 14 4 10V2H10V10Q14 14 14 17V30Q14 32 12 32H2Q0 32 0 30Z'):null;
  var carton=window.Path2D?new Path2D('M1 6L5 2H13L15 6V12H1Z M1 6H15 M8 2V6'):null;
  function element(tag,className,text){
    var node=document.createElement(tag);
    if(className)node.className=className;
    if(text!==undefined)node.textContent=text;
    return node;
  }
  function number(value){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function machineClass(state){
    if(state==='RUNNING')return 'line-running';
    if(['RAMPING_UP','STARTING'].includes(state))return 'line-ramp';
    if(['STARVED','WAITING_FOR_PRIME'].includes(state))return 'line-waiting';
    if(['BLOCKED','BACKUP_STOP','BACKUP_STOPPING'].includes(state))return 'line-blocked';
    if(['FAILED','FAILURE','STOPPED','EMERGENCY_STOP','PLANNED_STOP','PAUSED','MICRO_STOP'].includes(state))return 'line-stopped';
    return '';
  }
  function transitPositions(bands,length,width,geometry,tail){
    var pitch=geometry.productPitchMm;
    if(!bands?.length||!(pitch>0))return [];
    var runs=[],bandWidth=length/24;
    for(var index=0;index<bands.length;index+=2){
      var count=bands[index],center=bands[index+1],run=runs.at(-1);
      if(run&&center-run.last<=bandWidth*1.5){
        run.count+=count;
        run.weighted+=center*count;
        run.last=center;
      }else runs.push({count:count,weighted:center*count,first:center,last:center});
    }
    var positions=[],edge=(geometry.productLengthMm||pitch)/2,end=tail-edge,last=-Infinity;
    runs.forEach(function(run){
      var count=Math.max(1,Math.round(run.count));
      var pitchInFlow=Math.max(pitch,(run.last-run.first+bandWidth)/Math.max(1,run.count));
      if(run.first===run.last)pitchInFlow=pitch;
      var stride=Math.max(1,Math.ceil(Math.max(length/400,2*length/width)/pitchInFlow));
      var gap=pitchInFlow*stride,visible=Math.ceil(count/stride);
      var first=Math.max(edge,last+gap,Math.min(end-(visible-1)*gap,run.weighted/run.count-(visible-1)*gap/2));
      for(var position=first;visible>0&&position<=end;visible--,position+=gap){
        positions.push(position);
        last=position;
      }
    });
    return positions;
  }
  function applyCamera(){
    var stage=document.querySelector('.line-layout-stage');
    stage.style.transform='translate('+camera.x+'px,'+camera.y+'px) scale('+camera.scale+')';
    document.getElementById('line-layout-zoom').value=camera.scale;
  }
  function fitCamera(){
    var track=document.getElementById('line-layout-track'),viewport=track.closest('.line-layout-scroll');
    if(!track.offsetWidth||!viewport.clientWidth)return;
    camera.scale=Math.max(.05,Math.min(1,(viewport.clientWidth-24)/track.offsetWidth,(viewport.clientHeight-24)/track.offsetHeight));
    camera.x=(viewport.clientWidth-track.offsetWidth*camera.scale)/2;
    camera.y=(viewport.clientHeight-track.offsetHeight*camera.scale)/2;
    camera.fit=true;
    applyCamera();
  }
  function zoomAt(scale,x,y){
    scale=Math.max(.05,Math.min(8,scale));
    var ratio=scale/camera.scale;
    camera={x:x-(x-camera.x)*ratio,y:y-(y-camera.y)*ratio,scale:scale,fit:false};
    applyCamera();
  }
  function prepareProducts(rail,zone,nextZone,length,width,seconds){
    if(width<1)return null;
    var geometry=zone.geometry,packageWidth=geometry.productLengthMm||geometry.accumulatedPitchMm;
    if(!(packageWidth>0))return null;
    var canvas=element('canvas','line-layout-products');
    canvas.setAttribute('aria-hidden','true');
    var resolution=Math.min(window.devicePixelRatio||1,8192/width);
    canvas.width=Math.max(1,Math.round(width*resolution));
    canvas.height=Math.max(1,Math.round(21*resolution));
    rail.append(canvas);
    var context=canvas.getContext('2d');
    if(!context)return null;
    var tail=Math.min(length,Math.max(0,zone.queueTailPositionMm??length));
    var pitch=geometry.accumulatedPitchMm||packageWidth;
    var queueCount=Math.min(Math.round(zone.waitingUnits||0),Math.floor(length/pitch));
    var queueStride=Math.max(1,Math.ceil(queueCount/240));
    var discharged=Number.isFinite(nextZone?.dischargedUnits)&&Number.isFinite(zone.dischargedUnits)
      ? Math.max(0,nextZone.dischargedUnits-zone.dischargedUnits)
      : Math.max(0,(zone.waitingUnits||0)-(nextZone?.waitingUnits??zone.waitingUnits??0));
    function positions(sample){
      return sample.transitPositionsMm||transitPositions(sample.transitBands,length,width,geometry,sample.queueTailPositionMm??length);
    }
    var moving=positions(zone);
    var speed=zone.beltRunning===false||!(zone.transitBands||zone.transitPositionsMm)?0:Math.max(0,geometry.conveyorSpeedMmPerSecond||0);
    // Reconstruct visible entries from the next recorded frame, using the
    // same belt speed as product already on the belt.
    var entering=[];
    if(speed>0&&nextZone?.beltRunning!==false&&(nextZone?.transitBands||nextZone?.transitPositionsMm)&&seconds>0){
      entering=positions(nextZone)
        .map(function(position){return position-speed*seconds;})
        .filter(function(position){return position<0;});
    }
    var style=getComputedStyle(rail);
    var movingColor=style.getPropertyValue('--accent').trim()||'#267cc8';
    var queueColor=style.getPropertyValue('--line-queue-color').trim()||'#b16931';
    var diameter=Math.min(10,packageWidth*width/length)*resolution;
    var pixelsPerMm=canvas.width/length,mid=canvas.height/2;
    function paint(positions,offset,color,min,max){
      context.fillStyle=color;
      var isCase=zone.packageUnit==='CASES';
      var shape=isCase?carton:bottle;
      positions.forEach(function(origin){
        var position=origin+offset;
        if(position<min||position>max)return;
        var x=position*pixelsPerMm,r=diameter/2;
        if(!shape||diameter<2){
          context.fillRect(x-r,mid,diameter,Math.min(8*resolution,mid));
          return;
        }
        context.save();
        context.translate(x-r,isCase?mid*.55:mid*.18);
        context.scale(diameter/(isCase?16:14),(isCase?mid*1.25:mid*1.45)/(isCase?12:32));
        context.fill(shape);
        if(isCase){
          context.strokeStyle=style.getPropertyValue('--surface').trim()||'#fff';
          context.lineWidth=.75;
          context.stroke(shape);
        }
        context.restore();
      });
    }
    return function(elapsed){
      context.clearRect(0,0,canvas.width,canvas.height);
      var offset=speed*elapsed;
      var release=speed>0&&seconds>0?Math.min(queueCount,discharged*elapsed/seconds):0;
      var queued=[];
      var edge=packageWidth/2;
      for(var index=Math.floor(release);index<queueCount;index+=queueStride){
        queued.push(Math.min(length-edge,length-(index+.5-release)*pitch));
      }
      var queueTail=queueCount>release?length-(queueCount-.5-release)*pitch:length-edge+pitch;
      var projected=entering.concat(moving);
      var rolling=[],arriving=[];
      var minimumPitch=geometry.productPitchMm||pitch;
      var nextPosition=queueTail;
      for(var index=projected.length-1;index>=0;index--){
        var free=projected[index]+offset;
        var limit=nextPosition-pitch;
        var joinsQueue=free>=limit&&queueCount>release||arriving.length>0&&free>=limit;
        if(!joinsQueue&&free>length-edge&&seconds>0&&discharged>release)continue;
        var position=joinsQueue?limit:Math.min(free,limit,length-edge);
        if(position<edge)continue;
        if(joinsQueue)arriving.push(position);
        else rolling.push(position);
        nextPosition=position-(joinsQueue?0:Math.max(0,minimumPitch-pitch));
      }
      paint(queued,0,queueColor,0,length);
      paint(arriving,0,queueColor,0,length);
      paint(rolling,0,movingColor,0,length);
    };
  }
  function zonesByOwner(frame,definitions){
    return new Map((frame?.accumulationZones||[]).map(function(item){
      var zone={...definitions?.[item.id],...item};
      return [zone.ownerEquipmentId,zone];
    }));
  }
  function addSensor(rail,sensor,name,length,active){
    if(!sensor?.configured||!Number.isFinite(sensor.positionMm))return;
    var indicator=element('span','line-layout-sensor'+(active?' is-active '+(name==='Prime'?'line-running':'line-blocked'):''),name==='Prime'?'P':'B');
    indicator.style.left=(100*Math.max(0,Math.min(1,sensor.positionMm/length)))+'%';
    indicator.title=name+' · '+number(sensor.positionMm/1000)+' m · '+String(sensor.state||'—');
    indicator.setAttribute('aria-label',indicator.title);
    rail.append(indicator);
  }
  function draw(){
    if(animationFrame!==undefined)window.cancelAnimationFrame(animationFrame);
    animationFrame=undefined;
    var track=document.getElementById('line-layout-track');
    if(!track||!current)return;
    var {equipment,frame,definitions,next,clock}=current;
    var time=document.getElementById('line-layout-time'),note=document.getElementById('line-layout-note');
    time.textContent=frame?'Playback · '+number(frame.virtualSecond)+' s':'';
    track.replaceChildren();
    if(!frame){note.textContent='Run a simulation with playback history to see the line layout.';return;}
    var units=new Map((frame.equipment||[]).map(item=>[item.id,item]));
    var zones=zonesByOwner(frame,definitions),nextZones=zonesByOwner(next,definitions);
    var seconds=next?Math.max(0,next.virtualSecond-frame.virtualSecond):0;
    var painters=[];
    var scale=.045; // Base scene scale, in pixels per millimetre.
    var missingLength=false,missingTransit=false;
    equipment.forEach(function(item){
      var sample=units.get(item.id);
      if(item.type!=='CONVEYOR'){
        var state=sample?.availabilityState||sample?.mode||'UNKNOWN';
        var card=element('div','line-layout-machine '+machineClass(state));
        card.append(element('strong','',item.name||item.id),element('small','',state.replace(/_/g,' ')));
        if(Number.isFinite(sample?.actualRatePerSecond))card.append(element('small','',number(sample.actualRatePerSecond*60)+' / min'));
        card.title=item.name||item.id;
        track.append(card);
        return;
      }
      var zone=zones.get(item.id),length=zone?.geometry?.usableLengthMm;
      var belt=element('div','line-layout-belt'),rail=element('div','line-layout-rail');
      var usable=Number.isFinite(length)&&length>0,width=usable?length*scale:72;
      belt.style.width=width+'px';
      belt.append(element('strong','',item.name||item.id),rail,element('small','',usable?number(length/1000)+' m · '+number(zone.inventoryUnits)+' in belt · '+(zone.beltRunning===false?'Stopped':'Belt moving'):'Length unavailable'));
      belt.title=(item.name||item.id)+' · '+(usable?number(length/1000)+' m · '+number(zone.waitingUnits)+' queued · '+number(zone.inTransitUnits)+' in transit':'Length unavailable');
      if(usable){
        if(zone.beltRunning===false)rail.classList.add('line-belt-stopped','line-stopped');
        var paint=prepareProducts(rail,zone,nextZones.get(item.id),length,width,seconds);
        if(paint)painters.push(paint);
        addSensor(rail,zone.prime,'Prime',length,zone.prime?.latched);
        addSensor(rail,zone.backup,'Back-up',length,zone.backup?.controlActive);
        if(zone.transitBands===undefined&&zone.transitPositionsMm===undefined&&zone.inTransitUnits>0)missingTransit=true;
      }else missingLength=true;
      track.append(belt);
    });
    function animate(){
      animationFrame=undefined;
      if(track.closest('[hidden], .hidden'))return;
      var timing=clock?.()||{};
      var elapsed=Math.max(0,Math.min(seconds,timing.elapsed||0));
      painters.forEach(function(paint){paint(elapsed);});
      time.textContent='Playback · '+number(frame.virtualSecond+elapsed)+' s';
      if(timing.playing&&seconds>0&&elapsed<seconds&&painters.length)animationFrame=window.requestAnimationFrame(animate);
    }
    if(camera.fit)fitCamera();else applyCamera();
    animate();
    note.textContent='Conveyors use a shared length scale. B = Back-up, P = Prime. Belt motion and queue discharge are interpolated between samples. Drag to pan; Ctrl/⌘ + scroll to zoom.'
      +(missingLength?' Conveyors without recorded geometry use a placeholder.':'')
      +(missingTransit?' This replay has no positions for product in transit.':'');
  }
  var viewport=document.querySelector('.line-layout-scroll');
  document.getElementById('line-layout-fit').addEventListener('click',fitCamera);
  document.getElementById('line-layout-zoom').addEventListener('input',function(){
    zoomAt(Number(this.value),viewport.clientWidth/2,viewport.clientHeight/2);
  });
  viewport.addEventListener('wheel',function(event){
    if(!event.ctrlKey&&!event.metaKey)return;
    event.preventDefault();
    var bounds=viewport.getBoundingClientRect();
    zoomAt(camera.scale*Math.exp(-event.deltaY/350),event.clientX-bounds.left,event.clientY-bounds.top);
  },{passive:false});
  viewport.addEventListener('pointerdown',function(event){
    if(event.button!==0&&event.button!==1)return;
    drag={id:event.pointerId,x:event.clientX-camera.x,y:event.clientY-camera.y};
    viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener('pointermove',function(event){
    if(drag?.id!==event.pointerId)return;
    camera={x:event.clientX-drag.x,y:event.clientY-drag.y,scale:camera.scale,fit:false};
    applyCamera();
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(name){
    viewport.addEventListener(name,function(event){if(drag?.id===event.pointerId)drag=null;});
  });
  viewport.addEventListener('keydown',function(event){
    var moves={ArrowLeft:[32,0],ArrowRight:[-32,0],ArrowUp:[0,32],ArrowDown:[0,-32]};
    var move=moves[event.key];
    if(!move)return;
    event.preventDefault();
    camera={x:camera.x+move[0],y:camera.y+move[1],scale:camera.scale,fit:false};
    applyCamera();
  });
  return {render:function(equipment,frame,definitions,next,clock){current={equipment,frame,definitions,next,clock};draw();}};
})();
</script>
