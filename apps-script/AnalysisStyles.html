<style>
  :root { --vgraph-current:#15803d; --vgraph-recommended:#c026d3; }
  :root[data-theme=dark] { --vgraph-current:#4ade80; --vgraph-recommended:#e879f9; }
  .line-performance { margin-top: var(--space-5); border-top: var(--border-width) solid var(--line); padding-top: var(--space-4); }
  .line-performance h3 { font-size: var(--font-card); }
  .vgraph-legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: var(--font-secondary); color: var(--muted); }
  .vgraph-key { display: inline-flex; align-items: center; gap: var(--space-2); }
  .vgraph-key-normal { color:var(--vgraph-current); }
  .vgraph-key-recommended { color:var(--vgraph-recommended); }
  .vgraph-key::before { content: ''; width: var(--size-16); border-top: var(--focus-width) solid var(--vgraph-current); }
  .vgraph-key-recommended::before { border-color: var(--vgraph-recommended); }
  .vgraph-plot { width: 100%; overflow-x: auto; }
  .vgraph-plot svg { display: block; width: 100%; height: var(--vgraph-height); min-width: var(--vgraph-min-width); }
  .vgraph-grid { stroke: var(--chart-grid); stroke-width: var(--border-width); }
  .vgraph-label { fill: var(--muted); font-size: var(--font-caption); }
  .vgraph-reference { fill: var(--accent); font-size: var(--font-caption); font-weight: var(--weight-bold); }
  .vgraph-normal, .vgraph-recommended { fill: none; stroke-width: var(--focus-width); stroke-linecap: round; stroke-linejoin: round; }
  .vgraph-normal { stroke: var(--vgraph-current); }
  .vgraph-recommended { stroke: var(--vgraph-recommended); stroke-dasharray:6 4; }
  .vgraph-normal-dot { fill:var(--surface); stroke:var(--vgraph-current); stroke-width:2; }
  .vgraph-value { font-size:var(--font-caption); font-weight:var(--weight-bold); }
  .vgraph-normal-value { fill:var(--vgraph-current); }
  .vgraph-recommended-value { fill:var(--vgraph-recommended); }
  .vgraph-recommended-dot { fill: var(--vgraph-recommended); }
  .simulation-analysis { background: var(--surface); border: var(--size-1) solid var(--line); border-radius: var(--size-12); margin-top: var(--size-16); padding: var(--size-16); }
  .simulation-analysis-heading h3 { color: var(--ink); font-size: var(--text-16); margin: 0 0 var(--size-4); }
  .simulation-analysis-heading p { font-size: var(--text-12); margin: 0; max-width: var(--size-980); }
  .simulation-analysis-content { margin-top: var(--size-14); }
  .simulation-analysis-grid { display: grid; gap: var(--size-12); grid-template-columns: minmax(0, 1.15fr) minmax(var(--size-300), .85fr); }
  .analysis-finding, .analysis-recommendation, .analysis-no-action { background: var(--surface); border: var(--size-1) solid var(--line); border-radius: var(--size-9); padding: var(--size-14); }
  .analysis-finding { border-left: var(--state-border-width) solid var(--accent); }
  .analysis-finding.analysis-critical { border-left-color: var(--danger); }
  .analysis-finding.analysis-attention { border-left-color: var(--starved); }
  .analysis-status { border-radius: var(--size-99); display: inline-block; font-size: var(--text-9); font-weight: var(--weight-bold); letter-spacing: .06em; padding: var(--size-4) var(--size-7); text-transform: uppercase; }
  .analysis-status-stable { background: var(--success-soft); color: var(--success); }
  .analysis-status-attention { background: var(--warning-soft); color: var(--warning); }
  .analysis-status-critical, .analysis-status-input-required { background: var(--danger-soft); color: var(--danger); }
  .analysis-finding h4, .analysis-recommendation h4, .analysis-no-action h4 { color: var(--ink); font-size: var(--text-14); margin: var(--size-8) 0 var(--size-5); }
  .analysis-finding p, .analysis-recommendation p, .analysis-no-action p { font-size: var(--text-12); margin: 0; }
  .analysis-evidence { color: var(--muted) !important; margin-top: var(--size-9) !important; }
  .analysis-recommendation { background: var(--surface); }
  .analysis-capex { background: var(--surface-soft); border-radius: var(--size-99); color: var(--muted); display: inline-block; font-size: var(--text-9); font-weight: var(--weight-bold); letter-spacing: .05em; padding: var(--size-4) var(--size-7); text-transform: uppercase; }
  .analysis-recommendation button { font-size: var(--text-12); margin-top: var(--size-12); padding: var(--size-9) var(--size-11); }
  .analysis-checks { background: var(--surface-soft); border: var(--size-1) solid var(--line); border-radius: var(--size-8); margin-top: var(--size-12); padding: 0 var(--size-12); }
  .analysis-checks summary { color: var(--muted); cursor: pointer; font-size: var(--text-12); font-weight: var(--weight-bold); padding: var(--size-10) 0; }
  .analysis-checks ul { display: grid; gap: var(--size-6); list-style: none; margin: 0 0 var(--size-12); padding: 0; }
  .analysis-checks li { color: var(--muted); font-size: var(--text-11); line-height: var(--leading-body); }
  .analysis-checks li::before { color: var(--accent); content: '•'; font-weight: var(--weight-bold); margin-right: var(--size-7); }
  .scenario-tabs { display: flex; flex-wrap: wrap; gap: var(--size-8); margin: var(--size-12) 0; }
  .workspace-tabs { display: flex; gap: var(--size-8); margin-top: var(--size-16); overflow-x: auto; padding: var(--size-3); }
  .workspace-tab { background: var(--surface-soft); border: var(--size-1) solid var(--line); color: var(--muted); margin: 0; white-space: nowrap; }
  .workspace-tab-active { background: var(--accent); box-shadow: 0 0 0 var(--size-3) var(--accent-soft); color: var(--surface); font-weight: var(--weight-bold); }
  .workspace-tab-comparison { background: var(--surface-soft); }
  .comparison-vertical { display: grid; gap: var(--size-1); margin-top: var(--size-16); }
  .comparison-context { border: var(--size-1) solid var(--line); border-left: var(--state-border-width) solid var(--accent); border-radius: var(--size-8); padding: var(--size-12); }
  .comparison-context-paired { background: var(--success-soft); border-color: var(--success); border-left-color: var(--running); }
  .comparison-context-caution { background: var(--warning-soft); border-color: var(--warning); border-left-color: var(--starved); }
  .comparison-context strong { color: var(--ink); display: block; font-size: var(--text-13); }
  .comparison-context p { color: var(--muted); font-size: var(--text-12); margin: var(--size-5) 0 0; }
  .comparison-section { border: var(--size-1) solid var(--line); border-radius: var(--size-8); margin-top: var(--size-16); overflow: hidden; }
  .comparison-section h3 { background: var(--surface-soft); color: var(--ink); font-size: var(--text-13); margin: 0; padding: var(--size-10); }
  .comparison-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: var(--size-12); background: var(--surface); padding: var(--size-10); }
  .comparison-row span { background: var(--surface); padding: var(--size-6); }
  .comparison-changed { border-left: var(--state-border-width) solid var(--warning); background: var(--warning-soft); }
  .scenario-tab { background: var(--surface-soft); border: var(--size-1) solid var(--line); color: var(--muted); font-size: var(--text-12); margin: 0; padding: var(--size-8) var(--size-11); }
  .scenario-tab-active { background: var(--selected); border-color: var(--accent); color: var(--info); font-weight: var(--weight-bold); }
  .equipment-json-details { border-top: var(--size-1) solid var(--line); margin-top: var(--size-12); padding-top: var(--size-10); }
  .equipment-json-details summary { color: var(--muted); cursor: pointer; font-size: var(--text-12); font-weight: var(--weight-bold); }
  .equipment-json-details .characteristics-label { margin-top: var(--size-10); }
  .sr-only { height: var(--size-1); margin: -1px; overflow: hidden; position: absolute; width: var(--size-1); }

.scenario-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--size-280)),1fr)); gap:var(--space-4); }
.scenario-grid .analysis-recommendation { min-width:0; border-left:var(--state-border-width) solid var(--accent); }
.scenario-changes { font-size:var(--font-caption); padding-left:var(--space-4); overflow-wrap:anywhere; }
.analysis-recommendation .badge { margin-left:var(--space-2); white-space:normal; }
.gemini-messages .analysis-recommendation { margin:var(--space-3) 0; }
  .analysis-capex[data-tier="ZERO"] { color: var(--capex-zero); background: var(--capex-zero-bg); }
  .analysis-capex[data-tier="MEDIUM"] { color: var(--capex-medium); background: var(--capex-medium-bg); }
  .analysis-capex[data-tier="HIGH"] { color: var(--capex-high); background: var(--capex-high-bg); }

.export-menu { display:inline-block; position:relative; margin-bottom:var(--space-3); }
.export-menu summary { cursor:pointer; display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); font-weight:var(--weight-medium); }
.export-menu>div { position:absolute; right:0; min-width:var(--size-220); padding:var(--space-2); display:grid; gap:var(--space-1); background:var(--surface); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); z-index:var(--z-overlay); box-shadow:var(--shadow-dialog); }
.export-menu button { text-align:left; justify-content:flex-start; }
.scenario-change { margin:var(--space-3) 0; padding-bottom:var(--space-3); border-bottom:var(--border-width) solid var(--line); }
.scenario-change code { overflow-wrap:anywhere; font-size:var(--font-caption); }
.scenario-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:var(--space-3); }
.scenario-change { padding:var(--space-3); border:1px solid var(--line); border-radius:var(--radius-sm); }
.scenario-change > label:first-child { display:flex; align-items:center; gap:var(--space-2); }
.scenario-change input[type=checkbox] { width:auto; min-height:0; }
.scenario-change input[type=number] { width:140px; }
.scenario-preview-status { font-weight:600; padding:var(--space-3); background:var(--accent-soft); border-radius:var(--radius-sm); }
.scenario-explorer .scenario-changes { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:var(--space-3); }
.scenario-preview-context { font-size:var(--font-secondary); color:var(--muted); }
.scenario-explorer { margin-bottom:var(--space-4); }
.scenario-explorer > details { margin:var(--space-3) 0; }
.scenario-explorer textarea { min-height:70px; }
.scenario-external { font-size:var(--font-secondary); color:var(--muted); }
</style>
<style>
.scenario-scope { display:flex; align-items:center; gap:var(--space-2); margin:var(--space-2) 0; }
.scenario-scope input { width:auto; min-height:0; }
.scenario-tier-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:var(--space-3); }
.scenario-edit-details { margin:var(--space-2) 0; }
.scenario-changes { padding:0; max-height:360px; overflow:auto; }
.scenario-change { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2); padding:var(--space-2); margin:var(--space-2) 0; }
.scenario-change > label:first-child { grid-column:1 / -1; font-weight:600; }
.scenario-change p { margin:0; align-self:center; }
.scenario-change > label:last-of-type { font-size:var(--font-caption); }
.scenario-change input[type=number] { width:110px; display:block; }
.scenario-explorer .scenario-changes { display:block; }
.scenario-preview-status[data-state=rejected] { border-left:3px solid var(--muted); }
.scenario-preview-status[data-state=improved] { border-left:3px solid var(--accent); }
.scenario-audit-warnings { margin:var(--space-2) 0; }
.scenario-candidate-details { margin:var(--space-3) 0; }
</style>

<style>
.scenario-doe { margin:var(--space-2) 0; }
.scenario-doe[hidden] { display:none; }
.scenario-doe-factor { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); margin:var(--space-2) 0; }
.scenario-doe-factor > label:first-child { grid-column:1 / -1; display:flex; align-items:center; gap:var(--space-2); }
.scenario-doe-factor input[type=checkbox] { width:auto; min-height:0; }
.scenario-doe-factor input[type=number] { width:100%; }
.scenario-doe-results { max-height:300px; overflow:auto; }
</style>
