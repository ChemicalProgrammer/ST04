<script>
window.STCaseGallery = (function() {
  var page=0, pageSize=24, lastKey='', grid=STPreferences.read('caseLayout')==='grid';
  function render(cases,openCase,requestCaseClone,options) {
    var target=document.getElementById('cases-list'), pagination=document.getElementById('case-pagination');
    var query=document.getElementById('case-search').value.trim().toLowerCase();
    var filter=document.getElementById('case-filter').value, sort=document.getElementById('case-sort').value;
    var key=query+'|'+filter+'|'+sort;
    if(key!==lastKey) { page=0;lastKey=key; }
    var items=(cases||[]).filter(function(item) { return String(item.name||'').toLowerCase().includes(query) && (filter==='all'||Boolean(item.isSimulationReady)===(filter==='ready')); });
    items.sort(function(a,b){return sort==='name'?String(a.name).localeCompare(String(b.name)):new Date(b.updatedAt)-new Date(a.updatedAt);});
    page=Math.min(page,Math.max(0,Math.ceil(items.length/pageSize)-1));
    target.textContent=''; pagination.textContent=''; target.classList.toggle('grid',grid);
    document.getElementById('case-count').textContent=items.length+' '+(items.length===1?'case':'cases');
    var layout=document.getElementById('case-layout'); layout.innerHTML=STIcons.svg(grid?'list':'grid'); layout.setAttribute('aria-label',__ST_TEXT__('casegallery.switch_to')+(grid?'list':'grid')+__ST_TEXT__('casegallery.view'));layout.title=layout.getAttribute('aria-label');
    layout.onclick=function(){grid=!grid;STPreferences.write('caseLayout',grid?'grid':'list');render(cases,openCase,requestCaseClone,options);};
    if(!items.length) {
      if(options?.loading&&!query&&filter==='all')return;
      target.innerHTML=("<div class=\"empty\">")+STIcons.svg('folder')+'<h3>'+(query||filter!=='all'?__ST_TEXT__('casegallery.no_matching_cases'):__ST_TEXT__('casegallery.your_workspace_starts_here'))+'</h3><p>'+(query||filter!=='all'?__ST_TEXT__('casegallery.try_a_different_search_or_filter'):__ST_TEXT__('casegallery.create_a_case_to_model_a_line_or_start_with_the_demonstration_case'))+'</p></div>'; return;
    }
    items.slice(page*pageSize,(page+1)*pageSize).forEach(function(item,index){
      var row=document.createElement('article');row.className='case-row';
      row.innerHTML='<div class="case-identity"><span class="case-glyph" aria-hidden="true">'+STIcons.svg('folder')+'</span><div><button class="case-name open-case" type="button"></button><span class="case-description"></span></div></div><div class="case-actions"><span class="badge"></span><time class="case-date"></time></div><div class="case-tools"></div>';
      var open=row.querySelector('.case-name');open.textContent=/^(?:PUBLIC_)?(?:DEMONSTRATION|DEMO)_ONLY$/.test(item.dataClassification||'')?item.name.replace(/public[ -]+(?=demo)/ig,''):item.name;open.id='case-title-'+index;row.setAttribute('aria-labelledby',open.id);
      var description=row.querySelector('.case-description');description.id='case-description-'+index;open.setAttribute('aria-describedby',description.id);
      row.querySelector('.case-description').textContent=item.equipmentCount+__ST_TEXT__('casegallery.equipment_units')+(/^(?:PUBLIC_)?(?:DEMONSTRATION|DEMO)_ONLY$/.test(item.dataClassification||'')?__ST_TEXT__('casegallery.demo'):'');
      var badge=row.querySelector('.badge');badge.classList.toggle('ready',Boolean(item.isSimulationReady));badge.innerHTML=STIcons.svg(item.isSimulationReady?'check':'edit')+(item.isSimulationReady?__ST_TEXT__('casegallery.ready'):__ST_TEXT__('casegallery.draft'));
      var date=new Date(item.updatedAt);if(!Number.isNaN(date.getTime()))row.querySelector('time').dateTime=date.toISOString();row.querySelector('time').textContent=Number.isNaN(date.getTime())?'':date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
      open.onclick=function(){openCase(item.id);};
      // Native stretched button covers the surface. The row handler also handles
      // direct/assistive activation without intercepting independent tools.
      row.onclick=function(event){if(event.defaultPrevented||event.target.closest('button,a,input,select,textarea,.case-tools'))return;open.click();};
      var clone=document.createElement('button');clone.type='button';clone.className='clone-case ghost icon-button';clone.innerHTML=STIcons.svg('copy');clone.title=__ST_TEXT__('casegallery.clone');clone.setAttribute('aria-label',__ST_TEXT__('casegallery.clone')+' '+item.name);
      clone.onclick=function(){requestCaseClone(item.id,clone);};row.querySelector('.case-tools').appendChild(clone);
      if(options?.exportCase){
        var download=document.createElement('button');download.type='button';download.className='export-gallery-case ghost icon-button';download.dataset.caseId=item.id;download.innerHTML=STIcons.svg('upload');download.title='Export complete case (JSON)';download.setAttribute('aria-label',download.title+' · '+item.name);download.disabled=!!options.exportCasePending?.(item.id);
        download.onclick=function(){options.exportCase(item.id,download);};row.querySelector('.case-tools').appendChild(download);
      }
      if(options?.deleteCase){
        var remove=document.createElement('button');remove.type='button';remove.className='delete-gallery-case ghost icon-button';remove.innerHTML=STIcons.svg('trash');remove.title=__ST_TEXT__('dialog.delete_case');remove.setAttribute('aria-label',remove.title+' '+item.name);
        remove.onclick=function(){options.deleteCase(item.id,item.name,remove);};row.querySelector('.case-tools').appendChild(remove);
      }
      target.appendChild(row);
    });
    if(items.length>pageSize) {
      var prev=document.createElement('button');prev.className='ghost';prev.innerHTML=STIcons.svg('back')+__ST_TEXT__('casegallery.previous');prev.disabled=page===0;prev.onclick=function(){page--;render(cases,openCase,requestCaseClone,options);};
      var next=document.createElement('button');next.className='ghost';next.innerHTML=__ST_TEXT__('casegallery.next')+STIcons.svg('chevron');next.disabled=(page+1)*pageSize>=items.length;next.onclick=function(){page++;render(cases,openCase,requestCaseClone,options);};
      pagination.append(prev,document.createTextNode(__ST_TEXT__('casegallery.page')+(page+1)+__ST_TEXT__('casegallery.of')+Math.ceil(items.length/pageSize)),next);
    }
  }
  return {render:render};
})();
</script>
