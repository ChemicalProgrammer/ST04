<script>
// Presentation-only aggregation; all physical results are supplied by the engine.
window.STResults=(function(){
  function number(value,digits){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:digits===undefined?1:digits}):'—';}
  function downtime(result){return Object.values(result.equipmentMetrics||{}).reduce(function(n,m){return n+(m.pausedSeconds||0)+(m.stoppedSeconds||0);},0)/60;}
  function metrics(result){var s=result.summary;return [
    [__ST_TEXT__('results.global_oee'),s.lineOeePercent,'%',false],[__ST_TEXT__('results.throughput'),s.outputCount/result.durationSeconds*60,' '+(result.unitOfFlow||'units')+'/min',false],[__ST_TEXT__('results.production'),s.outputCount,' '+(result.unitOfFlow||'units'),false],
    [__ST_TEXT__('results.equipment_downtime'),downtime(result),__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.starving'),s.totalStarvedSeconds/60,__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.blocking'),s.totalBlockedSeconds/60,__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.failure_time'),s.totalFailureSeconds/60,__ST_TEXT__('client.min'),true]
  ];}
  function render(result,activeCase,simulation){
    var ready=Boolean(result&&result.summary);
    var batchTarget=document.getElementById('batch-results');batchTarget.classList.toggle('hidden',!result?.batch);batchTarget.innerHTML=result?.batch?STReports.batchHtml(result.batch):'';

    document.getElementById('results-empty').classList.toggle('hidden',ready);document.getElementById('results-body').classList.toggle('hidden',!ready);document.getElementById('export-results').disabled=!ready;
    STReports.bindResults(result,activeCase,simulation);
    if(!ready){document.getElementById('results-meta').textContent=__ST_TEXT__('results.complete_a_simulation_to_inspect_the_results');return;}
    document.getElementById('results-meta').textContent=activeCase.name+__ST_TEXT__('results.full_run')+result.durationSeconds+__ST_TEXT__('results.s_seed')+result.seed;
    if(result.batch)document.getElementById('results-meta').textContent+=' · '+__ST_TEXT__('batch.representative');
    var target=document.getElementById('results-kpis');target.textContent='';
    metrics(result).forEach(function(item,index){var card=document.createElement('article');card.className='result-kpi'+(index===0?__ST_TEXT__('results.primary_kpi'):'');var label=document.createElement('span'),value=document.createElement('strong');label.textContent=item[0];value.textContent=number(item[1])+item[2];card.append(label,value);target.appendChild(card);});
    document.getElementById('results-reference').textContent=__ST_TEXT__('results.oee_reference')+(result.summary.lineOeePacemakerName||'not available')+__ST_TEXT__('results.quality_assumes_100_no_reject_model_loss_and_downtime_totals_are_equipment_')+' '+__ST_TEXT__('results.partial_note')+' '+__ST_TEXT__('results.productive_note');
    window.STLinePerformance.render(result,activeCase.equipment||[]);
    var rows=(activeCase.equipment||[]).map(function(e){return {model:e,metric:(result.equipmentMetrics||{})[e.id]||{}};});
    var worst=rows.filter(function(r){return r.model.type!=='CONVEYOR';}).sort(function(a,b){return (b.metric.starvedSeconds||0)+(b.metric.blockedSeconds||0)+(b.metric.failureSeconds||0)-(a.metric.starvedSeconds||0)-(a.metric.blockedSeconds||0)-(a.metric.failureSeconds||0);})[0];
    document.getElementById('results-insight').textContent=worst?__ST_TEXT__('results.investigate')+worst.model.name+__ST_TEXT__('results.highest_combined_starving_blocking_and_failure_time_among_machines_this_is_'):'';
    var table=document.createElement('table'); table.innerHTML=("<thead><tr><th>" + __ST_HTML_TEXT__('client.equipment') + "</th><th>" + __ST_HTML_TEXT__('sheetimportmerge.type') + "</th><th>" + __ST_HTML_TEXT__('client.equipment_unit_label') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('client.oee') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.produced_processed') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.starved_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.blocked_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.failure_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.failures') + "</th></tr></thead>");
    table.querySelectorAll('thead th')[2].title=__ST_TEXT__('client.equipment_unit_help');
    var head=table.querySelector('thead tr');
    [__ST_TEXT__('results.partial_starvation'),__ST_TEXT__('results.partial_blocking'),__ST_TEXT__('results.productive_capacity')].forEach(function(label){var th=document.createElement('th');th.className='numeric';th.textContent=label;head.appendChild(th);});
    var body=document.createElement('tbody'); rows.forEach(function(r){var m=r.metric,tr=document.createElement('tr');[r.model.name,r.model.type,r.model.unitOfFlow||'units',number(m.oeePercent)+'%',number(m.outputCount),number(m.starvedSeconds/60),number(m.blockedSeconds/60),number(m.failureSeconds/60),number(m.failureCount,0),number((m.partialStarvationLossSeconds||0)/60),number((m.partialBlockingLossSeconds||0)/60),number(m.processingCapacityPercent)].forEach(function(v,i){var td=document.createElement('td');td.textContent=v; if(i>2)td.className='numeric';tr.appendChild(td);});body.appendChild(tr);});table.appendChild(body);document.getElementById('results-table').replaceChildren(table);
    document.getElementById('export-results').onclick=function(){var blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='simulation-results.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);};
  }
  function compare(target,a,b){
    if(!a.results?.summary||!b.results?.summary)return;
    if((a.results.unitOfFlow||'units')!==(b.results.unitOfFlow||'units')){var notice=document.createElement('p');notice.className='chart-note';notice.textContent=__ST_TEXT__('performance.unit_mismatch');target.appendChild(notice);}
    var section=document.createElement('section');section.className='comparison-section';section.innerHTML=("<h3>" + __ST_HTML_TEXT__('results.outcome_comparison') + "</h3><div class=\"table-scroll\"><table><thead><tr><th>" + __ST_HTML_TEXT__('results.metric') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('view.baseline') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.proposed') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.absolute') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.relative') + "</th></tr></thead><tbody></tbody></table></div>");
    var right=metrics(b.results);
    metrics(a.results).forEach(function(m,i){var n=right[i][1],d=n-m[1],tr=document.createElement('tr');[m[0],number(m[1])+m[2],number(n)+m[2],(d>0?'+':'')+number(d)+(i===0?__ST_TEXT__('results.pp'):m[2]),m[1]===0?__ST_TEXT__('results.n_a_zero_baseline'):(d>0?'+':'')+number(d/Math.abs(m[1])*100)+'%'].forEach(function(v,j){var td=document.createElement('td');td.textContent=v;if(j)td.className='numeric';tr.appendChild(td);});section.querySelector('tbody').appendChild(tr);});target.appendChild(section);
  }
  return {render:render,compare:compare};
})();
</script>
