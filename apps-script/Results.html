<script>
// Presentation-only aggregation; all physical results are supplied by the engine.
window.STResults=(function(){
  function unitLabel(unit){return window.STBasicMode?.unitLabel(unit)||unit||'units';}
  function number(value,digits){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:digits===undefined?1:digits}):'—';}
  function downtime(result){return Object.values(result.equipmentMetrics||{}).reduce(function(n,m){return n+(m.pausedSeconds||0)+(m.stoppedSeconds||0);},0)/60;}
  function metrics(result){var s=result.summary;return [
    [__ST_TEXT__('results.global_oee'),s.lineOeePercent,'%',false],[__ST_TEXT__('results.throughput'),s.outputCount/result.durationSeconds*60,' '+unitLabel(result.unitOfFlow||result.replay?.unitOfFlow)+'/min',false],[__ST_TEXT__('results.production'),s.outputCount,' '+unitLabel(result.unitOfFlow||result.replay?.unitOfFlow),false],
    [__ST_TEXT__('results.equipment_downtime'),downtime(result),__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.starving'),s.totalStarvedSeconds/60,__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.blocking'),s.totalBlockedSeconds/60,__ST_TEXT__('client.min'),true],[__ST_TEXT__('results.failure_time'),s.totalFailureSeconds/60,__ST_TEXT__('client.min'),true]
  ];}
  function render(result,activeCase,simulation){
    var ready=Boolean(result&&result.summary&&!result.provisional);
    var designReady=Boolean(activeCase?.equipment?.length);
    var batchTarget=document.getElementById('batch-results');batchTarget.classList.toggle('hidden',!result?.batch);batchTarget.innerHTML=result?.batch?STReports.batchHtml(result.batch):'';

    document.getElementById('results-empty').classList.toggle('hidden',ready||designReady);document.getElementById('results-body').classList.toggle('hidden',!ready&&!designReady);document.getElementById('results-body').classList.toggle('results-design-only',!ready);
    STReports.bindResults(ready?result:null,activeCase,simulation);
    if(!ready){document.getElementById('results-meta').textContent=result?.provisional?__ST_TEXT__('batch.calculating_first'):__ST_TEXT__('results.complete_a_simulation_to_inspect_the_results');STLinePerformance.render(null,activeCase?.equipment||[]);return;}
    document.getElementById('results-meta').textContent=activeCase.name+__ST_TEXT__('results.full_run')+result.durationSeconds+__ST_TEXT__('results.s_seed')+result.seed;
    if(result.batch)document.getElementById('results-meta').textContent+=' · '+__ST_TEXT__('batch.representative');
    var target=document.getElementById('results-kpis');target.textContent='';
    metrics(result).filter(function(_,index){return !window.STBasicMode?.isBasic()||index<3;}).forEach(function(item,index){var card=document.createElement('article');card.className='result-kpi'+(index===0?__ST_TEXT__('results.primary_kpi'):'');var label=document.createElement('span'),value=document.createElement('strong');var mean=window.STBasicMode?.isBasic()&&result.batch?.statistics?.[['lineOeePercent','throughputPerMinute','outputCount'][index]]?.mean;label.textContent=item[0]+(Number.isFinite(mean)?' (mean of '+result.batch.rounds+' rounds)':'');value.textContent=number(Number.isFinite(mean)?mean:item[1])+item[2];card.append(label,value);target.appendChild(card);});
    document.getElementById('results-reference').textContent=result.engineId==='DES_SIMPY_EXPERIMENTAL'?'DES · SimPy 4.1.2 (experimental). OEE is not validated. '+(result.limitations||[]).join(' '):__ST_TEXT__('results.oee_reference')+(result.summary.lineOeePacemakerName||'not available')+__ST_TEXT__('results.quality_assumes_100_no_reject_model_loss_and_downtime_totals_are_equipment_')+' '+__ST_TEXT__('results.partial_note')+' '+__ST_TEXT__('results.productive_note');
    window.STLinePerformance.render(result,activeCase.equipment||[]);
    var rows=(activeCase.equipment||[]).map(function(e){return {model:e,metric:(result.equipmentMetrics||{})[e.id]||{}};});
    var worst=rows.filter(function(r){return r.model.type!=='CONVEYOR';}).sort(function(a,b){return (b.metric.starvedSeconds||0)+(b.metric.blockedSeconds||0)+(b.metric.failureSeconds||0)-(a.metric.starvedSeconds||0)-(a.metric.blockedSeconds||0)-(a.metric.failureSeconds||0);})[0];
    document.getElementById('results-insight').textContent=worst?__ST_TEXT__('results.investigate')+worst.model.name+__ST_TEXT__('results.highest_combined_starving_blocking_and_failure_time_among_machines_this_is_'):'';
    var table=document.createElement('table'); table.innerHTML=("<thead><tr><th>" + __ST_HTML_TEXT__('client.equipment') + "</th><th>" + __ST_HTML_TEXT__('sheetimportmerge.type') + "</th><th>" + __ST_HTML_TEXT__('client.equipment_unit_label') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('client.oee') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.produced_processed') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.starved_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.blocked_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.failure_min') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.failures') + "</th></tr></thead>");
    table.querySelectorAll('thead th')[2].title=__ST_TEXT__('client.equipment_unit_help');
    var head=table.querySelector('thead tr');
    [__ST_TEXT__('results.partial_starvation'),__ST_TEXT__('results.partial_blocking'),__ST_TEXT__('results.productive_capacity')].forEach(function(label){var th=document.createElement('th');th.className='numeric';th.textContent=label;head.appendChild(th);});
    var body=document.createElement('tbody'); rows.forEach(function(r){var m=r.metric,tr=document.createElement('tr');[r.model.name,r.model.type,unitLabel(r.model.unitOfFlow),number(m.oeePercent)+'%',number(m.outputCount),number(m.starvedSeconds/60),number(m.blockedSeconds/60),number(m.failureSeconds/60),number(m.failureCount,0),number((m.partialStarvationLossSeconds||0)/60),number((m.partialBlockingLossSeconds||0)/60),number(m.processingCapacityPercent)].forEach(function(v,i){var td=document.createElement('td');td.textContent=v; if(i>2)td.className='numeric';tr.appendChild(td);});body.appendChild(tr);});table.appendChild(body);document.getElementById('results-table').replaceChildren(table);
  }
  function compare(target,a,b){
    if(!a.results?.summary||!b.results?.summary)return;
    if((a.results.engineId||'ST_CURRENT')!==(b.results.engineId||'ST_CURRENT')){var modelNote=document.createElement('p');modelNote.className='notice';modelNote.textContent='Different engines: ST spatial fluid model versus experimental SimPy spatial product model. Sensors, ramps and random failure schedules are not equivalent.';target.appendChild(modelNote);}
    if((a.results.unitOfFlow||a.results.replay?.unitOfFlow||'units')!==(b.results.unitOfFlow||b.results.replay?.unitOfFlow||'units')){var notice=document.createElement('p');notice.className='chart-note';notice.textContent=__ST_TEXT__('performance.unit_mismatch');target.appendChild(notice);}
    var section=document.createElement('section');section.className='comparison-section comparison-outcomes';section.innerHTML=("<h3>" + __ST_HTML_TEXT__('results.outcome_comparison') + "</h3><div class=\"table-scroll\"><table><thead><tr><th>" + __ST_HTML_TEXT__('results.metric') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('view.baseline') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.proposed') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.absolute') + "</th><th class=\"numeric\">" + __ST_HTML_TEXT__('results.relative') + "</th></tr></thead><tbody></tbody></table></div>");
    var right=metrics(b.results);
    var unitMismatch=(a.results.unitOfFlow||a.results.replay?.unitOfFlow||'units')!==(b.results.unitOfFlow||b.results.replay?.unitOfFlow||'units');
    function comparedValue(result,index,fallback){var key=['lineOeePercent','throughputPerMinute','outputCount'][index],mean=result.batch?.statistics?.[key]?.mean;return Number.isFinite(mean)?mean:fallback;}
    var highlights=document.createElement('div');highlights.className='comparison-highlights';
    metrics(a.results).slice(0,2).forEach(function(m,i){
      var left=comparedValue(a.results,i,m[1]),rightValue=comparedValue(b.results,i,right[i][1]),delta=Number.isFinite(left)&&Number.isFinite(rightValue)&&!(i===1&&unitMismatch)?rightValue-left:null;
      var card=document.createElement('article');card.className='comparison-kpi';var title=document.createElement('h4');title.textContent=m[0];card.append(title);
      [[a,left],[b,rightValue]].forEach(function(pair){var row=document.createElement('div');row.className='comparison-kpi-value';var label=document.createElement('span'),value=document.createElement('strong');label.textContent=pair[0].name;var unit=pair[0].results.unitOfFlow||pair[0].results.replay?.unitOfFlow;value.textContent=number(pair[1])+(i===0?'%':' '+unitLabel(unit)+'/min');row.append(label,value);card.append(row);});
      var change=document.createElement('p');change.className='comparison-kpi-delta';change.textContent='Δ '+(delta>0?'+':'')+number(delta)+(i===0?__ST_TEXT__('results.pp'):' '+unitLabel(a.results.unitOfFlow||a.results.replay?.unitOfFlow)+'/min');card.append(change);
      var basis=document.createElement('p');basis.className='chart-note';basis.textContent=[a,b].map(function(sim){return sim.name+': '+(sim.results.batch?.rounds||1)+' round(s)';}).join(' · ');card.append(basis);highlights.append(card);
    });
    section.querySelector('h3').after(highlights);
    var basic=Boolean(window.STBasicMode?.isBasic());
    metrics(a.results).filter(function(_,i){return !basic||i<3;}).forEach(function(m,i){var meanKey=['lineOeePercent','throughputPerMinute','outputCount'][i];if(Number.isFinite(a.results.batch?.statistics?.[meanKey]?.mean))m=[m[0]+' (mean)',a.results.batch.statistics[meanKey].mean,m[2]];var n=Number.isFinite(b.results.batch?.statistics?.[meanKey]?.mean)?b.results.batch.statistics[meanKey].mean:right[i][1],comparable=Number.isFinite(m[1])&&Number.isFinite(n)&&!(unitMismatch&&(i===1||i===2)),d=comparable?n-m[1]:null,tr=document.createElement('tr');[m[0],number(m[1])+m[2],number(n)+right[i][2],(d>0?'+':'')+number(d)+(i===0?__ST_TEXT__('results.pp'):m[2]),!comparable?'—':m[1]===0?__ST_TEXT__('results.n_a_zero_baseline'):(d>0?'+':'')+number(d/Math.abs(m[1])*100)+'%'].forEach(function(v,j){var td=document.createElement('td');td.textContent=v;if(j)td.className='numeric';tr.appendChild(td);});section.querySelector('tbody').appendChild(tr);});target.appendChild(section);
  }
  return {render:render,compare:compare};
})();
</script>
