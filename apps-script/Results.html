    var title=document.createElement('h3');title.textContent='OEE comparison';section.append(title);
    var note=document.createElement('p');note.className='chart-note';note.textContent='Mean of saved rounds when available. Differences are percentage points.';section.append(note);
    var scroll=document.createElement('div');scroll.className='table-scroll';var table=document.createElement('table');table.setAttribute('aria-label','OEE comparison');
    var head=document.createElement('thead'),header=document.createElement('tr');['Equipment',a.name,b.name,'Δ OEE (pp)'].forEach(function(label,index){var th=document.createElement('th');th.scope='col';th.textContent=label;if(index)th.className='numeric';header.append(th);});head.append(header);table.append(head);
    var body=document.createElement('tbody');
    function row(name,left,right){var tr=document.createElement('tr');[name,number(left)+(Number.isFinite(left)?'%':''),number(right)+(Number.isFinite(right)?'%':''),(Number.isFinite(left)&&Number.isFinite(right)?(right-left>0?'+':'')+number(right-left):'—')].forEach(function(value,index){var td=document.createElement('td');td.textContent=value;if(index)td.className='numeric';tr.append(td);});body.append(tr);}
    function global(sim){return sim.results.batch?.statistics?.lineOeePercent?.mean??sim.results.summary.lineOeePercent;}
    row('Global OEE',global(a),global(b));
    var ids=Array.from(new Set((a.equipment||[]).concat(b.equipment||[]).filter(e=>e.type!=='CONVEYOR').map(e=>e.id)));
    ids.forEach(function(id){var e=(a.equipment||[]).concat(b.equipment||[]).find(e=>e.id===id);function value(sim){return sim.results.batch?.equipmentStatistics?.[id]?.oeePercent?.mean??sim.results.equipmentMetrics?.[id]?.oeePercent;}row(e.name||id,value(a),value(b));});
    table.append(body);scroll.append(table);section.append(scroll);target.append(section);
  }
  return {renderRamps:renderRamps,renderEfficiency:renderEfficiency,render:render,compare:compare,compareEquipmentOee:compareEquipmentOee};
})();
</script>
