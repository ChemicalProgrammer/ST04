<style>
  .field-grid, .equipment-grid { display: grid; gap: var(--size-12); grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-grid { margin: var(--size-20) 0; max-width: var(--size-760); }
  #case-editor-form .field-grid { grid-template-columns:1fr; }
  label { color: var(--ink); display: grid; font-size: var(--text-13); font-weight: var(--weight-bold); gap: var(--size-6); }
  .editor-subheading { align-items: center; display: flex; justify-content: space-between; margin-top: var(--size-28); }
  .editor-subheading h3 { margin: 0 0 var(--size-4); }
  .editor-subheading p { margin-bottom: 0; }
  #editor-panel > .editor-subheading { margin-bottom:var(--space-4); gap:var(--space-4); flex-wrap:wrap; }
  #editor-panel > .editor-subheading .button-row { padding:var(--space-1) 0; gap:var(--space-3); }

  html[data-show-json=false] .equipment-json-details,
  html[data-show-json=false] .json-example { display:none !important; }
  .equipment-fields:has(.equipment-type option[value=CONVEYOR]:checked) .machine-design-field { display:none; }
  .equipment-list { display: grid; gap: var(--size-14); margin-top: var(--size-14); }
  .equipment-card { background: var(--surface); border: var(--size-1) solid var(--line); border-radius: var(--size-10); padding: var(--size-16); }
  .equipment-card:not(.equipment-card-expanded) .equipment-grid,
  .equipment-card:not(.equipment-card-expanded) .format-zone-setup,
  .equipment-card:not(.equipment-card-expanded) .equipment-json-details { display: none; }
  .equipment-card:not(.equipment-card-expanded) { padding: var(--size-10) var(--size-16); }
  .equipment-header strong { color: var(--ink); }
  .format-zone-setup { background: var(--surface-soft); border: var(--size-1) solid var(--line); border-radius: var(--size-9); margin-top: var(--size-14); padding: var(--size-13); }
  .format-zone-heading { align-items: flex-start; display: flex; gap: var(--size-14); justify-content: space-between; }
  .format-zone-heading strong { color: var(--ink); font-size: var(--text-14); }

  .format-zone-grid { display: grid; gap: var(--size-10); grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: var(--size-12); }
  .format-zone-grid label { color: var(--muted); font-size: var(--text-11); }
  .format-zone-grid input { padding: var(--size-8) var(--size-9); }
  .format-zone-preview { background: var(--surface); border-radius: var(--size-7); color: var(--info); font-size: var(--text-12); margin: var(--size-12) 0 0; padding: var(--size-9) var(--size-10); }
  .characteristics-label { margin-top: var(--size-12); }
  textarea { border: var(--size-1) solid var(--line-strong); min-height: var(--size-104); resize: vertical; width: 100%; }
  .raw-viewer { margin-top: var(--size-22); }
  .raw-viewer summary { color: var(--ink); cursor: pointer; font-weight: var(--weight-bold); }
  .raw-viewer textarea { font-family: var(--font-mono); margin-top: var(--size-12); min-height: var(--size-260); }
  .notice { background: var(--warning-soft); border: var(--size-1) solid var(--warning); border-radius: var(--size-8); color: var(--warning); margin: var(--size-18) 0; padding: var(--size-12); }
  .model-boundary { font-size: var(--text-13); margin: var(--size-14) 0; }


.equipment-drag { cursor:grab; touch-action:none; }
.equipment-dragging { opacity:.65; }
.equipment-drop-target { outline:var(--focus-width) solid var(--accent); background:var(--accent-soft); }
.equipment-card { transition:background var(--duration-fast), opacity var(--duration-fast); }

.equipment-card .equipment-fields { display:none; }
.equipment-selected { border-color:var(--accent); background:var(--accent-soft); }
#equipment-inspector { flex:1; min-height:0; overflow:auto; padding:var(--space-1); }
#equipment-inspector { container-type:inline-size; }
#equipment-inspector .equipment-grid,#equipment-inspector .format-zone-grid { gap:var(--space-3); grid-template-columns:repeat(auto-fit,minmax(min(100%,max(var(--equipment-field-width),calc((100% - 2 * var(--space-3)) / 3))),1fr)); }
#equipment-inspector .equipment-fields { min-width:0; }
#batch-progress { width:100%; accent-color:var(--accent); }
#batch-results { margin-bottom:var(--space-6); padding-bottom:var(--space-6); overflow:auto; }

#equipment-inspector label { position:relative; padding-right:var(--space-5); }
#equipment-inspector .format-zone-setup { background:transparent; padding:var(--space-3) 0; border:0; border-top:var(--border-width) solid var(--line); }
#equipment-inspector textarea,#json-help-code { font-family:var(--font-mono); }
.parameter-help { position:absolute; right:0; top:0; font-weight:var(--weight-regular); }
.parameter-help summary { cursor:help; color:var(--muted); list-style:none; }
.parameter-help p { display:none; position:absolute; right:0; top:var(--space-4); width:min(var(--size-260),70vw); padding:var(--space-3); background:var(--surface); color:var(--ink); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); z-index:var(--z-overlay); box-shadow:var(--shadow-dialog); font-size:var(--font-secondary); }
.parameter-help:hover p,.parameter-help:focus-within p,.parameter-help[open] p { display:block; }
.json-example { justify-self:start; font-size:var(--font-secondary); }
#json-help-dialog { width:min(var(--size-760),90vw); }
#json-help-code { min-height:var(--size-260); }
#json-help-fields dt { font-family:var(--font-mono); font-weight:var(--weight-medium); overflow-wrap:anywhere; }
#json-help-fields dd { margin:var(--space-1) 0 var(--space-3); color:var(--muted); }
#gemini-chat-view { display:flex; flex-direction:column; flex:1; min-height:0; gap:var(--space-3); }

.equipment-sorting { transition:transform var(--duration-normal) var(--ease); will-change:transform; }
.equipment-dragging { position:relative; z-index:var(--z-header); transition:none; cursor:grabbing; box-shadow:var(--shadow-dialog); }

.equipment-card { cursor:pointer; }
.equipment-card:focus-visible { outline:var(--focus-width) solid var(--accent); outline-offset:var(--space-1); }

.equipment-filters { display:inline-flex; gap:var(--space-1); padding:var(--space-1); margin-top:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); }
.equipment-filters label { position:relative; cursor:pointer; }
.equipment-filters input { position:absolute; width:1px; min-height:0; height:1px; opacity:0; margin:0; padding:0; }
.equipment-filters span { padding:var(--space-2) var(--space-3); border-radius:var(--radius-sm); color:var(--muted); font-size:var(--font-button); font-weight:var(--weight-medium); }
.equipment-filters input:checked + span { color:var(--accent); background:var(--accent-soft); }
.equipment-filters input:focus-visible + span { outline:var(--focus-width) solid var(--accent); outline-offset:var(--space-1); }
.equipment-filters label:hover span { background:var(--surface-hover); }
.switchable-value { display:flex; align-items:center; gap:var(--space-2); min-width:0; }
.switchable-value > input[type=number] { flex:1; min-width:0; }
.switchable-value > input[type=checkbox],html[data-ui-mode=basic] .basic-worksheet-group .switchable-value > input[type=checkbox] { width:16px; height:16px; min-height:16px; padding:0; flex:0 0 16px; }
.switchable-value > .calculated-value { background:var(--surface-soft); border-color:transparent; font-weight:var(--weight-semibold); text-align:right; }
</style>
