<style>
#realdata-panel .real-data-toolbar { display:flex;align-items:end;gap:var(--space-3);flex-wrap:wrap;margin-block:var(--space-3); }
#realdata-panel .real-data-toolbar > label { flex:1 1 220px;min-width:0; }
#realdata-panel .real-data-block { margin-block:var(--space-4);border:var(--border-width) solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);min-width:0; }
#realdata-panel .real-data-block h3 { margin:0 0 var(--space-3); }
#realdata-panel .real-data-block-heading { display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap; }
#realdata-panel .real-data-block-heading label { min-width:min(100%,220px); }
#realdata-panel .real-data-fields { display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:var(--space-3);align-items:end;margin-block:var(--space-3); }
#realdata-panel .real-data-fields > label { min-width:0; }
#realdata-panel .real-data-fields > label:has(textarea) { grid-column:1/-1; }
#realdata-panel .real-data-input-group { padding-block:var(--space-2);border-bottom:var(--border-width) solid var(--line); }
#realdata-panel .real-data-input-group:last-child { border:0; }
#realdata-panel .real-data-input-group > details { padding:var(--space-2); }
#realdata-panel summary { cursor:pointer;font-weight:var(--weight-semibold); }
#realdata-panel .real-data-filter { display:flex;align-items:center;gap:var(--space-2);margin-block:var(--space-3); }
#realdata-panel .real-data-filter input { width:auto;min-height:0; }
#realdata-panel :is(th,td) { padding:var(--space-3);white-space:normal;vertical-align:middle; }
#realdata-panel .numeric { text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums; }
#realdata-panel th { text-align:left; }
#realdata-panel .real-data-reported { display:block;color:var(--muted);font-size:var(--font-caption);font-weight:var(--weight-normal,400);margin-top:var(--space-1); }
#realdata-panel .real-data-group-row th { background:var(--surface-soft);color:var(--muted);font-size:var(--font-caption); }
#realdata-panel .real-data-main-table { min-width:600px; }
#realdata-panel .real-data-failure-table { min-width:900px; }
#realdata-panel tfoot { font-weight:var(--weight-semibold);border-top:var(--border-width) solid var(--line); }
#realdata-panel .real-data-review { margin-top:var(--space-3); }
#realdata-panel #real-data-warnings { color:var(--warning);padding-left:var(--space-5); }
#realdata-panel .real-data-error { color:var(--danger); }
#realdata-panel textarea { min-height:80px; }
@media(max-width:600px){#realdata-panel .real-data-block{padding:var(--space-3)}}
#realdata-panel .real-data-calibration-scroll { max-width:100%;overflow-x:auto; }
#realdata-panel .real-data-calibration-table { width:100%;min-width:1600px;border-collapse:collapse; }
#realdata-panel .real-data-calibration-table thead { background:#24599a;color:#fff; }
#realdata-panel .real-data-calibration-table th { text-align:center;min-width:90px;font-weight:500; }
#realdata-panel .real-data-calibration-table th small { display:block; }
#realdata-panel .real-data-calibration-table .real-data-sheet-letters th { background:var(--surface-soft);color:var(--muted);padding-block:var(--space-1); }
#realdata-panel .real-data-calibration-highlight { background:#dbe8c7;color:#182c17;font-weight:600; }
</style>
