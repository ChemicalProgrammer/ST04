<script>
window.STEquipmentInspector=(function(){
  var state,selected=null,opened=false,context='',helpOrigin=null,helpSequence=0;
  function el(id){return document.getElementById(id);}
  function key(){return (state?.activeCase?.id||'')+':'+(state?.activeSimulationId||'');}
  function release(){
    var selection=selected?{id:selected._fields.querySelector('.equipment-id').value,opened:opened,context:context}:null;
    if(selected){selected.appendChild(selected._fields);selected.classList.remove('equipment-selected');}
    selected=null;return selection;
  }
  function restore(selection){
    if(!selection||selection.context!==key()){opened=false;return;}
    var card=Array.from(document.querySelectorAll('#equipment-list .equipment-card')).find(function(c){return c.dataset.equipmentId===selection.id;});
    if(card){select(card,false);opened=selection.opened;}else opened=false;
  }
  function exchangeValues(a,b){
    var left=Array.from(a.querySelectorAll('input,select,textarea'));
    var right=Array.from(b.querySelectorAll('input,select,textarea'));
    if(left.length!==right.length)return false;
    left.forEach(function(control,index){
      var other=right[index],value=control.value,checked=control.checked;
      var bpm=control.dataset.originalBpm,rate=control.dataset.originalRate;
      control.value=other.value;control.checked=other.checked;
      other.value=value;other.checked=checked;
      if(control.classList.contains('equipment-rate')){
        control.dataset.originalBpm=other.dataset.originalBpm;
        control.dataset.originalRate=other.dataset.originalRate;
        other.dataset.originalBpm=bpm;other.dataset.originalRate=rate;
      }
    });
    return true;
  }
  function select(card,focus){
    if(selected===card){opened=true;return;}
    var previous=selected,panel=el('equipment-inspector'),scroll=panel.scrollTop;
    var sameType=previous&&context===key()&&previous._fields.querySelector('.equipment-type').value===card._fields.querySelector('.equipment-type').value;
    if(sameType){
      if(!card._helpReady){decorate(card);card._helpReady=true;}
      var retained=previous._fields,incoming=card._fields;
      if(exchangeValues(retained,incoming)){
        release();
        previous._fields=incoming;card._fields=retained;
        incoming._owner=previous;retained._owner=card;
        previous.appendChild(incoming);
        previous._refreshFormatPreview?.();card._refreshFormatPreview?.();
        selected=card;context=key();opened=true;
        panel.appendChild(retained);card.classList.add('equipment-selected');
        panel.scrollTop=scroll;
        window.dispatchEvent(new Event('st:inspector'));
        panel.scrollTop=scroll;
        if(focus!==false)panel.querySelector('input,select,textarea')?.focus({preventScroll:true});
        panel.scrollTop=scroll;
        return;
      }
    }
    release();selected=card;context=key();opened=true;
    if(!card._helpReady){decorate(card);card._helpReady=true;}
    panel.appendChild(card._fields);card.classList.add('equipment-selected');
    window.dispatchEvent(new Event('st:inspector'));
    if(focus!==false)panel.querySelector('input,select,textarea')?.focus();
  }
  function sync(){
    if(context!==key()){release();opened=false;el('equipment-inspector').textContent='';}
    var visible=Boolean(opened&&selected&&state.activeCase&&state.uiView==='editor');
    return visible;
  }
  function init(current,dirty){
    state=current;
    ['input','change'].forEach(function(type){el('equipment-inspector').addEventListener(type,function(event){if(event.target.matches('input,select,textarea')){var fields=selected?._fields;if(fields)selected.querySelector('.equipment-header strong').textContent=__ST_TEXT__('client.step')+(Number(selected.dataset.index)+1)+' · '+fields.querySelector('.equipment-type').value+' · '+fields.querySelector('.equipment-name').value+(fields.querySelector('.equipment-type').value==='CONVEYOR'?'':' · '+Number(fields.querySelector('.equipment-rate').value)+__ST_TEXT__('client.bpm'));dirty(event);}});});
    el('json-help-close').onclick=function(){el('json-help-dialog').close();};
    el('json-help-dialog').addEventListener('close',function(){helpOrigin?.focus();});
    el('json-help-copy').onclick=async function(){
      try{await navigator.clipboard.writeText(el('json-help-code').value);el('json-copy-status').textContent=__ST_TEXT__('inspector.copied');}
      catch(_){el('json-help-code').focus();el('json-help-code').select();el('json-copy-status').textContent=__ST_TEXT__('inspector.copy_manual');}
    };
  }
  function help(control,text){
    var label=control.closest('label');label.title=text;
    var details=document.createElement('details');details.className='parameter-help';
    var summary=document.createElement('summary');summary.innerHTML=STIcons.svg('info');summary.setAttribute('aria-label',__ST_TEXT__('inspector.parameter_help'));
    var message=document.createElement('p');message.id='parameter-help-'+(++helpSequence);message.textContent=text;message.setAttribute('role','tooltip');
    control.setAttribute('aria-describedby',message.id);details.append(summary,message);label.appendChild(details);
  }
  var basic={
    'equipment-id':__ST_TEXT__('inspector.help_id'),
    'equipment-name':__ST_TEXT__('inspector.help_name'),
    'equipment-type':__ST_TEXT__('inspector.help_type'),
    'equipment-rate':__ST_TEXT__('inspector.help_rate'),
    'equipment-mode':__ST_TEXT__('inspector.help_mode'),
    'equipment-characteristics':__ST_TEXT__('inspector.help_characteristics'),
    'equipment-noise-profile':__ST_TEXT__('inspector.help_noise'),
    'equipment-process-data':__ST_TEXT__('inspector.help_process')
  };
  function decorate(card){
    card._fields.querySelectorAll('input,select,textarea').forEach(function(control){
      help(control,basic[control.className]||control.closest('label').title);
      if(control.tagName==='TEXTAREA'){
        var button=document.createElement('button');button.type='button';button.className='ghost json-example';button.textContent=__ST_TEXT__('inspector.example');
        button.onclick=function(){showExample(control,control.closest('.equipment-fields')._owner||card,button);};control.closest('label').appendChild(button);
      }
    });
  }
  function showExample(control,card,origin){
    var type=card._fields.querySelector('.equipment-type').value,example;
    if(control.classList.contains('equipment-characteristics'))example={criticalMachine:true};
    else if(control.classList.contains('equipment-noise-profile'))example={reliability:{mtbfMinutes:35,mttrMinutes:2}};
    else if(type==='CONVEYOR')example={geometry:{lactMm:10000,lpPrimeMm:1000},upstream:{packageLengthMm:100,dischargePitchMm:120},accumulation:{speedMode:"AUTO",conveyorSpeedMmPerSecond:300,movingGapMm:20,accumulatedGapMm:0,conveyorSpeedFactorPercent:10,backupSensorPositionMm:1000,dischargeRunoutLengthMm:0,rejectRunoutLengthMm:0,blockedTimeDelaySeconds:1,clearTimeDelaySeconds:1,insuranceFactorUnits:2,upstreamStopResponseSeconds:1,bottlesDischargedAtStop:2,downstreamRampUpSeconds:2}};
    else example={equipment:{maximumSpeedBpm:300},upstream:{startupTimeSeconds:2},downstream:{infeedPitchMm:120,rampUpTimeSeconds:2}};
    helpOrigin=origin;el('json-help-title').textContent=control.closest('label').firstChild.textContent.trim();
    el('json-help-code').value=JSON.stringify(example,null,2);el('json-copy-status').textContent='';
    var list=el('json-help-fields');list.textContent='';
    function explain(value,prefix){Object.entries(value).forEach(function(pair){var path=prefix?prefix+'.'+pair[0]:pair[0];if(typeof pair[1]==='object'){explain(pair[1],path);return;}var dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=path;dd.textContent=descriptions[pair[0]];list.append(dt,dd);});}
    explain(example,'');el('json-help-dialog').showModal();el('json-help-close').focus();
  }
  var descriptions={
    criticalMachine:__ST_TEXT__('inspector.json_critical'),mtbfMinutes:__ST_TEXT__('inspector.json_mtbf'),mttrMinutes:__ST_TEXT__('inspector.json_mttr'),maximumSpeedBpm:__ST_TEXT__('inspector.json_max_speed'),startupTimeSeconds:__ST_TEXT__('inspector.json_startup'),infeedPitchMm:__ST_TEXT__('inspector.json_infeed'),rampUpTimeSeconds:__ST_TEXT__('inspector.json_ramp'),
    speedMode:__ST_TEXT__('conveyor.help_speed_mode'),conveyorSpeedMmPerSecond:__ST_TEXT__('conveyor.help_belt_speed'),movingGapMm:__ST_TEXT__('conveyor.help_moving_gap'),accumulatedGapMm:__ST_TEXT__('conveyor.help_accumulated_gap'),
    lactMm:__ST_TEXT__('client.total_installed_conveyor_length_measured_from_the_upstream_discharge_toward'),lpPrimeMm:__ST_TEXT__('client.reserved_downstream_length_between_the_prime_photocell_and_the_downstream_m'),packageLengthMm:__ST_TEXT__('client.physical_package_length_in_the_direction_of_travel_it_determines_the_photoe'),dischargePitchMm:__ST_TEXT__('client.centre_to_centre_distance_between_packages_leaving_the_upstream_machine'),conveyorSpeedFactorPercent:__ST_TEXT__('client.belt_speed_increase_relative_to_upstream_package_discharge_velocity_it_chan'),backupSensorPositionMm:__ST_TEXT__('client.installed_back_up_photocell_position_measured_from_the_upstream_discharge_a'),dischargeRunoutLengthMm:__ST_TEXT__('client.length_that_must_be_cleared_after_the_upstream_discharge_before_a_stop_full'),rejectRunoutLengthMm:__ST_TEXT__('client.additional_reject_runout_length_that_must_be_cleared_during_an_upstream_sto'),blockedTimeDelaySeconds:__ST_TEXT__('client.continuous_back_up_blocked_time_required_before_the_simulator_requests_the_'),clearTimeDelaySeconds:__ST_TEXT__('client.continuous_back_up_clear_time_required_before_the_simulator_releases_the_up'),insuranceFactorUnits:__ST_TEXT__('client.extra_package_margin_reserved_in_the_required_overflow_calculation_it_is_a_'),upstreamStopResponseSeconds:__ST_TEXT__('client.delay_from_the_upstream_stop_request_until_its_discharge_response_is_comple'),bottlesDischargedAtStop:__ST_TEXT__('client.packages_that_can_still_leave_the_upstream_machine_after_the_stop_request'),downstreamRampUpSeconds:__ST_TEXT__('client.time_for_the_downstream_machine_to_ramp_after_prime_authorizes_its_start')
  };
  return {init:init,select:select,release:release,restore:restore,sync:sync,decorate:decorate,hide:function(){opened=false;},show:function(){if(selected)opened=true;},available:function(){return !!selected&&state?.uiView==='editor';},name:function(){return selected?selected._fields.querySelector('.equipment-name').value:'';}};
})();
</script>
