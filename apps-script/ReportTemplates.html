<!-- Edit these templates to change the exported document layout. Dynamic content is escaped by Reports. -->
<template id="report-document-template">
  <main class="report-document">
    <header class="report-cover"><span class="report-brand" data-report="brand"></span><h1 data-report="title"></h1><p data-report="subtitle"></p></header>
    <div class="report-content" data-report="body"></div>
    <footer class="report-footer" data-report="footer"></footer>
  </main>
</template>



<template id="report-table-template"><div class="report-table"><table><thead></thead><tbody></tbody></table></div></template>
