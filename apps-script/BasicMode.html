<script>
// Optional presentation adapter. Removing its includes and hooks restores Advance.
window.STBasicMode=(function(){
  var state,actions,mounted=false,initialized=false,layout,panel,inspector,inspectorHome,inspectorNext,list,listHome,nav,sectionRow,tools,title,geminiToggle,geminiHome,geminiNext,setupControls,efficiencies,controlHomes=[],conveyorTabs,conveyorSummary,conveyorView="inputs";
  var sections=[['equipment',__ST_TEXT__('filter.equipment'),'edit','editor'],['conveyors',__ST_TEXT__('filter.conveyors'),'list','editor'],['simulation',__ST_TEXT__('shell.simulation'),'play','simulation'],['vgraph',__ST_TEXT__('basic.vgraph'),'chart','results'],['whatif',__ST_TEXT__('shell.what_if'),'flask','whatif'],['results',__ST_TEXT__('shell.results'),'chart','results']];
  function basic(){return !['ADVANCE','ADVANCED'].includes(String(state?.bootstrap?.uiMode||'BASIC').toUpperCase());}
  function type(card){return card._fields?.querySelector('.equipment-type')?.value;}
  function inline(card){return basic()&&type(card)!=='CONVEYOR';}
  function button(label,icon,click){var b=document.createElement('button');b.type='button';b.className='ghost';b.textContent=label;b.dataset.icon=icon;b.onclick=click;return b;}
  function init(current,callbacks){
    if(initialized)return;initialized=true;state=current;actions=callbacks;
    var header=document.querySelector('.topbar');
    sectionRow=document.createElement('div');sectionRow.id='basic-section-row';header.appendChild(sectionRow);
    nav=document.createElement('nav');nav.id='basic-navigation';nav.setAttribute('aria-label',__ST_TEXT__('basic.navigation'));
    sections.forEach(function(s){var b=button(s[1],s[2],function(){
      var previous=state.basicView;state.basicView=s[0];
      if(actions.navigate(s[3])===false){state.basicView=previous;actions.refresh();}
    });b.dataset.basicView=s[0];nav.appendChild(b);});sectionRow.appendChild(nav);
    tools=document.createElement('div');tools.id='basic-case-actions';tools.className='basic-utilities';
    var utilityRow=document.createElement('div');utilityRow.className='button-row';tools.appendChild(utilityRow);
    geminiToggle=document.getElementById('toggle-gemini');geminiHome=geminiToggle.parentNode;geminiNext=geminiToggle.nextSibling;
    [['open-settings',__ST_TEXT__('shell.settings'),'settings'],['home-cases',__ST_TEXT__('view.close_case'),'back'],['sign-out',__ST_TEXT__('view.sign_out'),'logout']].forEach(function(s){var b=button('',s[2],function(){document.getElementById(s[0]).click();});b.classList.add('icon-button');b.title=s[1];b.setAttribute('aria-label',s[1]);utilityRow.appendChild(b);});header.appendChild(tools);
    list=document.getElementById('equipment-list');listHome=list.parentNode;
    layout=document.createElement('div');layout.id='basic-conveyor-layout';list.before(layout);
    panel=document.createElement('aside');panel.id='basic-conveyor-panel';panel.setAttribute('aria-label',__ST_TEXT__('basic.conveyor_configuration'));
    title=document.createElement('h3');panel.appendChild(title);layout.appendChild(panel);
    conveyorTabs=document.createElement('div');conveyorTabs.className='button-row basic-conveyor-tabs';
    ['inputs','results'].forEach(function(view){var b=button(view==='inputs'?'Inputs':'Results','',function(){conveyorView=view;refreshData();});b.dataset.conveyorView=view;conveyorTabs.appendChild(b);});panel.appendChild(conveyorTabs);
    conveyorSummary=document.createElement('section');conveyorSummary.id='basic-conveyor-summary';panel.appendChild(conveyorSummary);
    efficiencies=document.createElement('div');efficiencies.id='basic-efficiencies';document.querySelector('#editor-panel > .editor-subheading').before(efficiencies);
    setupControls=document.createElement('div');setupControls.id='basic-run-controls';efficiencies.after(setupControls);
    [['run-playback-rate','Speed'],['run-shift-count','Duration (8 h shifts)'],['run-rounds','Rounds']].forEach(function(spec){
      var control=document.getElementById(spec[0]),label=control.closest('label');controlHomes.push({node:label,home:label.parentNode,next:label.nextSibling});
      var group=document.createElement('section'),heading=document.createElement('strong');heading.textContent=spec[1];group.appendChild(heading);setupControls.appendChild(group);
      if(spec[0]!=='run-rounds'){
        var row=document.createElement('div');row.className='button-row';group.appendChild(row);
        var values=spec[0]==='run-playback-rate'?[1,5,10,50,100]:[1,2,3];
        values.forEach(function(value){var b=button(spec[0]==='run-playback-rate'?value+'×':value+' shift'+(value===1?'':'s'),'',function(){
          control.value=String(value);
          if(spec[0]==='run-shift-count'){document.getElementById('run-shift-hours').value='8';var mode=document.getElementById('duration-mode');mode.value='SHIFTS';mode.dispatchEvent(new Event('change',{bubbles:true}));}
          control.dispatchEvent(new Event(spec[0]==='run-playback-rate'?'change':'input',{bubbles:true}));refreshData();
        });b.dataset.control=spec[0];b.dataset.value=String(value);row.appendChild(b);});
      }
      group._label=label;
    });
    inspector=document.getElementById('equipment-inspector');inspectorHome=inspector.parentNode;inspectorNext=inspector.nextSibling;
    window.addEventListener('st:inspector',function(){if(basic()){title.textContent=STEquipmentInspector.name();conveyorView='inputs';refreshData();}});
    sync(current);
  }
  function mount(){if(mounted)return;sectionRow.appendChild(geminiToggle);layout.insertBefore(list,panel);panel.appendChild(inspector);Array.from(setupControls.children).forEach(function(group){group.appendChild(group._label);});mounted=true;}
  function unmount(){if(!mounted)return;controlHomes.slice().reverse().forEach(function(c){c.home.insertBefore(c.node,c.next);});geminiHome.insertBefore(geminiToggle,geminiNext);STEquipmentInspector.release();STEquipmentInspector.hide();listHome.insertBefore(list,layout);inspectorHome.insertBefore(inspector,inspectorNext);mounted=false;}
  function sync(current){
    state=current;if(!initialized)return;
    var enabled=basic(),root=document.documentElement;root.dataset.uiMode=enabled?'basic':'advance';
    STPreferences.applyJsonFields(root.dataset.uiMode);
    if(!enabled){unmount();return;}mount();
    var active=Boolean(state.activeCase),view=state.uiView;
    var section=view==='editor'?(state.basicView==='conveyors'?'conveyors':'equipment'):view==='results'?(state.basicView==='results'?'results':'vgraph'):view==='whatif'?'whatif':'simulation';
    root.dataset.basicView=active?section:'cases';sectionRow.classList.toggle('hidden',!active);nav.classList.toggle('hidden',!active);tools.classList.toggle('hidden',!active);
    nav.querySelector('[data-basic-view=results]').classList.toggle('hidden',!state.run.result?.summary);
    nav.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-current',b.dataset.basicView===section?'page':'false');});
    var cards=Array.from(list.querySelectorAll('.equipment-card'));
    cards.forEach(function(card){card.classList.toggle('basic-machine',type(card)!=='CONVEYOR');if(type(card)==='CONVEYOR')prepareWorksheet(card);});
    if(active&&view==='editor'){
      var conveyor=section==='conveyors';
      inspector.classList.toggle('hidden',!conveyor);
      if(!conveyor){STEquipmentInspector.release();STEquipmentInspector.hide();}
      STEquipmentFilter.set(conveyor?'conveyors':'equipment');
      if(conveyor){
        var chosen=cards.find(function(c){return type(c)==='CONVEYOR'&&c.classList.contains('equipment-selected');})||cards.find(function(c){return type(c)==='CONVEYOR';});
        if(chosen&&!chosen.classList.contains('equipment-selected'))STEquipmentInspector.select(chosen,false);
        title.textContent=chosen?STEquipmentInspector.name():__ST_TEXT__('filter.empty');
      }
      document.getElementById('breadcrumb-view').textContent=conveyor?__ST_TEXT__('filter.conveyors'):__ST_TEXT__('filter.equipment');
    }else if(active&&view==='results'&&section==='vgraph'){
      document.getElementById('breadcrumb-view').textContent=__ST_TEXT__('basic.vgraph');
      // Display the input speed profile even before a run has been completed.
      document.getElementById('results-empty').classList.add('hidden');document.getElementById('results-body').classList.remove('hidden');
      STLinePerformance.render(state.run.result,state.activeCase.equipment||[]);
    }
    if(active){var host=section==='simulation'?document.getElementById('run-panel'):document.getElementById('editor-panel');
      var before=section==='simulation'?document.getElementById('run-config'):host.querySelector('.editor-subheading');
      host.insertBefore(efficiencies,before);host.insertBefore(setupControls,before);
    }
    refreshData();
    STIcons.decorate(nav);STIcons.decorate(tools);
  }
  function prepareWorksheet(card){
    var fields=card._fields;if(fields._basicWorksheet)return;
    var setup=fields.querySelector('.format-zone-setup'),worksheet=node('div','','basic-conveyor-worksheet');setup.appendChild(worksheet);
    var groups=[
      ['UPSTREAM','upstream',[
        ['package-length','Package Length (mm)'],['discharge-pitch','Discharge Pitch (mm)'],['startup','Startup Time (sec)'],['residual','Bottles at Stop'],
        [null,'Package velocity (m/min)','package-velocity'],[null,'Output rate B2B (m/min)','output-b2b']]],
      ['DOWNSTREAM','downstream',[
        ['infeed','Infeed Pitch (mm)'],['downstream-ramp','Ramp Up Time (sec)'],[null,'Consumption Rate (m/min)','consumption']]],
      ['GEOMETRY','geometry',[
        ['lact','Lact = Total Length (mm)'],['lp-prime','Lp = Prime Zone (mm)'],['discharge-runout','Discharge Actual (mm)'],['reject-runout','Coding Actual (mm)'],
        [null,'Overflow (mm)','overflow'],[null,'Lbu = D8 + E8 + F8 (mm)','lbu'],[null,'Lba = Lact − Lbu − Lp (mm)','lba']]],
      ['Speed & Sensors','sensors',[
        ['speed-factor','Discharge factor (%)'],['coding-factor','Coding factor (%)'],['acc-factor','Acc Zone factor (%)'],['blocked-delay','Back up block delay (sec)'],
        ['clear-delay','Back up clear delay (sec)'],['insurance','Insurance factor (pkgs)'],['overspeed','Conveyor overspeed (%)']]]
    ];
    groups.forEach(function(group){var section=node('section','','basic-worksheet-group format-zone-grid'),h=node('h4',group[0]);h.dataset.basicGroup=group[1];section.appendChild(h);worksheet.appendChild(section);
      group[2].forEach(function(spec){var label;
        if(spec[0]){var control=fields.querySelector('.format-zone-'+spec[0]);label=control.closest('label');if(label.firstChild?.nodeType===Node.TEXT_NODE)label.firstChild.nodeValue=spec[1];section.appendChild(label);}
        else {label=node('label',spec[1],'basic-worksheet-calculated');var output=node('output','—');output.dataset.basicOutput=spec[2];label.appendChild(output);section.appendChild(label);}
      });
    });
    fields._basicWorksheet=worksheet;
  }
  function updateWorksheet(card,audit,equipment){
    prepareWorksheet(card);
    var fields=card._fields,c=audit?.engineering?.calculated,up=equipment.find(function(e){return e.id===audit?.upstreamId;}),down=equipment.find(function(e){return e.id===audit?.downstreamId;});
    fields.querySelector('[data-basic-group=upstream]').textContent='UPSTREAM: '+(up?.name||'—')+' ('+number(up?.nominalRatePerSecond*60)+' BPM)';
    fields.querySelector('[data-basic-group=downstream]').textContent='DOWNSTREAM: '+(down?.name||'—')+' ('+number(down?.nominalRatePerSecond*60)+' BPM)';
    var outputs={'package-velocity':c?.upstreamDischargeVelocityMmPerSecond*.06,'output-b2b':c?.machineOutputRateMmPerSecond*.06,'consumption':c?.downstreamInfeedRateMmPerSecond*.06,'overflow':c?.overflowProductLengthMm,'lbu':c?.overflowLengthMm,'lba':c?.usefulAccumulationLengthMm};
    fields.querySelectorAll('[data-basic-output]').forEach(function(output){output.textContent=number(outputs[output.dataset.basicOutput]);});
  }
  function number(value,digits){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:digits??2}):'—';}
  function node(tag,text,cls){var n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;return n;}
  function metric(host,label,value){var row=node('div','','basic-metric');row.append(node('span',label),node('strong',value));host.appendChild(row);}
  function refreshData(){
    if(!mounted||!basic()||!state.activeCase)return;
    var equipment=actions.preview?.()||state.activeCase.equipment||[],simulation=(state.activeCase.simulations||[]).find(function(s){return s.id===state.activeSimulationId;});
    var audits=STScenarios.audit({equipment:equipment}),availability=1;
    Array.from(list.querySelectorAll('.equipment-card')).forEach(function(card,index){
      var e=equipment[index];if(!e)return;var machine=e.type!=='CONVEYOR';
      var sectionAudit=!machine?audits.find(function(x){return x.equipmentId===e.id;}):null;
      var upstream=equipment.find(function(x){return x.id===sectionAudit?.upstreamId;}),downstream=equipment.find(function(x){return x.id===sectionAudit?.downstreamId;});
      card.querySelector('.equipment-header strong').textContent=machine?e.name:(upstream&&downstream?upstream.name+' → '+downstream.name:e.name);
      var data=card.querySelector('.basic-card-data');if(!data){data=node('section','','basic-card-data');card.appendChild(data);}
      data.replaceChildren();
      if(machine){
        var speedLabel=card._fields.querySelector('.equipment-rate').closest('label');if(speedLabel.firstChild?.nodeType===Node.TEXT_NODE)speedLabel.firstChild.nodeValue='Speed (BPM)';
        var reliability=e.noiseProfile.reliability||{},a=reliability.mtbfMinutes/(reliability.mtbfMinutes+reliability.mttrMinutes);availability*=Number.isFinite(a)?a:NaN;
        var next=equipment[index+1],audit=next?.type==='CONVEYOR'?audits.find(function(x){return x.equipmentId===next.id;}):null;
        var capacity=audit?.engineering?.runtimeGeometry?.capacityUnits,downstream=equipment.find(function(x){return x.id===audit?.downstreamId;});
        var buffer=next?.type==='CONVEYOR'?capacity/(downstream?.nominalRatePerSecond*60):0;
        var label=node('label','Buffer post (min)'),output=node('output',number(buffer));output.className='basic-buffer';label.appendChild(output);data.append(label,node('strong','Avail (%): '+number(a*100,1),'basic-availability'));
      }else{
        var audit=audits.find(function(x){return x.equipmentId===e.id;}),calc=audit?.engineering?.calculated;
        var zone=Object.values(state.run.result?.accumulationZoneMetrics||{}).find(function(z){return z.ownerEquipmentId===e.id;}),loss=zone?.conveyorConstraintLossPercent??null;
        metric(data,'Loss',number(loss,1)+(loss===null?'':'%'));metric(data,'Tacc AB',number(calc?.antiBlockSeconds,0)+' s');
        data.appendChild(node('strong',audit?.engineering?.audit?.status||'NOT EVALUATED','basic-validation'));
      }
    });
    efficiencies.replaceChildren();metric(efficiencies,'Theoretical equipment efficiency',number(availability*100,1)+'%');metric(efficiencies,'Simulated efficiency',number(state.run.result?.summary?.lineOeePercent,1)+(state.run.result?'%':''));
    setupControls.querySelectorAll('[data-control]').forEach(function(b){b.setAttribute('aria-pressed',String(document.getElementById(b.dataset.control).value===b.dataset.value));});
    var chosen=list.querySelector('.equipment-selected'),id=chosen?.dataset.equipmentId,audit=audits.find(function(x){return x.equipmentId===id;}),c=audit?.engineering?.calculated,unit=equipment.find(function(e){return e.id===audit?.downstreamId;});
    if(chosen)title.textContent=chosen.querySelector('.equipment-header strong').textContent;
    if(chosen)updateWorksheet(chosen,audit,equipment);
    conveyorSummary.replaceChildren();
    var left=node('section','','basic-conveyor-result-column'),right=node('section','','basic-conveyor-result-column');conveyorSummary.append(left,right);
    var zone=Object.values(state.run.result?.accumulationZoneMetrics||{}).find(function(z){return z.ownerEquipmentId===id;}),duration=state.run.result?.durationSeconds;
    var status=Number.isFinite(c?.minimumInstalledLengthMm)&&Number.isFinite(audit?.engineering?.input.installedLengthMm)?audit.engineering.input.installedLengthMm>=c.minimumInstalledLengthMm?'PASS':'FAIL':'NOT EVALUATED';
    metric(left,'Tacc Antistarve (sec)',number(c?.antiStarveSeconds));metric(right,'Tacc Antiblock (sec)',number(c?.antiBlockSeconds));
    var pass=node('div','','basic-metric');pass.dataset.status=status;pass.append(node('span','Lact vs Lmin'),node('strong',status));left.appendChild(pass);
    metric(right,'Conv Loss (%)',number(zone?.conveyorConstraintLossPercent));
    [['Lba actual (mm)',c?.usefulAccumulationLengthMm],['Lba min rampup (mm)',c?.minimumRampAccumulationLengthMm],['Lrec (mm)',c?.recoveryLengthMm],['Overflow req (mm)',c?.overflowProductLengthMm],['Lmin required (mm)',c?.minimumInstalledLengthMm],['Min infeed speed (m/min)',c?.recommendedInfeedConveyorSpeedMmPerSecond*.06]].forEach(function(row){metric(left,row[0],number(row[1]));});
    [['Discharge zone',c?.dischargePopulationPercent],['Coding zone',c?.codingPopulationPercent],['Acc zone',c?.populationPercent]].forEach(function(row){
      var label=node('label',row[0]+' · '+number(row[1])+'%','basic-population');label.title='Calculated design population (packed material rate / zone belt speed); this is not live inventory.';
      var bar=document.createElement('progress');bar.max=100;if(Number.isFinite(row[1]))bar.value=Math.max(0,Math.min(100,row[1]));bar.setAttribute('aria-label',row[0]+' population');label.appendChild(bar);right.appendChild(label);
    });
    metric(right,'Block upstream',Number.isFinite(zone?.blockingEquivalentSeconds)?zone.blockingEquivalentSeconds>0?'YES':'NO':'—');
    metric(right,'Starve downstream',Number.isFinite(zone?.starvingEquivalentSeconds)?zone.starvingEquivalentSeconds>0?'YES':'NO':'—');
    metric(right,'Lost blocking/hr (s)',number(duration>0?zone?.blockingEquivalentSeconds/duration*3600:undefined));
    metric(right,'Lost starving/hr (s)',number(duration>0?zone?.starvingEquivalentSeconds/duration*3600:undefined));
    right.title='Observed equivalent loss seconds per hour; concurrent upstream blocking and downstream starving count once in Conv Loss.';
    conveyorSummary.classList.toggle('hidden',conveyorView!=='results');
    inspector.classList.toggle('hidden',state.uiView!=='editor'||state.basicView!=='conveyors'||conveyorView!=='inputs');
    conveyorTabs.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.conveyorView===conveyorView));b.disabled=false;});
  }
  return {init:init,sync:sync,inline:inline,isBasic:basic,newType:function(){return basic()&&state.basicView==='conveyors'?'CONVEYOR':null;}};
})();
</script>
