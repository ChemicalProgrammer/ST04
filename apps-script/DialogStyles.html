<style>
dialog { width: min(var(--dialog-width),calc(100vw - var(--space-6))); max-height: calc(100dvh - var(--space-6)); padding: 0; border: var(--border-width) solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-dialog); overflow: hidden; }

.dialog-body { padding: var(--space-5); overflow-y:auto; min-height:0; } .settings-section { padding-bottom: var(--space-5); margin-bottom: var(--space-5); border-bottom: var(--border-width) solid var(--line); }

.dialog-actions { flex-shrink:0; border-top:var(--border-width) solid var(--line); padding:var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); padding-top: var(--space-4); }
#settings-unsaved { margin-right: auto; color: var(--warning); font-size: var(--font-secondary); }
#settings-error { color: var(--danger); font-size: var(--font-secondary); }

.command-list { overflow-y:auto; display: grid; gap: var(--space-1); padding: var(--space-2); } .command-list button { justify-content: flex-start; }
#toast { position: fixed; bottom: var(--space-5); right: var(--space-5); z-index: var(--z-toast); background: var(--surface); border: var(--border-width) solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-dialog); max-width: calc(100vw - var(--space-8)); }

 .api-key-control { display:grid; grid-template-columns:minmax(0,1fr) var(--control-height); gap:var(--space-2); align-items:center; }
