<script>
  (function() {
    var state = {
      bootstrap: null,
      requestEpoch: 0,
      pendingRequests: 0,
      openSequence: 0,
      saving: false,
      activeCase: null,
      activeSimulationId: null,
      workspaceView: 'simulation',
      uiView: 'simulation',
      isDirty: false,
      liveZoneDetails: {},
      lastUserScrollAt: 0,
      scrollRestoreFrame: null,
      scrollRestoreUntil: 0,
      run: {
        commands: [],
        result: null,
        representative: null,
        roundIndex: 0,
        sampleIndex: 0,
        timer: null,
        playing: false,
        durationMode: 'FIXED',
        configuration: null
      }
    };

    var charts = STCharts(state,formatNumber);
    var drawSimulationChart = charts.drawSimulationChart, drawEquipmentSpeedChart = charts.drawEquipmentSpeedChart, drawEquipmentSpeedSparkline = charts.drawEquipmentSpeedSparkline;
    var renderCaseComparison = STComparison(state,isFiniteNumber).render;
    var assistant = STAssistant(state, {flush:flushForServer, applyScenario:applyChatScenario});
    var sheetImport = STSheetImport(state,{apply:applySheetImport,capture:captureSheetImport});
    var shell = STShell(state,{assistant:assistant.sync,signout:lockWorkspace,navigate:navigateView,home:showCaseHome,save:saveActiveCase,cases:function(){renderCases(state.bootstrap?.cases||[]);},redraw:renderPlaybackFrame,preview:basicEquipmentPreview});
    function navigateView(view) {
      if (!state.activeCase) return false;
      if (!syncPersistentSimulation()) return false;
      state.uiView = view;
      if(view==='whatif')renderSimulationAnalysis();
      if (view === 'comparison') showCaseComparison();
      else { state.workspaceView = 'simulation'; renderWorkspaceTabs(); }
      shell.sync(); renderPlaybackFrame();
      return true;
    }

    document.addEventListener('DOMContentLoaded', function() {
      bindEvents();
      STEquipmentInspector.init(state,markCaseDirty);
      assistant.init();
      sheetImport.init();
      STConfigurationEditor.init(state, {
        capture: async function(){ await flushCase(); var editor=collectCaseEditor(),run=readRunConfiguration(); if(!editor||!run)throw Error(__ST_TEXT__('exports.setup_invalid')); return STReports.configuration(editor,Object.assign({},activePersistentSimulation(),{equipment:editor.equipment,dynamicConfig:run})); },
        apply: function(config){ var simulation=activePersistentSimulation(); invalidateActiveResult(); simulation.equipment=cloneJson(config.equipment); simulation.dynamicConfig=cloneJson(config.dynamicConfig); simulation.updatedAt=new Date().toISOString(); activatePersistentSimulation(simulation.id,true); state.uiView='editor'; shell.sync(); autosave.change(true); }
      });
      shell.init();
      if (STPreferences.read('remember') === 'yes') {
        document.getElementById('remember-session').checked = true;
        signIn();
      }
    });
    window.addEventListener('resize', function() { renderPlaybackFrame(); });
    window.addEventListener('scroll', function() {
      if (Date.now() >= state.scrollRestoreUntil) state.lastUserScrollAt = Date.now();
    }, { passive: true });

    function bindEvents() {
      document.getElementById('sign-in-form').addEventListener('submit', function(event) { event.preventDefault(); signIn(); });
      document.getElementById('sign-out').addEventListener('click', lockWorkspace);
      document.getElementById('home-cases').addEventListener('click', showCaseHome);
      document.getElementById('open-settings').addEventListener('click', STSettings.open);
      document.getElementById('show-new-case').addEventListener('click', function() {
        toggle('new-case-form', true); document.getElementById('new-case-name').focus();
      });
      document.getElementById('case-search').addEventListener('input', function() { renderCases(state.bootstrap ? state.bootstrap.cases : []); });
      document.getElementById('workspace-form').addEventListener('submit', function(event){event.preventDefault();});
      STSettings.connect(saveWorkspace);
      STSettings.connectCaseFlush(function(){return prepareCaseDraft();});
      STSettings.connectInterfaceMode(function(mode){
        STEquipmentInspector.release();
        document.getElementById('equipment-list').replaceChildren();
        state.bootstrap.uiMode=mode;
        configureSaving();
        STBasicMode.sync(state);
        if(state.activeCase)renderEquipment();
        shell.sync();
        if(state.run.result)renderPlaybackFrame();
      });
      STSettings.connectRemoval(function(done){callServer('deleteGeminiApiKey',[],function(response){if(response.ok){state.bootstrap.gemini=response.data;STSettings.configureGemini(response.data);}done(response);});});
      document.getElementById('retry-autosave').onclick = retryAutosave;
      document.getElementById('save-case').onclick = function(){flushCase(true).catch(function(error){showError({message:error.message});});};
      document.getElementById('new-case-form').addEventListener('submit', createDraftCase);
      document.getElementById('create-public-demo-case').addEventListener('click', createPublicDemoCase);
      document.getElementById('clone-case').addEventListener('click', cloneActiveSimulation);
      document.getElementById('delete-case').addEventListener('click', deleteActiveCase);
      document.getElementById('rename-simulation').onclick = renameSimulation;
      document.getElementById('simulation-selector').onchange=function(){activatePersistentSimulation(this.value);this.value=state.activeSimulationId||'';};
      document.getElementById('delete-simulation').onclick = deleteSimulation;
      document.getElementById('add-equipment').addEventListener('click', addEquipment);
      document.getElementById('case-editor-form').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('change', markCaseDirty);
      document.getElementById('case-editor-form').addEventListener('change', markCaseDirty);
      document.getElementById('add-control-event').addEventListener('click', addControlEvent);
      document.getElementById('run-simulation').addEventListener('click', runSimulation);
      document.getElementById('play-simulation').addEventListener('click', startPlayback);
      document.getElementById('pause-simulation').addEventListener('click', pausePlayback);
      document.getElementById('reset-playback').addEventListener('click', resetPlayback);
      document.getElementById('playback-round').addEventListener('change',function(){selectPlaybackRound(Number(this.value),false);});
      document.getElementById('run-playback-rate').addEventListener('change',function(){var simulation=activePersistentSimulation();if(simulation){simulation.playbackRate=Number(this.value);autosave.change();}});
      ['run-duration','run-sample-interval','run-seed','run-rounds','run-shift-hours','run-shift-count'].forEach(function(id){document.getElementById(id).addEventListener('input',markCaseDirty);});
      document.getElementById('duration-mode').addEventListener('change', function(event) {
        state.run.durationMode = event.target.value;
        syncDurationControls();
        markCaseDirty();
      });
    }

    window.ST_CASE_SAVE_LIMITS={maxBytes:3*1024*1024};
    var localCalculations=0;
    function activity(){document.getElementById('request-progress').classList.toggle('hidden',!(state.pendingRequests||localCalculations));}
    window.addEventListener('st-calculation-activity',function(event){localCalculations=Math.max(0,localCalculations+(event.detail.active?1:-1));activity();});
    var whatIfOnlySave=false;
    var autosave = STAutosave({capture:captureForSave,send:function(payload,done){callServer('saveCase',[payload],done);},accept:function(saved){
      if (!state.activeCase || state.activeCase.id !== saved.id) return;
      state.activeCase.revision=saved.revision;state.activeCase.updatedAt=saved.updatedAt;
      var item=(state.bootstrap?.cases||[]).find(function(x){return x.id===saved.id;});
      if(item){item.name=saved.name;item.updatedAt=saved.updatedAt;item.equipmentCount=saved.equipmentCount??saved.equipment?.length??item.equipmentCount;item.isSimulationReady=item.equipmentCount>=2;}
    },status:function(status,error){
      state.saving=status==='saving';state.isDirty=status!=='saved';
      syncSaveButton();
      var label=document.getElementById('autosave-status');if(!label)return;
      label.textContent={saved:__ST_TEXT__('autosave.saved'),pending:__ST_TEXT__('autosave.pending'),saving:__ST_TEXT__('autosave.saving'),error:__ST_TEXT__('autosave.error')}[status];
      label.title=error?error.message:'';label.dataset.state=status;
      document.getElementById('retry-autosave').classList.toggle('hidden',status!=='error');
      if(shell)shell.sync();
    }});
    var queueCaseSave=autosave.change;autosave.change=function(immediate){whatIfOnlySave=false;queueCaseSave(immediate);};
    window.addEventListener('st-whatif-change',function(event){if(state.activeCase?.simulations?.includes(event.detail.simulation)){if(!autosave.pending())whatIfOnlySave=true;queueCaseSave();}});
    window.addEventListener('beforeunload',function(event){if(autosave.pending()||STSettings.pending()){event.preventDefault();event.returnValue='';}});
    window.addEventListener('online',function(){if(automaticSaving()&&autosave.pending())autosave.retry().catch(function(){});});
    function automaticSaving(){return ['ADVANCE','ADVANCED'].includes(String(state.bootstrap?.uiMode||document.documentElement.dataset.uiMode).toUpperCase())&&STPreferences.read('autosaveEnabled')!=='no';}
    function syncSaveButton(){var b=document.getElementById('save-case');if(!b)return;b.classList.toggle('hidden',!state.activeCase||automaticSaving());b.disabled=state.saving||!state.isDirty;}
    function configureSaving(){var seconds=Number(STPreferences.read('autosaveSeconds')||10);autosave.configure({enabled:automaticSaving(),intervalMs:Math.max(1,Math.min(3600,seconds||10))*1000});syncSaveButton();}
    window.addEventListener('st-save-policy-change',configureSaving);
    function prepareCaseDraft(){if(state.activeCase&&!syncPersistentSimulation())return Promise.reject(new Error(__ST_TEXT__('autosave.invalid')));return Promise.resolve();}
    function flushCase(force){return prepareCaseDraft().then(function(){return force===true||automaticSaving()?autosave.flush():undefined;});}
    function flushForServer(){return prepareCaseDraft().then(function(){if(!automaticSaving()&&autosave.pending())throw new Error('Save the case using the Save icon before asking Gemini.');return autosave.flush();});}
    async function leaveCase(){
      if(!state.activeCase||!autosave.pending())return true;
      if(automaticSaving()){await flushCase();return true;}
      var answer=await STDialog.open({title:'Unsaved case changes',message:'Save your changes before closing this case?',buttons:[{id:'cancel',label:__ST_TEXT__('view.cancel')},{id:'discard',label:'Discard changes'},{id:'save',label:'Save changes'}]});
      if(answer.action==='cancel')return false;
      if(answer.action==='save')await flushCase(true);
      else autosave.reset();
      return true;
    }
    async function retryAutosave(){
      try{await flushCase(true);}catch(error){
        if(error.code==='CASE_CONFLICT'){
          var answer=await STDialog.open({title:__ST_TEXT__('autosave.conflict_title'),message:__ST_TEXT__('autosave.conflict_message'),buttons:[{id:'cancel',label:__ST_TEXT__('view.cancel')},{id:'reload',label:__ST_TEXT__('autosave.export_reload')}]});
          if(answer.action==='reload'){
            var draft=captureForSave();if(!draft)return;
            var url=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));var link=document.createElement('a');link.href=url;link.download='case-draft.json';link.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
            var id=state.activeCase.id;autosave.reset();state.isDirty=false;openCase(id);
          }
        }else showError({message:error.message});
      }
    }
    function signIn() {
      document.getElementById('sign-in-button').disabled = true;
      document.getElementById('auth-status').textContent = __ST_TEXT__('client.verifying_your_google_access');
      initialize();
    }

    async function showCaseHome() {
      try { if(!await leaveCase())return false; } catch(error) { showError({message:error.message}); return false; }
      state.openSequence += 1;
      stopPlaybackTimer();
      sheetImport.close();
      state.activeCase = null;
      autosave.reset();
      state.run.result = null;
      state.isDirty = false;
      ['editor-panel', 'run-panel', 'comparison-panel', 'workspace-tabs', 'engine-panel'].forEach(function(id) { toggle(id, false); });
      var connected = Boolean(state.bootstrap && state.bootstrap.settings.workspaceRootFolderId);
      toggle('cases-panel', connected);
      shell.sync();
      return true;
    }

    async function lockWorkspace() {
      if (!await showCaseHome()) return;
      if (!await STSettings.flush()) return;
      state.requestEpoch += 1;
      cloningCases.clear();
      STPreferences.write('remember', null);
      document.getElementById('remember-session').checked = false;
      state.bootstrap = null;
      assistant.reset();
      document.getElementById('cases-list').textContent = '';
      toggle('application', false); toggle('auth-panel', true);
      document.getElementById('auth-status').textContent = __ST_TEXT__('client.signed_out_of_line_studio_your_google_account_remains_signed_in');
      document.getElementById('sign-in-button').focus();
    }

    function initialize() {
      setStatus(__ST_TEXT__('client.loading_console'));
      callServer('getBootstrap', [], renderBootstrap);
    }

    function renderBootstrap(response) {
      if (!response.ok) return showError(response.error);
      document.getElementById('sign-in-button').disabled = false;
      document.getElementById('auth-status').textContent = '';
      STPreferences.write('remember', document.getElementById('remember-session').checked ? 'yes' : null);
      document.documentElement.classList.remove('restoring-session');
      toggle('auth-panel', false); toggle('application', true);
      state.bootstrap = response.data;
      state.bootstrap.uiMode=STPreferences.resolveInterfaceMode(response.data.uiMode);
      configureSaving();
      STSettings.configureGemini(response.data.gemini || {});
      document.getElementById('user-email').textContent = response.data.user.email;
      document.getElementById('workspace-folder-id').value = response.data.settings.workspaceRootFolderId || '';


      var hasWorkspace = Boolean(response.data.settings.workspaceRootFolderId);
      document.getElementById('workspace-panel').classList.remove('hidden');
      toggle('cases-panel', hasWorkspace && !state.activeCase);
      toggle('engine-panel', false);
      renderCases(response.data.cases);
      setStatus(state.activeCase ? '' : (hasWorkspace ? '' : __ST_TEXT__('client.open_settings_to_connect_a_drive_folder_before_creating_a_case')));
      shell.sync();
    }

    async function saveWorkspace(request, done) {
      var changingFolder=request.workspaceRootFolderId.trim()!==state.bootstrap.settings.workspaceRootFolderId;
      if(changingFolder && !await showCaseHome()){done({ok:false,error:{message:__ST_TEXT__('autosave.invalid')}});return;}
      callServer('saveUserSettings', [request], function(response) {
        if(response.ok){
          state.bootstrap.settings=response.data;
          state.bootstrap.gemini={model:request.gemini.model,configured:Boolean(request.gemini.apiKey||state.bootstrap.gemini?.configured)};
          STSettings.setKeyConfigured(state.bootstrap.gemini.configured);
          shell.sync();
          if(!state.activeCase)callServer('getBootstrap',[],function(r){if(r.ok&&state.bootstrap?.settings.workspaceRootFolderId===response.data.workspaceRootFolderId){state.bootstrap.cases=r.data.cases;renderCases(r.data.cases);shell.sync();}});
        }
        done(response);
      });
    }

    function createDraftCase(event) {
      event.preventDefault();
      var input = document.getElementById('new-case-name');
      setBusy('new-case-form', true);
      callServer('createCase', [{ name: input.value }], function(response) {
        setBusy('new-case-form', false);
        if (!response.ok) return showError(response.error);
        input.value = '';
        toggle('new-case-form', false);
        openCase(response.data.id);
        initialize();
      });
    }



function createPublicDemoCase() {
      setBusy('create-public-demo-case', true);
      callServer('createPublicDemoCase', [], function(response) {
        setBusy('create-public-demo-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function deleteActiveCase() {
      if (!state.activeCase) return;
      requestCaseDeletion(state.activeCase.id, state.activeCase.name, document.getElementById('delete-case'));
    }

    async function requestCaseDeletion(caseId, caseName, button) {
      if (!await STDialog.confirm(__ST_TEXT__('dialog.delete_case'),__ST_TEXT__('client.move_case') + caseName + __ST_TEXT__('client.to_the_drive_trash'),true)) return;
      try{await flushCase();}catch(error){showError({message:error.message});return;}
      if (button) button.disabled = true;
      callServer('deleteCase', [caseId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        var deletedActiveCase = state.activeCase && state.activeCase.id === caseId;
        if (deletedActiveCase) {
          stopPlaybackTimer();
          state.activeCase = null;
          autosave.reset();
          STSettings.close();
          state.isDirty = false;
          state.run.commands = [];
          state.run.result = null;
          state.run.configuration = null;
          state.liveZoneDetails = {};
          toggle('editor-panel', false);
          toggle('run-panel', false);
        }
        initialize();
        setStatus(__ST_TEXT__('client.case_moved_to_drive_trash'));
      });
    }

async function openCase(caseId) {
      try{if(!await leaveCase())return;}catch(error){showError({message:error.message});return;}
      var sequence = ++state.openSequence;
      callServer('getCase', [caseId], function(response) {
        if(sequence !== state.openSequence) return;
        if (!response.ok) return showError(response.error);
        stopPlaybackTimer();
        state.activeCase = response.data;
        autosave.reset();
        toggle('cases-panel', false);

        state.isDirty = false;
        state.workspaceView = 'simulation';
        state.uiView = 'simulation';
        state.liveZoneDetails = {};
        state.run.commands = [];
        state.run.result = null;
        state.run.configuration = null;
        initializePersistentSimulations();
        setStatus(__ST_TEXT__('client.case_loaded'));
      });
    }

    function makeSimulationClone(source) {
      var copy=cloneJson(source), count=state.activeCase.simulations.length;
      copy.id='simulation-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
      copy.name=__ST_TEXT__('simulation.copy_name')+source.name;
      copy.results=null;delete copy.whatIf;copy.clonedFromSimulationId=source.id;copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;
      return copy;
    }
    async function cloneActiveSimulation() {
      if(!state.activeCase)return;
      try{await flushCase();}catch(error){showError({message:error.message});return;}
      var copy=makeSimulationClone(activePersistentSimulation());
      state.activeCase.simulations.push(copy);
      activatePersistentSimulation(copy.id,true);state.uiView='editor';shell.sync();autosave.change(true);
    }
    async function renameSimulation() {
      var source=activePersistentSimulation();if(!source)return;
      var answer=await STDialog.open({title:__ST_TEXT__('simulation.rename'),input:{label:__ST_TEXT__('simulation.name'),value:source.name},buttons:[{id:'cancel',label:__ST_TEXT__('view.cancel')},{id:'ok',label:__ST_TEXT__('dialog.ok')}]});
      if(answer.action!=='ok'||activePersistentSimulation()?.id!==source.id||answer.value===source.name)return;
      source.name=answer.value;source.updatedAt=new Date().toISOString();renderEditorMeta();renderWorkspaceTabs();autosave.change(true);
    }
    async function deleteSimulation() {
      var source=activePersistentSimulation();if(!source)return;
      if(state.activeCase.simulations.length<2){await STDialog.alert(__ST_TEXT__('simulation.delete'),__ST_TEXT__('simulation.keep_one'));return;}
      if(!await STDialog.confirm(__ST_TEXT__('simulation.delete'),__ST_TEXT__('simulation.delete_message')+source.name,true))return;
      try{await flushCase();}catch(error){showError({message:error.message});return;}
      state.activeCase.simulations=state.activeCase.simulations.filter(function(s){return s.id!==source.id;});
      activatePersistentSimulation(state.activeCase.simulations[0].id,true);state.uiView='editor';shell.sync();autosave.change(true);
    }
    function invalidateActiveResult() {
      var simulation=activePersistentSimulation();if(!simulation)return;
      simulation.results=null;state.run.result=null;state.run.configuration=null;stopPlaybackTimer();
      document.getElementById('simulation-json-preview').value='';
      toggle('simulation-results',false);
    }
    function markCaseDirty(event) {
      if (!state.activeCase) return;
      if(event?.target?.id==='case-name')state.activeCase.name=event.target.value;
      else invalidateActiveResult();
      autosave.change();renderEditorMeta();window.STBasicMode?.sync(state);
    }
    function captureForSave() {
      if(whatIfOnlySave&&state.activeCase){var evidenceDraft=Object.assign(cloneJson(state.activeCase),{expectedRevision:state.activeCase.revision});return fitCaseSave(evidenceDraft);}
      var next=collectCaseEditor();if(!next)return null;
      if(!next.name.trim()||next.equipment.some(function(e){return !e.id||!e.name||!(e.nominalRatePerSecond>0);}))throw new Error(__ST_TEXT__('autosave.invalid'));
      var simulation=activePersistentSimulation(),run=readRunConfiguration();if(!run)return null;
      if(simulation){simulation.equipment=cloneJson(next.equipment);simulation.dynamicConfig=cloneJson(run);simulation.updatedAt=new Date().toISOString();}
      compactStoredReplays(state.activeCase.simulations);
      next.simulations=cloneJson(state.activeCase.simulations);
      return fitCaseSave(cloneJson(next));
    }
    function fitCaseSave(draft){
      compactStoredReplays(draft.simulations);
      function bytes(){return new Blob([JSON.stringify(draft)]).size;}
      while(bytes()>window.ST_CASE_SAVE_LIMITS.maxBytes){
        var changed=false;(draft.simulations||[]).forEach(function(simulation){
          var result=simulation.results;if(!result)return;
          [result.replay].concat(result.batch?.replays||[]).filter(Boolean).forEach(function(replay){
            if(replay.samples?.length>2){var previous=replay.samples.length;replay.samples=retainedReplaySamples(replay.samples,Math.max(2,Math.floor(previous/2)));replay.detailCoverage=Object.assign({},replay.detailCoverage,{savedReplaySampled:true});changed=true;}
            if(replay.events?.length){replay.detailCoverage=Object.assign({},replay.detailCoverage,{savedEventsOmitted:replay.events.length+(replay.detailCoverage?.savedEventsOmitted||0)});replay.events=[];changed=true;}
          });
        });
        if(!changed)throw Object.assign(new Error('The case exceeds the save size budget even after compacting replay. Export the full results and remove unneeded simulations before saving. Your draft remains open.'),{code:'CASE_SAVE_SIZE'});
      }
      return draft;
    }
    function saveActiveCase(afterSave) {
      autosave.change(true);
      return prepareCaseDraft().then(function(){if(typeof afterSave==='function')afterSave(state.activeCase);}).catch(function(error){showError({message:error.message});});
    }

    function captureSheetImport() {
      var editor=collectCaseEditor();
      if (!editor) return null;
      return {equipment:cloneJson(editor.equipment),sourceImport:cloneJson(activePersistentSimulation()?.sourceImport||{})};
    }

    function applySheetImport(result) {
      var simulation=activePersistentSimulation();
      if (!state.activeCase || !simulation || state.saving || result.errors.length || !result.hasChanges) return false;
      syncPersistentSimulation();
      simulation.sourceImport=cloneJson(result.sourceImport);
      if(result.equipmentChanged){
        stopPlaybackTimer();
        state.activeCase.equipment=cloneJson(result.equipment);
        simulation.equipment=cloneJson(result.equipment);
        simulation.results=null;
        state.run.result=null;state.run.configuration=null;state.run.sampleIndex=0;
        document.getElementById('simulation-json-preview').value='';
        STResults.render(null,state.activeCase);
      }
      state.activeCase.metadata=Object.assign({},state.activeCase.metadata,{dataClassification:'USER_PROVIDED'});
      state.isDirty=true;state.uiView='editor';
      renderEditor();shell.sync();autosave.change(true);
      setStatus(__ST_TEXT__('client.applied_sheet_selection_to')+simulation.name+': '+result.added+__ST_TEXT__('client.added')+result.updated+__ST_TEXT__('client.updated_save_the_case')+(result.equipmentChanged?__ST_TEXT__('client.run_again_to_refresh_results'):''));
      return true;
    }

    function addEquipment() {
      if (!syncEquipmentFromEditor()) return;
      STEquipmentFilter.set('all');
      state.activeCase.equipment.push(createBlankEquipment());
      state.isDirty = true;
      renderEquipment();
      STEquipmentInspector.select(document.querySelector('#equipment-list .equipment-card:last-child'));
      invalidateActiveResult();autosave.change(true);
      renderRunWorkspace();
    }

    var cloningCases = new Set();
    function requestCaseClone(caseId,button) {
      if(cloningCases.has(caseId))return;
      cloningCases.add(caseId);button.disabled=true;
      callServer('cloneCase',[caseId],function(response){
        cloningCases.delete(caseId);button.disabled=false;
        if(!response.ok)return showError(response.error);
        state.bootstrap.cases.push(response.data);renderCases(state.bootstrap.cases);
        setStatus(__ST_TEXT__('casegallery.cloned'));
      });
    }

    function renderCases(cases) { STCaseGallery.render(cases, openCase, requestCaseClone); }

    function renderEditor() {
      if (!state.activeCase) return;
      toggle('editor-panel', true);
      var activeSimulation = activePersistentSimulation();
      document.getElementById('editor-title').textContent = state.activeCase.name + (activeSimulation ? ' · ' + activeSimulation.name : '');
      document.getElementById('case-name').value = state.activeCase.name;
      renderEditorMeta();
      renderCaseDataNote();
      renderEquipment();
      renderRawJson();
      renderRunWorkspace();
    }

    function renderEditorMeta() {
      if (!state.activeCase) return;
      var dirtyText = state.isDirty ? __ST_TEXT__('client.unsaved_changes') : '';
      var activeSimulation = activePersistentSimulation();

    async function createProposedScenario(proposal,origin,button) {
      var caseId=state.activeCase?.id,simulationId=state.activeSimulationId;
      if(button)button.disabled=true;
      try{
        await flushCase();
        var source=activePersistentSimulation();
        if(origin==='LOCAL'&&source?.id===simulationId&&proposal.sourceSignature!==STScenarios.signature(source)){
          var refreshed=STScenarios.plan(source).candidates.find(function(candidate){
            return candidate.canApply&&candidate.kind===proposal.kind&&candidate.tier===proposal.tier&&
              candidate.equipmentId===proposal.equipmentId&&JSON.stringify(candidate.changes)===JSON.stringify(proposal.changes);
          });
          if(refreshed)proposal=refreshed;
        }
        if(state.activeCase?.id!==caseId||source?.id!==simulationId||proposal.sourceSimulationId!==simulationId||proposal.sourceSignature!==STScenarios.signature(source)){
          if(origin==='LOCAL')renderSimulationAnalysis();
          throw new Error(__ST_TEXT__('scenario.stale'));
        }
        var approved=await STDialog.confirm(__ST_TEXT__('scenario.create'),__ST_TEXT__('scenario.confirm'));
        if(!approved)return;
        await flushCase(true);
        source=activePersistentSimulation();
        if(state.activeCase?.id!==caseId||source?.id!==simulationId||proposal.sourceSignature!==STScenarios.signature(source)){
          if(origin==='LOCAL')renderSimulationAnalysis();
          throw new Error(__ST_TEXT__('scenario.stale'));
        }
        // Local candidates are re-planned under the server write lock. Gemini
        // proposals keep their additional saved-source fingerprint check.
        var expectedRevision=state.activeCase.revision;
        var verified={revision:expectedRevision,simulationId:simulationId,signature:STScenarios.signature(source)};
        if(origin==='GEMINI'||origin==='REVIEWED')verified=await new Promise(function(resolve,reject){
          callServer('getScenarioSourceSignature',[{caseId:caseId,simulationId:simulationId,expectedRevision:expectedRevision}],function(response){
            response.ok?resolve(response.data):reject(Object.assign(new Error(response.error.message),{code:response.error.code}));
          });
        });
        if(state.activeCase?.id!==caseId||state.activeSimulationId!==simulationId||state.activeCase.revision!==expectedRevision||
            verified.revision!==expectedRevision||verified.simulationId!==simulationId||!verified.signature||verified.signature!==proposal.sourceSignature){
          if(origin==='LOCAL')renderSimulationAnalysis();
          throw new Error(__ST_TEXT__('scenario.stale'));
        }
        var payload={caseId:caseId,simulationId:simulationId,expectedRevision:expectedRevision,sourceSignature:verified.signature,origin:origin,proposal:Object.assign({},proposal,{title:proposal.title||STScenarioText[proposal.titleKey]})};
        document.getElementById('application').inert=true;
        await new Promise(function(resolve,reject){callServer('createScenario',[payload],function(response){
          if(!response.ok){reject(new Error(response.error.message+(response.error.details?.length?' '+response.error.details.join('; '):'')));return;}
          state.activeCase=response.data.case;autosave.reset();activatePersistentSimulation(response.data.simulationId,true);state.uiView='editor';shell.sync();resolve();
        });});
        setStatus(__ST_TEXT__('scenario.created'));
      }catch(error){showError({message:error.message});var feedback=button?.closest('.analysis-recommendation')?.querySelector('.scenario-preview-status');if(feedback){feedback.textContent='Cannot create scenario: '+error.message;feedback.dataset.state='rejected';}}finally{document.getElementById('application').inert=false;if(button?.isConnected)button.disabled=false;}
    }

    async function runSimulation() {
      if ((state.isDirty || window.STBasicMode?.isBasic()) && !collectCaseEditor()) return;
      var run = readRunConfiguration();
      if (!run) return;
      if(STPreferences.read('seedPolicy')==='RANDOM'){var seedArray=new Uint32Array(1);if(window.crypto?.getRandomValues)window.crypto.getRandomValues(seedArray);else seedArray[0]=Math.floor(Math.random()*4294967296);run.seed=seedArray[0];document.getElementById('run-seed').value=run.seed;}
      state.run.configuration = copyRunConfiguration(run);
      if(run.rounds>1||run.durationMode==='SHIFTS') {
        if(!await calculateBatch(run,0))return;
      } else if (!calculateSimulation(run, 0)) return;
      var tab = activePersistentSimulation();
      if (tab) {
        tab.dynamicConfig=cloneJson(run);
        tab.run = cloneJson(run);
        tab.results = createStoredSimulationResult(state.run.result, run);

        saveActiveCase();

      renderWorkspaceTabs();

      setStatus(state.run.durationMode === 'INDEFINITE'
        ? __ST_TEXT__('client.simulation_completed_at_its_virtual_safety_ceiling_playback_is_starting')
        : __ST_TEXT__('client.simulation_completed_playback_is_starting'));
      startPlayback();
    }

    function readRunConfiguration() {
      var durationSeconds = Number(document.getElementById('run-duration').value);
      var sampleEverySeconds = Number(document.getElementById('run-sample-interval').value);
      var seed = Number(document.getElementById('run-seed').value);
      var durationMode=document.getElementById('duration-mode').value;
      var shiftHours=Number(document.getElementById('run-shift-hours').value),shiftCount=Number(document.getElementById('run-shift-count').value),rounds=Number(document.getElementById('run-rounds').value);
      if(!Number.isInteger(rounds)||rounds<1||rounds>100||durationMode==='SHIFTS'&&(!(shiftHours>=0.25&&shiftHours<=24)||!Number.isInteger(shiftHours*4)||![1,2,3].includes(shiftCount))){showError({message:__ST_TEXT__('batch.invalid')});return null;}
      if(durationMode==='SHIFTS'){durationSeconds=shiftHours*3600*shiftCount;document.getElementById('run-duration').value=durationSeconds;}
      if (!(durationSeconds > 0) || !(sampleEverySeconds > 0) || !Number.isInteger(seed)) {
        showError({ code: 'INVALID_RUN_CONFIGURATION', message: __ST_TEXT__('client.duration_sample_interval_and_integer_seed_are_required') });
        return null;
      }
      return {
        durationMode:durationMode,shiftHours:shiftHours,shiftCount:shiftCount,shiftSeconds:durationMode==='SHIFTS'?shiftHours*3600:undefined,rounds:rounds,
        durationSeconds: durationSeconds,
        tickSeconds: 0.25,
        sampleEverySeconds: sampleEverySeconds,
        seed: seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };

    function calculateSimulation(run, resumeAtVirtualSecond) {
      var input = {
        case: JSON.parse(JSON.stringify(state.activeCase)),
        run: run
      };
      var response = window.SimulatorEngine.simulateLine(input);
      if (!response.ok) {
        showError(response.error);
        return false;
      }

      stopPlaybackTimer();
      state.run.result = response.result;
      state.run.representative=response.result;state.run.roundIndex=0;syncPlaybackRounds();
      state.run.sampleIndex = findSampleIndexAtOrBefore(response.result.samples, resumeAtVirtualSecond);
      toggle('simulation-results', true);
      document.getElementById('simulation-json-preview').value = JSON.stringify(response.result, null, 2);
      shell.sync();
      renderPlaybackFrame();
      return true;
    }

    function findSampleIndexAtOrBefore(samples, virtualSecond) {
      var selectedIndex = 0;
      for (var index = 0; index < samples.length; index += 1) {
        if (samples[index].virtualSecond > virtualSecond) break;
        selectedIndex = index;
      }
      return selectedIndex;
    }

    function startPlayback() {
      if (!state.run.result || state.run.playing) return;
      state.run.playing = true;
      schedulePlaybackStep();
    }

    function pausePlayback() {
      state.run.playing = false;
      stopPlaybackTimer();
      setPlaybackStatus('Paused');
    }

    function resetPlayback() {
      pausePlayback();
      if (!state.run.result) return;
      state.run.sampleIndex = 0;
      renderPlaybackFrame();
      setPlaybackStatus(__ST_TEXT__('client.reset'));
    }

    function schedulePlaybackStep() {
      renderPlaybackFrame();
      var samples = state.run.result.samples;
      if (state.run.sampleIndex >= samples.length - 1) {
        if(state.run.representative?.batch?.replays?.[state.run.roundIndex]){
          selectPlaybackRound(state.run.roundIndex+1,true);return;
        }
        state.run.playing = false;
        setPlaybackStatus('Completed');
        return;
      }
      var started=performance.now(),delay=playbackDelayMilliseconds();
      var rate=Number(document.getElementById('run-playback-rate').value||1);
      var virtualStart=samples[state.run.sampleIndex].virtualSecond;
      state.run.timer = window.setTimeout(function() {
        if (!state.run.playing) return;
        var target=virtualStart+(performance.now()-started)*rate/1000;
        state.run.sampleIndex=Math.min(samples.length-1,Math.max(state.run.sampleIndex+1,findSampleIndexAtOrBefore(samples,target)));
        schedulePlaybackStep();
      }, delay);
    }

    function playbackDelayMilliseconds() {
      var samples = state.run.result ? state.run.result.samples : [];
      var current = samples[state.run.sampleIndex];
      var next = samples[state.run.sampleIndex + 1];
      if (!current || !next) return 0;
      var virtualSeconds = Math.max(0, next.virtualSecond - current.virtualSecond);
      var playbackRate = Number(document.getElementById('run-playback-rate').value || 1);
      // At 1×, virtual and wall-clock seconds match. A higher multiplier only
      // speeds up playback; it never changes the deterministic calculation.
      return Math.max(35, virtualSeconds * 1000 / playbackRate);
    }

    function stopPlaybackTimer() {
      if (state.run.timer) window.clearTimeout(state.run.timer);
      state.run.timer = null;
      state.run.playing = false;
    }

    function renderPlaybackFrame() {
      if (!state.run.result || !state.run.result.samples.length) return;
      var scrollAnchor = captureLiveEquipmentScrollAnchor();
      var sample = state.run.result.samples[state.run.sampleIndex];
      var time = sample.virtualSecond;
      document.getElementById('metric-time').textContent = time + ' s';
      document.getElementById('metric-output').textContent = formatNumber(sample.outputCount);
      document.getElementById('metric-instant-rate').textContent = formatInstantaneousOutputRate();
      document.getElementById('metric-rate').textContent = time > 0 ? formatRatePerMinute(sample.outputCount / time) : '—';
      document.getElementById('metric-buffer').textContent = formatNumber(sum(sample.buffers));
      document.getElementById('metric-overflow').textContent = formatNumber(sum((sample.accumulationZones || []).map(function(zone) { return zone.overflowUnits || 0; })));
      document.getElementById('metric-backup-stop').textContent = formatMinutes(sum(sample.equipment.map(function(unit) { return unit.backupStopSeconds || 0; })));
      document.getElementById('metric-line-oee').textContent = formatLineOeeAtSample(sample);
      setPlaybackStatus((state.run.result.batch?__ST_TEXT__('batch.round')+' '+(state.run.roundIndex+1)+' / '+state.run.result.batch.rounds+' · ':'')+(state.run.playing ? 'Playing' : 'At') + ' ' + time + __ST_TEXT__('client.s_frame') + state.run.sampleIndex + ' / ' + (state.run.result.samples.length - 1));
      if (state.uiView === 'simulation') renderLiveEquipment(sample);
      drawSimulationChart();
      drawEquipmentSpeedChart();
      restoreLiveEquipmentScrollAnchor(scrollAnchor);
    }

    function captureLiveEquipmentScrollAnchor() {
      var target = document.getElementById('live-equipment');
      if (!target) return null;
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!(viewportHeight > 0)) return null;
      var cards = target.querySelectorAll('.live-equipment-card');
      for (var index = 0; index < cards.length; index += 1) {
        var bounds = cards[index].getBoundingClientRect();
        if (bounds.bottom > 0 && bounds.top < viewportHeight) {
          return {
            equipmentId: cards[index].getAttribute('data-equipment-id'),
            top: bounds.top
          };
        }
      }
      return null;
    }

    function restoreLiveEquipmentScrollAnchor(anchor) {
      if (!anchor || Date.now() - state.lastUserScrollAt < 140) return;
      if (state.scrollRestoreFrame) window.cancelAnimationFrame(state.scrollRestoreFrame);
      state.scrollRestoreFrame = window.requestAnimationFrame(function() {
        state.scrollRestoreFrame = null;
        if (Date.now() - state.lastUserScrollAt < 140) return;
        var target = document.getElementById('live-equipment');
        if (!target) return;
        var cards = target.querySelectorAll('.live-equipment-card');
        var card = null;
        for (var index = 0; index < cards.length; index += 1) {
          if (cards[index].getAttribute('data-equipment-id') === anchor.equipmentId) {
            card = cards[index];
            break;
          }
        }
        if (!card) return;
        var delta = card.getBoundingClientRect().top - anchor.top;
        if (Math.abs(delta) < 2) return;
        state.scrollRestoreUntil = Date.now() + 100;
        window.scrollBy(0, delta);
      });
    }

    function formatInstantaneousOutputRate() {
      if (!state.run.result || state.run.sampleIndex === 0) return '—';
      var current = state.run.result.samples[state.run.sampleIndex];
      var previous = state.run.result.samples[state.run.sampleIndex - 1];
      var elapsed = current.virtualSecond - previous.virtualSecond;
      if (!(elapsed > 0)) return '—';
      return formatRatePerMinute((current.outputCount - previous.outputCount) / elapsed);
    }

    function formatLineOeeAtSample(sample) {
      var pacemakerRate = state.run.result?.summary?.lineOeePacemakerRatePerSecond;
      if (!(sample.virtualSecond > 0) || !isFiniteNumber(pacemakerRate) || pacemakerRate <= 0) return '—';
      return formatPercent(Math.min(1, sample.outputCount / (pacemakerRate * sample.virtualSecond)));
    }

    function renderLiveEquipment(sample) {
      var target = document.getElementById('live-equipment');
      target.setAttribute('role', 'list');
      var columns = ensureLiveEquipmentColumns(target);
      var cardsByEquipmentId = {};

        cardsByEquipmentId[card.getAttribute('data-equipment-id')] = card;
      });
      var displayedEquipmentIds = {};
      var previousElement = columns;
      sample.equipment.forEach(function(unit, index) {
        var model = state.activeCase.equipment[index] || {};
        var equipmentId = unit.id || ('unit-' + index);
        var card = cardsByEquipmentId[equipmentId] || createLiveEquipmentCard(equipmentId);
        displayedEquipmentIds[equipmentId] = true;
        updateLiveEquipmentCard(card, unit, model, index, sample);
        if (card.parentNode !== target || card.previousElementSibling !== previousElement) {
          target.insertBefore(card, previousElement.nextElementSibling);
        }
        previousElement = card;
        drawEquipmentSpeedSparkline(card.querySelector('.equipment-speed-sparkline'), index, model);
      });
      Array.prototype.forEach.call(target.querySelectorAll('.live-equipment-card'), function(card) {
        if (!displayedEquipmentIds[card.getAttribute('data-equipment-id')]) card.remove();

    function createLiveEquipmentCard(equipmentId) {
      var card = document.createElement('article');
      card.className = 'live-equipment-card';

    }

    function formatSeconds(value) {
      return isFiniteNumber(value) ? formatNumber(value) + ' s' : '—';
    }

    function formatRatePerMinute(ratePerSecond) {
      return formatNumber(Number(ratePerSecond || 0) * 60) + __ST_TEXT__('client.min_3');
    }

    function formatPercent(value) {
      return isFiniteNumber(value) ? formatNumber(value * 100) + '%' : '—';
    }

    function formatMinutes(seconds) {
      return formatNumber(Number(seconds || 0) / 60) + __ST_TEXT__('client.min');
    }

    function callServer(name, args, onSuccess) {
      var epoch = state.requestEpoch;
      state.pendingRequests += 1;
      activity();
      function done() {
        state.pendingRequests = Math.max(0,state.pendingRequests-1);
        activity();
      }
      var runner = google.script.run
        .withFailureHandler(function(error) {
          done();
          if(epoch !== state.requestEpoch) return;
          state.saving=false;
          document.querySelectorAll('[data-busy="true"]').forEach(function(button){button.disabled=false;delete button.dataset.busy;});
          shell.sync();
          var detail=name==='saveCase'&&typeof error?.message==='string'?error.message.slice(0,300):'';
          onSuccess({ok:false,error:{ code: 'NETWORK_ERROR', message: __ST_TEXT__('client.the_server_request_could_not_be_completed_please_try_again')+(detail?' '+detail:'') }});
        })
        .withSuccessHandler(function(response) { done(); if(epoch === state.requestEpoch) onSuccess(response); });
      runner[name].apply(runner, args);
    }

    function toggle(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }
    function setStatus(message) { var target = document.getElementById('status'); target.className = 'status'; target.textContent = message; }
    function showError(error) {
      var message = (error.code || 'ERROR') + ': ' + (error.message || __ST_TEXT__('client.the_request_failed'));
      var target = document.getElementById('status'); target.className = 'status error'; target.textContent = message;
      if(error.code==='INVALID_SIMULATION_INPUT'&&Array.isArray(error.details)){
        var list=document.createElement('ul');
        error.details.forEach(function(detail){
          var item=document.createElement('li');item.textContent=STSheetImportMerge.physicalIssue(detail,state.activeCase?.equipment);list.appendChild(item);
        });
        target.appendChild(list);
      }
      document.documentElement.classList.remove('restoring-session');
      if(!state.bootstrap)toggle('auth-panel',true);
      document.getElementById('auth-status').textContent = message;
      document.getElementById('sign-in-button').disabled = false;
      if (document.getElementById('settings-dialog').open) STSettings.error(message);
    }
    function setBusy(targetId, busy) { var target = document.getElementById(targetId); var button = target.tagName === 'FORM' ? target.querySelector('button') : target; button.disabled = busy; button.dataset.busy=String(busy); button.setAttribute("aria-busy",String(busy)); }
  })();
</script>
