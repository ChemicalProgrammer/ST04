<script>
window.STAssistant = function(state,actions) {
  var opened=false,caseId=null,simulationId=null,messages=[],pending=false,sequence=0,phase='idle',progressTimer=null,startedAt=0,responseTimer=null;
  function el(id){return document.getElementById(id);}
  function basic(){return Boolean(window.STBasicMode?.isBasic());}
  function sideEditing(){return !basic()&&STEquipmentInspector.sync();}
  function progress(next){
    phase=next;clearInterval(progressTimer);progressTimer=null;
    var target=el('gemini-progress');target.textContent='';target.classList.toggle('hidden',next==='idle');
    if(next==='idle'){clearTimeout(responseTimer);responseTimer=null;return;}
    var labels=[__ST_TEXT__('assistant.progress_saved'),__ST_TEXT__('assistant.progress_waiting'),__ST_TEXT__('assistant.progress_ready')];
    var active={preparing:0,waiting:1,done:3,error:1}[next];
    labels.forEach(function(label,index){if(next==='error'&&index>active)return;var row=document.createElement('li');row.dataset.state=next==='error'&&index===1?'error':index<active?'done':index===active?'active':'pending';row.textContent=next==='error'&&index===1?__ST_TEXT__('assistant.progress_failed'):label;target.appendChild(row);});
    target.setAttribute('aria-busy',String(next==='preparing'||next==='waiting'));
    if(next==='waiting'){
      startedAt=Date.now();var elapsed=document.createElement('span');elapsed.className='chart-note';elapsed.setAttribute('aria-live','off');target.children[1].appendChild(elapsed);
      function tick(){elapsed.textContent=' · '+Math.floor((Date.now()-startedAt)/1000)+' '+__ST_TEXT__('assistant.progress_seconds');}
      tick();progressTimer=setInterval(tick,1000);
    }
  }
  function render(){
    el('gemini-messages').textContent='';
    messages.forEach(function(m){var p=document.createElement('p');p.className='gemini-message';p.dataset.role=m.role;var label=document.createElement('strong');label.textContent=m.role==='user'?'You':__ST_TEXT__('assistant.gemini');p.appendChild(label);p.appendChild(document.createTextNode(m.text));el('gemini-messages').appendChild(p);(basic()?[]:(m.proposals||[])).forEach(function(proposal){el('gemini-messages').appendChild(STWhatIf.card(proposal,actions.applyScenario,state.activeCase?.equipment,(state.activeCase?.simulations||[]).find(function(s){return s.id===state.activeSimulationId;})));});if(m.context){var note=document.createElement('p');note.className='chart-note';note.textContent=__ST_TEXT__('assistant.compact_context')+' '+m.context.includedEquipment+'/'+m.context.totalEquipment+__ST_TEXT__('assistant.equipment_included')+(m.historyOmitted?__ST_TEXT__('assistant.history_omitted')+m.historyOmitted:'');el('gemini-messages').appendChild(note);}});
    el('gemini-messages').scrollTop=el('gemini-messages').scrollHeight;
  }
  function reset(){progress('idle');sequence++;messages=[];pending=false;caseId=null;opened=false;render();el('gemini-question').value='';el('gemini-error').textContent='';sync();}
  function sync(){
    var active=state.activeCase;
    if(caseId!==(active?.id||null)||simulationId!==state.activeSimulationId){progress('idle');sequence++;caseId=active?.id||null;simulationId=state.activeSimulationId;messages=[];pending=false;render();el('gemini-question').value='';el('gemini-error').textContent='';}
    var editing=sideEditing();
    var visible=Boolean(active&&(opened||editing));
    if(!basic())el('equipment-inspector').classList.toggle('hidden',!editing);el('gemini-chat-view').classList.toggle('hidden',editing);
    el('gemini-title').textContent=editing?__ST_TEXT__('inspector.equipment'):__ST_TEXT__('assistant.gemini');
    el('application').classList.toggle('assistant-open',visible);el('gemini-panel').classList.toggle('hidden',!visible);el('toggle-gemini').setAttribute('aria-expanded',String(visible&&!editing));
    el('toggle-gemini').querySelector('.icon')?.remove();el('toggle-gemini').insertAdjacentHTML('afterbegin',STIcons.svg('gemini'));
    el('gemini-context').textContent=editing?STEquipmentInspector.name():active?active.name+' · '+((active.simulations||[]).find(function(s){return s.id===simulationId;})?.name||''):'';
    var configured=Boolean(state.bootstrap?.gemini?.configured);
    el('gemini-notice').textContent=pending?__ST_TEXT__('assistant.gemini_is_analyzing_the_case'):!configured?__ST_TEXT__('assistant.add_your_gemini_api_key_in_settings_to_ask_questions'):state.isDirty?__ST_TEXT__('assistant.save_your_changes_before_asking_about_this_case'):__ST_TEXT__('assistant.context_includes_this_saved_case_and_all_saved_simulation_results');
    el('send-gemini').disabled=pending||!configured||!active;el('send-gemini').setAttribute('aria-busy',String(pending));
    el('clear-gemini').disabled=pending;
  }
  function init(){
    var resize=el('gemini-resize');
    var mode=sideEditing()?'inspector':'assistant',drag=null,currentWidth=360;
    function preference(){return mode+'-width';}
    function width(value,persist){
      var min=Math.min(360,Math.max(240,window.innerWidth-60));
      var max=Math.max(min,Math.min(window.innerWidth-60,window.innerWidth*.8));
      currentWidth=Math.round(Math.max(min,Math.min(max,value)));
      document.documentElement.style.setProperty('--assistant-width',currentWidth+'px');
      resize.setAttribute('aria-valuemin',String(min));resize.setAttribute('aria-valuemax',String(Math.round(max)));
      resize.setAttribute('aria-valuenow',String(currentWidth));
      if(persist)STPreferences.write(preference(),String(currentWidth));
    }
    function syncWidthMode(){
      var next=sideEditing()?'inspector':'assistant';
      if(next===mode)return;
      mode=next;
      width(Number(STPreferences.read(preference()))||(mode==='inspector'?760:360),false);
    }
    width(Number(STPreferences.read(preference()))||360,false);
    resize.onkeydown=function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();width(currentWidth+(e.key==='ArrowLeft'?24:-24),true);window.dispatchEvent(new Event('resize'));}};
    resize.onpointerdown=function(e){
      if(e.button!==0||drag)return;
      e.preventDefault();drag={id:e.pointerId,x:e.clientX,width:el('gemini-panel').getBoundingClientRect().width||currentWidth};
      resize.setPointerCapture?.(e.pointerId);
    };
    resize.onpointermove=function(e){
      if(!drag||e.pointerId!==drag.id||!Number.isFinite(e.clientX)||e.clientX<8)return;
      width(drag.width+drag.x-e.clientX,false);
    };
    function finish(e){
      if(!drag||e.pointerId!==drag.id)return;
      drag=null;
      if(resize.hasPointerCapture?.(e.pointerId))resize.releasePointerCapture(e.pointerId);
      STPreferences.write(preference(),String(currentWidth));window.dispatchEvent(new Event('resize'));
    }
    resize.onpointerup=finish;resize.onpointercancel=finish;resize.onlostpointercapture=finish;
    window.addEventListener('resize',function(){if(!drag){syncWidthMode();width(currentWidth,false);}});

    el('toggle-gemini').onclick=function(){var wasEditing=sideEditing();if(!basic())STEquipmentInspector.hide();opened=wasEditing||!opened;sync();if(opened)el('gemini-question').focus();window.dispatchEvent(new Event('resize'));};
    el('close-gemini').onclick=function(){if(!basic())STEquipmentInspector.hide();opened=false;sync();el('toggle-gemini').focus();window.dispatchEvent(new Event('resize'));};
    el('gemini-panel').addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();el('close-gemini').click();}});
    window.addEventListener('st:inspector',function(){sync();if(!drag)syncWidthMode();window.dispatchEvent(new Event('resize'));});
    el('clear-gemini').onclick=function(){progress('idle');messages=[];render();el('gemini-error').textContent='';};
    el('gemini-form').onsubmit=async function(e){
      e.preventDefault();sync();if(el('send-gemini').disabled)return;
      var question=el('gemini-question').value.trim();if(!question)return;
      var originalCase=caseId,originalSimulation=simulationId;
      pending=true;progress('preparing');sync();
      try{await actions.flush();}catch(error){pending=false;progress('error');sync();el('gemini-error').textContent=error.message;return;}
      if(originalCase!==caseId||originalSimulation!==simulationId)return;
      var request={caseId:caseId,simulationId:simulationId,uiMode:basic()?'BASIC':'ADVANCE',question:question,history:messages.slice(-24).map(function(m){return {role:m.role,text:m.text};})},ticket=++sequence;
      pending=true;el('gemini-error').textContent='';messages.push({role:'user',text:question});el('gemini-question').value='';render();sync();
      progress('waiting');
      function finish(response){
        if(ticket!==sequence)return;
        clearTimeout(responseTimer);responseTimer=null;sequence++;
        if(!response||typeof response.ok!=='boolean'||response.ok&&typeof response.data?.text!=='string')response={ok:false,error:{code:'GEMINI_BAD_RESPONSE',message:'The server returned an incomplete answer. Try again.'}};
        pending=false;progress(response.ok?'done':'error');
        if(response.ok)messages.push({role:'model',text:response.data.text,proposals:response.data.proposals||[],context:response.data.context,historyOmitted:response.data.historyOmitted});
        else{messages.pop();el('gemini-question').value=question;el('gemini-error').textContent=(response.error?.message||'Gemini could not complete this request. Try again.')+(response.error?.code?' ['+response.error.code+']':'');}
        render();sync();
      }
      responseTimer=setTimeout(function(){finish({ok:false,error:{code:'GEMINI_TIMEOUT',message:'No response arrived within 3 minutes. Your question is retained; you can retry. The previous server request may still finish.'}});},180000);
      try{google.script.run.withFailureHandler(function(){finish({ok:false,error:{code:'GEMINI_CONNECTION',message:'The connection to Apps Script failed. Check your connection and try again; if it persists, sign out and back in.'}});}).withSuccessHandler(finish).askGemini(request);}
      catch(_){finish({ok:false,error:{code:'GEMINI_CONNECTION',message:'The request could not be sent. Your question is retained; try again.'}});}

    };
  }
  return {init:init,sync:sync,reset:reset};
};
</script>
