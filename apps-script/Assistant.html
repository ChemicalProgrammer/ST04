<script>
// EDITABLE CHAT PRESENTATION: visual reveal after the complete Apps Script response arrives.
window.ST_GEMINI_CHAT_PRESENTATION = {enabled:true, paragraphDelayMs:80, maxDurationMs:900};
window.STAssistant = function(state,actions) {
  var panelAnimation=null,panelVisible=false,creatingScenario=false;
  var opened=false,caseId=null,simulationId=null,messages=[],galleryMessages=[],pending=false,sequence=0,phase='idle',progressTimer=null,startedAt=0,responseTimer=null,revealTimer=null,progressHideTimer=null;
  function el(id){return document.getElementById(id);}
  function general(){return !state.activeCase||!el('gemini-scope').checked;}
  function basic(){return Boolean(window.STBasicMode?.isBasic());}
  function sideEditing(){return !basic()&&STEquipmentInspector.sync();}
  function progress(next){
    phase=next;clearInterval(progressTimer);progressTimer=null;clearTimeout(progressHideTimer);progressHideTimer=null;
    var target=el('gemini-progress');target.textContent='';target.classList.toggle('hidden',next==='idle');
    el('gemini-activity').classList.toggle('hidden',!['preparing','waiting','writing'].includes(next));el('gemini-activity').textContent=next==='preparing'?(general()?'Preparing general question…':'Preparing saved case…'):next==='waiting'?'Waiting for Gemini…':next==='writing'?'Displaying received answer…':'';
    if(next==='idle'){target.setAttribute('aria-busy','false');clearTimeout(responseTimer);responseTimer=null;return;}
    var labels=[general()?'No case data included':__ST_TEXT__('assistant.progress_saved'),__ST_TEXT__('assistant.progress_waiting'),__ST_TEXT__('assistant.progress_ready')];
    var active={preparing:0,waiting:1,writing:2,done:3,error:1}[next];
    labels.forEach(function(label,index){if(next==='error'&&index>active)return;var row=document.createElement('li');row.dataset.state=next==='error'&&index===1?'error':index<active?'done':index===active?'active':'pending';row.textContent=next==='error'&&index===1?__ST_TEXT__('assistant.progress_failed'):label;target.appendChild(row);});
    target.setAttribute('aria-busy',String(next==='preparing'||next==='waiting'||next==='writing'));
    if(next==='done'||next==='error')progressHideTimer=setTimeout(function(){progress('idle');},next==='done'?900:2500);

      startedAt=Date.now();var elapsed=document.createElement('span');elapsed.className='chart-note';elapsed.setAttribute('aria-live','off');target.children[1].appendChild(elapsed);
      function tick(){var seconds=Math.floor((Date.now()-startedAt)/1000);elapsed.textContent=' · '+seconds+' '+__ST_TEXT__('assistant.progress_seconds');el('gemini-activity').textContent='Waiting for Gemini · '+seconds+' s'+(seconds>=15?' · The app is responsive; still awaiting the server response.':'');}
      tick();progressTimer=setInterval(tick,1000);
    }
    scrollMessages();
  }
  function simulation(){return (state.activeCase?.simulations||[]).find(function(item){return item.id===state.activeSimulationId;});}
  function persist(draftOnly){
    var current=simulation();if(!current)return;
    current.geminiHistory=messages.map(function(m){return {role:m.role,text:m.text,createdAt:m.createdAt,proposals:m.proposals||[],context:m.context,historyOmitted:m.historyOmitted||0,scope:m.scope||'CASE'};});
    current.updatedAt=new Date().toISOString();
    var ownerCase=caseId,ownerSimulation=simulationId;
    Promise.resolve(actions.saveChat?.({draftOnly:!!draftOnly})).catch(function(error){if(caseId!==ownerCase||simulationId!==ownerSimulation)return;el('gemini-error').textContent='Chat changes are retained in the draft but could not be saved. Retry saving the case. '+error.message;STErrors.capture('gemini-error',error);});
  }
  async function copyMessage(message,button){
    try{
      try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(message.text);}
      catch(_){var field=document.createElement('textarea'),focus=document.activeElement;field.value=message.text;field.className='clipboard-fallback';document.body.appendChild(field);try{field.focus();field.select();if(!document.execCommand?.('copy'))throw Error('Clipboard unavailable');}finally{field.remove();focus?.focus();}}

    }catch(_){el('gemini-error').textContent='Copy is unavailable. Select the message text and copy it.';}
  }
  function editMessage(index){

    if(questionIndex<0)return;

    el('gemini-messages').querySelectorAll('.gemini-message-editor').forEach(function(node){node.remove();});
    editor.className='gemini-message-editor';text.value=messages[questionIndex].text;text.rows=4;text.maxLength=6000;text.required=true;text.setAttribute('aria-label','Edit question and regenerate');
    note.className='chart-note';note.textContent='Regenerating replaces this question and all later messages. Cancel keeps the conversation.';
    buttons.className='button-row';var cancel=document.createElement('button'),submit=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='Cancel';cancel.onclick=function(){editor.remove();};submit.type='submit';submit.textContent='Regenerate';buttons.append(cancel,submit);editor.append(note,text,buttons);message.node.append(editor);text.focus();
    editor.onsubmit=function(event){event.preventDefault();var question=text.value.trim();if(!question)return;editor.remove();el('gemini-scope').checked=(messages[questionIndex].scope||'CASE')==='CASE';submitQuestion(question,questionIndex);};
  }
  function attachments(m){
    if(m.role==='model'&&(m.scope||'CASE')==='CASE')(m.proposals||[]).filter(function(p){return p.canApply&&p.changes?.length;}).forEach(function(proposal){
      var button=document.createElement('button');button.type='button';button.className='gemini-scenario-create';if(['ZERO','MEDIUM','HIGH'].includes(proposal.tier))button.dataset.tier=proposal.tier;

  }
  function scrollMessages(){var host=el('gemini-messages');host.scrollTop=host.scrollHeight;}

      var controls=document.createElement('div');controls.className='gemini-message-actions';[['copy','Copy message',function(button){copyMessage(m,button);}]].concat(m.role==='user'?[['edit','Edit and regenerate',function(){editMessage(index);}]]:[]).forEach(function(spec){var button=document.createElement('button');button.type='button';button.className='secondary icon-button';button.innerHTML=STIcons.svg(spec[0]);button.setAttribute('aria-label',spec[1]);button.title=spec[1];button.dataset.action=spec[0];button.disabled=spec[0]==='edit'&&(pending||state.saving||!!m.revealing);button.onclick=function(){spec[2](button);};controls.append(button);});

  function stopReveal(){clearTimeout(revealTimer);revealTimer=null;el('gemini-messages').setAttribute('aria-busy','false');}
  function reveal(m){

    var options=window.ST_GEMINI_CHAT_PRESENTATION||{},chunks=m.text.match(/[\s\S]+?(?:\r?\n[ \t]*\r?\n|$)/g)||[m.text];
    var animate=state.bootstrap?.gemini?.generation?.displayMode!=='IMMEDIATE'&&options.enabled!==false&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&chunks.length>1;
    if(!animate){pending=false;render();progress('done');sync();return;}
    var ticket=sequence,index=1,delay=Math.max(0,Math.min(Number(options.paragraphDelayMs)||180,(Number(options.maxDurationMs)||3000)/(chunks.length-1)));
    m.revealing=true;m.visibleText=chunks[0];pending=true;render();progress('writing');sync();el('gemini-messages').setAttribute('aria-busy','true');
    function next(){
      revealTimer=null;if(ticket!==sequence||!m.node.isConnected)return;
      m.visibleText+=chunks[index++];STMarkdown.render(m.visibleText,m.body);scrollMessages();
      if(index<chunks.length){revealTimer=setTimeout(next,delay);return;}
      m.revealing=false;m.node.dataset.revealing='false';stopReveal();pending=false;render();progress('done');sync();
    }
    revealTimer=setTimeout(next,delay);
  }
  function reset(){stopReveal();progress('idle');sequence++;messages=[];galleryMessages=[];pending=false;caseId=null;simulationId=null;opened=false;render();el('gemini-question').value='';el('gemini-error').textContent='';sync();}
  function showPanel(visible){
    var panel=el('gemini-panel'),shell=el('application');
    if(visible===panelVisible)return;panelVisible=visible;
    panelAnimation?.cancel();panelAnimation=null;
    var reduced=STMotion.reduced()||typeof panel.animate!=='function';
    shell.classList.toggle('assistant-open',visible);panel.setAttribute('aria-hidden',String(!visible));panel.inert=!visible;
    if(visible){panel.classList.remove('hidden');if(!reduced)panelAnimation=STMotion.panel(panel,true);}
    else if(!reduced&&!panel.classList.contains('hidden')){var animation=STMotion.panel(panel,false);panelAnimation=animation;animation.onfinish=function(){if(!panelVisible){panel.classList.add('hidden');window.dispatchEvent(new Event('resize'));}if(panelAnimation===animation)panelAnimation=null;};}
    else panel.classList.add('hidden');
  }
  function sync(){
    var active=state.activeCase,currentSimulationId=active?state.activeSimulationId:null;
    if(caseId!==(active?.id||null)||simulationId!==currentSimulationId){stopReveal();progress('idle');sequence++;if(!caseId)galleryMessages=messages;caseId=active?.id||null;simulationId=currentSimulationId;el('gemini-scope').checked=!!active;messages=active?JSON.parse(JSON.stringify(simulation()?.geminiHistory||[])):galleryMessages;pending=false;render();el('gemini-question').value='';el('gemini-error').textContent='';}
    if(!active)el('gemini-scope').checked=false;el('gemini-scope-control').classList.toggle('hidden',!active);
    el('gemini-history-note').textContent=active?(general()?__ST_TEXT__('assistant.general_history'):__ST_TEXT__('assistant.history_saved')):__ST_TEXT__('assistant.gallery_history');

    var visible=Boolean(state.bootstrap&&(opened||editing));
    if(!basic())el('equipment-inspector').classList.toggle('hidden',!editing);el('gemini-chat-view').classList.toggle('hidden',editing);
    el('gemini-title').textContent=editing?__ST_TEXT__('inspector.equipment'):__ST_TEXT__('assistant.gemini');
    showPanel(visible);el('toggle-gemini').setAttribute('aria-expanded',String(visible&&!editing));
    el('toggle-gemini').querySelector('.icon')?.remove();el('toggle-gemini').insertAdjacentHTML('afterbegin',STIcons.svg('gemini'));
    el('gemini-context').textContent=editing?STEquipmentInspector.name():active?active.name+' · '+((active.simulations||[]).find(function(s){return s.id===simulationId;})?.name||''):'';
    var configured=Boolean(state.bootstrap?.gemini?.configured);
    el('gemini-scope').disabled=pending||!active;el('gemini-question').placeholder=general()?'Ask about using SimuLine or general concepts':'Ask about the current simulation';
    el('gemini-notice').textContent=!configured?__ST_TEXT__('assistant.add_your_gemini_api_key_in_settings_to_ask_questions'):general()?'General questions do not send case data and do not require saving.':pending?__ST_TEXT__('assistant.gemini_is_analyzing_the_case'):!configured?__ST_TEXT__('assistant.add_your_gemini_api_key_in_settings_to_ask_questions'):state.isDirty?'Save changes before asking about this simulation, or uncheck Case context.':__ST_TEXT__('assistant.context_includes_this_saved_case_and_all_saved_simulation_results');
    el('send-gemini').disabled=pending||state.saving||!configured||!active&&!general();el('send-gemini').setAttribute('aria-busy',String(pending));
    el('clear-gemini').disabled=pending||state.saving||creatingScenario;
    el('send-gemini').disabled=el('send-gemini').disabled||creatingScenario;
    el('gemini-messages').querySelectorAll('.gemini-scenario-create').forEach(function(button){button.disabled=pending||state.saving||creatingScenario;});
    el('gemini-export-menu').querySelectorAll('button').forEach(function(button){button.disabled=pending||!messages.length;});
    el('export-gemini').setAttribute('aria-disabled',String(pending||!messages.length));
    el('gemini-messages').querySelectorAll('.gemini-message-actions button').forEach(function(button){button.disabled=button.dataset.action==='edit'&&(pending||state.saving);});
  }
  function init(){
    var resize=el('gemini-resize');
    var mode=sideEditing()?'inspector':'assistant',drag=null,currentWidth=360;
    function preference(){return mode+'-width';}
    function width(value,persist){
      var min=Math.min(360,Math.max(240,window.innerWidth-60));
      var max=Math.max(min,Math.min(window.innerWidth-60,window.innerWidth*.8));

      document.documentElement.style.setProperty('--assistant-width',currentWidth+'px');
      resize.setAttribute('aria-valuemin',String(min));resize.setAttribute('aria-valuemax',String(Math.round(max)));

    }
    function syncWidthMode(){
      var next=sideEditing()?'inspector':'assistant';
      if(next===mode)return;
      mode=next;
      width(Number(STPreferences.read(preference()))||(mode==='inspector'?760:360),false);
    }
    width(Number(STPreferences.read(preference()))||360,false);
    resize.onkeydown=function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();width(currentWidth+(e.key==='ArrowLeft'?24:-24),true);window.dispatchEvent(new Event('resize'));}};
    resize.onpointerdown=function(e){
      if(e.button!==0||drag)return;
      e.preventDefault();el('application').classList.add('assistant-resizing');drag={id:e.pointerId,x:e.clientX,width:el('gemini-panel').getBoundingClientRect().width||currentWidth};
      try{resize.setPointerCapture?.(e.pointerId);}catch(_){}
    };
    resize.onpointermove=function(e){
      if(!drag||e.pointerId!==drag.id)return;
      if(e.buttons!==undefined&&(e.buttons&1)===0){finish(e);return;}
      if(!Number.isFinite(e.clientX)||e.clientX<8)return;
      width(drag.width+drag.x-e.clientX,false);
    };
    function finish(e){
      if(!drag||e.pointerId!==drag.id)return;
      drag=null;el('application').classList.remove('assistant-resizing');
      if(resize.hasPointerCapture?.(e.pointerId))resize.releasePointerCapture(e.pointerId);
      STPreferences.write(preference(),String(currentWidth));window.dispatchEvent(new Event('resize'));
    }
    resize.onpointerup=finish;resize.onpointercancel=finish;resize.onlostpointercapture=finish;
    window.addEventListener('pointerup',finish,true);window.addEventListener('pointercancel',finish,true);
    window.addEventListener('blur',function(){if(drag)finish({pointerId:drag.id});});
    document.addEventListener('visibilitychange',function(){if(document.hidden&&drag)finish({pointerId:drag.id});});
    window.addEventListener('resize',function(){if(!drag){syncWidthMode();width(currentWidth,false);}});

    el('toggle-gemini').onclick=function(){var wasEditing=sideEditing();if(!basic())STEquipmentInspector.hide();opened=wasEditing||!opened;sync();if(opened)el('gemini-question').focus();window.dispatchEvent(new Event('resize'));};
    el('close-gemini').onclick=function(){if(!basic())STEquipmentInspector.hide();opened=false;sync();el('toggle-gemini').focus();window.dispatchEvent(new Event('resize'));};
    el('gemini-panel').addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();el('close-gemini').click();}});
    window.addEventListener('st:inspector',function(){sync();if(!drag)syncWidthMode();window.dispatchEvent(new Event('resize'));});
    el('clear-gemini').onclick=function(){stopReveal();sequence++;progress('idle');messages=[];render();persist(general());el('gemini-error').textContent='';sync();};
    el('gemini-export-menu').querySelectorAll('[data-chat-export]').forEach(function(button){button.onclick=async function(){
      if(pending||!messages.length)return;
      var snapshot=STReports.chatHistory(messages);el('gemini-export-menu').open=false;

      catch(error){el('gemini-error').textContent='Could not export chat history: '+error.message;STErrors.capture('gemini-error',error);}
    };});
    el('export-gemini').addEventListener('click',function(event){if(pending||!messages.length)event.preventDefault();});
    el('gemini-export-menu').addEventListener('keydown',function(event){if(event.key==='Escape'&&this.open){event.stopPropagation();this.open=false;el('export-gemini').focus();}});
    el('gemini-scope').onchange=sync;
    el('gemini-form').onsubmit=function(e){e.preventDefault();submitQuestion(el('gemini-question').value.trim());};
  }
  async function submitQuestion(question,cutIndex){
      sync();if(el('send-gemini').disabled||!question)return;
      var originalCase=caseId,originalSimulation=simulationId;
      pending=true;progress('preparing');sync();
      var scope=general()?'GENERAL':'CASE';
      try{if(scope==='CASE')await actions.flush();}catch(error){pending=false;progress('error');sync();el('gemini-error').textContent=error.message;STErrors.capture('gemini-error',error);return;}
      if(originalCase!==caseId||originalSimulation!==simulationId)return;
      var previousMessages=messages.slice();if(cutIndex!==undefined)messages=messages.slice(0,cutIndex);
      var request={scope:scope,...(scope==='CASE'?{caseId:caseId,simulationId:simulationId}:{}),uiMode:basic()?'BASIC':'ADVANCE',screen:{section:state.uiView,settingsOpen:el('settings-dialog').open,selectedEquipmentName:scope==='CASE'?STEquipmentInspector.name():null},question:question,history:messages.filter(function(m){return (m.scope||'CASE')===scope;}).slice(-24).map(function(m){return {role:m.role,text:m.text};})},ticket=++sequence;
      pending=true;el('gemini-error').textContent='';messages.push({role:'user',scope:scope,text:question,createdAt:new Date().toISOString()});el('gemini-question').value='';render();sync();

        messages=previousMessages;el('gemini-question').value=question;el('gemini-error').textContent=(response.error?.message||'Gemini could not complete this request. Try again.')+(response.error?.code?' ['+response.error.code+']':'');STErrors.capture('gemini-error',response.error);

      catch(_){finish({ok:false,error:{code:'GEMINI_CONNECTION',message:'The request could not be sent. Your question is retained; try again.'}});}

};
</script>
