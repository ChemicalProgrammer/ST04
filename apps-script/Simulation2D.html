<style>
#simulation2d-canvas { display:block; width:100%; height:clamp(420px,57vh,690px); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); cursor:grab; touch-action:none; }
#simulation2d-canvas:active { cursor:grabbing; }
#simulation2d-canvas { background-color:var(--surface); background-image:radial-gradient(var(--line) 1px,transparent 1px); background-size:18px 18px; }
.simulation2d-metrics { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:var(--space-3) 0; }
.simulation2d-metrics > div { flex:1 1 8rem; padding:var(--space-2) var(--space-3); border:1px solid var(--line); border-radius:var(--radius-md); }
.simulation2d-metrics dt { color:var(--muted); font-size:var(--font-secondary); }
.simulation2d-metrics dd { margin:0; font-weight:var(--weight-semibold); font-variant-numeric:tabular-nums; }
#simulation2d-panel { container-type:inline-size; }
#simulation2d-panel .fold-tools { flex-wrap:nowrap; align-items:center; max-width:100%; min-width:0; gap:var(--space-1); }
#simulation2d-panel .fold-tools > * { flex:0 0 auto; margin:0; }
#simulation2d-speed { width:max-content; min-width:0; padding-inline:6px 20px; background-position:right 4px center; background-size:13px; }
.simulation2d-limit { display:inline-flex; align-items:center; gap:2px; color:var(--ink); font-size:var(--font-secondary); white-space:nowrap; }
#simulation2d-limit { width:6ch; min-width:0; padding-inline:4px; }
#simulation2d-zoom { width:96px; min-width:0; padding:0; accent-color:var(--accent); }
#simulation2d-zoom-value { width:5ch; text-align:end; color:var(--ink); font-size:var(--font-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
@container (max-width:450px) {
  #simulation2d-panel .fold-tools { gap:2px; }
  #simulation2d-panel .fold-tools .icon-button { width:28px; padding-inline:4px; }
  #simulation2d-zoom { width:48px; }
  #simulation2d-zoom-value { font-size:11px; }
  #simulation2d-speed { font-size:12px; padding-inline:4px 16px; background-size:11px; }
}
@container (max-width:320px) {
  #simulation2d-panel .fold-tools { gap:1px; }
  #simulation2d-panel .fold-tools .icon-button { width:23px; padding-inline:2px; }
  #simulation2d-zoom { width:28px; }
  #simulation2d-limit { width:5ch; font-size:11px; padding-inline:2px; }
  .simulation2d-limit { font-size:10px; }
  #simulation2d-speed { padding-inline:2px 13px; background-position:right 2px center; background-size:10px; }
}
#simulation2d-legend { display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-4); margin-block:var(--space-2); }
#simulation2d-legend span::before { content:""; display:inline-block; width:.65em; height:.65em; border-radius:50%; margin-inline-end:.4em; background:var(--lamp); }
#simulation2d-legend .run { --lamp:#00bd67; }
#simulation2d-legend .wait { --lamp:#ffb000; }
#simulation2d-legend .stop { --lamp:#ff384c; }
</style>
<script>
window.STSimulation2D=(function(){
  const el=id=>document.getElementById('simulation2d-'+id);
  const canvas=el('canvas'),panel=el('panel');
  const step=1/120,sceneScale=.09,cardWidth=260,cardGap=24;
  let shiftHours=8,shiftOutput=[],limitSeconds=3600,save,signature,lastSave=0;
  let seed=1,key,definitions=[],model=null,frame,previous=0,lag=0,drag,validation='',runState='Ready',lastMetrics=-Infinity;
  let camera={scale:1,x:0,y:0,fit:true};
  function num(value){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function failuresFor(item,config){
    const general=item.noiseProfile?.reliability;
    if(config.reliabilityEnabled===false||!general)return [];
    const split=item.processData?.equipment?.stopInputs;
    const profiles=split?Object.entries(split):[['general',general]];
    return profiles.filter(([key,profile])=>config.reliabilityCategories?.[key]!==false&&profile?.mtbfMinutes>0&&profile?.mttrMinutes>0)
      .map(([,profile])=>({rate:1/(profile.mtbfMinutes*60),repairSeconds:profile.mttrMinutes*60}));
  }
  function prepare(equipment,format,config){
    const geometry=window.SimulatorEngine;
    const packSize=format?geometry.productPackSize(format):null;
    const configured=format?geometry.applyProductProfile(equipment,format):equipment;
    return configured.map((item,index)=>{
      const data=item.processData||{};
      const unit=data.flowUnits?.output==='CASES'||String(item.unitOfFlow).toUpperCase()==='CASES'?'CASES':'BOTTLES';
      if(item.type!=='CONVEYOR'){
        const batch=unit==='CASES'&&data.flowUnits?.input==='BOTTLES'
          ? (format?geometry.productPackSize(format):NaN) : 1;
        return {id:item.id,name:item.name||item.id,kind:'machine',unit,length:1100,rate:item.nominalRatePerSecond,
          bottlesPerUnit:unit==='BOTTLES'?1:packSize,
          rampSeconds:item.restartRampUpSeconds??data.downstream?.rampUpTimeSeconds??0,
          rampAfterRepair:data.downstream?.rampAfterRepair===true,failures:failuresFor(item,config),
          startDelay:item.startupDelaySeconds??data.upstream?.startupTimeSeconds??0,batch};
      }
      const zone=geometry.resolveProductConveyor(configured,index)||{};
      const presentation=format?geometry.productPresentation(format,unit):{};
      return {id:item.id,name:item.name||item.id,kind:'belt',unit,bottlesPerUnit:unit==='BOTTLES'?1:packSize,
        length:zone.usableLengthMm,speed:zone.conveyorSpeedMmPerSecond,beltWidth:data.accumulation?.conveyorWidthMm??null,
        packageLength:zone.productLengthMm??presentation.lengthMm,
        packageWidth:presentation.widthMm??data.upstream?.packageWidthMm??null,
        pitch:zone.productPitchMm,packedGap:Math.max(0,(zone.accumulatedPitchMm??zone.productLengthMm)-zone.productLengthMm)||0,
        prime:zone.primeSensorPositionMm??null,backup:zone.backupSensorPositionMm??null,
        blockDelay:zone.blockedTimeDelaySeconds??.5,clearDelay:zone.clearTimeDelaySeconds??.5,
        responseDelay:zone.upstreamStopResponseSeconds??0,residual:Math.max(0,Math.floor(zone.bottlesDischargedAtStop??0))};
    });
  }
  function validate(){
    if(!definitions.length)return 'Add equipment in Equipment to start.';
    if(definitions[0].kind==='belt'||definitions.at(-1).kind==='belt'||definitions.some((item,index)=>item.kind==='belt'&&definitions[index-1]?.kind==='belt'))
      return 'This 2D model requires a machine at each end and at most one conveyor between two machines.';
    for(const item of definitions){
      if(item.kind==='machine'){
        if(!(item.rate>0)||!Number.isInteger(item.batch)||item.batch<1)return item.name+': check nominal rate and bottles per case.';
        continue;
      }
      const missing=[['conveyor length',item.length],['belt speed',item.speed],['product length',item.packageLength],['moving pitch',item.pitch]]
        .filter(([,value])=>!Number.isFinite(value)||value<=0).map(([label])=>label);
      if(missing.length)return item.name+': '+missing.join(', ')+' required in the case. Check Equipment and Formats.';
      if(item.beltWidth!==null&&(!(item.beltWidth>0)||(item.packageWidth>0&&item.beltWidth<item.packageWidth)))return item.name+': conveyor width must accommodate the product width.';
      if(item.length<item.packageLength||item.pitch<item.packageLength+item.packedGap)return item.name+': check conveyor length and package pitch.';
      if([item.prime,item.backup].some(value=>value!==null&&(!Number.isFinite(value)||value<0||value>item.length)))
        return item.name+': sensor positions must be within the conveyor length.';
    }
    return '';
  }
  function shiftIndex(seconds){return Math.floor((seconds+1e-7)/(shiftHours*3600));}
  function syncZoom(){
    const slider=el('zoom'),ratio=camera.scale/sceneScale;
    slider.value=Math.log2(ratio);
    const percent=(ratio>=.01?Math.round(ratio*100):num(ratio*100))+'%';
    slider.setAttribute('aria-valuetext',percent);
    el('zoom-value').textContent=percent;
  }
  function fit(){
    if(!canvas.clientWidth||!canvas.clientHeight)return;
    const length=definitions.reduce((total,item)=>total+(item.length||0),0)+(definitions.length?(cardWidth+cardGap)/sceneScale:0);
    const top=60,bottom=Math.max(240,68+shiftIndex(model?.time??0)*20);
    const horizontal=(canvas.clientWidth-52)/Math.max(1,length);
    const vertical=(canvas.clientHeight-36)*sceneScale/(top+bottom);
    camera.scale=Math.max(.0001,Math.min(horizontal,vertical,.32));
    camera.x=(canvas.clientWidth-length*camera.scale)/2;
    camera.y=(canvas.clientHeight+(top-bottom)*camera.scale/sceneScale)/2;
    camera.fit=true;
    syncZoom();draw();
  }
  function strokeBox(context,x,y,width,height){
    context.beginPath();
    context.roundRect(x,y,width,height,Math.min(5,width/2,height/2));
    context.fill();context.stroke();
  }
  const lampColors=['#ff384c','#ffb000','#00bd67'];
  function machineSignal(item){
    if(runState==='Stopped'||runState==='Completed')return {state:runState,lamp:0};
    if(runState==='Paused')return {state:'Paused',lamp:1};
    const state=item.state||'Waiting';
    if(state==='Back-up stop'||state==='Blocked'||state==='Failed')return {state,lamp:0};
    if(state==='Running'||state==='Discharging')return {state,lamp:2};
    return {state,lamp:1};
  }
  function drawSignal(context,x,y,lamp){
    context.fillStyle='#edf2f7';
    context.strokeStyle='#79899b';
    strokeBox(context,x-22,y-8,44,16);
    lampColors.forEach((color,index)=>{
      context.beginPath();
      context.arc(x+(index-1)*13,y,4.5,0,Math.PI*2);
      context.fillStyle=index===lamp?color:'#cbd5df';
      context.strokeStyle=index===lamp?'#344255':'#9ba9b7';
      context.fill();context.stroke();
    });
  }
  function drawProduction(context,x,y,ink,border,surface){
    const output=model?.line.at(-1)||definitions.at(-1);
    const cases=output.unit==='CASES';
    const bottleFactor=output.bottlesPerUnit;
    const currentShift=shiftIndex(model?.time??0);
    const height=88+(currentShift+1)*20;
    context.fillStyle=surface;context.strokeStyle=border;
    strokeBox(context,x,y,cardWidth,height);
    context.fillStyle=ink;
    context.textAlign='left';
    context.font='bold 14px system-ui';
    context.fillText('Production',x+14,y+22);
    context.font='12px system-ui';
    context.fillText(num(shiftHours)+' h per shift',x+14,y+41);
    context.fillText('Cases',x+120,y+60);
    context.fillText(cases?'Bottle eq.':'Bottles',x+182,y+60);
    function row(label,quantity,position){
      context.fillText(label,x+14,position);
      context.fillText(num(cases?quantity:0),x+120,position,55);
      context.fillText(num(cases?(bottleFactor>0?quantity*bottleFactor:NaN):quantity),x+182,position,64);
    }
    row('Total',output.produced||0,y+80);
    for(let index=0;index<=currentShift;index++)row('Shift '+(index+1),shiftOutput[index]||0,y+100+20*index);
    context.textAlign='center';
  }
  function draw(){
    if(panel.classList.contains('hidden'))return;
    const screenWidth=canvas.clientWidth,h=canvas.clientHeight;
    if(!screenWidth||!h)return;
    const dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(screenWidth*dpr)||canvas.height!==Math.round(h*dpr)){
      canvas.width=Math.round(screenWidth*dpr);canvas.height=Math.round(h*dpr);
    }
    const context=canvas.getContext('2d');
    if(!context)return;
    const style=getComputedStyle(canvas);
    const ink=style.getPropertyValue('--ink').trim()||'#20252c';
    const border=style.getPropertyValue('--line-strong').trim()||'#758497';
    const accent=style.getPropertyValue('--accent').trim()||'#2473b5';
    const surface=style.getPropertyValue('--surface').trim()||'#fff';
    context.setTransform(dpr,0,0,dpr,0,0);
    context.clearRect(0,0,screenWidth,h);
    const factor=camera.scale/sceneScale,w=screenWidth/factor;
    context.setTransform(dpr*factor,0,0,dpr*factor,0,0);
    context.font='12px system-ui';context.textAlign='center';
    const scale=sceneScale,y=camera.y/factor;
    let x=camera.x/factor,machineIndex=0;
    for(const item of model?.line||definitions){
      const width=Math.max(0,item.length||0)*scale;
      const lane=item.kind==='belt';
      const labelRow=lane?0:(machineIndex++%2);
      if(x+width<0||x>w){x+=width;continue;}
      if(lane){
        const span=Math.max(10,(item.beltWidth??(item.packageWidth||0)*1.4)*scale);
        context.fillStyle=surface;context.strokeStyle=border;
        strokeBox(context,x,y-span/2,width,span);
        context.beginPath();context.moveTo(x,y);context.lineTo(x+width,y);
        context.setLineDash([3,5]);context.stroke();context.setLineDash([]);
        context.fillStyle=accent;
        for(const product of item.items||[]){
          const px=x+product.x*scale,length=item.packageLength*scale,across=item.packageWidth*scale;
          if(px+length/2<0||px-length/2>w)continue;
          if(!(across>0)){
            // Width is only visual. Show a centreline marker without assuming a physical width.
            context.fillRect(px-length/2,y-1,length,2);
          }else if(item.unit==='CASES'){
            context.fillRect(px-length/2,y-across/2,length,across);
            if(length>8&&across>5){
              context.strokeStyle=surface;context.beginPath();context.moveTo(px,y-across/2);context.lineTo(px,y+across/2);context.stroke();
            }
          }else {context.beginPath();context.ellipse(px,y,length/2,across/2,0,0,Math.PI*2);context.fill();}
        }
        for(const [label,position,active] of [['B',item.backup,item.backupBlocked],['P',item.prime,item.primeBeam]]){
          if(position===null)continue;
          const sx=x+position*scale,sy=label==='P'?y-span/2-12:y+span/2+12;
          if(sx<0||sx>w)continue;
          context.strokeStyle=active?'#d26d31':accent;
          context.beginPath();context.moveTo(sx,y-span/2);context.lineTo(sx,y+span/2);context.stroke();
          context.beginPath();context.arc(sx,sy,8,0,Math.PI*2);
          context.fillStyle=active?'#d26d31':surface;context.fill();context.stroke();
          context.fillStyle=active?'#fff':ink;context.fillText(label,sx,sy+4);
        }
        if(width>100){
          const labelX=Math.max(55,Math.min(w-55,x+width/2));
          context.fillStyle=ink;
          context.fillText(item.name+' · '+num(item.length/1000)+' m',labelX,y-span/2-35,Math.min(width,w-16));
          context.fillText(num(item.items?.length??0)+' on belt',labelX,y+span/2+37);
        }
        if(width>=45){
          const labelX=Math.max(32,Math.min(w-32,x+width/2));
          const rate=item.ratePerMinute??0;
          const bottleRate=item.bottlesPerUnit>0?num(rate*item.bottlesPerUnit):'—';
          const units=item.unit==='CASES'?bottleRate+' bpm · '+num(rate)+' cpm':bottleRate+' bpm';
          context.fillStyle=ink;
          context.fillText(units,labelX,y+span/2+53,Math.min(Math.max(width,72),w-12));
        }
      }else{
        const height=Math.max(24,540*scale);
        const signal=machineSignal(item);
        context.fillStyle=surface;context.strokeStyle=lampColors[signal.lamp];
        strokeBox(context,x,y-height/2,width,height);
        context.fillStyle=context.strokeStyle;
        context.fillRect(x,y-height/2,Math.min(4,width),height);
        if(width>=36){
          context.strokeRect(x+width*.25,y-height*.23,width*.5,height*.46);
          context.beginPath();context.moveTo(x+width/2,y-height*.23);context.lineTo(x+width/2,y+height*.23);context.stroke();
        }
        const sx=x+width/2,sy=y+height/2+52+labelRow*22;
        drawSignal(context,sx,y-height/2-14,signal.lamp);
        context.fillStyle=ink;
        context.fillText(item.name,sx,sy,Math.max(24,width-4));
        context.fillText(signal.state,sx,sy+14,Math.max(24,width-4));
        if(width>=86){
          const durations=item.durations||{}, rate=item.ratePerMinute||0, produced=item.produced||0;
          const bottles=item.bottlesPerUnit>0?num(produced*item.bottlesPerUnit):'—';
          const bpm=item.bottlesPerUnit>0?num(rate*item.bottlesPerUnit):'—';
          const counters=[
            'Run '+num(durations.running||0)+' s',
            'Starving '+num(durations.starving||0)+' s',
            'Ramp up '+num(durations.acceleration||0)+' s',
            'Ramp down '+num(durations.deceleration||0)+' s',
            'Blocked '+num(durations.blocked||0)+' s',
            'Own failure '+num(durations.failure||0)+' s',
            bottles+' bottles · '+bpm+' bpm'
          ];
          if(item.unit==='CASES')counters.push(num(produced)+' cases · '+num(rate)+' cpm');
          counters.forEach((label,index)=>context.fillText(label,sx,sy+31+index*15,width-4));
        }
      }
      x+=width;
    }
    if(definitions.length&&x+cardGap<=w&&x+cardGap+cardWidth>=0)drawProduction(context,x+cardGap,y-40,ink,border,surface);
  }
  function status(){
    const unknownWidth=definitions.some(item=>item.kind==='belt'&&!(item.packageWidth>0));
    el('status').textContent=validation||runState+(unknownWidth?' · Products without a width in Formats are shown as centreline markers.':'');
    const line=model?.line||[];
    el('time').textContent=num(model?.time??0)+' s';
    el('output').textContent=num(line.at(-1)?.produced??0)+' '+(definitions.at(-1)?.unit==='CASES'?'cases':'bottles');
    el('inventory').textContent=num(line.reduce((sum,item)=>sum+(item.items?.length||0),0));
    el('running').textContent=num(line.filter(item=>item.state==='Running'||item.state==='Discharging').length);
    el('backup').textContent=num(line.filter(item=>item.backupBlocked).length);
  }
  function cancelFrame(){
    if(frame!==undefined)window.cancelAnimationFrame(frame);
    frame=undefined;previous=0;
  }
  function syncControls(){
    el('play').disabled=!!validation||runState==='Running';
    el('pause').disabled=runState!=='Running';
    el('stop').disabled=runState!=='Running'&&runState!=='Paused';
    el('reset').disabled=!!validation;
    el('limit').disabled=runState==='Running';
    status();
  }
  function checkpoint(){
    if(!save)return;
    save({
      version:1,speed:Number(el('speed').value),limitSeconds,signature,runState,
      shiftOutput:[...shiftOutput],checkpoint:model?.time>0?model.snapshot():null
    });
  }
  function pause(){
    if(runState!=='Running')return;
    cancelFrame();runState='Paused';syncControls();draw();checkpoint();
  }
  function reset(){
    cancelFrame();lag=0;lastMetrics=-Infinity;shiftOutput=[];validation=validate();
    model=validation?null:STSimulation2DEngine.create(definitions,seed);
    runState='Ready';syncControls();
    if(camera.fit)fit();else draw();
  }
  function animate(now){
    if(previous)lag+=(now-previous)/1000*Number(el('speed').value);
    previous=now;
    const output=model.line.at(-1);
    const deadline=performance.now()+12;
    for(let count=0;count<24000;count++){
      const remaining=limitSeconds-model.time;
      if(remaining<=1e-8||lag<Math.min(step,remaining))break;
      const advance=Math.min(step,remaining),previousOutput=output.produced;
      model.step(advance);lag-=advance;
      if(output.produced>previousOutput){
        const index=shiftIndex(model.time);
        shiftOutput[index]=(shiftOutput[index]||0)+output.produced-previousOutput;
      }
      if(count%128===127&&performance.now()>=deadline)break;
    }
    if(limitSeconds-model.time<=1e-8){
      cancelFrame();runState='Completed';syncControls();draw();checkpoint();return;
    }
    if(now-lastMetrics>=125){status();lastMetrics=now;}
    if(now-lastSave>=15000){checkpoint();lastSave=now;}
    draw();
    frame=window.requestAnimationFrame(animate);
  }
  el('play').onclick=function(){
    if(!model||frame!==undefined)return;
    if(runState==='Stopped'||runState==='Completed'||model.time>=limitSeconds)reset();
    lastSave=performance.now();runState='Running';syncControls();
    frame=window.requestAnimationFrame(animate);
  };
  el('stop').onclick=()=>{cancelFrame();runState='Stopped';syncControls();draw();checkpoint();};
  document.addEventListener('visibilitychange',()=>{if(document.hidden){endDrag();pause();}});
  el('pause').onclick=pause;
  el('reset').onclick=()=>{reset();checkpoint();};
  el('speed').addEventListener('change',checkpoint);
  el('limit').addEventListener('change',function(){
    if(!this.checkValidity()||!Number.isFinite(this.valueAsNumber*60)||this.valueAsNumber<=0){
      this.value=limitSeconds/60;
      return;
    }
    limitSeconds=this.valueAsNumber*60;
    checkpoint();
  });
  canvas.addEventListener('dblclick',fit);
  el('fit').onclick=fit;
  el('zoom').addEventListener('input',function(){
    zoom(sceneScale*2**Number(this.value)/camera.scale,canvas.clientWidth/2,canvas.clientHeight/2);
  });
  function zoom(factor,x,y){
    const scale=Math.max(.0001,Math.min(4,camera.scale*factor));
    const ratio=scale/camera.scale;
    camera={scale,x:x-(x-camera.x)*ratio,y:y-(y-camera.y)*ratio,fit:false};syncZoom();draw();
  }
  canvas.addEventListener('wheel',event=>{
    if(!event.ctrlKey&&!event.metaKey)return;
    event.preventDefault();
    const rect=canvas.getBoundingClientRect();
    zoom(Math.exp(-event.deltaY/350),event.clientX-rect.left,event.clientY-rect.top);
  },{passive:false});
  function endDrag(event){
    if(!drag||(event?.pointerId!==undefined&&event.pointerId!==drag.id))return;
    const id=drag.id;
    drag=null;
    if(canvas.hasPointerCapture?.(id))canvas.releasePointerCapture(id);
  }
  canvas.addEventListener('pointerdown',event=>{
    if(event.button!==0||drag)return;
    drag={id:event.pointerId,x:event.clientX-camera.x,y:event.clientY-camera.y};
    canvas.setPointerCapture?.(event.pointerId);
  });
  window.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    if(event.buttons===0){endDrag(event);return;}
    camera={...camera,x:event.clientX-drag.x,y:event.clientY-drag.y,fit:false};draw();
  });
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
  window.addEventListener('blur',()=>endDrag());
  canvas.addEventListener('lostpointercapture',endDrag);
  if(window.ResizeObserver)new ResizeObserver(()=>{if(!panel.classList.contains('hidden')&&canvas.clientWidth){if(camera.fit)fit();else draw();}}).observe(canvas);
  return {pause,unload(){cancelFrame();save=null;key=null;model=null;},load(identity,equipment,format,config={},stored,saveRecord){
    const configuredHours=config.shiftHours??config.durationOptions?.shiftHours??config.shiftSeconds/3600;
    const hours=Number.isFinite(configuredHours)&&configuredHours>0?configuredHours:8;
    const next=JSON.stringify([identity,config.seed,hours]);
    const revised=prepare(equipment,format,config);
    const nextSignature=JSON.stringify([next,revised]);
    if(next===key&&nextSignature===signature){save=saveRecord;draw();return;}
    cancelFrame();
    save=saveRecord;signature=nextSignature;
    key=next;seed=config.seed??1;shiftHours=hours;definitions=revised;
    const defaultLimit=config.durationSeconds>0?config.durationSeconds:3600;
    limitSeconds=stored?.limitSeconds>0&&Number.isFinite(stored.limitSeconds)?stored.limitSeconds:defaultLimit;
    el('limit').value=limitSeconds/60;
    el('speed').value=String(stored?.speed??1);
    if(!el('speed').value)el('speed').value='1';
    camera.fit=true;reset();
    if(model&&stored?.version===1&&stored.signature===signature&&stored.checkpoint){
      model=STSimulation2DEngine.create(definitions,seed,stored.checkpoint);
      shiftOutput=Array.isArray(stored.shiftOutput)?[...stored.shiftOutput]:[];
      runState=model.time>=limitSeconds-1e-8?'Completed':stored.runState==='Stopped'?'Stopped':'Paused';
      syncControls();fit();
    }
    if(camera.scale<sceneScale){camera={scale:sceneScale,x:28,y:canvas.clientHeight/2-80,fit:false};syncZoom();draw();}
  }};
})();
</script>
