<style>
#simulation2d-canvas { display:block; width:100%; height:clamp(420px,57vh,690px); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); cursor:grab; touch-action:none; }
#simulation2d-canvas:active { cursor:grabbing; }
#simulation2d-canvas { background-color:var(--surface); background-image:radial-gradient(var(--line) 1px,transparent 1px); background-size:18px 18px; }
.simulation2d-metrics { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:var(--space-3) 0; }
.simulation2d-metrics > div { flex:1 1 8rem; padding:var(--space-2) var(--space-3); border:1px solid var(--line); border-radius:var(--radius-md); }
.simulation2d-metrics dt { color:var(--muted); font-size:var(--font-secondary); }
.simulation2d-metrics dd { margin:0; font-weight:var(--weight-semibold); font-variant-numeric:tabular-nums; }
#simulation2d-panel { container-type:inline-size; }
#simulation2d-panel.simulation2d-fullscreen {
  position:fixed; inset:0; z-index:1000; margin:0; max-width:none;
  border-radius:0; background:var(--surface); overflow:auto;
  display:flex; flex-direction:column;
}
.simulation2d-fullscreen #simulation2d-content {
  flex:1; min-height:22rem; display:flex; flex-direction:column;
}
.simulation2d-fullscreen #simulation2d-canvas { flex:1; min-height:12rem; height:auto; }
.simulation2d-options { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2) var(--space-3); }
.simulation2d-source { display:inline-flex; align-items:center; gap:var(--space-2); font-size:var(--font-secondary); white-space:nowrap; max-width:100%; }
.simulation2d-source select { width:auto; min-width:0; }
.simulation2d-source input[type=checkbox] { width:auto; margin:0; }
#simulation2d-panel .fold-tools { flex-wrap:nowrap; align-items:center; max-width:100%; min-width:0; gap:var(--space-1); }
#simulation2d-panel .fold-tools > * { flex:0 0 auto; margin:0; }
#simulation2d-speed { width:max-content; min-width:0; padding-inline:6px 20px; background-position:right 4px center; background-size:13px; }
.simulation2d-limit { display:inline-flex; align-items:center; gap:2px; color:var(--ink); font-size:var(--font-secondary); white-space:nowrap; }
#simulation2d-limit { width:7ch; min-width:7ch; padding-inline:4px; appearance:textfield; font-variant-numeric:tabular-nums; }
#simulation2d-limit::-webkit-inner-spin-button { appearance:none; margin:0; }
#simulation2d-zoom { width:96px; min-width:0; padding:0; accent-color:var(--accent); }
#simulation2d-zoom-value { width:5ch; text-align:end; color:var(--ink); font-size:var(--font-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
@container (max-width:450px) {
  #simulation2d-panel .fold-tools { gap:2px; }
  #simulation2d-panel .fold-tools .icon-button { width:28px; padding-inline:4px; }
  #simulation2d-zoom { width:48px; }
  #simulation2d-zoom-value { font-size:11px; }
  #simulation2d-speed { font-size:12px; padding-inline:4px 16px; background-size:11px; }
}
@container (max-width:320px) {
  #simulation2d-panel .fold-tools { gap:1px; }
  #simulation2d-panel .fold-tools .icon-button { width:23px; padding-inline:2px; }
  #simulation2d-zoom { width:28px; }
  #simulation2d-limit { font-size:11px; padding-inline:2px; }
  .simulation2d-limit { font-size:10px; }
  #simulation2d-speed { padding-inline:2px 13px; background-position:right 2px center; background-size:10px; }
}
#simulation2d-legend { display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-4); margin-block:var(--space-2); }
#simulation2d-legend span::before { content:""; display:inline-block; width:.65em; height:.65em; border-radius:50%; margin-inline-end:.4em; background:var(--lamp); }
#simulation2d-legend .run { --lamp:#00bd67; }
#simulation2d-legend .wait { --lamp:#ffb000; }
#simulation2d-legend .stop { --lamp:#ff384c; }
</style>
<script>
window.STSimulation2D=(function(){
  const el=id=>document.getElementById('simulation2d-'+id);
  const canvas=el('canvas'),panel=el('panel');
  const step=1/120,sceneScale=.09,cardWidth=260,cardGap=24,telemetryWidth=180,telemetryGap=6,machineScale=3.75;
  const machineHeight=540*sceneScale*machineScale,beltDepth=7.5,beltInset=1.5;
  let shiftHours=8,shiftOutput=[],limitSeconds=3600,save,signature,lastSave=0;
  let seed=1,key,viewKey,definitions=[],model=null,frame,previous=0,lag=0,drag,validation='',runState='Ready',lastMetrics=-Infinity;
  let representative=null,defaultRun=null;
  let productHeights={},machineTypes=new Map(),bottleStages=new Map(),conveyorDimensions=new Map();
  const dimensionRowHeight=32,dimensionLevels=3,dimensionOffset=126;
  let dimensionPointer=null;
  const bottleStageNames=['Empty','Labeled','Filled','Filled + labeled'];
  const machineStyle=el('machine-style'),reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  machineStyle.value=window.STPreferences?.read('simulation2dMachineStyle')==='animated'?'animated':'blocks';
  machineStyle.addEventListener('change',()=>{
    window.STPreferences?.write('simulation2dMachineStyle',machineStyle.value);
    if(camera.fit)fit();else draw();
  });
  const showDimensions=el('dimensions');
  showDimensions.checked=window.STPreferences?.read('simulation2dDimensions')==='yes';
  showDimensions.addEventListener('change',()=>{
    window.STPreferences?.write('simulation2dDimensions',showDimensions.checked?'yes':'no');
    dimensionPointer=null;
    draw();
  });
  let camera={scale:1,x:0,y:0,fit:true};
  function num(value){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function failuresFor(item,config){
    if(config.reliabilityEnabled===false)return [];
    const split=item.processData?.equipment?.stopInputs;
    const profiles=split?Object.entries(split):[['general',item.noiseProfile?.reliability]];
    return profiles.filter(([key,profile])=>config.reliabilityCategories?.[key]!==false
      &&Number.isFinite(profile?.mtbfMinutes)&&profile.mtbfMinutes>0
      &&Number.isFinite(profile.mttrMinutes)&&profile.mttrMinutes>0)
      .map(([,profile])=>({rate:1/(profile.mtbfMinutes*60),repairSeconds:profile.mttrMinutes*60}));
  }
  function conveyorSegments(data){
    return {
      discharge:data.geometry?.actualDischargeMm??data.accumulation?.dischargeRunoutLengthMm??0,
      coding:data.geometry?.actualCodingMm??data.accumulation?.rejectRunoutLengthMm??0
    };
  }
  function formatDimensionInputs(zone,models,discharge,coding){
    const {input,calculated}=zone?.engineering||{};
    const speed=zone?.conveyorSpeedMmPerSecond;
    const upstream=models.find(item=>item.id===zone?.upstreamControlEquipmentId);
    const downstream=models.find(item=>item.id===zone?.downstreamControlEquipmentId);
    if(upstream?.processData?.productApplies===false||downstream?.processData?.productApplies===false)return {};
    const length=input?.packageLengthMm??zone?.productLengthMm;
    const rate=input?.upstreamNominalSpeedBpm??upstream?.nominalRatePerSecond*60;
    if(!(speed>0&&length>0&&rate>0))return {};
    const flow=rate*length/60,population=flow/speed;
    const dischargeSpeed=calculated?.dischargeZoneSpeedMmPerSecond??speed;
    const codingSpeed=calculated?.codingZoneSpeedMmPerSecond??speed;
    if(!(population<1)||discharge>0&&!(dischargeSpeed>0)||coding>0&&!(codingSpeed>0))return {};
    const dischargeTime=discharge>0?discharge/dischargeSpeed:0;
    const codingTime=coding>0?coding/codingSpeed:0;
    const blocked=input?.blockedTimeDelaySeconds??zone.blockedTimeDelaySeconds??0;
    const clear=input?.clearTimeDelaySeconds??zone.clearTimeDelaySeconds??0;
    const stop=input?.bottlesDischargedAtStop??zone.bottlesDischargedAtStop??0;
    const startup=upstream?.startupDelaySeconds??input?.upstreamStartupTimeSeconds??upstream?.processData?.upstream?.startupTimeSeconds??0;
    const units=(blocked+dischargeTime+codingTime)*rate/60+stop+(input?.insuranceFactorUnits??0);
    const downstreamRate=downstream?.processData?.productInputRatePerSecond??downstream?.nominalRatePerSecond;
    return {overflow:units*length/(1-population),speed,
      consumption:calculated?.downstreamConsumptionRateMmPerSecond??downstreamRate*length,
      restart:clear+startup+dischargeTime+codingTime};
  }
  function dimensionRows(zone,data,designProfiles,index){
    const length=data.geometry?.lactMm??zone.usableLengthMm;
    const lp=data.geometry?.lpPrimeMm??(length-zone.primeSensorPositionMm);
    const prime=length-lp;
    const {discharge,coding}=conveyorSegments(data);
    const runout=discharge+coding;
    const results=designProfiles
      .filter(({models})=>models[index].processData?.productApplies!==false)
      .map(({zones,models})=>formatDimensionInputs(zones[index],models,discharge,coding));
    const overflows=results.map(result=>result.overflow).filter(Number.isFinite);
    const overflow=overflows.length?Math.max(...overflows):undefined;
    const lbu=runout+overflow,lba=prime-lbu;
    const margins=results.flatMap(({overflow:required,speed,consumption,restart})=>{
      if(!Number.isFinite(required)||!(consumption>0&&speed>consumption)||!(lba>=0))return [];
      const queueLoss=consumption*(restart+overflow/speed);
      return [lba-queueLoss-consumption*queueLoss/(speed-consumption)];
    });
    const recovery=margins.length?Math.min(...margins):undefined;
    const overflowPartial=overflows.length<results.length;
    const recoveryPartial=overflowPartial||margins.length<results.length;
    const rows=[];
    function span(tier,label,start,value,partial=false,showZero=false){
      if(Number.isFinite(value)&&(value!==0||showZero)){
        rows.push({tier,label,start,value,partial});
      }
    }
    span(0,'Discharge',0,discharge);
    span(0,'Coding',discharge,coding);
    span(0,'Overflow',runout,overflow,overflowPartial,true);
    if(Number.isFinite(recovery)){
      rows.push({tier:0,label:'Lrec',start:prime-Math.max(0,recovery),end:prime,value:recovery,partial:recoveryPartial});
    }else{
      rows.push({tier:0,label:'Lrec',start:prime,end:prime});
    }
    span(0,'Lp',prime,lp);
    span(1,'Lbu',0,lbu,overflowPartial,true);
    span(1,'Lba',lbu,lba,overflowPartial,true);
    span(2,'Lact',0,length);
    return {rows,runout,backup:lbu,prime,recovery:recovery>0?prime-recovery:undefined};
  }
  function prepare(equipment,format,config,formats){
    const geometry=window.SimulatorEngine;
    const packSize=format?geometry.productPackSize(format):null;
    const configured=format?geometry.applyProductProfile(equipment,format):equipment;
    const resolveZones=models=>models.map((item,index)=>item.type==='CONVEYOR'?geometry.resolveProductConveyor(models,index):null);
    const zones=resolveZones(configured);
    const currentProfile={models:configured,zones};
    const designProfiles=formats.map(candidate=>{
      if(candidate.id===format?.id)return currentProfile;
      const models=geometry.applyProductProfile(equipment,candidate);
      return {models,zones:resolveZones(models)};
    });
    if(!designProfiles.length)designProfiles.push(currentProfile);
    conveyorDimensions=new Map();
    return configured.map((item,index)=>{
      const data=item.processData||{};
      const unit=data.flowUnits?.output==='CASES'||String(item.unitOfFlow).toUpperCase()==='CASES'?'CASES':'BOTTLES';
      if(item.type!=='CONVEYOR'){
        const batch=unit==='CASES'&&data.flowUnits?.input==='BOTTLES'
          ? (format?geometry.productPackSize(format):NaN) : 1;
        const inputBottleFactor=data.flowUnits?.input==='CASES'&&packSize>0?packSize:1;
        const bottlesPerUnit=unit==='BOTTLES'?1:packSize;
        const capacityBottles=data.equipment?.internalCapacityBottles??Math.max(30,batch*inputBottleFactor);
        const residenceSeconds=capacityBottles/(item.nominalRatePerSecond*bottlesPerUnit);
        return {capacityBottles,residenceSeconds,inputBottleFactor,id:item.id,name:item.name||item.id,
          kind:'machine',unit,length:1100,rate:item.nominalRatePerSecond,bottlesPerUnit,
          rampSeconds:item.restartRampUpSeconds??data.downstream?.rampUpTimeSeconds??0,
          primeRampSeconds:zones[index-1]?.primeSensorPositionMm!=null?zones[index-1].downstreamRampUpSeconds:undefined,
          rampAfterRepair:data.downstream?.rampAfterRepair===true,failures:failuresFor(item,config),
          startDelay:item.startupDelaySeconds??data.upstream?.startupTimeSeconds??0,batch};
      }
      const zone=zones[index]||{};
      conveyorDimensions.set(item.id,dimensionRows(zone,data,designProfiles,index));
      const presentation=format?geometry.productPresentation(format,unit):{};
      return {id:item.id,name:item.name||item.id,kind:'belt',unit,bottlesPerUnit:unit==='BOTTLES'?1:packSize,
        zoneId:zone.id,length:zone.usableLengthMm,speed:zone.conveyorSpeedMmPerSecond,beltWidth:data.accumulation?.conveyorWidthMm??null,
        packageLength:zone.productLengthMm??presentation.lengthMm,
        packageWidth:presentation.widthMm??data.upstream?.packageWidthMm??null,
        pitch:zone.productPitchMm,packedGap:Math.max(0,(zone.accumulatedPitchMm??zone.productLengthMm)-zone.productLengthMm)||0,
        prime:zone.primeSensorPositionMm??null,backup:zone.backupSensorPositionMm??null,
        blockDelay:zone.blockedTimeDelaySeconds??.5,clearDelay:zone.clearTimeDelaySeconds??.5,
        responseDelay:zone.upstreamStopResponseSeconds??0,residual:Math.max(0,Math.floor(zone.bottlesDischargedAtStop??0))};
    });
  }
  function validate(){
    if(!definitions.length)return 'Add equipment in Equipment to start.';
    if(definitions[0].kind==='belt'||definitions.at(-1).kind==='belt'||definitions.some((item,index)=>item.kind==='belt'&&definitions[index-1]?.kind==='belt'))
      return 'This 2D model requires a machine at each end and at most one conveyor between two machines.';
    for(const item of definitions){
      if(item.kind==='machine'){
        if(!(item.rate>0)||!Number.isInteger(item.batch)||item.batch<1)return item.name+': check nominal rate and bottles per case.';
        const minimum=item.batch*item.inputBottleFactor;
        if(!Number.isSafeInteger(item.capacityBottles)||item.capacityBottles<minimum)
          return item.name+': set Internal capacity to at least '+num(minimum)+' bottles in Equipment.';
        if(!Number.isFinite(item.residenceSeconds)||item.residenceSeconds<0)
          return item.name+': check nominal speed and the bottle equivalent of the active format.';
        continue;
      }
      const missing=[['conveyor length',item.length],['belt speed',item.speed],['product length',item.packageLength],['moving pitch',item.pitch]]
        .filter(([,value])=>!Number.isFinite(value)||value<=0).map(([label])=>label);
      if(missing.length)return item.name+': '+missing.join(', ')+' required in the case. Check Equipment and Formats.';
      if(item.beltWidth!==null&&(!(item.beltWidth>0)||(item.packageWidth>0&&item.beltWidth<item.packageWidth)))return item.name+': conveyor width must accommodate the product width.';
      if(item.length<item.packageLength||item.pitch<item.packageLength+item.packedGap)return item.name+': check conveyor length and package pitch.';
      if([item.prime,item.backup].some(value=>value!==null&&(!Number.isFinite(value)||value<0||value>item.length)))
        return item.name+': sensor positions must be within the conveyor length.';
    }
    return '';
  }
  function shiftIndex(seconds){return Math.floor((seconds+1e-7)/(shiftHours*3600));}
  function syncZoom(){
    const slider=el('zoom'),ratio=camera.scale/sceneScale;
    slider.value=Math.log2(ratio);
    const percent=(ratio>=.01?Math.round(ratio*100):num(ratio*100))+'%';
    slider.setAttribute('aria-valuetext',percent);
    el('zoom-value').textContent=percent;
  }
  function machineDesign(item){
    return item.kind==='machine'&&machineStyle.value==='animated'
      ? window.STSimulation2DMachines?.dimensions(machineTypes.get(item.id)) : null;
  }
  function displayWidth(item){
    return Math.max(0,item.length||0)*sceneScale*(item.kind==='machine'?machineScale*(machineDesign(item)?.width??1):1);
  }
  function displayHeight(item){return machineHeight*(machineDesign(item)?.height??1);}
  function tallestMachine(){
    return Math.max(0,...definitions.filter(item=>item.kind==='machine').map(displayHeight));
  }
  function sceneHalfHeight(){
    return Math.max(tallestMachine()/2,0,...definitions.filter(item=>item.kind==='belt').map(beltHalfHeight));
  }
  function sceneTop(){
    const half=sceneHalfHeight();
    if(!conveyorDimensions.size)return half+26;
    return half+dimensionOffset+dimensionLevels*dimensionRowHeight;
  }
  function telemetryLayout(line){
    let end=0;
    const centers=line.map(item=>{
      const width=displayWidth(item),center=end+width/2;
      end+=width;
      return center;
    });
    const positions=[];
    for(const center of centers){
      positions.push(Math.max(center,positions.length?positions.at(-1)+telemetryWidth+cardGap:telemetryWidth/2));
    }
    return {centers,positions,end};
  }
  function fit(){
    if(!canvas.clientWidth||!canvas.clientHeight)return;
    const {positions,end}=telemetryLayout(model?.line||definitions);
    const length=Math.max(end+(definitions.length?cardWidth+cardGap:0),
      (positions.at(-1)??0)+telemetryWidth/2)/sceneScale;
    const top=sceneTop(),bottom=Math.max(sceneHalfHeight()+417,68+shiftIndex(model?.time??0)*20);
    const horizontal=(canvas.clientWidth-52)/Math.max(1,length);
    const vertical=(canvas.clientHeight-36)*sceneScale/(top+bottom);
    camera.scale=Math.max(.0001,Math.min(horizontal,vertical,.32));
    camera.x=(canvas.clientWidth-length*camera.scale)/2;
    camera.y=(canvas.clientHeight+(top-bottom)*camera.scale/sceneScale)/2;
    camera.fit=true;
    syncZoom();draw();
  }
  function strokeBox(context,x,y,width,height){
    context.beginPath();
    context.roundRect(x,y,width,height,Math.min(5,width/2,height/2));
    context.fill();context.stroke();
  }
  const lampColors=['#ff384c','#ffb000','#00bd67'];
  function machineSignal(item){
    if(runState==='Stopped'||runState==='Completed')return {state:runState,lamp:0};
    if(runState==='Paused')return {state:'Paused',lamp:1};
    const state=item.state||'Waiting';
    if(['Back-up stop','Blocked','Failed','Emergency stop','Planned stop','Stopped','Micro stop'].includes(state))return {state,lamp:0};
    if(state==='Running'||state==='Discharging')return {state,lamp:2};
    return {state,lamp:1};
  }
  function beltSignal(item){
    if(runState==='Stopped'||runState==='Completed')return {state:runState,lamp:0};
    if(runState!=='Running')return {state:runState,lamp:1};
    const state=item.state||'Empty';
    return {state,lamp:item.backupBlocked?0:state==='Flowing'?2:1};
  }
  function drawSignal(context,x,y,lamp){
    context.fillStyle='#edf2f7';
    context.strokeStyle='#79899b';
    strokeBox(context,x-22,y-8,44,16);
    lampColors.forEach((color,index)=>{
      context.beginPath();
      context.arc(x+(index-1)*13,y,4.5,0,Math.PI*2);
      context.fillStyle=index===lamp?color:'#cbd5df';
      context.strokeStyle=index===lamp?'#344255':'#9ba9b7';
      context.fill();context.stroke();
    });
  }
  function drawText(context,text,x,y,available){
    const width=context.measureText(text).width;
    if(width<=available||width===0){context.fillText(text,x,y);return;}
    const factor=available/width;
    context.save();
    context.translate(x,y);
    context.scale(factor,factor);
    context.fillText(text,0,0);
    context.restore();
  }
  function drawProduction(context,x,y,ink,border,surface){
    const output=model?.line.at(-1)||definitions.at(-1);
    const cases=output.unit==='CASES';
    const bottleFactor=output.bottlesPerUnit;
    const currentShift=shiftIndex(model?.time??0);
    const height=88+(currentShift+1)*20;
    context.fillStyle=surface;context.strokeStyle=border;
    strokeBox(context,x,y,cardWidth,height);
    context.fillStyle=ink;
    context.textAlign='left';
    context.font='bold 14px system-ui';
    context.fillText('Production',x+14,y+22);
    context.font='12px system-ui';
    context.fillText(num(shiftHours)+' h per shift',x+14,y+41);
    context.fillText('Cases',x+120,y+60);
    context.fillText(cases?'Bottle eq.':'Bottles',x+182,y+60);
    function row(label,quantity,position){
      context.fillText(label,x+14,position);
      drawText(context,num(cases?quantity:0),x+120,position,55);
      drawText(context,num(cases?(bottleFactor>0?quantity*bottleFactor:NaN):quantity),x+182,position,64);
    }
    row('Total',output.produced||0,y+80);
    for(let index=0;index<=currentShift;index++)row('Shift '+(index+1),shiftOutput[index]||0,y+100+20*index);
    context.textAlign='center';
  }
  function drawTelemetry(context,item,x,y,signal,ink,border,surface,muted,soft){
    const belt=item.kind==='belt',cases=item.unit==='CASES';
    const rate=item.ratePerMinute??0,produced=item.produced??0;
    const bottles=value=>num(item.bottlesPerUnit>0?value*item.bottlesPerUnit:NaN);
    const duration=(label,key)=>[label,num(item.durations?.[key]??0),'s'];
    const summary=[['State',signal.state,''],['Flow',bottles(rate),'bpm'],['Processed',bottles(produced),'bottles']];
    if(cases)summary.push(['Case flow',num(rate),'cpm'],['Cases made',num(produced),'cases']);
    if(belt){
      summary.push(['Belt speed',num(item.speed*.06),'m/min'],
        ['On belt',num(item.items?.length??0),cases?'cases':'bottles']);
      if(!cases){
        const stage=bottleStages.get(item.id)??0;
        summary.push(['Bottle stage',bottleStageNames[stage&3],'']);
        if(stage&4)summary.push(['Cap','Applied','']);
      }
    }else summary.push(['Inside',num((item.resident?.length??0)*item.inputBottleFactor)+' / '+num(item.capacityBottles),'bottles'],
      ['Est. residence',num(item.residenceSeconds),'s']);
    const counters=belt
      ? [duration('Empty','empty'),duration('Flowing','flowing'),duration('Accumulating','accumulating'),
        ['Back-up',item.backup===null?'—':item.backupBlocked?'Active':'Clear',''],['Own failures','—','']]
      : [duration('Start','starting'),duration('Run','running'),duration('Starving','starving'),
        duration('Ramp up','acceleration'),duration('Ramp down','deceleration'),duration('Blocked','blocked'),
        duration('Failure time','failure'),['Own failures',item.failures?.length?num(item.failureCount??0):'Off','']];
    function card(title,rows,showSignal){
      const left=x-telemetryWidth/2,width=telemetryWidth;
      const height=47+(showSignal?7:rows.length)*18;
      context.fillStyle=surface;context.strokeStyle=border;
      strokeBox(context,left,y,width,height);
      context.fillStyle=soft;
      context.fillRect(left+1,y+6,width-2,33);
      if(showSignal){
        context.fillStyle=lampColors[signal.lamp];
        context.beginPath();context.arc(left+12,y+17,3,0,Math.PI*2);context.fill();
      }
      context.fillStyle=ink;context.font='600 12px system-ui';context.textAlign='left';
      const titleInset=showSignal?21:9;
      drawText(context,title,left+titleInset,y+21,width-titleInset-9);
      context.fillStyle=muted;context.font='10px system-ui';
      context.fillText('Parameter',left+9,y+35);
      context.textAlign='right';context.fillText('Value',left+132,y+35);
      context.textAlign='left';context.fillText('Unit',left+140,y+35);
      rows.forEach(([label,value,unit],index)=>{
        const rowY=y+40+index*18;
        if(index%2===1){context.fillStyle=soft;context.fillRect(left+1,rowY,width-2,18);}
        context.font='11px system-ui';context.fillStyle=muted;
        drawText(context,label,left+9,rowY+13,76);

    const configuredHours=config.shiftHours??config.durationOptions?.shiftHours??config.shiftSeconds/3600;
    const hours=Number.isFinite(configuredHours)&&configuredHours>0?configuredHours:8;
    const next=JSON.stringify([identity,config.seed,hours]);
    const nextView=JSON.stringify(identity);
    const newView=nextView!==viewKey;
    const revised=prepare(equipment,format,config,formats);
    machineTypes=new Map(equipment.map(item=>[item.id,item.type==='PACEMAKER'?item.processData?.machineType:item.type]));
    bottleStages=new Map();
    let bottleStage=0;
    for(const item of revised){
      if(item.kind==='belt'){bottleStages.set(item.id,bottleStage);continue;}
      const type=machineTypes.get(item.id);
      if(type==='SLEEVER')bottleStage|=1;
      if(type==='FILLER')bottleStage|=2;
      if(type==='CAPPER'||/\b(?:capper|capping|tapadora|taponadora|roscadora)\b/i.test(item.name))bottleStage|=4;
    }
    const geometry=window.SimulatorEngine;
    const heights=format?{BOTTLES:geometry.productPresentation(format,'BOTTLES').heightMm,
      CASES:geometry.productPresentation(format,'CASES').heightMm}:{};
    const heightChanged=heights.BOTTLES!==productHeights.BOTTLES||heights.CASES!==productHeights.CASES;
    productHeights=heights;
    const nextSignature=JSON.stringify([next,revised],(key,value)=>key==='zoneId'?undefined:value);
    const nextRepresentative=Number.isFinite(source?.seed)?source:null;
    const sameCase=next===key&&nextSignature===signature;
    if(sameCase&&nextRepresentative?.round===representative?.round&&nextRepresentative?.seed===representative?.seed){
      save=saveRecord;if(heightChanged&&camera.fit)fit();else draw();return;
    }
    if(sameCase&&defaultRun)switchSource(false);
    representative=nextRepresentative;
    if(sameCase){save=saveRecord;syncControls();draw();return;}
    cancelFrame();defaultRun=null;el('source').value='independent';
    save=saveRecord;signature=nextSignature;
    key=next;seed=config.seed??1;shiftHours=hours;definitions=revised;
    const defaultLimit=config.durationSeconds>0?config.durationSeconds:3600;
    limitSeconds=stored?.limitSeconds>0&&Number.isFinite(stored.limitSeconds)?stored.limitSeconds:defaultLimit;
    el('limit').value=limitSeconds/60;
    el('speed').value=String(stored?.speed??1);
    if(!el('speed').value)el('speed').value='1';
    if(newView){endDrag();viewKey=nextView;camera.fit=true;}
    reset();
    if(model&&stored?.version===1&&stored.signature===signature&&stored.checkpoint){
      model=STSimulation2DEngine.create(definitions,seed,stored.checkpoint);
      shiftOutput=Array.isArray(stored.shiftOutput)?[...stored.shiftOutput]:[];
      runState=model.time>=limitSeconds-1e-8?'Completed':stored.runState==='Stopped'?'Stopped':'Paused';
      syncControls();if(camera.fit)fit();else draw();
    }
    if(newView&&camera.scale<sceneScale){camera={scale:sceneScale,x:28,y:Math.max(sceneTop()+18,canvas.clientHeight/2-80),fit:false};syncZoom();draw();}
  }};
})();
</script>
