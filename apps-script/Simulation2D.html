<style>
#simulation2d-canvas { display:block; width:100%; height:clamp(420px,57vh,690px); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); cursor:grab; touch-action:none; }
#simulation2d-canvas:active { cursor:grabbing; }
#simulation2d-canvas { background-color:var(--surface); background-image:radial-gradient(var(--line) 1px,transparent 1px); background-size:18px 18px; }
.simulation2d-metrics { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:var(--space-3) 0; }
.simulation2d-metrics > div { flex:1 1 8rem; padding:var(--space-2) var(--space-3); border:1px solid var(--line); border-radius:var(--radius-md); }
.simulation2d-metrics dt { color:var(--muted); font-size:var(--font-secondary); }
.simulation2d-metrics dd { margin:0; font-weight:var(--weight-semibold); font-variant-numeric:tabular-nums; }
#simulation2d-panel > .fold-card { container-type:inline-size; }
#simulation2d-settings { margin-bottom:var(--space-3); }
#simulation2d-results.simulation2d-fullscreen {
  position:fixed; inset:0; z-index:1000; margin:0; max-width:none;
  border-radius:0; background:var(--surface); overflow:auto;
  display:flex; flex-direction:column;
}
.simulation2d-fullscreen #simulation2d-content {
  flex:1; min-height:22rem; display:flex; flex-direction:column;
}
.simulation2d-fullscreen .simulation2d-diagram { flex:1; display:flex; }
.simulation2d-fullscreen #simulation2d-canvas { flex:1; min-height:12rem; height:auto; }
.simulation2d-diagram { position:relative; overflow:hidden; }
#simulation2d-machine-controls { position:absolute; inset:0; pointer-events:none; }
.simulation2d-machine-actions { position:absolute; display:flex; gap:2px; pointer-events:auto; transform:translate(-50%,-50%); }
.simulation2d-machine-actions[hidden] { display:none; }
.simulation2d-machine-actions .icon-button { width:26px; height:22px; min-width:0; min-height:0; padding:3px; }

.simulation2d-analysis-action { position:absolute; pointer-events:auto; transform:translateY(-50%); transform-origin:left center; white-space:nowrap; background:none; color:var(--ink); border:0; border-radius:0; padding:0; min-width:0; min-height:0; line-height:1; text-decoration:none; cursor:pointer; }
.simulation2d-analysis-action:hover { background:none; }
.simulation2d-analysis-action[hidden] { display:none; }
#simulation2d-events-panel { margin-bottom:var(--space-3); }
#simulation2d-events-panel[hidden] { display:none; }
#simulation2d-event-editor > .fold-card { margin:0; }
.simulation2d-options { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2) var(--space-3); }
.simulation2d-source { display:inline-flex; align-items:center; gap:var(--space-2); font-size:var(--font-secondary); white-space:nowrap; max-width:100%; }
.simulation2d-source select { width:auto; min-width:0; }
.simulation2d-source input[type=checkbox] { width:auto; margin:0; }
#simulation2d-panel .fold-tools { flex-wrap:nowrap; align-items:center; max-width:100%; min-width:0; gap:var(--space-1); }
#simulation2d-panel .fold-tools > * { flex:0 0 auto; margin:0; }
#simulation2d-speed { width:max-content; min-width:0; padding-inline:6px 20px; background-position:right 4px center; background-size:13px; }
.simulation2d-limit { display:inline-flex; align-items:center; gap:2px; color:var(--ink); font-size:var(--font-secondary); white-space:nowrap; }
#simulation2d-limit { width:7ch; min-width:7ch; padding-inline:4px; appearance:textfield; font-variant-numeric:tabular-nums; }
#simulation2d-limit::-webkit-inner-spin-button { appearance:none; margin:0; }
#simulation2d-zoom { width:96px; min-width:0; padding:0; accent-color:var(--accent); }
#simulation2d-zoom-value { width:5ch; text-align:end; color:var(--ink); font-size:var(--font-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
@container (max-width:450px) {
  #simulation2d-panel .fold-tools { gap:2px; }
  #simulation2d-panel .fold-tools .icon-button { width:28px; padding-inline:4px; }
  #simulation2d-zoom { width:48px; }
  #simulation2d-zoom-value { font-size:11px; }

}
#simulation2d-legend { display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-4); margin-block:var(--space-2); }

#simulation2d-legend .run { --lamp:var(--running); }
#simulation2d-legend .starved { --lamp:var(--starved); }
#simulation2d-legend .blocked { --lamp:var(--blocked); }
#simulation2d-legend .info { --lamp:var(--info); }
#simulation2d-legend .failure { --lamp:var(--failure); }
#simulation2d-legend .stop { --lamp:var(--muted); }
</style>
<script>
window.STSimulation2D=(function(){
  const el=id=>document.getElementById('simulation2d-'+id);
  const canvas=el('canvas'),panel=el('panel');
  const tableScale=.75*.75;
  const step=1/120,sceneScale=.09,cardWidth=226*tableScale,cardGap=24,telemetryGap=6*tableScale,machineScale=3.75;
  const telemetryCardHeight=(53+16*18)*tableScale,telemetryRowHeight=18*tableScale;
  const telemetryColumns=[[84,99,38],[94,50,23],[128,50,54],[145,62,22]].map(columns=>columns.map(width=>width*tableScale));
  const telemetryTopGap=25.5,telemetryPadding=7*tableScale,telemetryColumnGap=5*tableScale;
  const parameterValueGap=telemetryColumnGap*.9,telemetryFont=12*tableScale+'px system-ui';
  const telemetryWidths=telemetryColumns.map(columns=>
    columns.reduce((sum,width)=>sum+width,0)+2*telemetryPadding+parameterValueGap+telemetryColumnGap);
  const telemetryPairWidth=telemetryWidths[0]+telemetryWidths[1]+telemetryGap;
  const telemetryGroupWidth=telemetryPairWidth+telemetryWidths[2]+telemetryGap;
  const conveyorGroupWidth=telemetryPairWidth+telemetryWidths[3]+telemetryGap;
  const machineHeight=540*sceneScale*machineScale,beltDepth=7.5,beltInset=1.5;
  let shiftHours=8,shiftOutput=[],limitSeconds=3600,save,signature,lastSave=0;
  let seed=1,key,viewKey,definitions=[],model=null,frame,previous=0,lag=0,drag,validation='',runState='Ready',lastMetrics=-Infinity;
  let representative=null,defaultRun=null,palletAnimation=null;
  let productHeights={},machineTypes=new Map(),bottleStages=new Map(),conveyorDimensions=new Map();
  const dimensionRowHeight=32,dimensionLevels=3,dimensionOffset=126;
  let dimensionPointer=null;
  const verdictHitBoxes=[];
  const bottleStageNames=['Empty','Labeled','Filled','Filled + labeled'];
  const machineStyle=el('machine-style'),reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  machineStyle.value=window.STPreferences?.read('simulation2dMachineStyle')==='animated'?'animated':'blocks';
  machineStyle.addEventListener('change',()=>{
    window.STPreferences?.write('simulation2dMachineStyle',machineStyle.value);
    if(camera.fit)fit();else draw();
  });
  const showDimensions=el('dimensions');
  showDimensions.checked=window.STPreferences?.read('simulation2dDimensions')==='yes';
  showDimensions.addEventListener('change',()=>{
    window.STPreferences?.write('simulation2dDimensions',showDimensions.checked?'yes':'no');
    dimensionPointer=null;
    draw();
  });
  let camera={scale:1,x:0,y:0,fit:true};
  function num(value){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—';}
  function failuresFor(item,config){
    const split=item.processData?.equipment?.stopInputs;
    const profiles=split?Object.entries(split):[['general',item.noiseProfile?.reliability]];
    return profiles.filter(([key,profile])=>config.reliabilityCategories?.[key]!==false
      &&Number.isFinite(profile?.mtbfMinutes)&&profile.mtbfMinutes>0
      &&Number.isFinite(profile.mttrMinutes)&&profile.mttrMinutes>0)
      .map(([,profile])=>({rate:1/(profile.mtbfMinutes*60),repairSeconds:profile.mttrMinutes*60}));
  }
  let schedule={},scheduleError='';
  const scheduleOptions={failures:el('failures'),events:el('use-events'),calendar:el('use-calendar')};
  const scheduleSettings=()=>Object.fromEntries(Object.entries(scheduleOptions).map(([key,input])=>[key,input.checked]));
  const machineControls=new Map(),analysisButtons=new Map();
  let conveyorWorksheets=new Map();
  function resolveSchedule(config){
    const engine=window.SimulatorEngine;
    const calendar=config.plantCalendar;
    const manual=(config.plannedStops||[]).filter(event=>event.source!=='PLANT_CALENDAR');
    const generated=engine.plantCalendarSchedule?.(calendar,step);
    const calendarStops=(generated?.events||[]).map(event=>({...event,restartPolicy:generated.restartPolicy,fromCalendar:true}));
    const stops=manual.length||calendarStops.length
      ?engine.resolvePlannedStops({tickSeconds:step,plannedStops:[...manual,...calendarStops]}).events:[];
    const commands=[...(config.commands||[])].sort((a,b)=>a.atVirtualSecond-b.atVirtualSecond);
    return {commands,stops};
  }
  function configureModel(){
    model?.configure?.(scheduleSettings());
  }
  function rebuildMachineControls(){
    const target=el('machine-controls');
    target.replaceChildren();machineControls.clear();analysisButtons.clear();
    window.STConveyorAnalysis.close();
    const actions=[['RUN','play','Start / resume'],['PAUSE','pause','Pause'],['STOP','stop','Stop'],
      ['EMERGENCY_STOP','error','Emergency stop'],['RESET','refresh','Reset emergency stop']];
    for(const item of definitions){
      if(item.kind==='belt'){
        const button=document.createElement('button');
        button.type='button';button.className='simulation2d-analysis-action';
        button.textContent='Conveyor Geometry';
        button.style.font='600 '+telemetryFont;
        button.title='Open conveyor analysis';
        button.setAttribute('aria-label','Conveyor Geometry · '+item.name);
        button.setAttribute('aria-haspopup','dialog');
        button.setAttribute('aria-controls','conveyor-analysis-dialog');
        button.onclick=()=>window.STConveyorAnalysis.open(item.name,conveyorWorksheets.get(item.id));
        target.append(button);analysisButtons.set(item.id,button);
        continue;
      }
      const group=document.createElement('div');
      group.className='simulation2d-machine-actions';
      group.setAttribute('role','group');
      group.setAttribute('aria-label',item.name+' controls');
      const buttons=new Map();
      for(const [action,icon,label] of actions){
        const button=document.createElement('button');
        button.type='button';button.className='secondary icon-button';
        button.title=label+' · '+item.name;
        button.setAttribute('aria-label',button.title);
        if(window.STIcons)button.innerHTML=window.STIcons.svg(icon);
        else button.textContent=label;
        button.onclick=()=>{
          model?.control?.(item.id,action);
          status();draw();checkpoint();
        };
        buttons.set(action,button);group.append(button);
      }
      target.append(group);machineControls.set(item.id,{group,buttons});
    }
  }
  function dimensionRows({lact,lp,prime,discharge,coding,runout,overflow,lbu,lba,recovery,point,minimumLength,status,statusReason}){
    return {runout,backup:lbu,prime,status,statusReason,minimumLength,minimumPartial:recovery.partial,recovery:point,rows:[
      {tier:0,label:'Discharge',start:0,value:discharge},
      {tier:0,label:'Coding',start:discharge,value:coding},
      {tier:0,label:'Overflow',start:runout,value:overflow.value,partial:overflow.partial},
      {tier:0,label:'Lrec',start:recovery.value>0?point:prime,end:prime,value:recovery.value,partial:recovery.partial,deficit:recovery.value<0},
      {tier:0,label:'Lp',start:prime,value:lp},
      {tier:1,label:'Lbu',start:0,value:lbu,partial:overflow.partial},
      {tier:1,label:'Accumulation Zone (Lba)',start:lbu,value:lba,partial:overflow.partial},
      {tier:2,label:'Lact',start:0,value:lact}
    ]};
  }
  function prepare(equipment,format,config,formats){
    const geometry=window.SimulatorEngine;
    const packSize=format?geometry.productPackSize(format):null;
    const {models:configured,zones,designProfiles}=window.STConveyorAnalysis.resolveProfiles(equipment,format,formats);
    conveyorDimensions=new Map();
    conveyorWorksheets=new Map();
    return configured.map((item,index)=>{
      const data=item.processData||{};
      const unit=data.flowUnits?.output==='CASES'||String(item.unitOfFlow).toUpperCase()==='CASES'?'CASES':'BOTTLES';
      if(item.type!=='CONVEYOR'){
        const batch=unit==='CASES'&&data.flowUnits?.input==='BOTTLES'
          ? (format?geometry.productPackSize(format):NaN) : 1;
        const inputBottleFactor=data.flowUnits?.input==='CASES'&&packSize>0?packSize:1;
        const bottlesPerUnit=unit==='BOTTLES'?1:packSize;
        const capacityBottles=(data.equipment?.internalCapacityBottles??Math.max(30,batch))*inputBottleFactor;
        const maximum=data.equipment?.maximumSpeedBpm;
        const designSpeedPerSecond=maximum>0?maximum/60:item.nominalRatePerSecond;
        const rate=Math.min(item.nominalRatePerSecond,designSpeedPerSecond);
        const residenceSeconds=capacityBottles/(rate*bottlesPerUnit);
        return {capacityBottles,residenceSeconds,inputBottleFactor,inputUnit:data.flowUnits?.input||'BOTTLES',id:item.id,name:item.name||item.id,
          kind:'machine',unit,length:1100,rate,bottlesPerUnit,designSpeedPerSecond,
          rampSeconds:item.restartRampUpSeconds??data.downstream?.rampUpTimeSeconds??0,
          primeRampSeconds:zones[index-1]?.primeSensorPositionMm!=null?zones[index-1].downstreamRampUpSeconds:undefined,
          rampAfterRepair:data.downstream?.rampAfterRepair===true,failures:failuresFor(item,config),
          startDelay:item.startupDelaySeconds??data.upstream?.startupTimeSeconds??0,batch};
      }
      const zone=zones[index]||{};
      const worksheet={zone,data,designProfiles,index};
      conveyorDimensions.set(item.id,dimensionRows(window.STConveyorAnalysis.calculate(worksheet).geometry));
      conveyorWorksheets.set(item.id,worksheet);
      const presentation=format?geometry.productPresentation(format,unit):{};
      return {id:item.id,name:item.name||item.id,kind:'belt',unit,bottlesPerUnit:unit==='BOTTLES'?1:packSize,
        zoneId:zone.id,length:zone.usableLengthMm,speed:zone.conveyorSpeedMmPerSecond,beltWidth:data.accumulation?.conveyorWidthMm??null,
        packageLength:zone.productLengthMm??presentation.lengthMm,
        packageWidth:presentation.widthMm??data.upstream?.packageWidthMm??null,
        pitch:zone.productPitchMm,packedGap:Math.max(0,(zone.accumulatedPitchMm??zone.productLengthMm)-zone.productLengthMm)||0,
        prime:zone.primeSensorPositionMm??null,backup:zone.backupSensorPositionMm??null,
        configuredBackupRelease:zone.backupRestartPositionMm,
        blockDelay:zone.blockedTimeDelaySeconds??.5,clearDelay:zone.clearTimeDelaySeconds??.5,
        responseDelay:zone.upstreamStopResponseSeconds??0,residual:Math.max(0,Math.floor(zone.bottlesDischargedAtStop??0))};
    });
  }
  function validate(){
    if(!definitions.length)return 'Add equipment in Equipment to start.';
    if(definitions[0].kind==='belt'||definitions.at(-1).kind==='belt'||definitions.some((item,index)=>item.kind==='belt'&&definitions[index-1]?.kind==='belt'))
      return 'This 2D model requires a machine at each end and at most one conveyor between two machines.';
    for(const item of definitions){
      if(item.kind==='machine'){
        if(!(item.rate>0)||!Number.isInteger(item.batch)||item.batch<1)return item.name+': check nominal rate and bottles per case.';
        const minimum=item.batch*item.inputBottleFactor;
        if(!Number.isSafeInteger(item.capacityBottles)||item.capacityBottles<minimum)
          return item.name+': set Internal capacity to at least '+num(minimum/item.inputBottleFactor)+' '+(item.inputUnit==='CASES'?'cases':'bottles')+' in Equipment.';
        if(!Number.isFinite(item.residenceSeconds)||item.residenceSeconds<0)
          return item.name+': check nominal speed and the bottle equivalent of the active format.';
        continue;
      }
      const missing=[['conveyor length',item.length],['belt speed',item.speed],['product length',item.packageLength],['moving pitch',item.pitch]]
        .filter(([,value])=>!Number.isFinite(value)||value<=0).map(([label])=>label);
      if(missing.length)return item.name+': '+missing.join(', ')+' required in the case. Check Equipment and Formats.';
      if(item.beltWidth!==null&&(!(item.beltWidth>0)||(item.packageWidth>0&&item.beltWidth<item.packageWidth)))return item.name+': conveyor width must accommodate the product width.';
      if(item.length<item.packageLength||item.pitch<item.packageLength+item.packedGap)return item.name+': check conveyor length and package pitch.';
      if([item.prime,item.backup].some(value=>value!==null&&(!Number.isFinite(value)||value<0||value>item.length)))
        return item.name+': sensor positions must be within the conveyor length.';
    }
    return '';
  }
  function shiftIndex(seconds){return Math.floor((seconds+1e-7)/(shiftHours*3600));}
  function syncZoom(){
    const slider=el('zoom'),ratio=camera.scale/sceneScale;
    slider.value=Math.log2(ratio);
    const percent=(ratio>=.01?Math.round(ratio*100):num(ratio*100))+'%';
    slider.setAttribute('aria-valuetext',percent);
    el('zoom-value').textContent=percent;
  }
  function machineDesign(item){
    return item.kind==='machine'&&machineStyle.value==='animated'
      ? window.STSimulation2DMachines?.dimensions(machineTypes.get(item.id)) : null;
  }
  function displayWidth(item){
    return Math.max(0,item.length||0)*sceneScale*(item.kind==='machine'?machineScale*(machineDesign(item)?.width??1):1);
  }
  function displayHeight(item){return machineHeight*(machineDesign(item)?.height??1);}
  function tallestMachine(){
    return Math.max(0,...definitions.filter(item=>item.kind==='machine').map(displayHeight));
  }
  function sceneHalfHeight(){
    return Math.max(tallestMachine()/2,0,...definitions.filter(item=>item.kind==='belt').map(beltHalfHeight));
  }
  function sceneTop(){
    const half=sceneHalfHeight();
    if(!conveyorDimensions.size)return half+26;
    return half+dimensionOffset+dimensionLevels*dimensionRowHeight;
  }
  function equipmentLayout(line){
    let right=0,previous;
    const items=line.map(item=>{
      const width=displayWidth(item);
      const telemetryWidth=item.kind==='belt'?conveyorGroupWidth:telemetryGroupWidth;
      const center=previous
        ? Math.max(right+width/2,previous.center+(previous.telemetryWidth+telemetryWidth)/2+cardGap)
        : Math.max(width,telemetryWidth)/2;
      right=center+width/2;
      previous={left:center-width/2,center,width,telemetryWidth};
      return previous;
    });
    return {items,right};
  }
  function caseDimensions(line,index){
    const upstream=line.slice(0,index).reverse().find(item=>item.kind==='belt'&&item.unit==='CASES');
    const width=(upstream?.packageLength||300)*sceneScale;
    return {caseWidth:width,caseHeight:upstream?productHeight(upstream):(productHeights.CASES||225)*sceneScale};
  }
  function productionLayout(line,items,right){
    const last=items.at(-1);
    const start=last?Math.max(right,last.center+last.telemetryWidth/2)+cardGap:0;
    const palletizer=line.at(-1);
    const pallets=machineTypes.get(palletizer?.id)==='PALLETIZER'&&palletizer.unit==='CASES';
    const dimensions=caseDimensions(line,line.length-1);
    const palletWidth=3*dimensions.caseWidth+12;
    const stagingWidth=100+3*palletWidth+40;
    const production=pallets?start+100+(3*palletWidth+40-cardWidth)/2:start;
    // Keep the whole production table above the tallest loaded pallet.
    const productionY=pallets?90-4*dimensions.caseHeight-Math.max(cardGap,80)-productionHeight():-40;
    return {start,pallets,production,productionY,right:pallets?start+stagingWidth:start+cardWidth,...dimensions};
  }
  function palletTransfer(item){
    const time=model?.time??0,produced=item.produced||0;
    if(palletAnimation?.model!==model||time<palletAnimation.time){
      palletAnimation={model,time,settled:produced,started:null,duration:1,batch:0,picked:false};
    }
    const animation=palletAnimation;
    animation.time=time;
    if(reducedMotion?.matches){
      animation.settled=produced;animation.started=null;
      return {produced,progress:1,batch:1,waiting:0};
    }
    // Stage motion is symbolic. Keep readable physical travel times even at high throughput;
    // production counters and the simulation's configured machine rate remain independent.
    const cycleDuration=()=>Math.max(animation.settled%12>=9?24:8,1/Math.max(.001,item.rate||.001));
    function pick(){
      if(!animation.picked){
        animation.batch=Math.min(3,12-animation.settled%12,produced-animation.settled);
        animation.picked=true;
      }
    }
    while(animation.started!==null&&time-animation.started+1e-8>=animation.duration){
      pick();
      animation.started+=animation.duration;
      animation.settled+=animation.batch;
      animation.batch=0;animation.picked=false;
      if(animation.settled>=produced)animation.started=null;
      else animation.duration=cycleDuration();
    }
    if(animation.started===null&&produced>animation.settled){
      animation.started=time;
      animation.duration=cycleDuration();
      animation.batch=0;animation.picked=false;
    }
    const progress=animation.started===null?1:Math.min(1,Math.max(0,(time-animation.started)/animation.duration));
    if(animation.started!==null&&progress>=.04)pick();
    const batch=animation.picked?animation.batch:Math.min(3,12-animation.settled%12,produced-animation.settled);
    const result={produced:animation.started===null?produced:animation.settled+batch,progress,
      batch:Math.max(1,batch),waiting:Math.max(0,produced-animation.settled-(animation.picked?animation.batch:0))};
    const group=Math.floor((result.produced-1)/12),index=(result.produced-1)%12;
    if(group>=2&&index>=9){
      if(animation.forkGroup!==group&&(!Number.isFinite(animation.forkStarted)||time-animation.forkStarted>=animation.forkPeriod)){
        animation.forkGroup=group;
        // Travel takes at least 18 simulation seconds, independently of robot throughput.
        animation.forkPeriod=Math.max(18,2.3/Math.max(.001,item.rate||.001));
        animation.forkStarted=time;
      }
    }
    if(Number.isFinite(animation.forkStarted)){
      result.forkProgress=Math.max(0,Math.min(1,(time-animation.forkStarted)/animation.forkPeriod));
      result.forkGroup=animation.forkGroup;
    }
    return result;
  }
  function palletInfeed(line,items,y,transfer){
    const index=line.length-1,item=line[index],layout=items[index];
    const upstream=line[index-1],entry=items[index-1];
    const {caseWidth,caseHeight}=caseDimensions(line,index);
    const pickup=layout.left+layout.width-caseWidth;
    const start=upstream?.kind==='belt'?entry.left+entry.width-caseWidth:layout.left;
    const startBottom=upstream?.kind==='belt'?y+productHeight(upstream)-beltHalfHeight(upstream):y;
    const cases=(item.resident||[]).map(ready=>{
      const progress=Math.max(0,Math.min(1,1-(ready-item.residenceClock)/Math.max(step,item.residenceSeconds)));
      return {left:start+(pickup-start)*progress,top:startBottom+(y-startBottom)*progress-caseHeight};
    });
    // Processed cases remain at pickup until the visual robot actually takes them.
    // Coincident cases intentionally share a silhouette, without growing the drawing workload.
    if(transfer?.waiting>0)cases.push({left:pickup,top:y-caseHeight,waiting:transfer.waiting});
    return {start,startBottom,pickup,caseWidth,caseHeight,cases,waiting:transfer?.waiting||0};
