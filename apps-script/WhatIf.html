<script>
window.STWhatIf = (function() {
  function node(tag,text,className){var element=document.createElement(tag);element.textContent=text||'';if(className)element.className=className;return element;}
  function label(key){return window.STScenarioText[key]||key;}
  function card(project,create,equipment,simulation){
    var item=node('article','','analysis-recommendation');
    item.append(node('span',label(project.tier),'analysis-capex'),node('span',label(project.basis),'badge'),node('h4',project.title||label(project.titleKey)));
    item.querySelector('.analysis-capex').dataset.tier=project.tier;
    if(project.description)item.append(node('p',project.description,'chart-note'));
    if(project.evidence){var detail=node('details','','analysis-checks');detail.append(node('summary',__ST_TEXT__('scenario.evidence')));Object.entries(project.evidence).forEach(function(pair){if(pair[1]!=null)detail.append(node('p',label(pair[0])+': '+pair[1]));});item.append(detail);}
    STScenarioExplorer.attach(item,project,create,simulation||{id:project.sourceSimulationId,equipment:equipment||[],dynamicConfig:{}});
    return item;
  }
  function render(simulation,target,create){
    var plan=STScenarios.plan(simulation);target.textContent='';if(simulation.results?.batch)target.appendChild(node('p',__ST_TEXT__('batch.evidence'),'notice'));var grid=node('div','','scenario-grid');
    var proposals=visibleProjects(plan);proposals.forEach(function(p){grid.appendChild(card(p,create,simulation.equipment,simulation));});target.appendChild(grid);STScenarioExplorer.tools(target,simulation,plan,create);
    if(!proposals.length)target.appendChild(node('p',__ST_TEXT__('scenario.no_supported'),'empty'));
    STReports.bindWhatIf(simulation,plan,proposals);
    var checks=node('details','','analysis-checks');checks.appendChild(node('summary',__ST_TEXT__('scenario.design_checks')));
    checks.appendChild(node('p',__ST_TEXT__('scenario.basis_note'),'chart-note'));
    var list=node('ul');plan.checks.forEach(function(check){list.appendChild(node('li',(check.equipmentId?check.equipmentId+' · ':'')+label(check.rule)+': '+label(check.status)+(check.coverage!=null?' ('+check.coverage.toFixed(2)+'× MTTR)':'')));});checks.appendChild(list);target.appendChild(checks);
  }
  function visibleProjects(plan){return (plan.candidates||plan.projects).filter(function(p){return p.changes?.length&&p.disabledReason!=='SCENARIO_INSUFFICIENT_EVIDENCE';});}
  function changeInfo(change,equipment){
    var field=fields[change.path],unit=change.unit||field?.[2]||'',equipmentName=(equipment||[]).find(function(e){return e.id===change.equipmentId;})?.name||change.equipmentId;
    function value(v){return (v==null?__ST_TEXT__('scenario.not_set'):String(v))+(unit?' '+unit:'');}
    return {equipment:equipmentName,parameter:field?.[0]||change.path,before:value(change.before),after:value(change.after),explanation:field?.[1]||__ST_TEXT__('scenario.review_field')};
  }
  var fields={
    'noiseProfile.reliability.mtbfMinutes':['MTBF','External reliability intervention','min'],
    'noiseProfile.reliability.mttrMinutes':['MTTR','External repair intervention','min'],
    'processData.accumulation.conveyorSpeedMmPerSecond':['Conveyor speed','Physical belt speed','mm/s'],
    'processData.accumulation.conveyorSpeedFactorPercent':[__ST_TEXT__('client.conveyor_speed_factor'),__ST_TEXT__('scenario.explain_speed'),'%'],
    'processData.accumulation.blockedTimeDelaySeconds':[__ST_TEXT__('client.back_up_blocked_delay_s'),__ST_TEXT__('scenario.explain_blocked'),'s'],
    'processData.accumulation.clearTimeDelaySeconds':[__ST_TEXT__('client.back_up_clear_delay_s'),__ST_TEXT__('scenario.explain_clear'),'s'],
    'processData.accumulation.backupSensorPositionMm':[__ST_TEXT__('client.installed_back_up_position_mm'),__ST_TEXT__('scenario.explain_backup'),'mm'],
    'processData.geometry.lactMm':[__ST_TEXT__('client.installed_length_l_act_mm'),__ST_TEXT__('scenario.explain_length'),'mm'],
    'processData.geometry.lpPrimeMm':[__ST_TEXT__('client.prime_reserve_l_p_mm'),__ST_TEXT__('scenario.explain_prime'),'mm'],
    'processData.accumulation.downstreamRampUpSeconds':[__ST_TEXT__('client.downstream_ramp_up_s'),__ST_TEXT__('scenario.explain_ramp'),'s'],
    'processData.upstream.startupTimeSeconds':[__ST_TEXT__('sheetimportmerge.startup_time_s'),__ST_TEXT__('scenario.explain_startup'),'s']
  };
  return {render:render,card:card,visibleProjects:visibleProjects,changeInfo:changeInfo};
})();
window.STScenarioText = {
  ZERO:__ST_TEXT__('scenario.zero'),MEDIUM:__ST_TEXT__('scenario.medium'),HIGH:__ST_TEXT__('scenario.high'),
  STATIC:__ST_TEXT__('scenario.static'),DYNAMIC:__ST_TEXT__('scenario.dynamic'),HYBRID:__ST_TEXT__('scenario.hybrid'),
  'scenario.speed_balance':__ST_TEXT__('scenario.speed_balance'),'scenario.sensor_debounce':__ST_TEXT__('scenario.sensor_debounce'),
  'scenario.buffer_recovery':__ST_TEXT__('scenario.buffer_recovery'),'scenario.no_proposal':__ST_TEXT__('scenario.no_proposal'),
  SCENARIO_INSUFFICIENT_EVIDENCE:__ST_TEXT__('scenario.insufficient'),SCENARIO_INVALID_PHYSICS:__ST_TEXT__('scenario.invalid_physics'),SCENARIO_AUDIT_REGRESSION:__ST_TEXT__('scenario.regression'),
  TURN_TRAP_AND_FILLED_DIAMETER:__ST_TEXT__('scenario.turn_diameter'),PACEMAKER_DESIRED_STATE_AND_V_GRAPH:__ST_TEXT__('scenario.desired_state'),
  ACCUMULATION_1_TO_2_MTTR:__ST_TEXT__('scenario.coverage'),MAJOR_FAILURE_OUTSIDE_MICROSTOP_BUFFER_TARGET:__ST_TEXT__('scenario.major_failure'),
  NOT_EVALUATED:__ST_TEXT__('scenario.not_evaluated'),REVIEW:__ST_TEXT__('scenario.review'),
  pulseSeconds:__ST_TEXT__('scenario.pulse'),gapSeconds:__ST_TEXT__('scenario.gap'),recoveryLengthMm:__ST_TEXT__('scenario.recovery'),requiredOverflowMm:__ST_TEXT__('scenario.overflow'),addedLengthMm:__ST_TEXT__('scenario.added_length'),
  coverage:__ST_TEXT__('scenario.coverage'),failureSeconds:__ST_TEXT__('scenario.failure'),intrinsicAvailabilityPercent:__ST_TEXT__('scenario.availability'),recommendedSpeedMmPerSecond:__ST_TEXT__('scenario.speed'),
  overflowUnits:__ST_TEXT__('scenario.overflow_units')
};
</script>
