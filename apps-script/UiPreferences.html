<script>
// Browser preferences only. Google identity is ALWAYS verified by the server.
window.STPreferences = (function() {
  var key = 'st.ui.v1.',caseProvider,caseChanged;
  function read(name) { try { return localStorage.getItem(key + name); } catch (_) { return null; } }
  function write(name, value) {
    try { if (value === null) localStorage.removeItem(key + name); else localStorage.setItem(key + name, value); return true; }
    catch (_) { return false; }
  }
  if (read('remember') === 'yes') document.documentElement.classList.add('restoring-session');
  var theme = read('theme') || STThemeResources.defaultTheme || 'auto', automaticTimer;
  function automaticThemeAt(date) {
    var schedule = STThemeResources.automaticTheme || {lightStartHour:7,darkStartHour:19};
    var hour = date.getHours();
    return hour >= schedule.lightStartHour && hour < schedule.darkStartHour ? 'light' : 'dark';
  }
  function scheduleAutomaticTheme() {
    clearTimeout(automaticTimer);
    if (theme !== 'auto') return;
    var now = new Date(), schedule = STThemeResources.automaticTheme || {lightStartHour:7,darkStartHour:19};
    var delays = [schedule.lightStartHour, schedule.darkStartHour].map(function(hour) {
      var boundary = new Date(now);boundary.setHours(hour,0,0,0);
      if (boundary <= now) boundary.setDate(boundary.getDate()+1);
      return boundary.getTime()-now.getTime();
    });
    automaticTimer = setTimeout(apply, Math.min.apply(null,delays)+50);
  }
  var colors=Object.keys(STThemeResources.palettes);
  function resolveInterfaceMode(fallback){var value=read('interfaceMode')||fallback;return ['ADVANCE','ADVANCED'].includes(String(value||'').trim().toUpperCase())?'ADVANCE':'BASIC';}
  function applyPalette(){
    document.querySelectorAll('.accent-choice').forEach(function(button){
      var entry=STThemeResources.palettes[button.dataset.accent];
      if(!entry)return;
      button.title=entry.name;button.setAttribute('aria-label',entry.name+' primary color');
      button.classList.remove('hidden');
    });
  }
  function setAccent(value){value=STThemeResources.legacyAccents?.[value]||value;if(!colors.includes(value))value=colors.includes(STThemeResources.defaultAccent)?STThemeResources.defaultAccent:colors[0];document.documentElement.dataset.accent=value;write('accent',value);applyAccent();document.querySelectorAll('.accent-choice').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.accent===value));});window.dispatchEvent(new Event('st:theme'));}
  setAccent(read('accent'));
  function applyAccent(){var p=STThemeResources.palettes[document.documentElement.dataset.accent];if(!p)return;var c=p[document.documentElement.dataset.theme==='dark'?'dark':'light'],style=document.documentElement.style;Object.entries({'--accent':c.accent,'--accent-hover':c.accent,'--accent-soft':c.soft,'--selected':c.soft,'--selected-text':c.text||c.accent,'--on-accent':c.onAccent}).forEach(function(pair){style.setProperty(pair[0],pair[1]);});}
  function apply() {
    document.documentElement.dataset.theme = theme === 'auto' ? automaticThemeAt(new Date()) : theme;
    scheduleAutomaticTheme();
    applyAccent();window.dispatchEvent(new Event('st:theme'));
  }
  function setTheme(value) {
    theme = ['auto', 'light', 'dark'].indexOf(value) >= 0 ? value : 'auto';
    write('theme', theme); apply();
    document.querySelectorAll('[data-theme-picker]').forEach(function(select) { select.value = theme; });
  }
  function fontMode(){return document.documentElement.dataset.uiMode==='basic'?'basic':'advance';}
  function setFontScale(value,persist){value=Number(value);if(![80,90,100,110,125].includes(value))value=fontMode()==='basic'?110:100;if(persist!==false)write('fontScale.'+fontMode(),String(value));document.documentElement.style.fontSize=(16*value/100)+'px';var picker=document.getElementById('settings-font-scale');if(picker)picker.value=String(value);}
  function applyFontScale(){var value=read('fontScale.'+fontMode())||read('fontScale')||(fontMode()==='basic'?110:100);setFontScale(value,false);}
  applyFontScale();
  window.addEventListener('focus', apply);
  document.addEventListener('visibilitychange', function(){if(!document.hidden)apply();});
  apply();
  function caseOptions() {
    var saved=caseProvider?.()?.metadata?.consoleOptions||{};
    var seconds=Number(saved.autosaveSeconds??read('autosaveSeconds')??10);
    return {autosaveEnabled:typeof saved.autosaveEnabled==='boolean'?saved.autosaveEnabled:read('autosaveEnabled')==='yes',
      autosaveSeconds:Number.isInteger(seconds)&&seconds>=1&&seconds<=3600?seconds:10,
      seedPolicy:(saved.seedPolicy??read('seedPolicy'))==='FIXED'?'FIXED':'RANDOM'};
  }
  function setCaseOptions(value) {
    var record=caseProvider?.();if(!record)return false;
    record.metadata=record.metadata||{};
    var previous=record.metadata.consoleOptions;
    if(JSON.stringify(previous)===JSON.stringify(value))return true;
    record.metadata.consoleOptions=Object.assign({},value);
    window.dispatchEvent(new Event('st-save-policy-change'));
    caseChanged?.();return true;
  }
  function initializeCaseOptions() {
    var record=caseProvider?.();if(!record)return;
    record.metadata=record.metadata||{};
    // Migrate browser defaults into the draft; persist on the next user save.
    if(!record.metadata.consoleOptions)record.metadata.consoleOptions=caseOptions();
    if(typeof record.metadata.includeDOE!=='boolean')record.metadata.includeDOE=read('scenarioDoe')==='yes';
  }
  function applyJsonFields(mode) {
    mode=mode==='basic'?'basic':'advance';
    var record=caseProvider?.(),stored=read('jsonFields.'+mode),visible=mode==='advance'&&(typeof record?.metadata?.showJsonFields==='boolean'?record.metadata.showJsonFields:stored===null?true:stored==='yes');
    document.documentElement.dataset.showJson=String(visible);
    var checkbox=document.getElementById('settings-json-fields');if(checkbox){checkbox.checked=visible;checkbox.disabled=!record||mode!=='advance';checkbox.closest('label').hidden=!record||mode!=='advance';}
  }
  document.addEventListener('DOMContentLoaded', function() {
    applyFontScale();
    document.getElementById('settings-font-scale')?.addEventListener('change',function(event){setFontScale(event.target.value);window.dispatchEvent(new Event('resize'));});
    applyJsonFields(document.documentElement.dataset.uiMode);
    document.getElementById('settings-json-fields')?.addEventListener('change',function(event){
      var mode=document.documentElement.dataset.uiMode==='advance'?'advance':'basic';
      var record=caseProvider?.();if(!record||mode!=='advance'){applyJsonFields(mode);return;}record.metadata=record.metadata||{};record.metadata.showJsonFields=event.target.checked;caseChanged?.();applyJsonFields(mode);
    });
    var palette=document.getElementById('accent-palette');
    if(palette)colors.forEach(function(color){
      var button=document.createElement('button'),entry=STThemeResources.palettes[color];
      button.type='button';button.className='accent-choice theme-color-choice';button.dataset.accent=color;
      button.title=entry.name;button.setAttribute('aria-label',entry.name+' primary color');
      var swatch=document.createElement('span');swatch.className='theme-color-swatch';swatch.setAttribute('aria-hidden','true');
      swatch.style.background=entry.hex||entry.light.accent;swatch.style.color=entry.light.onAccent;swatch.innerHTML=STIcons.svg('check');
      var name=document.createElement('span');name.className='theme-color-name';name.textContent=entry.name;
      button.append(swatch,name);button.onclick=function(){setAccent(color);};palette.appendChild(button);
    });
    setAccent(read('accent'));
    document.querySelectorAll('[data-theme-picker]').forEach(function(select) {
      select.value = theme;
      select.addEventListener('change', function() { setTheme(select.value); });
    });
  });
  function reset(){
    Object.keys(localStorage).filter(function(name){return name.indexOf(key)===0;}).forEach(function(name){localStorage.removeItem(name);});
    theme=STThemeResources.defaultTheme||'auto';document.documentElement.classList.remove('restoring-session');
    setTheme(theme);setAccent(STThemeResources.defaultAccent);
  }
  return {reset:reset,caseOptions:caseOptions,setCaseOptions:setCaseOptions,initializeCaseOptions:initializeCaseOptions, connectCase:function(provider,changed){caseProvider=provider;caseChanged=changed;},read: read, write: write, setTheme: setTheme,setAccent:setAccent,automaticThemeAt:automaticThemeAt,setFontScale:setFontScale,applyFontScale:applyFontScale, applyJsonFields:applyJsonFields,applyPalette:applyPalette,resolveInterfaceMode:resolveInterfaceMode };
})();
</script>
