<style>
/* Shared visual hierarchy for Advance and Basic. Mode scaling is applied once,
   to the root font size by STPreferences; layout can still vary by mode. */
:root { --section-gap:var(--space-4); --panel-padding:var(--space-5); --checkbox-size:16px; }
h1,h2,h3,h4 { color:var(--ink); font-weight:var(--weight-semibold); line-height:var(--leading-tight); text-transform:none; letter-spacing:normal; }
h1 { font-size:var(--font-page); }
h2,.dialog-heading h2 { font-size:var(--font-section); }
h3,h4,.equipment-header strong,.format-zone-heading strong,.basic-conveyor-heading h3,
.simulation-analysis-heading h3,.equipment-speed-chart-heading h3,
.analysis-finding h4,.analysis-recommendation h4,.analysis-no-action h4,
.comparison-section h3,#settings-dialog .settings-section h3 { font-size:var(--font-card); }
label,.field-label,.basic-control-heading { color:var(--ink); font-size:var(--font-body); font-weight:var(--weight-medium); line-height:var(--leading-body); }
.equipment-grid label,.format-zone-grid label,.reliability-controls label { font-size:var(--font-body); font-weight:var(--weight-medium); }
input,select,textarea { font-size:var(--font-input); font-weight:var(--weight-regular); }
/* Fixed dimensions override field-grid rules which also match checkboxes. */
input[type=checkbox] { width:var(--checkbox-size) !important; min-width:var(--checkbox-size) !important; max-width:var(--checkbox-size) !important; height:var(--checkbox-size) !important; min-height:var(--checkbox-size) !important; max-height:var(--checkbox-size) !important; padding:0 !important; margin:0; flex:0 0 var(--checkbox-size) !important; appearance:auto; accent-color:var(--accent); vertical-align:middle; }
label:has(> input[type=checkbox]) { display:flex; align-items:center; gap:var(--space-2); }
.workspace-content > section.card { padding:var(--panel-padding); }
.workspace-content > section.card > .section-heading { margin:0 0 var(--section-gap); gap:var(--space-3); min-height:var(--control-height); }
.workspace-content > section.card > .section-heading h2 { margin:0; }
.workspace-content > section.card > .section-heading .eyebrow { display:none; }
.workspace-content > section.card > .section-heading p:not(.eyebrow) { margin:var(--space-2) 0 0; }
#editor-panel > .editor-subheading { margin:0 0 var(--section-gap); gap:var(--space-3); }
#editor-panel > .editor-subheading .button-row { padding:0; gap:var(--space-2); }
.equipment-list { gap:var(--space-3); margin-top:0; }
.section-heading,.format-zone-heading,.simulation-analysis-heading { gap:var(--space-3); margin-bottom:var(--section-gap); }
#settings-dialog .settings-section { padding-bottom:var(--section-gap); margin-bottom:var(--section-gap); }
#settings-dialog .settings-section h3 { margin:0 0 var(--space-3); }
#settings-dialog .settings-section:last-child { padding-bottom:0; margin-bottom:0; }
.accent-heading { line-height:var(--leading-body); }
#settings-dialog .accent-palette { display:flex; flex-wrap:wrap; gap:var(--space-2); }
html[data-header-view=vgraph] #results-panel > .section-heading .export-menu,
html[data-header-view=vgraph] #results-meta,
html[data-header-view=vgraph] #line-performance > .section-heading { display:none; }
html[data-header-view=vgraph] #line-performance { margin:0; padding:0; border:0; }
#basic-run-options { display:none; }
html[data-ui-mode=basic] #basic-run-options { display:block; padding:var(--space-3); margin:0 0 var(--section-gap); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); }
html[data-ui-mode=basic][data-header-view=conveyors] #basic-run-options { display:none; }
#basic-run-options > h3 { margin:0 0 var(--space-3); }
html[data-ui-mode=basic] #basic-efficiencies { gap:var(--space-4); padding-bottom:var(--space-3); border-bottom:var(--border-width) solid var(--line); }
html[data-ui-mode=basic] #basic-efficiencies > div { padding:0; border:0; flex-direction:row; align-items:center; gap:var(--space-3); }
html[data-ui-mode=basic] #basic-efficiencies strong { font-size:var(--font-section); font-variant-numeric:tabular-nums; }
html[data-ui-mode=basic] #basic-run-controls { grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(110px,.45fr); gap:var(--space-4); margin:var(--space-3) 0 0; align-items:start; }
html[data-ui-mode=basic] #basic-run-controls > section { padding:0; border:0; gap:var(--space-2); }
html[data-ui-mode=basic] .basic-machine .equipment-header strong { color:var(--ink); }
html[data-ui-mode=basic] .basic-buffer { font-size:var(--font-input); font-weight:var(--weight-semibold); color:var(--ink); }
html[data-ui-mode=basic] .basic-availability { font-size:var(--font-secondary); }
html[data-ui-mode=basic] .basic-worksheet-group output,
html[data-ui-mode=basic] .basic-worksheet-group .switchable-value > input.calculated-value { font-size:var(--font-input); font-weight:var(--weight-semibold); }
html[data-ui-mode=basic] #basic-conveyor-layout { margin-top:0; gap:var(--section-gap); }
html[data-ui-mode=basic] #basic-conveyor-panel { padding:var(--space-3); }
html[data-ui-mode=basic] #basic-conveyor-panel .format-zone-setup { padding:0; margin:0; border:0; }
html[data-ui-mode=basic] .basic-conveyor-worksheet { gap:var(--space-3); }
html[data-ui-mode=basic] .basic-worksheet-group { margin:0; padding:var(--space-3); gap:var(--space-2); }
html[data-ui-mode=basic] .basic-worksheet-group h4 { margin:0 0 var(--space-2); }
html[data-ui-mode=basic] .basic-worksheet-group label { grid-template-columns:minmax(0,1fr) minmax(85px,110px); }
.live-equipment-columns,.equipment-speed-sparkline-heading { text-transform:none; letter-spacing:normal; }
@media(max-width:760px) {
 :root { --panel-padding:var(--space-3); }
 html[data-ui-mode=basic] #basic-run-controls { grid-template-columns:1fr; }
 html[data-ui-mode=basic] #basic-efficiencies { grid-template-columns:1fr; gap:var(--space-2); }
}

/* Subsection toolbars share a baseline; the navigation already names the view. */
#editor-panel > .section-heading,#whatif-panel > .section-heading { display:none; }
#editor-panel > .editor-subheading,.simulation-analysis-heading,.json-section-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
#equipment-subsection-title { margin:0; }
.editor-subheading > .button-row { margin-left:auto; }
.import-menu > summary.icon-button { list-style:none; display:flex; align-items:center; justify-content:center; }
.import-menu > summary::-webkit-details-marker { display:none; }
.import-menu > div { z-index:30; }
html[data-header-view=conveyors] #export-equipment-json { display:none; }
.json-section-heading > .button-row { margin-left:auto; padding:0; flex-wrap:wrap; }
.simulation-analysis-heading > div { min-width:0; }
.simulation-analysis-heading > .export-menu { margin-left:auto; flex-shrink:0; }
.simulation-analysis-heading .eyebrow { display:none; }
html[data-header-view=vgraph] #results-panel > .section-heading { display:none; }
html[data-header-view=vgraph] #line-performance > .section-heading { display:flex; }
html[data-ui-mode=basic] #results-insight,
html[data-ui-mode=basic] .scenario-design-checks { display:none !important; }
/* Separate metric and control boxes, with more prominent percentages. */
html[data-ui-mode=basic] #basic-run-options { background:transparent; border:0; padding:0; }
html[data-ui-mode=basic] #basic-efficiencies { padding:0; border:0; gap:var(--space-3); }
html[data-ui-mode=basic] #basic-efficiencies > div { flex-direction:column; align-items:flex-start; gap:var(--space-2); padding:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); }
html[data-ui-mode=basic] #basic-efficiencies strong { font-size:2rem; line-height:1.1; }
html[data-ui-mode=basic] #basic-run-controls { gap:var(--space-3); }
html[data-ui-mode=basic] #basic-run-controls > section { padding:var(--space-3); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); align-self:stretch; }
html[data-ui-mode=basic] #basic-conveyor-panel { position:static; max-height:none; }
html[data-ui-mode=basic] #basic-conveyor-panel #equipment-inspector { max-height:none; overflow:visible; flex:none; }
html[data-ui-mode=basic][data-basic-view=conveyors] #equipment-list { max-height:none; overflow:visible; }
html[data-ui-mode=basic][data-basic-view=conveyors] .equipment-card { display:flex; flex-direction:column; justify-content:center; }
html[data-ui-mode=basic][data-basic-view=conveyors] .equipment-header { align-items:center; margin:0; }
/* Basic presents the same evaluated values without the advanced comparison table. */
.scenario-basic-metrics { display:none; }
html[data-ui-mode=basic] .analysis-recommendation > .badge,
html[data-ui-mode=basic] .analysis-recommendation:has(.analysis-capex) > h4,
html[data-ui-mode=basic] .scenario-metric-table,
html[data-ui-mode=basic] .scenario-preview-context { display:none; }
html[data-ui-mode=basic] .analysis-recommendation .analysis-capex { font-size:var(--font-card); text-transform:none; letter-spacing:normal; }
html[data-ui-mode=basic] .scenario-result-box { background:transparent; border:0; padding:var(--space-3) 0; }
html[data-ui-mode=basic] .scenario-basic-metrics { display:grid; gap:var(--space-4); }
.scenario-basic-metric { display:flex; flex-direction:column; gap:var(--space-1); }
.scenario-basic-metric > span:first-child { color:var(--muted); }
.scenario-basic-metric strong { color:var(--ink); font-size:var(--font-section); font-variant-numeric:tabular-nums; }
.scenario-basic-metric:first-child strong { font-size:2.4rem; line-height:1.1; }
.scenario-basic-change { font-size:var(--font-secondary); color:var(--muted); }
.scenario-basic-change[data-direction=up] { color:var(--success); }
.scenario-basic-change[data-direction=down] { color:var(--danger); }
html[data-ui-mode=basic] .scenario-actions button { margin-top:0; }
/* A common shell for analysis and warnings, preserving severity colors. */
html[data-ui-mode=advance] :is(.notice,.result-insight,.analysis-finding,.analysis-no-action,.scenario-audit-warnings,.round-warning) { border:var(--border-width) solid var(--line); border-left:var(--state-border-width) solid var(--accent); border-radius:var(--radius-md); padding:var(--space-3); background:var(--surface-soft); font-size:var(--font-body); line-height:var(--leading-body); }
html[data-ui-mode=advance] .analysis-critical { border-left-color:var(--danger); }
html[data-ui-mode=advance] :is(.analysis-attention,.scenario-audit-warnings,.round-warning) { border-left-color:var(--warning); }
.json-field-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex-wrap:wrap; }
.json-field-heading .button-row { margin-left:auto; padding:0; gap:var(--space-1); }
/* Subsection headings and action menus use the same dimensions in every view. */
#simulation-analysis { margin-top:0; }
#simulation-analysis-content { margin-top:0; }
#editor-panel > .editor-subheading,
.workspace-content > section.card > .section-heading,
.simulation-analysis-heading,#line-performance > .section-heading,
.basic-conveyor-heading { min-height:var(--control-height); align-items:center; margin-top:0; margin-bottom:var(--section-gap); }
.workspace-content > section.card > .section-heading h2,
#equipment-subsection-title,#basic-run-options-title,#simulation-analysis-title,#vgraph-title,
.basic-conveyor-heading h3 { font-size:var(--font-card); font-weight:var(--weight-semibold); line-height:var(--leading-tight); margin:0; }
#basic-run-options > h3 { display:flex; align-items:center; min-height:var(--control-height); margin-bottom:var(--section-gap); }
.section-heading .export-menu,.editor-subheading .export-menu,.simulation-analysis-heading .export-menu { margin:0; vertical-align:middle; }
.editor-subheading > .button-row { align-items:center; }
.export-menu > summary.icon-button { box-sizing:border-box; width:var(--control-height); height:var(--control-height); min-height:var(--control-height); padding:var(--space-2); }
html[data-ui-mode=basic] .scenario-tier-grid { grid-template-columns:repeat(4,minmax(210px,1fr)); align-items:stretch; overflow-x:auto; padding-bottom:var(--space-2); }
html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation { min-width:0; display:flex; flex-direction:column; padding:var(--space-3); }
html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation > .analysis-capex,
html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation > h4 { margin:0 0 var(--space-4); min-height:var(--control-height); align-content:center; font-size:var(--font-card); }
html[data-ui-mode=basic] .scenario-tier-grid .scenario-actions { margin-top:auto; padding-top:var(--space-3); gap:var(--space-1); flex-wrap:nowrap; }
html[data-ui-mode=basic] .scenario-tier-grid .scenario-actions .icon-button { width:var(--control-height); height:var(--control-height); flex-basis:var(--control-height); }
html[data-ui-mode=basic] .scenario-current { border-left:var(--state-border-width) solid var(--muted); }
html[data-ui-mode=basic] .scenario-current .scenario-basic-metrics { padding:var(--space-3) 0; }
</style>
