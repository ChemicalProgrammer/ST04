<style>
* { box-sizing:border-box; }
body { margin:0; font:14px/1.5 var(--font-ui); background:var(--page); color:var(--ink); }
button,input,textarea,select { font:inherit; }
button { min-height:var(--control-height); padding:6px 14px; border:1px solid transparent; border-radius:var(--radius-sm); background:var(--accent); color:var(--on-accent); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); }
button.secondary { background:var(--surface); color:var(--ink); border-color:var(--line); }
button.danger { background:var(--danger); color:var(--surface); }
button.icon-button { width:var(--control-height); padding:8px; flex-shrink:0; }
button:hover:not(:disabled) { filter:brightness(.94); }
button:disabled { opacity:.55; cursor:wait; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
input,select,textarea { width:100%; min-height:var(--control-height); padding:7px 10px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); }
textarea { min-height:130px; resize:vertical; }
label { display:grid; gap:6px; font-weight:600; }
h1,h2,h3,p { margin:0; } h1 { font-size:26px; letter-spacing:-.03em; } h2 { font-size:20px; } h3 { font-size:16px; }
small,.muted { color:var(--muted); } .hidden { display:none!important; } .icon { width:18px; height:18px; }
.auth-shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
.auth-card { width:min(100%,420px); padding:32px; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow); display:grid; gap:20px; }
.brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:-.02em; }
.brand-mark { width:38px; height:38px; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); border-radius:12px; }
#sign-in { width:100%; } #auth-status:empty { display:none; } #auth-status { color:var(--muted); padding:10px; background:var(--surface-soft); border-radius:8px; }
#application { min-height:100vh; }
.app-header { min-height:var(--header-height); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
.header-actions { display:flex; align-items:center; gap:8px; } #account-label { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
#request-progress { height:3px; position:fixed; top:0; left:0; right:0; z-index:40; overflow:hidden; pointer-events:none; }
#request-progress span { display:block; width:30%; height:100%; background:var(--accent); animation:request-travel 1.1s linear infinite; }
@keyframes request-travel { from { transform:translateX(-100%); } to { transform:translateX(440%); } }
.workspace { display:grid; grid-template-columns:200px minmax(0,1fr); min-height:calc(100vh - var(--header-height)); }
.sidebar { padding:24px 16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; background:var(--surface); }
.sidebar button { justify-content:flex-start; } .sidebar small { margin-top:auto; padding:16px 8px; }
.content { padding:32px; min-width:0; }
.page-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
.page-heading p { margin-top:4px; color:var(--muted); }
.filters { display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:12px; margin-bottom:24px; }
.project-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
.project-card { min-height:148px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:16px; text-align:left; }
.project-card[aria-pressed=true] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.project-card strong { overflow-wrap:anywhere; font-size:16px; }
.project-card .card-footer { display:flex; width:100%; align-items:center; justify-content:space-between; gap:8px; }
.badge { font-size:11px; font-weight:600; padding:3px 8px; background:var(--surface-soft); color:var(--muted); border-radius:20px; }
.empty { padding:50px 20px; border:1px dashed var(--line); border-radius:12px; text-align:center; color:var(--muted); }
.editor { width:360px; padding:24px; background:var(--surface); border-left:1px solid var(--line); position:fixed; top:var(--header-height); right:0; bottom:0; overflow:auto; z-index:15; box-shadow:var(--shadow); }
.workspace.editor-open { padding-right:360px; }
.editor-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:8px; }
#project-form { display:grid; gap:16px; } .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .editor-actions { display:flex; flex-wrap:wrap; gap:8px; }
.error-message { color:var(--danger); font-size:13px; overflow-wrap:anywhere; } .error-message:empty { display:none; }
dialog { width:min(480px,calc(100vw - 32px)); max-height:calc(100vh - 32px); padding:24px; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
dialog::backdrop { background:var(--overlay); } dialog form,dialog .dialog-content { display:grid; gap:20px; } .dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
#notice { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); z-index:50; padding:12px 20px; background:var(--ink); color:var(--surface); border-radius:10px; box-shadow:var(--shadow); }
* { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
@media(max-width:1100px) { .workspace.editor-open { padding-right:0; } }
@media(max-width:760px) { .workspace { grid-template-columns:1fr; } .sidebar { display:none; } .content { padding:20px; } .app-header { padding:12px 16px; } #account-label { display:none; } .editor { width:min(100%,420px); } .page-heading { align-items:flex-start; } .filters { grid-template-columns:1fr; } }
</style>
